            font-family: var(--font-mono);
            font-size: 11px;
            padding: 9px 14px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-accent);
            font-weight: 700;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 7000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: calc(100% - 40px);
            max-width: 380px;
            pointer-events: none;
        }
        .toast {
            position: relative;
            background: rgba(15, 15, 15, 0.97);
            border: 1px solid var(--border-2);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-lg);
            pointer-events: auto;
            backdrop-filter: blur(16px);
            animation: toastIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.error { border-left-color: var(--danger); }
        .toast.info { border-left-color: var(--info); }
        .toast.warning { border-left-color: var(--warn); }
        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            background: var(--accent-dim);
            color: var(--accent);
        }
        .toast.error .toast-icon { background: var(--danger-dim); color: var(--danger); }
        .toast.info .toast-icon { background: var(--info-dim); color: var(--info); }
        .toast.warning .toast-icon { background: var(--warn-dim); color: var(--warn); }
        .toast-title { font-size: 12px; font-weight: 800; margin-bottom: 3px; }
        .toast-message { font-size: 11px; color: var(--text-2); line-height: 1.3; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toast.removing { animation: toastOut 0.3s ease forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-16px) scale(0.95); } }

        /* ═══════════════════════════════════════════════════════════════
           RESPONSIVO
           ═══════════════════════════════════════════════════════════════ */
        @media (max-width: 900px) {
            .status-container {
                position: static;
                text-align: center;
                margin-bottom: 16px;
                border-left: none;
                border-top: 3px solid var(--accent);
                padding-left: 0;
                padding-top: 12px;
            }
            header { padding: 20px; }
            .menu-trigger { right: 20px; top: 20px; }
            .grid { padding: 16px 20px 140px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .log-drawer { right: 12px; width: calc(100% - 24px); max-width: 340px; }
            .brand-center h1 { letter-spacing: 4px; }
            .sheet-preview { width: 240px; height: 170px; }
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════
         MENU TRIGGER
         ═══════════════════════════════════════════════════════════════ -->
    <div class="menu-trigger" id="menu-trigger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         HEADER
         ═══════════════════════════════════════════════════════════════ -->
    <header>
        <div class="status-container">
            <div class="status-label">Status Evento</div>
            <div id="nome-evento">Carregando...</div>
            <div id="tipo-formato">--</div>
        </div>

        <div class="brand-center">
            <h1>PHOTO PRINT</h1>
            <div class="brand-subtitle">central de impressão A4</div>

            <div class="print-status-bar" id="print-status-bar">
                <span class="dot"></span>
                <span id="print-status-text">Aguardando fotos</span>
            </div>

            <div class="print-controls">
                <button class="ctrl-btn pause" id="btn-pause" onclick="togglePausa()">
                    <i class="fa-solid fa-pause"></i>
                    <span id="btn-pause-text">Pausar</span>
                </button>
                <button class="ctrl-btn" onclick="limparFilaManual()">
                    <i class="fa-solid fa-broom"></i>
                    Limpar Fila
                    <span class="badge-qty" id="fila-count">0</span>
                </button>
                <button class="ctrl-btn" id="btn-selecao" onclick="toggleModoSelecao()">
                    <i class="fa-solid fa-check-square"></i>
                    <span id="btn-selecao-text">Selecionar</span>
                </button>
            </div>

            <!-- Barra de seleção (aparece ao marcar fotos) -->
            <div class="selection-bar" id="selection-bar">
                <span class="selection-bar-label">
                    <span id="selection-count">0</span> foto(s) selecionada(s)
                </span>
                <button class="ctrl-btn active" onclick="imprimirSelecionadas()">
                    <i class="fa-solid fa-print"></i> Imprimir Selecionadas
                </button>
                <button class="ctrl-btn" onclick="cancelarSelecao()">
                    <i class="fa-solid fa-times"></i> Cancelar
                </button>
            </div>

            <!-- Preview da folha em tempo real -->
            <div class="sheet-preview-wrap">
                <div class="slot-indicator">
                    <span class="slot-indicator-label">Folha Atual</span>
                    <div class="slot-dots" id="slot-dots"></div>
                    <span class="slot-indicator-count" id="slot-count">0/0</span>
                </div>
                <div class="sheet-preview" id="sheet-preview"></div>
            </div>

            <div class="search-box">
                <input type="number" id="input-busca" placeholder="BUSCAR POR ID"
                       onkeydown="if(event.key==='Enter') executarBusca()">
                <button class="search-btn" onclick="executarBusca()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
         SIDEBAR
         ═══════════════════════════════════════════════════════════════ -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">Menu de Controle</div>

        <button class="sidebar-btn" onclick="baixarZip()">
            <i class="fa-solid fa-download"></i>
            Baixar Galeria (.zip)
        </button>

        <button class="sidebar-btn danger" onclick="limparTudo()">
            <i class="fa-solid fa-trash"></i>
            Apagar Servidor
        </button>

        <div class="sidebar-section">
            <div class="sidebar-section-title">Configurações</div>

            <div class="config-row">
                <label>Fotos por folha</label>
                <select id="config-capacidade" onchange="salvarConfigCapacidade(this.value)">
                    <option value="2">2 por folha A4</option>
                    <option value="4">4 por folha A4</option>
                    <option value="6" selected>6 por folha A4</option>
                </select>
            </div>

            <div class="config-row">
                <label>Delay entre folhas</label>
                <select id="config-delay" onchange="salvarConfigDelay(this.value)">
                    <option value="1000">1s</option>
                    <option value="1500">1.5s</option>
                    <option value="2000">2s</option>
                    <option value="2500" selected>2.5s</option>
                    <option value="3000">3s</option>
                    <option value="4000">4s</option>
                    <option value="5000">5s</option>
                    <option value="7000">7s</option>
                    <option value="10000">10s</option>
                </select>
            </div>

            <div class="config-row">
                <label>Auto-impressão</label>
                <select id="config-auto" onchange="salvarConfigAuto(this.value)">
                    <option value="1" selected>Ativada</option>
                    <option value="0">Desativada</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         GRID
         ═══════════════════════════════════════════════════════════════ -->
    <main class="grid" id="grid-fotos"></main>

    <!-- ═══════════════════════════════════════════════════════════════
         MODAL DE ZOOM
         ═══════════════════════════════════════════════════════════════ -->
    <div class="modal" id="modal-zoom">
        <img id="img-zoom" src="" alt="Zoom">
        <div class="modal-info">
            <div><span>ID:</span> <strong id="zoom-id">#--</strong></div>
            <div><span>Cópias:</span> <strong id="zoom-copias">--</strong></div>
            <div><span>Guestbook:</span> <strong id="zoom-guestbook">--</strong></div>
        </div>
        <div class="modal-controls">
            <button class="btn-act btn-voltar" onclick="fecharZoom()">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
            <button class="btn-act btn-reimprimir" onclick="reimprimirAtual()">
                <i class="fa-solid fa-print"></i> Reimprimir
            </button>
            <button class="btn-act btn-excluir" id="btn-excluir-zoom">
                <i class="fa-solid fa-trash"></i> Excluir
            </button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         LOG DRAWER
         ═══════════════════════════════════════════════════════════════ -->
    <div class="log-drawer" id="log-drawer">
        <div class="log-header">
            <span class="log-title"><i class="fa-solid fa-terminal"></i> Log de Impressão</span>
            <button class="log-close" onclick="toggleLog()"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="log-body" id="log-body"></div>
    </div>

    <button class="log-toggle" id="log-toggle" onclick="toggleLog()">
        <i class="fa-solid fa-terminal"></i>
        <span class="badge-count" id="log-badge" style="display:none">0</span>
    </button>

    <!-- Área de impressão A4 (invisível) -->
    <div id="print-area"></div>

    <!-- Debug + toasts -->
    <div class="debug-info" id="debug-info">SISTEMA PRONTO</div>
    <div class="toast-container" id="toast-container"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         SCRIPT PRINCIPAL v8.0 — A4 AGGREGATOR + SELEÇÃO MANUAL
         ═══════════════════════════════════════════════════════════════ -->
    <script>
        /* ═══════════════════════════════════════════════════════════════
           CONFIGURAÇÕES
           ═══════════════════════════════════════════════════════════════ */
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const POLL_INTERVAL_MS = 4000;
        const MAX_LOG_LINES = 30;

        const LS_CONFIG = 'pp_print_config_v8';
        const LS_HISTORY = 'pp_print_history_v8';
        const SS_BUFFER = 'pp_sheet_buffer_v8';
        const SS_QUEUE = 'pp_sheet_queue_v8';

        /*
         * ═══════════════════════════════════════════════════════════════
         * CAPACIDADE DE FOLHA A4 POR FORMATO DE FOTO
         * ═══════════════════════════════════════════════════════════════
         * A4 = 210×297mm. Margem Epson L3250 ≈ 3mm cada lado.
         * Área útil: 204×291mm.
         *
         * Polaroid 68×98mm (proporcional a 70×100, cabe na Epson):
         *   6 por folha (3×2) → 204×196mm ✓
         *   4 por folha (2×2) → 136×196mm ✓
         *   2 por folha (1×2) → 68×196mm  ✓
         *
         * 10x15V (100×150mm): 4 por folha (2×2) → 200×300 (não cabe exato) → 2 por folha
         * 10x15H (150×100mm): 2 por folha (1×2) → 150×200 ✓
         * Tirinha (50×150mm): 2 por folha (2×1) → 100×150 ✓
         * ═══════════════════════════════════════════════════════════════
         */
        let fotosPorFolha = 6;  // configurável: 2, 4 ou 6 (polaroid)

        function getCapacidadeA4() {
            const fmt = formatoAtual.toUpperCase();
            if (fmt.includes('POLAROID')) {
                const layout = fotosPorFolha === 6 ? 'layout-6'
                              : fotosPorFolha === 4 ? 'layout-4'
                              : 'layout-2';
                return { slots: fotosPorFolha, layout, orientacao: 'portrait' };
            }
            if (fmt.includes('TIRINHA')) {
                return { slots: 2, layout: 'layout-2', orientacao: 'portrait' };
            }
            if (fmt.includes('10X15H')) {
                return { slots: 2, layout: 'layout-2', orientacao: 'landscape' };
            }
            // 10X15V (default)
            return { slots: 2, layout: 'layout-2', orientacao: 'portrait' };
        }

        /* ═══════════════════════════════════════════════════════════════
           ESTADO GLOBAL
           ═══════════════════════════════════════════════════════════════ */
        let todasFotos = [];
        let chavesLocais = new Set();
        let eventoAtual = "";
        let eventoIdAtual = "";
        let formatoAtual = "POLAROID";
        let primeiraCarga = true;

        let sheetBuffer = [];
        let sheetQueue = [];
        let isPrinting = false;
        let pausado = false;
        let printDelayMs = 2500;
        let autoImpressao = true;
        let folhaAtualImprimindo = null;

        // Seleção manual
        let modoSelecao = false;
        let selecionadas = new Set();

        let logHistory = [];
        let logNaoLidas = 0;
        let logAberto = false;

        /* ═══════════════════════════════════════════════════════════════
           PERSISTÊNCIA
           ═══════════════════════════════════════════════════════════════ */
        function salvarEstado() {
            try {
                sessionStorage.setItem(SS_BUFFER, JSON.stringify(sheetBuffer));
                sessionStorage.setItem(SS_QUEUE, JSON.stringify(sheetQueue));
            } catch(e) {}
        }
        function carregarEstado() {
            try {
                const b = sessionStorage.getItem(SS_BUFFER);
                const q = sessionStorage.getItem(SS_QUEUE);
                if (b) sheetBuffer = JSON.parse(b) || [];
                if (q) sheetQueue = JSON.parse(q) || [];
            } catch(e) { sheetBuffer = []; sheetQueue = []; }
        }
        function limparEstadoStorage() {
            try {
                sessionStorage.removeItem(SS_BUFFER);
                sessionStorage.removeItem(SS_QUEUE);
            } catch(e) {}
        }

        function salvarConfig() {
            try {
                localStorage.setItem(LS_CONFIG, JSON.stringify({
                    printDelayMs, autoImpressao, fotosPorFolha
                }));
            } catch(e) {}
        }
        function carregarConfig() {
            try {
                const raw = localStorage.getItem(LS_CONFIG);
                if (raw) {
                    const c = JSON.parse(raw);
                    if (typeof c.printDelayMs === 'number') printDelayMs = c.printDelayMs;
                    if (typeof c.autoImpressao === 'boolean') autoImpressao = c.autoImpressao;
                    if (typeof c.fotosPorFolha === 'number') fotosPorFolha = c.fotosPorFolha;
                }
            } catch(e) {}
        }

        function salvarHistorico() {
            try { localStorage.setItem(LS_HISTORY, JSON.stringify(logHistory.slice(-MAX_LOG_LINES))); } catch(e) {}
        }
        function carregarHistorico() {
            try {
                const raw = localStorage.getItem(LS_HISTORY);
                if (raw) logHistory = JSON.parse(raw) || [];
            } catch(e) { logHistory = []; }
        }

        /* ═══════════════════════════════════════════════════════════════
           HELPERS
           ═══════════════════════════════════════════════════════════════ */
        function debug(msg) {
            console.log('[GALERIA]', msg);
            const el = document.getElementById('debug-info');
            if (el) el.innerText = msg;
        }

        function traduzirFormato(f) {
            if (!f) return "--";
            const up = f.toUpperCase().trim();
            if (up.includes("10X15H")) return "10x15 Horizontal";
            if (up.includes("10X15V")) return "10x15 Vertical";
            if (up.includes("TIRINHA")) return "Tirinha";
            if (up.includes("POLAROID")) return "Polaroid";
            return up;
        }

        function mostrarToast(titulo, mensagem, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            const iconMap = {
                success: 'fa-check',
                error: 'fa-exclamation-triangle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation'
            };
            toast.innerHTML = `
                <div class="toast-icon"><i class="fas ${iconMap[tipo] || 'fa-check'}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${titulo}</div>
                    <div class="toast-message">${mensagem}</div>
                </div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        /* ═══════════════════════════════════════════════════════════════
           LOG
           ═══════════════════════════════════════════════════════════════ */
        function addLog(msg, tipo = 'info') {
            const agora = new Date();
            const ts = `${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}:${String(agora.getSeconds()).padStart(2,'0')}`;
            const entry = { ts, msg, tipo };
            logHistory.push(entry);
            if (logHistory.length > MAX_LOG_LINES) logHistory.shift();
            renderLogEntry(entry);
            salvarHistorico();
            if (!logAberto) {
                logNaoLidas++;
                const badge = document.getElementById('log-badge');
                if (badge) {
                    badge.innerText = logNaoLidas > 99 ? '99+' : logNaoLidas;
                    badge.style.display = 'flex';
                }
            }
        }
        function renderLogEntry(entry) {
            const body = document.getElementById('log-body');
            if (!body) return;
            const line = document.createElement('div');
            line.className = `log-line ${entry.tipo}`;
            line.innerHTML = `<span class="ts">${entry.ts}</span><span class="msg">${entry.msg}</span>`;
            body.appendChild(line);
            while (body.children.length > MAX_LOG_LINES) body.removeChild(body.firstChild);
            body.scrollTop = body.scrollHeight;
        }
        function renderLogCompleto() {
            const body = document.getElementById('log-body');
            if (!body) return;
            body.innerHTML = '';
            logHistory.forEach(entry => renderLogEntry(entry));
        }
        function toggleLog() {
            logAberto = !logAberto;
            document.getElementById('log-drawer').classList.toggle('active', logAberto);
            if (logAberto) {
                logNaoLidas = 0;
                const badge = document.getElementById('log-badge');
                if (badge) badge.style.display = 'none';
                renderLogCompleto();
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           SIDEBAR + CONFIG
           ═══════════════════════════════════════════════════════════════ */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('menu-trigger').classList.toggle('active');
        }
        function salvarConfigCapacidade(valor) {
            fotosPorFolha = parseInt(valor, 10);
            salvarConfig();
            atualizarIndicadorFolha();
            atualizarPreviewFolha();
            mostrarToast('Configuração salva', `${fotosPorFolha} foto(s) por folha A4`, 'info');
        }
        function salvarConfigDelay(valor) {
            printDelayMs = parseInt(valor, 10) || 2500;
            salvarConfig();
            mostrarToast('Configuração salva', `Delay entre folhas: ${printDelayMs}ms`, 'info');
        }
        function salvarConfigAuto(valor) {
            autoImpressao = valor === '1';
            salvarConfig();
            mostrarToast('Configuração salva', `Auto-impressão ${autoImpressao ? 'ativada' : 'desativada'}`, autoImpressao ? 'success' : 'warning');
        }

        /* ═══════════════════════════════════════════════════════════════
           SELEÇÃO MANUAL
           ═══════════════════════════════════════════════════════════════ */
        function toggleModoSelecao() {
            modoSelecao = !modoSelecao;
            selecionadas.clear();
            document.getElementById('btn-selecao').classList.toggle('active', modoSelecao);
            document.getElementById('btn-selecao-text').innerText = modoSelecao ? 'Cancelar Seleção' : 'Selecionar';
            atualizarBarraSelecao();
            render();
        }

        function cancelarSelecao() {
            selecionadas.clear();
            modoSelecao = false;
            document.getElementById('btn-selecao').classList.remove('active');
            document.getElementById('btn-selecao-text').innerText = 'Selecionar';
            atualizarBarraSelecao();
            render();
        }

        function toggleSelecionada(id) {
            if (!modoSelecao) return;
            if (selecionadas.has(id)) selecionadas.delete(id);
            else selecionadas.add(id);
            atualizarBarraSelecao();
            render();
        }

        function atualizarBarraSelecao() {
            const bar = document.getElementById('selection-bar');
            if (modoSelecao && selecionadas.size > 0) {
                bar.classList.add('active');
                document.getElementById('selection-count').innerText = selecionadas.size;
            } else {
                bar.classList.remove('active');
            }
        }

        function imprimirSelecionadas() {
            if (selecionadas.size === 0) return;
            const fotos = todasFotos.filter(f => selecionadas.has(f.id));
            for (const foto of fotos) {
                alimentarBuffer(foto.url, foto.key, { copias: foto.copias, guestbook: foto.guestbook }, foto.id);
            }
            addLog(`🖨️ Impressão manual: ${fotos.length} foto(s)`, 'info');
            selecionadas.clear();
            atualizarBarraSelecao();
            render();
        }

        /* ═══════════════════════════════════════════════════════════════
           ATUALIZAÇÃO DA GALERIA
           ═══════════════════════════════════════════════════════════════ */
        async function atualizar() {
            try {
                const r1 = await fetch(`${API}/get-all-states?t=${Date.now()}`).catch(() => null);
                if (!r1 || !r1.ok) return;

                const config = await r1.json();
                const evt = (config.config && config.config.evento) ? config.config.evento : "Geral";
                const evtId = (config.config && config.config.eventoId) ? config.config.eventoId : "";
                const novoFormato = (config.config && config.config.formato)
                    ? config.config.formato.toUpperCase().trim()
                    : "POLAROID";

                if (eventoIdAtual !== evtId) {
                    eventoAtual = evt;
                    eventoIdAtual = evtId;
                    formatoAtual = novoFormato;
                    todasFotos = [];
                    chavesLocais.clear();
                    sheetBuffer = [];
                    sheetQueue = [];
                    limparEstadoStorage();
                    primeiraCarga = true;
                    document.getElementById('grid-fotos').innerHTML = "";
                    atualizarBarraStatus();
                    atualizarIndicadorFolha();
                    atualizarPreviewFolha();
                    addLog(`🔄 Evento: ${evt} (${traduzirFormato(formatoAtual)})`, 'info');
                } else if (formatoAtual !== novoFormato) {
                    formatoAtual = novoFormato;
                    addLog(`📐 Formato: ${traduzirFormato(formatoAtual)}`, 'info');
                    atualizarIndicadorFolha();
                    atualizarPreviewFolha();
                }

                document.getElementById('nome-evento').innerText = eventoAtual;
                                document.getElementById('tipo-formato').innerText = traduzirFormato(formatoAtual);

                if (!eventoIdAtual) {
                    debug('⏳ Aguardando evento ativo...');
                    return;
                }

                const r2 = await fetch(
                    `${API}/list-photos?evento=${encodeURIComponent(eventoAtual)}&t=${Date.now()}`
                ).catch(() => null);
                if (!r2 || !r2.ok) return;

                const dados = await r2.json();
                const fotosValidas = Array.isArray(dados)
                    ? dados.filter(f => !f.key.toLowerCase().includes('moldura'))
                    : [];

                const novas = fotosValidas.filter(f => !chavesLocais.has(f.key));

                if (novas.length > 0) {
                    debug(`📷 ${novas.length} nova(s) foto(s)`);
                    for (const f of novas) {
                        const url = `${API}/photo?key=${encodeURIComponent(f.key)}`;
                        const parsed = analisarNomeFoto(f.key);
                        const idFoto = todasFotos.length + 1;

                        todasFotos.push({
                            id: idFoto,
                            url,
                            key: f.key,
                            copias: parsed.copias,
                            guestbook: parsed.guestbook,
                            impressa: primeiraCarga
                        });
                        chavesLocais.add(f.key);

                        if (!primeiraCarga && autoImpressao) {
                            alimentarBuffer(url, f.key, parsed, idFoto);
                            addLog(`📥 Nova: ${parsed.copias}× ${parsed.guestbook ? '+ guestbook' : ''}`, 'success');
                        } else if (!primeiraCarga && !autoImpressao) {
                            addLog(`⏸️ Foto recebida (auto off): ${f.key.split('/').pop()}`, 'warn');
                        }
                    }
                    render();
                    atualizarBarraStatus();
                    debug(`✅ ${todasFotos.length} foto(s) na galeria`);
                }

                primeiraCarga = false;
            } catch (e) {
                debug('⚠️ ' + e.message);
            }
        }

        function analisarNomeFoto(key) {
            const kl = key.toLowerCase();
            let copias = 1;
            const match = kl.match(/_(\d+)c/);
            if (match) copias = parseInt(match[1], 10) || 1;
            const guestbook = kl.includes('_guestbook');
            return { copias, guestbook };
        }

        /* ═══════════════════════════════════════════════════════════════
           CORE: ALIMENTAR BUFFER A4 + FECHAR FOLHA
           ═══════════════════════════════════════════════════════════════ */
        function alimentarBuffer(url, key, parsed, origemId) {
            const { copias, guestbook } = parsed;
            const cap = getCapacidadeA4();

            if (guestbook) {
                sheetQueue.push({
                    slots: [{ url, key, tipo: 'guestbook', origemId }],
                    layout: 'layout-1',
                    totalSlots: 1,
                    descricao: 'Guestbook (folha dedicada)'
                });
                addLog(`📄 Guestbook preparado (foto #${origemId})`, 'info');
                salvarEstado();
                processarFilaImpressao();
                return;
            }

            for (let i = 0; i < copias; i++) {
                sheetBuffer.push({ url, key, tipo: 'foto', origemId });
                if (sheetBuffer.length >= cap.slots) {
                    fecharFolha();
                }
            }

            salvarEstado();
            atualizarIndicadorFolha();
            atualizarPreviewFolha();
            atualizarBarraStatus();
            render();
        }

        function fecharFolha() {
            if (sheetBuffer.length === 0) return;
            const cap = getCapacidadeA4();
            const slots = sheetBuffer.splice(0, cap.slots);

            sheetQueue.push({
                slots,
                layout: cap.layout,
                totalSlots: slots.length,
                descricao: `Folha ${traduzirFormato(formatoAtual)} (${slots.length} foto${slots.length > 1 ? 's' : ''})`
            });

            addLog(`📄 Folha fechada: ${slots.length}/${cap.slots} slots`, 'success');
            salvarEstado();
            atualizarIndicadorFolha();
            atualizarPreviewFolha();
            atualizarBarraStatus();
            processarFilaImpressao();
        }

        /* ═══════════════════════════════════════════════════════════════
           INDICADOR + PREVIEW DA FOLHA
           ═══════════════════════════════════════════════════════════════ */
        function atualizarIndicadorFolha() {
            const dots = document.getElementById('slot-dots');
            const count = document.getElementById('slot-count');
            if (!dots || !count) return;

            const cap = getCapacidadeA4();
            const usados = sheetBuffer.length;

            dots.innerHTML = '';
            for (let i = 0; i < cap.slots; i++) {
                const d = document.createElement('div');
                d.className = 'slot-dot' + (i < usados ? ' filled' : '');
                dots.appendChild(d);
            }
            count.innerText = `${usados}/${cap.slots}`;
        }

        /**
         * PREVIEW em tempo real — mostra os slots da folha atual
         * (o "esquema da moldura sendo montada")
         */
        function atualizarPreviewFolha() {
            const container = document.getElementById('sheet-preview');
            if (!container) return;

            const cap = getCapacidadeA4();
            container.innerHTML = '';

            // Define colunas do preview conforme capacidade
            const cols = cap.slots >= 6 ? 3 : cap.slots >= 4 ? 2 : cap.slots;
            const rows = cap.slots >= 6 ? 2 : cap.slots >= 4 ? 2 : 1;
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            for (let i = 0; i < cap.slots; i++) {
                const slot = document.createElement('div');
                slot.className = 'sheet-preview-slot';
                const slotData = sheetBuffer[i];
                if (slotData) {
                    slot.classList.add('filled');
                    slot.innerHTML = `
                        <span class="slot-label">${i + 1}</span>
                        <img src="${slotData.url}" alt="Slot ${i+1}">
                    `;
                } else {
                    slot.innerHTML = `<span>${i + 1}</span>`;
                }
                container.appendChild(slot);
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           BARRA DE STATUS + PAUSA
           ═══════════════════════════════════════════════════════════════ */
        function atualizarBarraStatus() {
            const bar = document.getElementById('print-status-bar');
            const txt = document.getElementById('print-status-text');
            const filaCount = document.getElementById('fila-count');
            const btnPause = document.getElementById('btn-pause');
            const btnPauseText = document.getElementById('btn-pause-text');

            if (filaCount) filaCount.innerText = sheetQueue.length;
            bar.classList.remove('active', 'paused');

            if (pausado) {
                bar.classList.add('paused');
                txt.innerText = `⏸️ Pausado (${sheetQueue.length} folha(s) na fila)`;
                btnPause.classList.add('active');
                btnPauseText.innerText = 'Retomar';
                btnPause.querySelector('i').className = 'fa-solid fa-play';
            } else if (isPrinting && folhaAtualImprimindo) {
                bar.classList.add('active');
                txt.innerText = `Imprimindo: ${folhaAtualImprimindo.descricao} (${sheetQueue.length} na fila)`;
                btnPause.classList.remove('active');
                btnPauseText.innerText = 'Pausar';
                btnPause.querySelector('i').className = 'fa-solid fa-pause';
            } else if (sheetQueue.length > 0) {
                bar.classList.add('active');
                txt.innerText = `${sheetQueue.length} folha(s) pronta(s)`;
            } else if (sheetBuffer.length > 0) {
                const cap = getCapacidadeA4();
                bar.classList.add('active');
                txt.innerText = `Preenchendo folha: ${sheetBuffer.length}/${cap.slots}`;
            } else {
                txt.innerText = 'Aguardando fotos';
                btnPause.classList.remove('active');
                btnPauseText.innerText = 'Pausar';
                btnPause.querySelector('i').className = 'fa-solid fa-pause';
            }
        }

        function togglePausa() {
            pausado = !pausado;
            if (pausado) {
                addLog('⏸️ Impressão pausada', 'warn');
                mostrarToast('Pausado', 'A impressão foi pausada.', 'warning');
            } else {
                addLog('▶️ Impressão retomada', 'success');
                mostrarToast('Retomado', 'A impressão foi retomada.', 'success');
                processarFilaImpressao();
            }
            atualizarBarraStatus();
            render();
        }

        function limparFilaManual() {
            const total = sheetQueue.length + sheetBuffer.length;
            if (total === 0) {
                mostrarToast('Fila vazia', 'Não há folhas pendentes.', 'info');
                return;
            }
            if (!confirm(`Limpar ${sheetQueue.length} folha(s) + ${sheetBuffer.length} slot(s)?`)) return;
            sheetQueue = [];
            sheetBuffer = [];
            limparEstadoStorage();
            addLog(`🗑️ Fila limpa (${total} itens)`, 'warn');
            atualizarBarraStatus();
            atualizarIndicadorFolha();
            atualizarPreviewFolha();
            render();
            mostrarToast('Fila limpa', `${total} item(ns) removidos.`, 'info');
        }

        /* ═══════════════════════════════════════════════════════════════
           PROCESSAMENTO DA FILA DE FOLHAS
           ═══════════════════════════════════════════════════════════════ */
        async function processarFilaImpressao() {
            if (isPrinting) return;
            if (pausado) { atualizarBarraStatus(); return; }
            if (sheetQueue.length === 0) {
                isPrinting = false;
                folhaAtualImprimindo = null;
                atualizarBarraStatus();
                render();
                return;
            }

            isPrinting = true;
            folhaAtualImprimindo = sheetQueue.shift();
            salvarEstado();
            atualizarBarraStatus();
            render();

            try {
                await executarImpressaoFolha(folhaAtualImprimindo);
                addLog(`✅ Impresso: ${folhaAtualImprimindo.descricao}`, 'success');
            } catch (e) {
                console.error('Erro ao imprimir:', e);
                addLog(`❌ Erro: ${e.message}`, 'error');
            }

            setTimeout(() => {
                isPrinting = false;
                folhaAtualImprimindo = null;
                atualizarBarraStatus();
                render();
                processarFilaImpressao();
            }, printDelayMs);
        }

        async function executarImpressaoFolha(folha) {
            debug(`🖨️ Imprimindo: ${folha.descricao}`);
            await Promise.all(folha.slots.map(s => preloadImagem(s.url)));

            const printArea = document.getElementById('print-area');
            const sheet = document.createElement('div');
            sheet.className = `print-sheet ${folha.layout || 'layout-6'}`;

            for (const slot of folha.slots) {
                const slotEl = document.createElement('div');
                slotEl.className = 'slot';
                const img = document.createElement('img');
                img.src = slot.url;
                img.alt = slot.tipo || 'foto';
                slotEl.appendChild(img);
                sheet.appendChild(slotEl);
            }

            printArea.innerHTML = '';
            printArea.appendChild(sheet);

            // Orientação dinâmica
            const cap = getCapacidadeA4();
            let stylePage = document.getElementById('dynamic-page-style');
            if (!stylePage) {
                stylePage = document.createElement('style');
                stylePage.id = 'dynamic-page-style';
                document.head.appendChild(stylePage);
            }
            const orient = cap.orientacao === 'landscape' ? 'A4 landscape' : 'A4 portrait';
            stylePage.innerHTML = `@media print { @page { size: ${orient}; margin: 0; } }`;

            await new Promise(r => setTimeout(r, 400));
            window.focus();
            window.print();
            debug(`✅ Folha enviada`);
        }

        function preloadImagem(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                setTimeout(() => resolve(false), 8000);
            });
        }

        /* ═══════════════════════════════════════════════════════════════
           RENDER DO GRID (com seleção)
           ═══════════════════════════════════════════════════════════════ */
        function render() {
            const grid = document.getElementById('grid-fotos');
            if (todasFotos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-camera-retro"></i>
                        <div class="empty-state-title">Nenhuma foto ainda</div>
                        <div class="empty-state-sub">As fotos aparecerão aqui conforme forem capturadas</div>
                    </div>`;
                return;
            }

            const keysNaFila = new Set([
                ...sheetBuffer.map(s => s.key),
                ...sheetQueue.flatMap(f => f.slots.map(s => s.key))
            ]);
            const keysImprimindo = folhaAtualImprimindo
                ? new Set(folhaAtualImprimindo.slots.map(s => s.key))
                : new Set();

            grid.innerHTML = todasFotos.slice().reverse().map((f, i) => {
                const estaSelecionada = selecionadas.has(f.id);
                let printStateClass = '';
                let printStateIcon = 'fa-clock';
                let printStateText = 'NA FILA';

                if (f.impressa) {
                    printStateClass = 'done';
                    printStateIcon = 'fa-check-circle';
                    printStateText = 'IMPRESSA';
                } else if (keysImprimindo.has(f.key)) {
                    printStateClass = 'printing';
                    printStateIcon = 'fa-spinner fa-spin';
                    printStateText = 'IMPRIMINDO';
                } else if (keysNaFila.has(f.key)) {
                    printStateClass = 'printing';
                    printStateIcon = 'fa-hourglass-half';
                    printStateText = 'AGUARDANDO';
                }

                // Clique: se em modo seleção, alterna; senão abre zoom
                const clickHandler = modoSelecao
                    ? `onclick="toggleSelecionada(${f.id})"`
                    : `onclick="abrirZoom(${f.id})"`;

                return `
                    <div class="card ${estaSelecionada ? 'selected' : ''}"
                         style="animation-delay:${Math.min(i * 20, 300)}ms"
                         ${clickHandler}>
                        <div class="check-overlay"><i class="fa-solid fa-check-circle"></i></div>
                        <span class="badge-id">#${f.id}</span>
                        <span class="badge-copias">${f.copias}× cópia${f.copias > 1 ? 's' : ''}</span>
                        ${f.guestbook
                            ? `<span class="badge-guestbook"><i class="fa-solid fa-book-open"></i> GUESTBOOK</span>`
                            : ''}
                        <span class="print-state ${printStateClass}">
                            <i class="fa-solid ${printStateIcon}"></i> ${printStateText}
                        </span>
                        <img src="${f.url}" loading="lazy" alt="Foto #${f.id}">
                    </div>`;
            }).join('');
        }

        /* ═══════════════════════════════════════════════════════════════
           MODAL DE ZOOM
           ═══════════════════════════════════════════════════════════════ */
        function abrirZoom(id) {
            const foto = todasFotos.find(f => f.id === id);
            if (!foto) return;
            document.getElementById('img-zoom').src = foto.url;
            document.getElementById('zoom-id').innerText = `#${foto.id}`;
            document.getElementById('zoom-copias').innerText = `${foto.copias}×`;
            document.getElementById('zoom-guestbook').innerText = foto.guestbook ? 'SIM' : 'NÃO';
            document.getElementById('btn-excluir-zoom').onclick = () => excluirFoto(foto.key);
            document.getElementById('modal-zoom').classList.add('active');
        }
        function fecharZoom() {
            document.getElementById('modal-zoom').classList.remove('active');
        }
        function reimprimirAtual() {
            const url = document.getElementById('img-zoom').src;
            if (!url) return;
            const foto = todasFotos.find(f => f.url === url);
            if (!foto) {
                alimentarBuffer(url, `manual_${Date.now()}`, { copias: 1, guestbook: false }, 0);
                return;
            }
            alimentarBuffer(foto.url, foto.key, { copias: foto.copias, guestbook: foto.guestbook }, foto.id);
            addLog(`🔁 Reimpressão: ${foto.copias}× ${foto.guestbook ? '+ guestbook' : ''}`, 'info');
            fecharZoom();
        }

        async function excluirFoto(key) {
            if (!confirm("Excluir esta foto?")) return;
            try {
                await fetch(`${API}/photo?key=${encodeURIComponent(key)}`, { method: 'DELETE' });
                todasFotos = todasFotos.filter(f => f.key !== key);
                chavesLocais.delete(key);
                todasFotos.forEach((f, i) => f.id = i + 1);
                sheetBuffer = sheetBuffer.filter(s => s.key !== key);
                sheetQueue = sheetQueue.map(folha => ({
                    ...folha,
                    slots: folha.slots.filter(s => s.key !== key)
                })).filter(folha => folha.slots.length > 0);
                salvarEstado();
                fecharZoom();
                render();
                atualizarBarraStatus();
                atualizarIndicadorFolha();
                atualizarPreviewFolha();
                addLog(`🗑️ Foto excluída`, 'warn');
            } catch (e) {
                mostrarToast('Erro', 'Não foi possível excluir.', 'error');
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           BUSCA
           ═══════════════════════════════════════════════════════════════ */
        function executarBusca() {
            const input = document.getElementById('input-busca');
            const idBusca = parseInt(input.value, 10);
            if (!idBusca || isNaN(idBusca)) {
                mostrarToast('ID inválido', 'Digite um número.', 'error');
                return;
            }
            const foto = todasFotos.find(f => f.id === idBusca);
            if (foto) {
                abrirZoom(foto.id);
                input.value = '';
            } else {
                mostrarToast('Não encontrada', `ID #${idBusca}`, 'warning');
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           SIDEBAR: ZIP + LIMPAR SERVIDOR
           ═══════════════════════════════════════════════════════════════ */
        async function baixarZip() {
            if (todasFotos.length === 0) {
                mostrarToast('Sem fotos', 'Nenhuma foto.', 'info');
                return;
            }
            mostrarToast('Preparando ZIP', `${todasFotos.length} foto(s)...`, 'info');
            try {
                const zip = new JSZip();
                let baixadas = 0;
                for (const f of todasFotos) {
                    try {
                        const blob = await fetch(f.url).then(r => r.blob());
                        const nome = `foto_${String(f.id).padStart(3, '0')}_${f.copias}c${f.guestbook ? '_gb' : ''}.jpg`;
                        zip.file(nome, blob);
                        baixadas++;
                    } catch (e) {}
                }
                if (baixadas === 0) {
                    mostrarToast('Erro', 'Nenhuma pôde ser baixada.', 'error');
                    return;
                }
                const content = await zip.generateAsync({ type: "blob" });
                const nomeZip = `galeria_${eventoAtual.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.zip`;
                saveAs(content, nomeZip);
                addLog(`✅ ZIP gerado (${baixadas} fotos)`, 'success');
            } catch (e) {
                addLog(`❌ Erro ZIP: ${e.message}`, 'error');
            }
        }

        async function limparTudo() {
            if (!confirm("⚠️ APAGAR TODAS AS FOTOS do evento ativo?\n\nIrreversível.")) return;
            const senha = prompt("Senha mestra:");
            if (senha !== "1234") {
                mostrarToast('Cancelado', 'Senha incorreta.', 'error');
                return;
            }
            try {
                await fetch(`${API}/photo?key=all`, { method: 'DELETE' });
                todasFotos = [];
                chavesLocais.clear();
                sheetBuffer = [];
                sheetQueue = [];
                limparEstadoStorage();
                render();
                atualizarBarraStatus();
                atualizarIndicadorFolha();
                atualizarPreviewFolha();
                addLog(`🗑️ Servidor limpo`, 'warn');
                mostrarToast('Servidor limpo', 'Fotos removidas.', 'success');
            } catch (e) {
                addLog(`❌ Erro: ${e.message}`, 'error');
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           EVENTOS GLOBAIS + INICIALIZAÇÃO
           ═══════════════════════════════════════════════════════════════ */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('modal-zoom').classList.contains('active')) fecharZoom();
                else if (document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
                else if (logAberto) toggleLog();
                else if (modoSelecao) cancelarSelecao();
            }
        });
        document.getElementById('modal-zoom').addEventListener('click', (e) => {
            if (e.target.id === 'modal-zoom') fecharZoom();
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) atualizar();
        });
        window.addEventListener('beforeunload', () => {
            salvarEstado();
        });

        window.addEventListener('load', () => {
            carregarConfig();
            carregarHistorico();
            renderLogCompleto();

            document.getElementById('config-delay').value = String(printDelayMs);
            document.getElementById('config-auto').value = autoImpressao ? '1' : '0';
            document.getElementById('config-capacidade').value = String(fotosPorFolha);

            carregarEstado();

            addLog('🚀 Central A4 v8.0 iniciada', 'success');
            debug('🚀 Central A4 v8.0 pronta');

            atualizarIndicadorFolha();
            atualizarPreviewFolha();
            atualizarBarraStatus();

            if (sheetQueue.length > 0) {
                addLog(`♻️ Fila restaurada (${sheetQueue.length} folha(s))`, 'info');
                processarFilaImpressao();
            }
            if (sheetBuffer.length > 0) {
                addLog(`♻️ Buffer restaurado (${sheetBuffer.length} slot(s))`, 'info');
            }

            atualizar();
            setInterval(atualizar, POLL_INTERVAL_MS);
        });
    </script>
</body>
</html>
