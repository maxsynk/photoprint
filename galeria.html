<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>PHOTO PRINT — Sua Foto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- INÍCIO DO BLOCO DE ESTILOS (CSS)                            -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <style>
        :root {
            --neon: #39ff14;
            --neon-dim: rgba(57, 255, 20, 0.12);
            --neon-glow: 0 0 20px rgba(57, 255, 20, 0.4);
            --red: #ff3131;
            --red-dim: rgba(255, 49, 49, 0.15);
            --blue: #0096ff;
            --blue-dim: rgba(0, 150, 255, 0.12);

            --bg-0: #000000;
            --bg-1: #0a0a0a;
            --bg-2: #111111;
            --bg-3: #1a1a1a;
            --bg-4: #222222;

            --text-0: #ffffff;
            --text-1: #e0e0e0;
            --text-2: #999999;
            --text-3: #555555;

            --border-1: rgba(255, 255, 255, 0.06);
            --border-2: rgba(255, 255, 255, 0.1);
            --border-neon: rgba(57, 255, 20, 0.3);

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;

            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.15s ease;

            --font-display: 'Outfit', sans-serif;
            --font-mono: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: var(--font-body);
            background: var(--bg-0);
            color: var(--text-0);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background:
                radial-gradient(circle at 50% 0%, rgba(26, 58, 18, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(57, 255, 20, 0.03) 0%, transparent 40%),
                var(--bg-0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* Orb de fundo animada */
        body::after {
            content: '';
            position: fixed;
            top: 30%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(57, 255, 20, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: orbBreath 5s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes orbBreath {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* ═══════════ HEADER ═══════════ */
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 28px;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: clamp(26px, 7vw, 36px);
            font-weight: 900;
            color: var(--neon);
            text-shadow: var(--neon-glow), 0 0 40px rgba(57, 255, 20, 0.2);
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
            animation: titleGlow 3s ease-in-out infinite;
        }
        @keyframes titleGlow {
            0%, 100% { text-shadow: var(--neon-glow), 0 0 40px rgba(57, 255, 20, 0.2); }
            50% { text-shadow: var(--neon-glow), 0 0 70px rgba(57, 255, 20, 0.4); }
        }
        .brand-subtitle {
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--text-3);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 6px;
        }

        /* ═══════════ CARD DA FOTO ═══════════ */
        .photo-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: var(--bg-1);
            border: 1px solid var(--border-neon);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg), 0 0 60px rgba(57, 255, 20, 0.1);
            animation: fadeInUp 0.7s ease-out 0.1s backwards;
            position: relative;
        }
        .photo-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            animation: scanLine 2.5s ease-in-out infinite;
            z-index: 3;
        }
        @keyframes scanLine {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .photo-wrapper {
            position: relative;
            background: var(--bg-0);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            overflow: hidden;
        }
        .photo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.4s ease;
        }

        /* Badge do ID da foto */
        .photo-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 4;
            background: rgba(0, 0, 0, 0.85);
            border-left: 3px solid var(--neon);
            border-radius: var(--radius-sm);
            padding: 6px 14px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            color: var(--neon);
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        /* Loader de imagem */
        .photo-loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            background: var(--bg-1);
            z-index: 2;
            transition: opacity 0.4s ease;
        }
        .photo-loader.hidden { opacity: 0; pointer-events: none; }
        .spin {
            width: 48px; height: 48px;
            border: 3px solid rgba(57, 255, 20, 0.15);
            border-top-color: var(--neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 700;
            color: var(--neon);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ═══════════ FOOTER DO CARD (AÇÕES) ═══════════ */
        .photo-actions {
            padding: 20px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--neon);
            color: var(--bg-0);
            box-shadow: var(--neon-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.6);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
            background: var(--bg-4);
            color: var(--text-3);
            box-shadow: none;
            cursor: wait;
            transform: none;
        }
        .btn-primary i { font-size: 16px; }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-2);
            color: var(--text-1);
        }
        .btn-secondary:hover {
            border-color: var(--neon);
            color: var(--neon);
            background: var(--neon-dim);
        }
        .btn-secondary i { font-size: 14px; }

        /* Status do download */
        .status-msg {
            text-align: center;
            font-size: 11px;
            color: var(--text-3);
            font-weight: 600;
            min-height: 16px;
            transition: var(--transition);
        }
        .status-msg.success { color: var(--neon); }
        .status-msg.error { color: var(--red); }

        /* ═══════════ SHARE / INFO ═══════════ */
        .info-footer {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 28px;
            font-size: 10px;
            color: var(--text-3);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }
        .info-footer .heart {
            color: var(--red);
            margin: 0 4px;
        }

        /* ═══════════ ESTADO DE ERRO ═══════════ */
        .error-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            z-index: 2;
            position: relative;
            animation: fadeInUp 0.5s ease-out;
        }
        .error-state.active { display: flex; }
        .error-state i {
            font-size: 60px;
            color: var(--red);
            margin-bottom: 20px;
            opacity: 0.8;
            animation: errorPulse 2s ease-in-out infinite;
        }
        @keyframes errorPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .error-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 800;
            color: var(--text-0);
            margin-bottom: 8px;
        }
        .error-text {
            font-size: 12px;
            color: var(--text-2);
            line-height: 1.5;
            max-width: 320px;
        }

        /* ═══════════ RESPONSIVO ═══════════ */
        @media (max-width: 400px) {
            .brand-title { font-size: 24px; letter-spacing: 2px; }
            .photo-actions { padding: 16px; gap: 8px; }
            .btn { padding: 14px 20px; font-size: 12px; }
        }
    </style>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- FIM DO BLOCO DE ESTILOS (CSS)                               -->
    <!-- ═══════════════════════════════════════════════════════════ -->
</head>
<body>

    <!-- ═══════════ HEADER ═══════════ -->
    <div class="header" id="main-header">
        <h1 class="brand-title">PHOTO PRINT</h1>
        <p class="brand-subtitle">Sua Foto Está Pronta</p>
    </div>

    <!-- ═══════════ CARD PRINCIPAL ═══════════ -->
    <div class="photo-card" id="photo-card">
        <div class="photo-wrapper">
            <div class="photo-badge" id="photo-badge">#----</div>
            <div class="photo-loader" id="photo-loader">
                <div class="spin"></div>
                <div class="loader-text">Carregando Foto...</div>
            </div>
            <img id="main-photo" src="" alt="Foto do evento" style="opacity: 0;">
        </div>
        <div class="photo-actions">
            <button class="btn btn-primary" id="btn-download" onclick="baixarFoto()">
                <i class="fas fa-download"></i> Baixar Foto
            </button>
            <button class="btn btn-secondary" id="btn-compartilhar" onclick="compartilharFoto()">
                <i class="fas fa-share-alt"></i> Compartilhar
            </button>
            <div class="status-msg" id="status-msg"></div>
        </div>
    </div>

    <!-- ═══════════ ESTADO DE ERRO ═══════════ -->
    <div class="error-state" id="error-state">
        <i class="fas fa-exclamation-triangle"></i>
        <h2 class="error-title">Foto não encontrada</h2>
        <p class="error-text" id="error-text">
            O link pode ter expirado ou está incorreto.
            Escaneie o QR Code novamente no quiosque.
        </p>
    </div>

    <!-- ═══════════ FOOTER ═══════════ -->
    <div class="info-footer">
        Feito com <span class="heart">♥</span> por Photo Print &copy; 2026
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- INÍCIO DO BLOCO DE SCRIPTS (JavaScript)                     -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script>
        const API_URL = "https://photoprint-api.maxprimefotovideo.workers.dev";
        let fotoUrlAtual = "";

        /* ═══════════ INICIALIZAÇÃO ═══════════ */
        document.addEventListener('DOMContentLoaded', init);

        function init() {
            const params = new URLSearchParams(window.location.search);
            const fotoKey = params.get('key');
            const fotoId = params.get('id') || params.get('photoId');

            // Caso 1: URL com ?key=xxx
            if (fotoKey) {
                carregarFotoPorKey(fotoKey, fotoId);
                return;
            }

            // Caso 2: URL com ?dl=xxx (base64 ou URL direta) - fallback
            const fotoUrl = params.get('dl');
            if (fotoUrl) {
                carregarFotoDireta(decodeURIComponent(fotoUrl), fotoId);
                return;
            }

            // Caso 3: nenhum parâmetro → mostra erro
            mostrarErro('Nenhuma foto especificada. Use o link recebido no quiosque.');
        }

                     /* ═══════════ CARREGAR FOTO POR KEY (tenta vários formatos) ═══════════ */
        function carregarFotoPorKey(key, id) {
            const keyDecodificada = decodeURIComponent(key);
            
            // Lista de URLs para tentar (em ordem de preferência)
            const urlsParaTentar = [
                `${API_URL}/photo?key=${encodeURIComponent(keyDecodificada)}`,
                `${API_URL}/foto?key=${encodeURIComponent(keyDecodificada)}`,
                `${API_URL}/photo/${encodeURIComponent(keyDecodificada)}`,
                `${API_URL}/fotos/${encodeURIComponent(keyDecodificada)}`
            ];
            
            console.log('[GALERIA] Key:', keyDecodificada);
            console.log('[GALERIA] URLs a tentar:', urlsParaTentar);
            
            tentarUrlsEmSequencia(urlsParaTentar, 0, id);
        }

        function carregarFotoDireta(url, id) {
            carregarFoto(url, id);
        }

        /* Tenta as URLs uma por uma até uma funcionar */
        function tentarUrlsEmSequencia(urls, index, id) {
            if (index >= urls.length) {
                // Todas falharam
                document.getElementById('photo-loader').classList.add('hidden');
                mostrarErro(
                    'Não foi possível carregar a foto.\n' +
                    'Testamos ' + urls.length + ' formatos de URL diferentes e todos falharam.\n' +
                    'Verifique o console (F12) para mais detalhes.'
                );
                return;
            }

            const url = `${urls[index]}&t=${Date.now()}`;
            console.log(`[GALERIA] Tentando URL ${index + 1}/${urls.length}:`, url);
            
            const img = new Image();
            const timeout = setTimeout(() => {
                console.warn(`[GALERIA] Timeout na URL ${index + 1}`);
                tentarUrlsEmSequencia(urls, index + 1, id);
            }, 4000);

            img.onload = () => {
                clearTimeout(timeout);
                console.log(`✅ [GALERIA] URL ${index + 1} funcionou!`);
                carregarFoto(url, id);
            };

            img.onerror = () => {
                clearTimeout(timeout);
                console.warn(`❌ [GALERIA] URL ${index + 1} falhou`);
                tentarUrlsEmSequencia(urls, index + 1, id);
            };

            img.src = url;
        }

        /* ═══════════ CARREGAR FOTO (comportamento final) ═══════════ */
        function carregarFoto(url, id) {
            const img = document.getElementById('main-photo');
            const loader = document.getElementById('photo-loader');
            const badge = document.getElementById('photo-badge');

            fotoUrlAtual = url;

            if (id) {
                badge.innerText = `#${id}`;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }

            img.onload = () => {
                console.log('✅ [GALERIA] Foto exibida com sucesso');
                loader.classList.add('hidden');
                img.style.transition = 'opacity 0.4s ease';
                img.style.opacity = '1';
            };

            img.onerror = () => {
                console.error('❌ [GALERIA] Erro final ao carregar:', url);
                loader.classList.add('hidden');
                mostrarErro('Não foi possível carregar a imagem. Verifique o console (F12).');
            };

            img.src = url;
        }   

            tentarCarregar();

            // Timeout de segurança (20s)
            setTimeout(() => {
                if (!img.complete || img.naturalWidth === 0) {
                    if (img.style.opacity === '0') {
                        console.warn('[GALERIA] Timeout de 20s atingido');
                        loader.classList.add('hidden');
                        mostrarErro('A foto está demorando muito para carregar. Verifique sua conexão.');
                    }
                }
            }, 20000);
        }

        /* ═══════════ DOWNLOAD ═══════════ */
        async function baixarFoto() {
            const btn = document.getElementById('btn-download');
            const status = document.getElementById('status-msg');
            
            if (!fotoUrlAtual) {
                status.innerText = "Nenhuma foto para baixar.";
                status.className = "status-msg error";
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparando...';
                status.innerText = "Preparando download...";
                status.className = "status-msg";

                const response = await fetch(fotoUrlAtual);
                if (!response.ok) throw new Error('Erro na requisição');

                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                a.href = blobUrl;
                a.download = `photoprint_${timestamp}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Baixada!';
                status.innerText = "✅ Foto salva na sua galeria!";
                status.className = "status-msg success";

                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-download"></i> Baixar Foto';
                }, 3000);

            } catch (e) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-download"></i> Baixar Foto';
                status.innerText = "❌ Falha no download. Segure na imagem e escolha 'Salvar foto'.";
                status.className = "status-msg error";
            }
        }

        /* ═══════════ COMPARTILHAR (Web Share API) ═══════════ */
        async function compartilharFoto() {
            const status = document.getElementById('status-msg');
            
            if (!fotoUrlAtual) {
                status.innerText = "Nenhuma foto para compartilhar.";
                status.className = "status-msg error";
                return;
            }

            // Verifica suporte à Web Share API
            if (navigator.share) {
                try {
                    // Tenta compartilhar a imagem como arquivo
                    const response = await fetch(fotoUrlAtual);
                    const blob = await response.blob();
                    const file = new File([blob], 'photoprint.jpg', { type: blob.type });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'PHOTO PRINT',
                            text: 'Olha a foto do evento! 📸'
                        });
                        status.innerText = "✅ Compartilhado com sucesso!";
                        status.className = "status-msg success";
                        return;
                    }
                } catch (err) {
                    if (err.name === 'AbortError') return; // usuário cancelou
                }
            }

            // Fallback: copia o link
            try {
                await navigator.clipboard.writeText(window.location.href);
                status.innerText = "🔗 Link copiado! Cole no WhatsApp.";
                status.className = "status-msg success";
            } catch (e) {
                status.innerText = "Compartilhamento não disponível neste navegador.";
                status.className = "status-msg error";
            }
        }

        /* ═══════════ ERRO ═══════════ */
        function mostrarErro(mensagem) {
            document.getElementById('photo-card').style.display = 'none';
            document.getElementById('main-header').style.display = 'none';
            document.getElementById('error-state').classList.add('active');
            if (mensagem) {
                document.getElementById('error-text').innerText = mensagem;
            }
        }

        /* ═══════════ PREVENIR ZOOM DUPLO TOQUE (iOS) ═══════════ */
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

    </script>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- FIM DO BLOCO DE SCRIPTS (JavaScript)                        -->
    <!-- ═══════════════════════════════════════════════════════════ -->
</body>
</html>
