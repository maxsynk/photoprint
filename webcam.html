<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>PHOTO PRINT — Webcam Totem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; position: relative; background: radial-gradient(circle at 50% 0%, rgba(0,229,255,0.05) 0%, transparent 40%), var(--bg-0); }
        #dynamic-bg { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
        #dynamic-bg.active { opacity: 0.45; }
        #dynamic-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)); }
        .bg-brand { position: fixed; inset: 0; z-index: 1; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.05; }
        .bg-brand-title { font-family: var(--font-display); font-size: clamp(80px, 15vw, 180px); font-weight: 900; color: var(--accent); letter-spacing: 16px; text-transform: uppercase; line-height: 1; }
        .bg-brand-sub { margin-top: 20px; font-size: clamp(18px, 3vw, 36px); letter-spacing: 12px; text-transform: uppercase; color: var(--text-0); font-weight: 700; }
        .top-logo { position: fixed; top: 40px; left: 48px; z-index: 25; cursor: pointer; }
        .logo-title { font-family: var(--font-display); color: var(--accent); font-size: clamp(28px, 4vw, 44px); font-weight: 900; letter-spacing: 6px; text-shadow: var(--accent-glow); user-select: none; line-height: 1; }
        .logo-sub { margin-top: 6px; color: var(--text-2); letter-spacing: 4px; font-size: 11px; text-transform: uppercase; font-weight: 700; }
        #active-event-name { position: fixed; top: 120px; left: 48px; z-index: 26; font-family: var(--font-body); color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 1.5px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--accent); display: none; text-transform: uppercase; backdrop-filter: blur(10px); }
        #active-event-name.visible { display: inline-flex; align-items: center; gap: 8px; }
        #active-event-name::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 6px var(--accent); animation: pulseDot 2s infinite; }
        @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.4} }
        #debug-info { position: fixed; bottom: 16px; right: 16px; z-index: 999; background: rgba(0,0,0,0.8); color: var(--accent); font-size: 10px; padding: 6px 12px; border-radius: 6px; font-family: var(--font-body); max-width: 350px; word-break: break-all; border: 1px solid var(--border-1); display: none; }
        #bg-menu { position: fixed; top: 120px; right: 40px; z-index: 100; display: none; flex-direction: column; gap: 12px; }
        #bg-menu.active { display: flex; }
        .bg-btn { padding: 12px 22px; border-radius: var(--radius-md); border: 1px solid var(--accent); background: rgba(0,0,0,0.85); color: var(--text-0); font-family: var(--font-body); font-size: 13px; font-weight: 800; cursor: pointer; backdrop-filter: blur(12px); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .bg-btn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); box-shadow: var(--accent-glow); }
        #bg-input { display: none; }
        #offline-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
        #offline-overlay.active { display: flex; }
        .offline-text { font-family: var(--font-display); font-size: clamp(28px, 5vw, 42px); font-weight: 900; color: var(--danger); text-shadow: 0 0 20px var(--danger); animation: pulseOff 1.5s infinite; text-transform: uppercase; letter-spacing: 4px; text-align: center; }
        @keyframes pulseOff { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #gesto-msg { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); z-index: 45; pointer-events: none; display: none; }
        #gesto-msg.active { display: block; }
        .msg-text { font-family: var(--font-display); font-size: clamp(20px, 3vw, 28px); font-weight: 900; color: #fff; text-shadow: 0 0 30px var(--accent); animation: pulseGesto 1.2s ease-in-out infinite; text-transform: uppercase; letter-spacing: 3px; text-align: center; background: rgba(0,0,0,0.8); padding: 16px 36px; border-radius: 30px; border: 2px solid var(--accent); backdrop-filter: blur(10px); }
        @keyframes pulseGesto { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.03); } }
        .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; flex-direction: column; }
        .screen.active { display: flex; }
        .btn-start { position: relative; width: clamp(280px, 40vw, 380px); height: clamp(280px, 40vw, 380px); border-radius: 50%; border: 4px solid var(--accent); background: radial-gradient(circle at center, rgba(0,229,255,0.15), rgba(0,0,0,0.96)); overflow: hidden; transition: all 0.3s; display: flex; align-items: center; justify-content: center; padding: 40px; box-shadow: 0 0 40px rgba(0,229,255,0.5); z-index: 30; animation: startPulse 2.5s infinite; }
        @keyframes startPulse { 0%, 100% { box-shadow: 0 0 40px rgba(0,229,255,0.5); } 50% { box-shadow: 0 0 60px rgba(0,229,255,0.8); } }
        .btn-start::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: rgba(0,0,0,0.9); box-shadow: inset 0 0 60px rgba(0,229,255,0.15); }
        .start-content { position: relative; z-index: 5; text-align: center; width: 100%; }
        .start-icon { font-size: clamp(48px, 6vw, 64px); margin-bottom: 20px; color: var(--accent); }
        .start-title { font-family: var(--font-display); color: var(--accent); font-size: clamp(20px, 2.5vw, 26px); font-weight: 900; letter-spacing: 4px; text-shadow: var(--accent-glow); margin-bottom: 16px; text-transform: uppercase; }
        .start-subtitle { font-family: var(--font-body); font-size: clamp(14px, 1.8vw, 18px); color: var(--text-1); line-height: 1.5; font-weight: 600; }
        #camera-wrapper { position: absolute; inset: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
        #camera-canvas { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
        .fun-text { position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: clamp(24px, 4vw, 36px); font-weight: 900; text-align: center; color: #fff; text-transform: uppercase; text-shadow: 0 0 15px var(--accent); animation: funPulse 0.6s infinite alternate; z-index: 50; background: rgba(0,0,0,0.7); padding: 14px 32px; border-radius: 40px; border: 2px solid var(--accent); display: none; letter-spacing: 2px; }
        @keyframes funPulse { 0% { transform: translateX(-50%) scale(0.95); } 100% { transform: translateX(-50%) scale(1.05); } }
        #options-overlay { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(10,10,10,0.95); padding: 24px 50px; border-radius: 60px; box-shadow: 0 20px 60px rgba(0,0,0,0.6), var(--accent-glow); z-index: 60; text-align: center; display: none; border: 2px solid var(--accent); backdrop-filter: blur(16px); }
        #options-overlay.active { display: block; }
        .options-text { font-family: var(--font-body); font-size: clamp(16px, 2vw, 22px); color: var(--accent); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .status-text { font-family: var(--font-display); font-size: clamp(28px, 4vw, 44px); color: var(--accent); font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 25px var(--accent); text-align: center; animation: pulseText 1.5s infinite; background: rgba(0,0,0,0.85); padding: 40px 80px; border-radius: var(--radius-xl); border: 2px solid var(--accent); backdrop-filter: blur(16px); }
        @keyframes pulseText { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    </style>
</head>
<body>
    <div id="dynamic-bg"></div>
    <div class="bg-brand"><div class="bg-brand-title">PHOTO PRINT</div><div class="bg-brand-sub">Colecionando Momentos</div></div>
    <div class="top-logo" id="secret-logo"><div class="logo-title">PHOTO PRINT</div><div class="logo-sub">Colecionando Momentos</div></div>
    <div id="active-event-name"></div>
    <div id="debug-info">SISTEMA PRONTO</div>
    <div id="bg-menu"><label class="bg-btn" for="bg-input"><i class="fas fa-image"></i> Alterar Fundo</label><div class="bg-btn" onclick="removeBackground()"><i class="fas fa-times"></i> Sem Fundo</div></div>
    <input type="file" id="bg-input" accept="image/*">
    <div id="offline-overlay"><div class="offline-text">SISTEMA EM<br>MANUTENÇÃO</div></div>
    <div id="gesto-msg"><div class="msg-text" id="msg-texto">🖐️ MOSTRE A MÃO ABERTA</div></div>
    
    <div id="screen-start" class="screen active">
        <div class="btn-start"><div class="start-content"><div class="start-icon"><i class="fas fa-camera"></i></div><div class="start-title">PHOTO PRINT</div><div class="start-subtitle">Aproxime-se para ativar</div></div></div>
    </div>
    
    <div id="screen-camera" class="screen" style="z-index:40;">
        <div id="camera-wrapper">
            <video id="camera-feed" autoplay playsinline muted></video>
            <canvas id="camera-canvas"></canvas>
            <div id="fun-text" class="fun-text"></div>
            <div id="options-overlay"><div class="options-text">ACESSE O TOTEM PARA IMPRIMIR SUA FOTO</div></div>
        </div>
    </div>
    
    <div id="screen-thanks" class="screen"><div class="status-text" id="thanks-text">🖨️ AGUARDE A IMPRESSÃO...</div></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const API_BASE = 'https://photoprint-api.maxprimefotovideo.workers.dev';
        const videoFeed = document.getElementById('camera-feed'), canvasCapture = document.getElementById('camera-canvas');
        const ctx = canvasCapture.getContext('2d'), funText = document.getElementById('fun-text'), optionsOverlay = document.getElementById('options-overlay');
        let stream = null, lastState = 'start', captureInProgress = false, handDetector = null, handCamera = null;
        let handOpen = false, gestureActive = false, initialLoad = true, sistemaOnline = true;
        let eventoAtual = null, eventoId = null, formatoAtual = 'POLAROID', molduraBase64 = null;
        let handVisibleFrames = 0, openFrames = 0, closedFrames = 0, personDetected = false, inactivityTimeout = null;
        const FORMATOS = { "TIRINHA": { w: 591, h: 1819 }, "POLAROID": { w: 1041, h: 1311 }, "10X15V": { w: 1181, h: 1819 }, "10X15H": { w: 1772, h: 1228 } };

        function debug(msg) { console.log('[WEBCAM]', msg); const el = document.getElementById('debug-info'); if (el) el.innerText = msg; }

        async function verificarStatus() {
            try {
                const res = await fetch(`${API_BASE}/get-all-states?t=${Date.now()}`);
                if (!res || !res.ok) { sistemaOnline = false; mostrarOffline(); return; }
                const data = await res.json();
                const status = (data.config && data.config.status) ? data.config.status : 'OFFLINE';
                if (status === 'OFFLINE') { sistemaOnline = false; mostrarOffline(); } else { sistemaOnline = true; esconderOffline(); }
                return data;
            } catch (e) { sistemaOnline = false; mostrarOffline(); return null; }
        }

        function mostrarOffline() { document.getElementById('offline-overlay').classList.add('active'); }
        function esconderOffline() { document.getElementById('offline-overlay').classList.remove('active'); }

        async function syncEvento() {
            const data = await verificarStatus();
            if (!data || !sistemaOnline) return;
            if (data.config && data.config.evento && data.config.evento !== 'Geral') {
                const novoEventoId = data.config.eventoId, novoFormato = (data.config.formato || 'POLAROID').toUpperCase().trim();
                if (eventoAtual !== data.config.evento || eventoId !== novoEventoId || formatoAtual !== novoFormato || !molduraBase64) {
                    eventoAtual = data.config.evento; eventoId = novoEventoId; formatoAtual = novoFormato;
                    if (data.moldura) molduraBase64 = data.moldura; else molduraBase64 = null;
                    updateEventoUI();
                }
            }
        }

        function updateEventoUI() {
            const el = document.getElementById('active-event-name');
            if (eventoAtual) { el.classList.add('visible'); el.innerHTML = `🎉 ${eventoAtual} | ${formatoAtual}`; } else el.classList.remove('visible');
        }

        async function initCamera() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices(), cameras = devices.filter(d => d.kind === 'videoinput');
                let selectedDevice = null;
                for (const cam of cameras) { const name = cam.label.toLowerCase(); if (name.includes('logitech') || name.includes('usb') || name.includes('c920')) { selectedDevice = cam; break; } }
                if (!selectedDevice && cameras.length > 0) selectedDevice = cameras[0];
                stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: selectedDevice ? { exact: selectedDevice.deviceId } : undefined, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                videoFeed.srcObject = stream; startMotionDetection();
            } catch (err) { document.querySelector('.start-subtitle').innerText = 'Câmera não encontrada'; }
        }

        let motionCanvas = null, motionCtx = null, previousFrame = null;
        function startMotionDetection() {
            motionCanvas = document.createElement('canvas'); motionCanvas.width = 160; motionCanvas.height = 90;
            motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true }); checkMotion();
        }

        function checkMotion() {
            if (!stream || !motionCtx) { requestAnimationFrame(checkMotion); return; }
            try {
                if (videoFeed.readyState >= 2) {
                    motionCtx.drawImage(videoFeed, 0, 0, 160, 90);
                    const frame = motionCtx.getImageData(0, 0, 160, 90);
                    if (previousFrame)
                                        let changed = 0;
                    for (let i = 0; i < frame.data.length; i += 16) {
                        const diff = Math.abs(frame.data[i] - previousFrame.data[i]) + Math.abs(frame.data[i+1] - previousFrame.data[i+1]) + Math.abs(frame.data[i+2] - previousFrame.data[i+2]);
                        if (diff > 30) changed++;
                    }
                    const movement = (changed / (frame.data.length / 16)) * 100;
                    if (movement > 3 && !personDetected) {
                        personDetected = true; abrirCameraPorPresenca();
                        clearTimeout(inactivityTimeout);
                    }
                    if (movement < 0.5 && personDetected) {
                        if (!inactivityTimeout) {
                            inactivityTimeout = setTimeout(() => {
                                if (lastState === 'options' || lastState === 'start') { personDetected = false; resetToStart(); }
                                inactivityTimeout = null;
                            }, 45000);
                        }
                    } else if (movement > 1) {
                        clearTimeout(inactivityTimeout); inactivityTimeout = null;
                    }
                    previousFrame = frame;
                }
            } catch(e) {}
            requestAnimationFrame(checkMotion);
        }

        function abrirCameraPorPresenca() {
            if (lastState !== 'start' || captureInProgress) return;
            lastState = 'capturing';
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-camera').classList.add('active');
            videoFeed.style.display = 'block'; canvasCapture.style.display = 'none';
            document.getElementById('gesto-msg').classList.add('active');
            document.getElementById('msg-texto').innerText = '🖐️ MOSTRE A MÃO ABERTA';
            initHandDetector();
        }

        async function initHandDetector() {
            if (gestureActive) return;
            gestureActive = true;
            handDetector = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            handDetector.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.70, minTrackingConfidence: 0.65 });
            handDetector.onResults(onHandResults);
            handCamera = new Camera(videoFeed, { onFrame: async () => { if (gestureActive) await handDetector.send({ image: videoFeed }); }, width: 1280, height: 720 });
            handCamera.start();
        }

        function onHandResults(results) {
            if (!gestureActive) return;
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                handVisibleFrames = 0; openFrames = 0; closedFrames = 0; return;
            }
            handVisibleFrames++;
            const hand = results.multiHandLandmarks[0];
            const dedosAbertos = (hand[8].y < hand[6].y ? 1 : 0) + (hand[12].y < hand[10].y ? 1 : 0) + (hand[16].y < hand[14].y ? 1 : 0) + (hand[20].y < hand[18].y ? 1 : 0);
            if (handVisibleFrames < 8) return;
            if (dedosAbertos >= 4) {
                openFrames++; closedFrames = 0;
                if (openFrames == 10) handOpen = true;
            }
            if (handOpen && dedosAbertos <= 1) {
                closedFrames++;
                if (closedFrames == 6) { gestureActive = false; handOpen = false; capturePhoto(); }
            }
            if (dedosAbertos > 1 && dedosAbertos < 4) { openFrames = 0; closedFrames = 0; }
        }

        function capturePhoto() {
            captureInProgress = true;
            document.getElementById('gesto-msg').classList.remove('active');
            funText.style.display = 'block';
            funText.innerHTML = "✨ PREPARE-SE! ✨";
            setTimeout(() => {
                let cd = 3;
                funText.innerHTML = `😁 SORRIA! 😁<br>⏳ ${cd}`;
                const t = setInterval(() => {
                    cd--;
                    if (cd > 0) { funText.innerHTML = `😁 SORRIA! 😁<br>⏳ ${cd}`; }
                    else {
                        funText.style.display = 'none'; clearInterval(t);
                        canvasCapture.width = videoFeed.videoWidth || 1280;
                        canvasCapture.height = videoFeed.videoHeight || 720;
                        ctx.save(); ctx.scale(-1, 1); ctx.drawImage(videoFeed, -canvasCapture.width, 0, canvasCapture.width, canvasCapture.height); ctx.restore();
                        videoFeed.style.display = 'block'; canvasCapture.style.display = 'block';
                        fetch(`${API_BASE}/set-state`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: 'options' }) }).catch(() => {});
                        captureInProgress = false;
                        optionsOverlay.classList.add('active');
                        document.getElementById('gesto-msg').classList.add('active');
                        document.getElementById('msg-texto').innerText = '👉 RETIRE SUA FOTO NO TOTEM';
                    }
                }, 1000);
            }, 2500);
        }

        async function composeAndUpload(opcaoCopias) {
            if (!molduraBase64) return;
            const copiasFisicas = opcaoCopias === 1 ? 1 : opcaoCopias === 2 ? 2 : opcaoCopias === 3 ? 2 : 3;
            try {
                const fotoImg = await new Promise(r => { const img = new Image(); img.onload = () => r(img); img.src = canvasCapture.toDataURL('image/jpeg', 0.92); });
                const molduraImg = await new Promise((rs, rj) => { const img = new Image(); img.onload = () => rs(img); img.onerror = rj; img.src = molduraBase64; });
                const fmt = FORMATOS[formatoAtual] || FORMATOS['POLAROID'];
                const canvas = document.createElement('canvas'); canvas.width = fmt.w; canvas.height = fmt.h;
                const cctx = canvas.getContext('2d'); cctx.fillStyle = '#FFFFFF'; cctx.fillRect(0, 0, canvas.width, canvas.height);
                const scale = Math.max(canvas.width / fotoImg.width, canvas.height / fotoImg.height);
                cctx.drawImage(fotoImg, (canvas.width - fotoImg.width * scale) / 2, (canvas.height - fotoImg.height * scale) / 2, fotoImg.width * scale, fotoImg.height * scale);
                cctx.drawImage(molduraImg, 0, 0, canvas.width, canvas.height);
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
                const temGuestbook = (opcaoCopias === 3 || opcaoCopias === 4);
                const sufixo = temGuestbook ? '_guestbook' : '';
                const fd = new FormData();
                fd.append('foto', blob, `foto_${Date.now()}_${copiasFisicas}c${sufixo}.jpg`);
                fd.append('eventoId', eventoId);
                fd.append('timestamp', String(Date.now()) + '_' + copiasFisicas + 'c' + sufixo);
                fd.append('copias', String(copiasFisicas));
                await fetch(`${API_BASE}/salvar-foto`, { method: 'POST', body: fd });
                showThanks();
            } catch (e) { debug('❌ ' + e.message); }
        }

        function showThanks() {
            document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
            document.getElementById('screen-thanks').classList.add('active');
            document.getElementById('thanks-text').innerHTML = "🖨️ AGUARDE A IMPRESSÃO...";
            setTimeout(() => { document.getElementById('thanks-text').innerHTML = "💖 OBRIGADO! 💖"; setTimeout(resetToStart, 2500); }, 2500);
        }

        function resetToStart() {
            document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
            document.getElementById('screen-start').classList.add('active');
            ctx.clearRect(0, 0, canvasCapture.width, canvasCapture.height);
            captureInProgress = false; lastState = 'start'; personDetected = false; gestureActive = false;
            document.getElementById('gesto-msg').classList.remove('active');
            optionsOverlay.classList.remove('active');
            funText.style.display = 'none';
            if (handCamera) { try { handCamera.stop(); } catch(e) {} handCamera = null; }
            handDetector = null; handVisibleFrames = 0; openFrames = 0; closedFrames = 0;
            fetch(`${API_BASE}/set-state`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: 'start' }) }).catch(() => {});
        }

        // Fundo personalizado
        let clickCount = 0, clickTimer = null;
        document.getElementById('secret-logo').addEventListener('click', () => {
            clickCount++; clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
            if (clickCount >= 7) { document.getElementById('bg-menu').classList.toggle('active'); clickCount = 0; }
        });

        document.getElementById('bg-input').addEventListener('change', (e) => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                document.getElementById('dynamic-bg').style.backgroundImage = `url('${ev.target.result}')`;
                document.getElementById('dynamic-bg').classList.add('active');
                try { localStorage.setItem('photoprint_bg', ev.target.result); } catch(err) {}
                document.getElementById('bg-menu').classList.remove('active');
            };
            r.readAsDataURL(f);
        });

        function removeBackground() {
            localStorage.removeItem('photoprint_bg');
            document.getElementById('dynamic-bg').style.backgroundImage = "";
            document.getElementById('dynamic-bg').classList.remove('active');
            document.getElementById('bg-menu').classList.remove('active');
        }

        (function() {
            const bg = localStorage.getItem('photoprint_bg');
            if (bg) { document.getElementById('dynamic-bg').style.backgroundImage = `url('${bg}')`; document.getElementById('dynamic-bg').classList.add('active'); }
        })();

        window.addEventListener('load', () => {
            initCamera(); syncEvento();
            setInterval(syncEvento, 5000);
        });
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (handCamera) { try { handCamera.stop(); } catch(e) {} }
            if (inactivityTimeout) clearTimeout(inactivityTimeout);
        });
    </script>
</body>
</html>
