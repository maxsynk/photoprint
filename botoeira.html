<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTOEIRA - PHOTO PRINT v3.6</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        :root { --neon: #39ff14; }
        body { margin:0; background:#050505; color:white; font-family:Arial; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        
        /* Título do evento no topo */
        #active-event-name { 
            position: fixed; top: 20px; left: 20px; 
            font-family: 'Orbitron', sans-serif; color: var(--neon); 
            font-size: 14px; font-weight: 700; letter-spacing: 2px; 
            text-shadow: 0 0 10px var(--neon); 
            background: rgba(0,0,0,0.5); padding: 5px 12px; 
            border-radius: 8px; border: 1px solid var(--neon); 
        }

        .btn-start { width:280px; height:280px; border-radius:50%; border:4px solid var(--neon); background:rgba(0,0,0,0.8); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow: 0 0 30px rgba(57,255,20,0.4); }
        .btn-start:active { transform: scale(0.95); }
        .start-title { color:var(--neon); font-family:'Orbitron'; font-size:24px; font-weight:900; }
        .screen { display:flex; flex-direction:column; align-items:center; }
        .options-container { background:rgba(20,20,20,0.9); padding:20px; border:1px solid var(--neon); border-radius:15px; }
        .btn-print { margin:10px; padding:15px; cursor:pointer; border:1px solid var(--neon); background:transparent; color:white; }
        .btn-print.selected { background:var(--neon); color:black; }
    </style>
</head>
<body>

    <div id="active-event-name">CARREGANDO...</div>

    <div id="screen-start" class="screen">
        <div class="btn-start" onclick="iniciarCaptura()">
            <div class="start-title">TIRAR FOTO</div>
        </div>
    </div>

    <div id="screen-triggered" class="screen" style="display:none">
        <h2 style="color:var(--neon)">AGUARDE...</h2>
    </div>

    <div id="screen-options" class="screen" style="display:none">
        <div class="options-container">
            <h3>QUANTAS CÓPIAS?</h3>
            <button class="btn-print selected" onclick="select(this,1)">1 Cópia</button>
            <button class="btn-print" onclick="select(this,2)">2 Cópias</button>
            <button class="btn-print" onclick="sendPrint()">ENVIAR</button>
        </div>
    </div>

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        let copias = 1;

        // Sincroniza o nome do evento
        async function syncEvento() {
            try {
                const res = await fetch(`${API}/status?t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.evento) {
                        document.getElementById('active-event-name').innerText = `📸 ${data.evento}`;
                    }
                }
            } catch(e) { console.error(e); }
        }

        async function iniciarCaptura() {
            document.getElementById('screen-start').style.display = "none";
            document.getElementById('screen-triggered').style.display = "flex";
            try {
                await fetch(`${API}/set-state`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ state: 'capturing' })
                });
                verificarStatusWebcam();
            } catch(e) { alert("Erro ao conectar"); location.reload(); }
        }

        async function verificarStatusWebcam() {
            const interval = setInterval(async () => {
                const res = await fetch(`${API}/get-state?t=${Date.now()}`);
                const data = await res.json();
                if (data.state === 'options') {
                    clearInterval(interval);
                    document.getElementById('screen-triggered').style.display = "none";
                    document.getElementById('screen-options').style.display = "flex";
                }
            }, 800);
        }

        function select(btn, val) {
            document.querySelectorAll('.btn-print').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            copias = val;
        }

        async function sendPrint() {
            await fetch(`${API}/trigger-print`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ copias: copias })
            });
            location.reload();
        }

        // Inicia a busca pelo nome do evento
        syncEvento();
        setInterval(syncEvento, 30000); // Atualiza a cada 30 segundos
    </script>
</body>
</html>
