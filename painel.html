<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHOTO PRINT - Master Panel v1.4</title>
    </head>
<body>
    <script>
        const API_URL = "https://photoprint-api.maxprimefotovideo.workers.dev";
        
        // Função para atualizar o Worker com a configuração do evento
        async function sincronizarConfig(evento, status, formato, livro) {
            try {
                await fetch(`${API_URL}/set-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento, status, formato, livro })
                });
            } catch(e) { console.error("Erro na sincronização:", e); }
        }

        // Integrar no seu salvarEvento:
        async function salvarEvento() {
            // ... sua lógica de salvar ...
            const statusAtual = document.getElementById('server-status').checked ? "ONLINE" : "OFFLINE";
            await sincronizarConfig(nome, statusAtual, formato, livro);
            // ... resto do seu código ...
        }

        // Integrar no seu salvarStatusRede:
        async function salvarStatusRede() {
            const on = document.getElementById('server-status').checked;
            const ativo = eventos.find(e => e.ativo);
            if(ativo) {
                await sincronizarConfig(ativo.nome, on ? "ONLINE" : "OFFLINE", ativo.formato, ativo.livro || false);
                atualizarUIStatus(on);
            }
        }
    </script>
</body>
</html>
