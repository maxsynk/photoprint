<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<title>WEBCAM - PHOTO PRINT v6.8</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

:root{
    --neon:#39ff14;
    --dark:#050505;
    --danger:#ff3131;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background:
    radial-gradient(circle at top,
    rgba(57,255,20,0.10),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(57,255,20,0.08),
    transparent 30%),

    linear-gradient(
        135deg,
        #020202 0%,
        #050505 40%,
        #071107 100%
    );

    color:white;
    font-family:Arial,Helvetica,sans-serif;
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
}

/* FOTO DE FUNDO DINÂMICA */

#dynamic-bg{
    position:fixed;
    inset:0;
    z-index:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;
    transition:opacity 0.6s ease;
}

#dynamic-bg.active{
    opacity:0.45;
}

#dynamic-bg::after{
    content:'';
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.65)
    );
}

/* FUNDO TECNOLÓGICO */

body::before{
    content:'';
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(57,255,20,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(57,255,20,0.03) 1px, transparent 1px);

    background-size:40px 40px;

    z-index:0;

    animation:gridMove 12s linear infinite;
}

body.bg-active::before{
    display:none;
}

@keyframes gridMove{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(40px);
    }
}

.bg-brand{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    opacity:0.07;
}

body.bg-active .bg-brand{
    display:none;
}

.bg-brand-title{
    font-family:'Orbitron',sans-serif;
    font-size:140px;
    font-weight:900;
    color:var(--neon);
    letter-spacing:14px;
    text-transform:uppercase;
}

.bg-brand-sub{
    margin-top:20px;
    font-size:42px;
    letter-spacing:12px;
    text-transform:uppercase;
    color:white;
}

.top-logo{
    position:fixed;
    top:40px;
    left:50px;
    z-index:25;
}

.logo-title{
    font-family:'Orbitron',sans-serif;
    color:var(--neon);
    font-size:46px;
    font-weight:900;
    letter-spacing:8px;

    text-shadow:
    0 0 15px var(--neon),
    0 0 35px rgba(57,255,20,0.8);

    cursor:pointer;
    user-select:none;
}

.logo-sub{
    margin-top:4px;
    color:white;
    opacity:0.7;
    letter-spacing:5px;
    font-size:13px;
    text-transform:uppercase;
}

.corner-glow{
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(57,255,20,0.08);
    filter:blur(90px);
    z-index:0;
}

body.bg-active .corner-glow{
    display:none;
}

.corner-1{
    top:-150px;
    left:-100px;
}

.corner-2{
    bottom:-180px;
    right:-100px;
}

/* MENU OCULTO */

#bg-menu{
    position:fixed;
    top:40px;
    right:40px;

    z-index:100;

    display:none;
    flex-direction:column;
    gap:12px;
}

#bg-menu.active{
    display:flex;
}

.bg-btn{
    padding:12px 20px;

    border-radius:14px;

    border:1px solid rgba(57,255,20,0.45);

    background:rgba(0,0,0,0.55);

    color:white;

    font-size:14px;
    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:0.25s;

    box-shadow:
    0 0 20px rgba(57,255,20,0.12);

    text-align:center;
}

.bg-btn:hover{
    transform:translateY(-2px);

    border-color:var(--neon);

    color:var(--neon);

    box-shadow:
    0 0 25px rgba(57,255,20,0.35);
}

#bg-input{
    display:none;
}

/* BOTÃO CENTRAL FIXO */

.center-button-wrapper{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:20;
}

.btn-start{
    position:relative;

    width:380px;
    height:380px;

    border-radius:50%;

    border:4px solid var(--neon);

    background:
    radial-gradient(circle at center,
    rgba(57,255,20,0.18),
    rgba(0,0,0,0.96));

    cursor:pointer;
    overflow:hidden;

    transition:0.3s;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:35px;

    box-shadow:
    0 0 30px rgba(57,255,20,0.8),
    inset 0 0 60px rgba(57,255,20,0.15);

    backdrop-filter:blur(4px);

    z-index:30;
}

.btn-start:hover{
    transform:scale(1.04);

    box-shadow:
    0 0 70px rgba(57,255,20,1),
    inset 0 0 80px rgba(57,255,20,0.35);
}

.btn-start::before{
    content:'';

    position:absolute;

    width:250%;
    height:250%;

    background:conic-gradient(
        transparent,
        rgba(57,255,20,1),
        rgba(57,255,20,0.25),
        transparent
    );

    animation:rotateGlow 3s linear infinite;

    filter:blur(20px);

    opacity:1;
}

.btn-start::after{
    content:'';

    position:absolute;

    inset:8px;

    border-radius:50%;

    background:rgba(0,0,0,0.92);

    box-shadow:
    inset 0 0 60px rgba(57,255,20,0.15);
}

@keyframes rotateGlow{
    100%{
        transform:rotate(360deg);
    }
}

.start-content{
    position:relative;
    z-index:5;
    text-align:center;
    width:100%;
}

.start-icon{
    font-size:58px;
    margin-bottom:18px;
    filter:drop-shadow(0 0 15px var(--neon));
}

.start-title{
    color:var(--neon);

    font-family:'Orbitron',sans-serif;

    font-size:22px;

    font-weight:900;

    letter-spacing:4px;

    text-shadow:
    0 0 15px var(--neon),
    0 0 35px var(--neon);

    margin-bottom:18px;

    text-transform:uppercase;

    line-height:1.4;

    min-height:40px;
}

.start-subtitle{
    font-size:22px;
    line-height:1.6;
}

.start-subtitle span{
    color:var(--neon);
    font-weight:bold;
    text-shadow:0 0 15px var(--neon);
}

</style>

</head>

<body>

<!-- FOTO DE FUNDO -->
<div id="dynamic-bg"></div>

<div class="corner-glow corner-1"></div>
<div class="corner-glow corner-2"></div>

<!-- LOGO CENTRAL -->
<div class="bg-brand">

    <div class="bg-brand-title">
        PHOTO PRINT
    </div>

    <div class="bg-brand-sub">
        Colecionando momentos
    </div>

</div>

<!-- LOGO SUPERIOR -->
<div class="top-logo">

    <div
        class="logo-title"
        id="secret-logo"
    >
        PHOTO PRINT
    </div>

    <div class="logo-sub">
        Colecionando momentos
    </div>

</div>

<!-- MENU OCULTO -->

<div id="bg-menu">

    <label
        class="bg-btn"
        for="bg-input"
    >
        🖼 ALTERAR FUNDO
    </label>

    <div
        class="bg-btn"
        onclick="removeBackground()"
    >
        ✖ SEM FUNDO
    </div>

</div>

<input
    type="file"
    id="bg-input"
    accept="image/*"
/>

<!-- BOTÃO CENTRAL -->

<div class="center-button-wrapper">

    <div class="btn-start">

        <div class="start-content">

            <div class="start-icon">
                📸
            </div>

            <div class="start-title">
                PHOTO PRINT
            </div>

            <div class="start-subtitle">
                Aperte para iniciar
            </div>

        </div>

    </div>

</div>

<script>

const bgInput =
document.getElementById('bg-input');

const dynamicBg =
document.getElementById('dynamic-bg');

const bgMenu =
document.getElementById('bg-menu');

const secretLogo =
document.getElementById('secret-logo');

/* =========================
   MENU SECRETO
========================= */

let clickCount = 0;
let clickTimer = null;

secretLogo.addEventListener('click',()=>{

    clickCount++;

    clearTimeout(clickTimer);

    clickTimer = setTimeout(()=>{

        clickCount = 0;

    },2000);

    if(clickCount >= 7){

        bgMenu.classList.toggle('active');

        clickCount = 0;

    }

});

/* =========================
   CONTROLE VISUAL
========================= */

function updateVisualMode(){

    const savedBg =
    localStorage.getItem('photoprint_bg');

    if(savedBg){

        document.body.classList.add('bg-active');

    }else{

        document.body.classList.remove('bg-active');

    }

}

/* =========================
   FOTO DE FUNDO
========================= */

bgInput.addEventListener('change',(e)=>{

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload = function(ev){

        const image =
        ev.target.result;

        dynamicBg.style.backgroundImage =
        `url('${image}')`;

        dynamicBg.classList.add('active');

        localStorage.setItem(
            'photoprint_bg',
            image
        );

        updateVisualMode();

        bgMenu.classList.remove('active');

    };

    reader.readAsDataURL(file);

});

function removeBackground(){

    localStorage.removeItem('photoprint_bg');

    dynamicBg.style.backgroundImage = "";

    dynamicBg.classList.remove('active');

    updateVisualMode();

    bgMenu.classList.remove('active');

}

function loadSavedBackground(){

    const savedBg =
    localStorage.getItem('photoprint_bg');

    if(savedBg){

        dynamicBg.style.backgroundImage =
        `url('${savedBg}')`;

        dynamicBg.classList.add('active');

    }

    updateVisualMode();

}

/* INIT */

loadSavedBackground();

</script>

</body>
</html>
