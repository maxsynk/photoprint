<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHOTO PRINT - GALLERY V5.0</title>
    </head>
<body>
    <div id="manutencao" style="display:none; position:fixed; inset:0; background:#000; color:red; font-size:50px; align-items:center; justify-content:center; z-index:9999;">
        SISTEMA EM MANUTENÇÃO
    </div>
    
    <main class="grid" id="grid-fotos"></main>

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";

        async function loopSync() {
            try {
                const res = await fetch(`${API}/get-all-states?t=${Date.now()}`);
                const data = await res.json();

                // 1. Controle de Manutenção
                const emManutencao = (data.config.status === "OFFLINE");
                document.getElementById('manutencao').style.display = emManutencao ? "flex" : "none";
                if(emManutencao) return;

                // 2. Atualizar Nome e Formato
                document.getElementById('nome-evento').innerText = data.config.evento;
                document.getElementById('tipo-formato').innerText = data.config.formato;

                // 3. Lógica de Impressão (via Worker)
                if (data.print && data.print.printTriggered) {
                    await imprimir(data.print.copias); // Sua função de impressão
                    await fetch(`${API}/clear-print`, { method: 'POST' });
                }

                // 4. Carregar novas fotos se necessário
                atualizarGrid(data.config.evento);

            } catch(e) { console.error("Falha na sincronização:", e); }
        }
        
        setInterval(loopSync, 2000);
    </script>
</body>
</html>
