<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>WEBCAM - PHOTO PRINT v8.3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

:root{
    --neon:#39ff14;
    --dark:#050505;
    --danger:#ff3131;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    background: radial-gradient(circle at top, rgba(57,255,20,0.10), transparent 35%),
                radial-gradient(circle at bottom right, rgba(57,255,20,0.08), transparent 30%),
                linear-gradient(135deg, #020202 0%, #050505 40%, #071107 100%);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    width:100vw; height:100vh;
    overflow:hidden; position:relative;
}

#dynamic-bg{
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    opacity:0; transition:opacity 0.6s ease;
}

#dynamic-bg.active{ opacity:0.45; }

#dynamic-bg::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65));
}

body::before{
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(57,255,20,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(57,255,20,0.03) 1px, transparent 1px);
    background-size:40px 40px; z-index:0;
    animation:gridMove 12s linear infinite;
}

body.bg-active::before{ display:none; }

@keyframes gridMove{
    from{ transform:translateY(0px); }
    to{ transform:translateY(40px); }
}

.bg-brand{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0.07;
}

body.bg-active .bg-brand{ display:none; }

.bg-brand-title{ font-family:'Orbitron',sans-serif; font-size:140px; font-weight:900; color:var(--neon); letter-spacing:14px; text-transform:uppercase; }
.bg-brand-sub{ margin-top:20px; font-size:42px; letter-spacing:12px; text-transform:uppercase; color:white; }

.top-logo{ position:fixed; top:40px; left:50px; z-index:25; }
.logo-title{ font-family:'Orbitron',sans-serif; color:var(--neon); font-size:46px; font-weight:900; letter-spacing:8px; text-shadow: 0 0 15px var(--neon), 0 0 35px rgba(57,255,20,0.8); cursor:pointer; user-select:none; }
.logo-sub{ margin-top:4px; color:white; opacity:0.7; letter-spacing:5px; font-size:13px; text-transform:uppercase; }

#active-event-name {
    position: fixed; top: 130px; left: 50px; z-index: 26;
    font-family: 'Orbitron', sans-serif; color: var(--neon); font-size: 16px; font-weight: 700;
    letter-spacing: 2px; text-shadow: 0 0 10px var(--neon); background: rgba(0,0,0,0.7);
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--neon); display: none;
}

.corner-glow{ position:fixed; width:420px; height:420px; border-radius:50%; background:rgba(57,255,20,0.08); filter:blur(90px); z-index:0; }
body.bg-active .corner-glow{ display:none; }
.corner-1{ top:-150px; left:-100px; }
.corner-2{ bottom:-180px; right:-100px; }

#bg-menu{ position:fixed; top:40px; right:40px; z-index:100; display:none; flex-direction:column; gap:12px; }
#bg-menu.active{ display:flex; }
.bg-btn{ padding:12px 20px; border-radius:14px; border:1px solid rgba(57,255,20,0.45); background:rgba(0,0,0,0.55); color:white; font-size:14px; font-weight:bold; letter-spacing:1px; cursor:pointer; backdrop-filter:blur(10px); transition:0.25s; box-shadow: 0 0 20px rgba(57,255,20,0.12); text-align:center; }
.bg-btn:hover{ transform:translateY(-2px); border-color:var(--neon); color:var(--neon); box-shadow: 0 0 25px rgba(57,255,20,0.35); }
#bg-input{ display:none; }

.screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; flex-direction:column; }

.btn-start{ position:relative; width:380px; height:380px; border-radius:50%; border:4px solid var(--neon); background: radial-gradient(circle at center, rgba(57,255,20,0.18), rgba(0,0,0,0.96)); overflow:hidden; transition:0.3s; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px; box-shadow: 0 0 30px rgba(57,255,20,0.8), inset 0 0 60px rgba(57,255,20,0.15); backdrop-filter:blur(4px); z-index:30; }
.btn-start::before{ content:''; position:absolute; width:250%; height:250%; background:conic-gradient( transparent, rgba(57,255,20,1), rgba(57,255,20,0.25), transparent ); animation:rotateGlow 3s linear infinite; filter:blur(20px); opacity:1; }
.btn-start::after{ content:''; position:absolute; inset:8px; border-radius:50%; background:rgba(0,0,0,0.92); box-shadow: inset 0 0 60px rgba(57,255,20,0.15); }
@keyframes rotateGlow{ 100%{ transform:rotate(360deg); } }

.start-content{ position:relative; z-index:5; text-align:center; width:100%; }
.start-icon{ font-size:58px; margin-bottom:18px; filter:drop-shadow(0 0 15px var(--neon)); }
.start-title{ color:var(--neon); font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; letter-spacing:4px; text-shadow: 0 0 15px var(--neon), 0 0 35px var(--neon); margin-bottom:18px; text-transform:uppercase; line-height:1.4; min-height:40px; }
.start-subtitle{ font-size:22px; line-height:1.6; }

#camera-wrapper { position: absolute; inset: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; z-index: 40; }
#camera-feed, #camera-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

.fun-text {
    position: absolute; top: 75%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif; font-size: 90px; font-weight: 900;
    text-align: center; color: #fff; white-space: nowrap; text-transform: uppercase;
    text-shadow: 0px 0px 15px #ff0080, 0px 0px 30px #ff8c00, 0px 0px 45px #ffff00;
    animation: funPulse 0.6s infinite alternate, hueShift 3s linear infinite; z-index: 50; pointer-events: none;
}
@keyframes funPulse { 0% { transform: translate(-50%, -50%) scale(0.9); } 100% { transform: translate(-50%, -50%) scale(1.15); } }
@keyframes hueShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

#options-overlay {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); padding: 20px 45px; border-radius: 50px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 60; text-align: center;
}
.options-text { font-family: 'Arial', sans-serif; font-size: 28px; color: #222; font-weight: bold; letter-spacing: 1px; }

.status-text { font-family:'Orbitron',sans-serif; font-size:40px; color:var(--neon); font-weight:900; letter-spacing:4px; text-shadow: 0 0 20px var(--neon); text-align:center; animation:pulseText 1.5s infinite; background: rgba(0,0,0,0.8); padding: 40px 80px; border-radius: 20px; border: 2px solid var(--neon); backdrop-filter: blur(10px); }
@keyframes pulseText { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
</style>
</head>
<body>

<div id="dynamic-bg"></div>
<div class="corner-glow corner-1"></div>
<div class="corner-glow corner-2"></div>

<div class="bg-brand">
    <div class="bg-brand-title">PHOTO PRINT</div>
    <div class="bg-brand-sub">Colecionando momentos</div>
</div>

<div class="top-logo">
    <div class="logo-title" id="secret-logo">PHOTO PRINT</div>
    <div class="logo-sub">Colecionando momentos</div>
</div>

<div id="active-event-name"></div>

<div id="bg-menu">
    <label class="bg-btn" for="bg-input">🖼 ALTERAR FUNDO</label>
    <div class="bg-btn" onclick="removeBackground()">✖ SEM FUNDO</div>
</div>
<input type="file" id="bg-input" accept="image/*"/>

<div id="screen-start" class="screen">
    <div class="btn-start">
        <div class="start-content">
            <div class="start-icon">📸</div>
            <div class="start-title">PHOTO PRINT</div>
            <div class="start-subtitle">Aguardando comando...</div>
        </div>
    </div>
</div>

<div id="screen-camera" class="screen" style="display:none; z-index:40;">
    <div id="camera-wrapper">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="camera-canvas" style="display:none;"></canvas>
        <div id="fun-text" class="fun-text" style="display:none;"></div>
        <div id="options-overlay" style="display:none;">
            <div class="options-text">ACESSE O TOTEM PARA IMPRIMIR SUA FOTO</div>
        </div>
    </div>
</div>

<div id="screen-thanks" class="screen" style="display:none;">
    <div class="status-text" id="thanks-text">🖨️ AGUARDE A IMPRESSÃO...</div>
</div>

<script>
const bgInput = document.getElementById('bg-input');
const dynamicBg = document.getElementById('dynamic-bg');
const bgMenu = document.getElementById('bg-menu');
const secretLogo = document.getElementById('secret-logo');

const videoFeed = document.getElementById('camera-feed');
const canvasCapture = document.getElementById('camera-canvas');
const ctx = canvasCapture.getContext('2d');
const funText = document.getElementById('fun-text');
const optionsOverlay = document.getElementById('options-overlay');
let stream = null;
let lastState = 'start';
let captureInProgress = false;
let initialLoad = true;

const API_BASE = 'https://photoprint-api.maxprimefotovideo.workers.dev';

let eventoAtual = null;
let formatoAtual = null;
let molduraUrl = null;

const FORMATOS = {
    "TIRINHA": { w: 600, h: 1800, fotos: 3, key: "TIRINHA", exigeH: false },
    "POLAROID": { w: 1200, h: 1500, fotos: 1, key: "POLAROID", exigeH: false },
    "10X15H": { w: 1800, h: 1200, fotos: 1, key: "10X15H", exigeH: true },
    "10X15V": { w: 1200, h: 1800, fotos: 1, key: "10X15V", exigeH: false }
};

// =================================================
// CONTROLE DO STREAM
// =================================================
async function startCameraStream() {
    if (stream) {
        if (videoFeed.srcObject !== stream) videoFeed.srcObject = stream;
        return true;
    }
    try {
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'user', width: 1920, height: 1080 } 
        });
        videoFeed.srcObject = stream;
        console.log('✅ Webcam iniciada.');
        return true;
    } catch (err) {
        console.warn("❌ Permissão de câmera negada.");
        return false;
    }
}

function stopCameraStream() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        videoFeed.srcObject = null;
        console.log('⏹️ Webcam desligada.');
    }
}

// =================================================
// SINCRONIZAÇÃO COM O PAINEL
// =================================================
async function atualizarEventoAtivo() {
    try {
        const res = await fetch(`${API_BASE}/status?t=${Date.now()}`);
        if (res.ok) {
            const data = await res.json();
            if (data.evento) {
                eventoAtual = data.evento;
                formatoAtual = data.formato ? data.formato.toUpperCase().trim() : "10X15V";
                const el = document.getElementById('active-event-name');
                el.style.display = 'block';
                el.innerText = `📸 ${eventoAtual}`;
                await carregarMoldura(eventoAtual);
                console.log(`📋 Evento ativo: ${eventoAtual} | Formato: ${formatoAtual}`);
                return eventoAtual;
            }
        }
    } catch(e) {}

    // Fallback localStorage
    try {
        const eventosDB = localStorage.getItem('eventos_db');
        if (eventosDB) {
            const eventos = JSON.parse(eventosDB);
            const ativo = eventos.find(e => e.ativo);
            if (ativo) {
                eventoAtual = ativo.nome;
                formatoAtual = ativo.formato ? ativo.formato.toUpperCase().trim() : "10X15V";
                const el = document.getElementById('active-event-name');
                el.style.display = 'block';
                el.innerText = `📸 ${eventoAtual}`;
                await carregarMoldura(eventoAtual);
                return eventoAtual;
            }
        }
    } catch (e) {}

    document.getElementById('active-event-name').style.display = 'none';
    return null;
}

async function carregarMoldura(evento) {
    try {
        const res = await fetch(`${API_BASE}/list-photos?evento=${encodeURIComponent(evento)}&t=${Date.now()}`);
        if (res.ok) {
            const arquivos = await res.json();
            const moldura = arquivos.find(f => f.key.toLowerCase().endsWith('.png'));
            if (moldura) {
                molduraUrl = `${API_BASE}/photo/${encodeURIComponent(moldura.key)}`;
                console.log('🖼️ Moldura carregada:', molduraUrl);
            } else {
                molduraUrl = null;
            }
        }
    } catch(e) {
        molduraUrl = null;
    }
}

// =================================================
// COMPOSIÇÃO E UPLOAD
// =================================================
async function composeAndUpload(quantidadeCopias) {
    if (!molduraUrl) {
        console.warn('⚠️ Sem moldura, enviando foto pura.');
        return uploadSemMoldura(quantidadeCopias);
    }

    const formatoConfig = FORMATOS[formatoAtual] || FORMATOS["10X15V"];
    const outCanvas = document.createElement('canvas');
    outCanvas.width = formatoConfig.w;
    outCanvas.height = formatoConfig.h;
    const outCtx = outCanvas.getContext('2d');

    outCtx.fillStyle = 'white';
    outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);

    try {
        const fotoImg = await loadImageFromCanvas(canvasCapture);
        const scale = Math.max(outCanvas.width / fotoImg.width, outCanvas.height / fotoImg.height);
        const w = fotoImg.width * scale;
        const h = fotoImg.height * scale;
        const x = (outCanvas.width - w) / 2;
        const y = (outCanvas.height - h) / 2;
        outCtx.drawImage(fotoImg, x, y, w, h);

        const molduraImg = await loadImage(molduraUrl);
        outCtx.drawImage(molduraImg, 0, 0, outCanvas.width, outCanvas.height);

        const blob = await canvasToBlob(outCanvas, 'image/jpeg', 0.95);
        await fazerUpload(blob, quantidadeCopias);
    } catch (e) {
        console.error('❌ Erro na composição:', e);
        await uploadSemMoldura(quantidadeCopias);
    }
}

function loadImage(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
    });
}

function loadImageFromCanvas(canvas) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = canvas.toDataURL('image/jpeg', 0.92);
    });
}

function canvasToBlob(canvas, type, quality) {
    return new Promise(resolve => {
        canvas.toBlob(resolve, type, quality);
    });
}

async function uploadSemMoldura(quantidadeCopias) {
    const blob = await canvasToBlob(canvasCapture, 'image/jpeg', 0.92);
    await fazerUpload(blob, quantidadeCopias);
}

async function fazerUpload(blob, quantidadeCopias) {
    if (!eventoAtual) {
        console.warn('❌ Nenhum evento ativo para upload.');
        return;
    }

    let nomeArquivo = 'foto.jpg';
    let copiasFisicas = 1;

    if (quantidadeCopias === 1) {
        nomeArquivo = 'foto.jpg';
        copiasFisicas = 1;
    } else if (quantidadeCopias === 2) {
        nomeArquivo = 'foto_2c.jpg';
        copiasFisicas = 2;
    } else if (quantidadeCopias === 3) {
        nomeArquivo = 'foto_2c_guestbook.jpg';
        copiasFisicas = 2;
    } else if (quantidadeCopias === 4) {
        nomeArquivo = 'foto_3c_guestbook.jpg';
        copiasFisicas = 3;
    }

    const form = new FormData();
    form.append('file', blob, nomeArquivo);
    form.append('evento', eventoAtual);
    form.append('copias', copiasFisicas);
    form.append('tipo', 'photo');

    try {
        const uploadRes = await fetch(`${API_BASE}/upload`, { method: 'POST', body: form });
        if (uploadRes.ok) {
            console.log(`⬆️ Upload concluído: ${nomeArquivo} (${copiasFisicas} cópia(s))`);
        } else {
            console.error('❌ Falha no upload.');
        }
    } catch (e) {
        console.error('❌ Erro no upload:', e);
    }
}

// =================================================
// AGUARDA TOTEM
// =================================================
async function aguardarPrintEEnviar() {
    optionsOverlay.style.display = 'block';
    optionsOverlay.querySelector('.options-text').innerText = 'ACESSE O TOTEM PARA IMPRIMIR SUA FOTO';

    let printData = null;
    for (let i = 0; i < 60; i++) {
        try {
            const res = await fetch(`${API_BASE}/check-print?t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                if (data.printTriggered) {
                    printData = data;
                    break;
                }
            }
        } catch(e) {}
        await new Promise(r => setTimeout(r, 500));
    }

    if (!printData) {
        console.warn('⏰ Timeout aguardando totem.');
        await fetch(`${API_BASE}/clear-print`, { method: 'POST' }).catch(()=>{});
        updateScreenState('start');
        return;
    }

    const copias = printData.copias || 1;
    optionsOverlay.querySelector('.options-text').innerText = 'Compondo foto...';

    try {
        await composeAndUpload(copias);
    } catch(e) {
        console.error('❌ Falha na composição/upload:', e);
    }

    await fetch(`${API_BASE}/clear-print`, { method: 'POST' }).catch(()=>{});
    await fetch(`${API_BASE}/photo-ready`, { method: 'POST' }).catch(()=>{});

    mostrarTelaAgradecimento();
}

function mostrarTelaAgradecimento() {
    document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
    document.getElementById('screen-thanks').style.display = 'flex';
    const msgThanks = document.getElementById('thanks-text');
    msgThanks.innerHTML = "🖨️ AGUARDE A IMPRESSÃO...";

    setTimeout(() => {
        msgThanks.innerHTML = "💖 OBRIGADO! 💖<br>APROVEITE SUA FOTO!";
        setTimeout(() => {
            document.getElementById('screen-thanks').style.display = 'none';
            document.getElementById('screen-start').style.display = 'flex';
            ctx.clearRect(0, 0, canvasCapture.width, canvasCapture.height);
            captureInProgress = false;
            stopCameraStream();
            lastState = 'start';
            fetch(`${API_BASE}/set-state`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: 'start' })
            }).catch(()=>{});
        }, 2500);
    }, 2500);
}

// =================================================
// CAPTURA
// =================================================
function startCaptureSequence() {
    if (captureInProgress) return;
    captureInProgress = true;
    
    videoFeed.style.display = 'block';
    canvasCapture.style.display = 'none';
    optionsOverlay.style.display = 'none';
    
    funText.style.display = 'block';
    funText.innerHTML = "✨ PREPARE-SE! ✨<br>😜🕺💃";
    
    setTimeout(() => {
        let countdown = 3;
        funText.innerHTML = `😁 SORRIA! 😁<br>⏳ ${countdown}`;
        
        const timerInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                funText.innerHTML = `😁 SORRIA! 😁<br>⏳ ${countdown}`;
            } else if (countdown === 0) {
                funText.style.display = 'none';
                clearInterval(timerInterval);
                
                canvasCapture.width = videoFeed.videoWidth;
                canvasCapture.height = videoFeed.videoHeight;
                ctx.drawImage(videoFeed, 0, 0, canvasCapture.width, canvasCapture.height);
                
                videoFeed.style.display = 'none';
                canvasCapture.style.display = 'block';
                
                fetch(`${API_BASE}/photo-ready`, { method: 'POST' }).catch(()=>{});
                captureInProgress = false;

                // Já podemos mostrar o overlay de espera pelo totem
                optionsOverlay.style.display = 'block';
                optionsOverlay.querySelector('.options-text').innerText = 'ACESSE O TOTEM PARA IMPRIMIR SUA FOTO';
            }
        }, 1000);
    }, 4000);
}

// =================================================
// SINCRONIZAÇÃO DE ESTADOS
// =================================================
function updateScreenState(state) {
    if (state === lastState && state !== 'capturing') return;
    
    if (state === 'start' && lastState === 'options') {
        aguardarPrintEEnviar();
        lastState = state;
        return;
    }

    if (state === 'capturing' && lastState === 'options') return;

    document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');

    if (state === 'capturing') {
        startCameraStream().then(success => {
            if (success) {
                document.getElementById('screen-camera').style.display = 'flex';
                startCaptureSequence();
            } else {
                alert('Não foi possível acessar a câmera.');
                captureInProgress = false;
                updateScreenState('start');
            }
        });
    } 
    else if (state === 'options') {
        document.getElementById('screen-camera').style.display = 'flex';
        videoFeed.style.display = 'none';
        canvasCapture.style.display = 'block';
        funText.style.display = 'none';
        optionsOverlay.style.display = 'block';
        optionsOverlay.querySelector('.options-text').innerText = 'ACESSE O TOTEM PARA IMPRIMIR SUA FOTO';
        stopCameraStream();
    } 
    else {
        document.getElementById('screen-start').style.display = 'flex';
        captureInProgress = false;
        stopCameraStream();
    }
    
    lastState = state;
}

// =================================================
// POLLING
// =================================================
async function pollServerState() {
    try {
        const res = await fetch(`${API_BASE}/get-state?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data.state || data.state === lastState) return;

        if (initialLoad) {
            initialLoad = false;
            if (data.state !== 'start') {
                await fetch(`${API_BASE}/set-state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state: 'start' })
                });
                updateScreenState('start');
                return;
            }
        }

        console.log(`🔁 Estado: ${lastState} -> ${data.state}`);
        updateScreenState(data.state);
    } catch(e) {}
}

// =================================================
// INICIALIZAÇÃO
// =================================================
window.addEventListener('storage', (e) => {
    if (e.key === 'booth_state') updateScreenState(e.newValue);
});

secretLogo.addEventListener('click',()=>{
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(()=>{ clickCount = 0; },2000);
    if(clickCount >= 7){ bgMenu.classList.toggle('active'); clickCount = 0; }
});
let clickCount = 0, clickTimer = null;

function updateVisualMode(){
    const savedBg = localStorage.getItem('photoprint_bg');
    if(savedBg){ document.body.classList.add('bg-active'); }
    else{ document.body.classList.remove('bg-active'); }
}

bgInput.addEventListener('change',(e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
        const image = ev.target.result;
        dynamicBg.style.backgroundImage = `url('${image}')`;
        dynamicBg.classList.add('active');
        localStorage.setItem('photoprint_bg', image);
        updateVisualMode();
        bgMenu.classList.remove('active');
    };
    reader.readAsDataURL(file);
});

function removeBackground(){
    localStorage.removeItem('photoprint_bg');
    dynamicBg.style.backgroundImage = "";
    dynamicBg.classList.remove('active');
    updateVisualMode();
    bgMenu.classList.remove('active');
}

function loadSavedBackground(){
    const savedBg = localStorage.getItem('photoprint_bg');
    if(savedBg){
        dynamicBg.style.backgroundImage = `url('${savedBg}')`;
        dynamicBg.classList.add('active');
    }
    updateVisualMode();
}

loadSavedBackground();
localStorage.setItem('booth_state', 'start');
updateScreenState('start');

setInterval(pollServerState, 800);
setInterval(atualizarEventoAtivo, 10000);
atualizarEventoAtivo();

console.log('🚀 WEBCAM PHOTO PRINT v8.3 pronta.');
</script>
