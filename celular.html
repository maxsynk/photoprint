<!-- INÍCIO DO NOVO BLOCO <style> — celular.html v4.1           -->
<!-- ═══════════════════════════════════════════════════════════ -->
<style>
    :root {
        /* Cores base */
        --neon: #39ff14;
        --neon-dim: rgba(57, 255, 20, 0.12);
        --neon-glow: 0 0 20px rgba(57, 255, 20, 0.4);
        --neon-soft: 0 0 40px rgba(57, 255, 20, 0.2);
        --red: #ff3131;
        --red-dim: rgba(255, 49, 49, 0.15);
        --blue: #00e5ff;
        --blue-dim: rgba(0, 229, 255, 0.12);
        --yellow: #ffb800;
        --yellow-dim: rgba(255, 184, 0, 0.15);

        /* Backgrounds */
        --bg-0: #000000;
        --bg-1: #0a0a0a;
        --bg-2: #111111;
        --bg-3: #1a1a1a;
        --bg-4: #222222;

        /* Texto */
        --text-0: #ffffff;
        --text-1: #e0e0e0;
        --text-2: #999999;
        --text-3: #555555;

        /* Borders */
        --border-1: rgba(255, 255, 255, 0.06);
        --border-2: rgba(255, 255, 255, 0.1);
        --border-neon: rgba(57, 255, 20, 0.3);

        /* Radius */
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-xl: 28px;

        /* Shadows */
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);

        /* Transitions */
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-fast: all 0.15s ease;

        /* ═══════════ NOVA TIPOGRAFIA SUAVE ═══════════ */
        --font-display: 'Outfit', sans-serif;      /* Títulos grandes */
        --font-mono: 'Space Grotesk', sans-serif;  /* Números */
        --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif; /* Corpo */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
        font-family: var(--font-body);
        background: var(--bg-0);
        color: var(--text-0);
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        display: flex;
        flex-direction: column;
        position: relative;
        background:
            radial-gradient(circle at 50% 30%, rgba(26, 58, 18, 0.4) 0%, transparent 50%),
            radial-gradient(circle at 80% 90%, rgba(57, 255, 20, 0.03) 0%, transparent 40%),
            var(--bg-0);
    }

    /* Orb animada de fundo (respiracao) */
    body::after {
        content: '';
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(57, 255, 20, 0.08) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        animation: orbBreath 4s ease-in-out infinite;
        z-index: 1;
    }
    @keyframes orbBreath {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* Fundo dinâmico personalizado */
    #dynamic-bg {
        position: fixed; inset: 0;
        z-index: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 0.6s ease;
    }
    #dynamic-bg.active { opacity: 0.35; }
    #dynamic-bg::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85));
    }

    /* Grid pattern sutil */
    body::before {
        content: '';
        position: fixed; inset: 0;
        background-image:
            linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 0;
        animation: gridMove 12s linear infinite;
        pointer-events: none;
        mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
    }
    body.bg-active::before { display: none; }
    @keyframes gridMove { from { transform: translateY(0); } to { transform: translateY(40px); } }

    /* ═══════════════════════════════════════════════════════════
       STATUS BADGE FLUTUANTE (novo)
       ═══════════════════════════════════════════════════════════ */
    .status-badge {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 20;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: rgba(10, 10, 10, 0.85);
        border: 1px solid var(--border-2);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-family: var(--font-body);
        box-shadow: var(--shadow-sm);
    }
    .status-badge .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 8px var(--red);
        animation: pulseDot 2s ease-in-out infinite;
    }
    .status-badge.online .dot {
        background: var(--neon);
        box-shadow: 0 0 8px var(--neon);
    }
    .status-badge.online { color: var(--neon); border-color: var(--border-neon); }
    @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* ═══════════════════════════════════════════════════════════
       HEADER REFORMULADO
       ═══════════════════════════════════════════════════════════ */
    .header {
        position: relative;
        z-index: 10;
        padding: 22px 20px 18px 26px;
        margin: 16px 16px 0;
        background: linear-gradient(135deg, rgba(10,10,10,0.9), rgba(17,17,17,0.7));
        border: 1px solid var(--border-1);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow-md);
        overflow: hidden;
        cursor: pointer;
        transition: var(--transition);
    }
    .header::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: linear-gradient(180deg, var(--neon), rgba(57,255,20,0.3));
        box-shadow: 0 0 12px var(--neon);
        animation: borderGlow 2s ease-in-out infinite;
    }
    @keyframes borderGlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }

    .brand-title {
        font-family: var(--font-display);
        font-size: clamp(22px, 6vw, 30px);
        font-weight: 900;
        color: var(--neon);
        text-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1;
    }
    .subtitle {
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--text-3);
        text-transform: uppercase;
        font-weight: 700;
        margin-top: 4px;
        font-family: var(--font-body);
    }

    #nome-evento-capa {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 700;
        color: var(--neon);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 14px;
        min-height: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    #nome-evento-capa::before {
        content: '';
        display: inline-block;
        width: 6px; height: 6px;
        background: var(--neon);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--neon);
        animation: pulseDot 1.5s ease-in-out infinite;
    }

    #modo-guestbook {
        display: none;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 4px 10px;
        background: var(--blue-dim);
        border: 1px solid rgba(0, 229, 255, 0.4);
        border-radius: 20px;
        color: var(--blue);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-family: var(--font-body);
    }
    #modo-guestbook.visible { display: inline-flex; }

    /* ═══════════════════════════════════════════════════════════
       SEGMENTED CONTROL (modo selector reformulado)
       ═══════════════════════════════════════════════════════════ */
    .modo-selector {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
    }
    .modo-selector > span {
        font-size: 10px;
        color: var(--text-3);
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 1px;
        font-family: var(--font-body);
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .modo-segment {
        position: relative;
        display: inline-flex;
        background: var(--bg-0);
        border: 1px solid var(--border-2);
        border-radius: 20px;
        padding: 3px;
        gap: 0;
    }
    .modo-btn {
        position: relative;
        z-index: 2;
        padding: 7px 16px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        background: transparent;
        border: none;
        color: var(--text-3);
        transition: var(--transition-fast);
        text-transform: uppercase;
        font-family: var(--font-body);
    }
    .modo-btn.activo { color: var(--bg-0); }
    .modo-indicator {
        position: absolute;
        top: 3px; bottom: 3px;
        left: 3px;
        width: calc(50% - 3px);
        background: var(--neon);
        border-radius: 20px;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
        z-index: 1;
    }
    .modo-indicator.right { transform: translateX(100%); }

    /* ═══════════════════════════════════════════════════════════
       BOTÃO OLHO REFORMULADO (anel duplo rotativo)
       ═══════════════════════════════════════════════════════════ */
    .main-ui {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        flex-direction: column;
        gap: 24px;
        padding-bottom: 40px;
    }

    .btn-eye-wrapper {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Anel externo rotativo */
    .btn-eye-wrapper::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed rgba(57, 255, 20, 0.3);
        animation: rotateRing 20s linear infinite;
    }
    @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* Anel interno estático */
    .btn-eye-wrapper::after {
        content: '';
        position: absolute;
        inset: 20px;
        border-radius: 50%;
        border: 1px solid rgba(57, 255, 20, 0.15);
    }

    .btn-eye {
        position: relative;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 3px solid var(--neon);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle, rgba(0,0,0,0.9) 0%, rgba(10,20,5,0.9) 100%);
        backdrop-filter: blur(10px);
        animation: pulseNeon 2.4s infinite;
        transition: var(--transition);
        z-index: 2;
    }
    .btn-eye:active { transform: scale(0.94); }
    .btn-eye.desativado {
        opacity: 0.35;
        animation: none;
        pointer-events: none;
        filter: grayscale(0.7);
    }
    .eye-inner {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3px solid var(--neon);
        background: radial-gradient(circle, rgba(57,255,20,0.15) 0%, transparent 70%);
        box-shadow:
            inset 0 0 20px rgba(57, 255, 20, 0.3),
            0 0 20px rgba(57, 255, 20, 0.4);
        transition: var(--transition);
    }
    .btn-eye:hover .eye-inner {
        transform: scale(1.1);
        box-shadow:
            inset 0 0 30px rgba(57, 255, 20, 0.5),
            0 0 30px rgba(57, 255, 20, 0.6);
    }

    @keyframes pulseNeon {
        0% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.7), 0 0 20px rgba(57, 255, 20, 0.3); }
        70% { box-shadow: 0 0 0 24px rgba(57, 255, 20, 0), 0 0 20px rgba(57, 255, 20, 0.3); }
        100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0), 0 0 20px rgba(57, 255, 20, 0.3); }
    }

    /* Texto dinâmico abaixo do botão */
    .btn-hint {
        font-family: var(--font-body);
        font-size: 11px;
        color: var(--text-2);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 800;
        text-align: center;
        transition: var(--transition);
    }
    .btn-hint .highlight {
        display: block;
        color: var(--neon);
        margin-top: 4px;
        font-size: 12px;
    }

    /* ═══════════════════════════════════════════════════════════
       CÂMERA REFORMULADA
       ═══════════════════════════════════════════════════════════ */
    #cam-container {
        position: fixed; inset: 0;
        background: #000;
        display: none;
        z-index: 1000;
    }
    #cam-container.active { display: block; }
    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .mirror { transform: scaleX(-1); }

    #overlay {
        position: absolute; inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        pointer-events: none;
    }

    /* Grupo do topo - contador */
    .topo-grupo {
        background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(10,20,5,0.85));
        border: 1px solid var(--neon);
        padding: 18px 32px 20px;
        border-radius: var(--radius-xl);
        width: 88%;
        max-width: 420px;
        backdrop-filter: blur(16px);
        box-shadow:
            0 0 30px rgba(57, 255, 20, 0.15),
            inset 0 0 30px rgba(57, 255, 20, 0.05);
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    .topo-grupo::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--neon), transparent);
        animation: scanLine 2s ease-in-out infinite;
    }
    @keyframes scanLine {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
    }

    #info-topo {
        font-family: var(--font-body);
        font-size: 10px;
        font-weight: 800;
        color: var(--neon);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    #num-count {
        font-family: var(--font-mono);
        font-size: 84px;
        font-weight: 700;
        color: #fff;
        line-height: 1;
        display: block;
        text-shadow:
            0 0 30px var(--neon),
            0 0 60px rgba(57, 255, 20, 0.4);
        letter-spacing: -2px;
    }
    #sub-count {
        font-family: var(--font-body);
        font-size: 11px;
        font-weight: 800;
        color: var(--neon);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 6px;
        display: block;
    }

    /* Controles da câmera */
    #cam-controls {
        position: absolute;
        bottom: 40px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        width: 100%;
        padding: 0 24px;
        pointer-events: auto;
    }
    .cam-btn {
        width: 58px;
        height: 58px;
        background: rgba(0, 0, 0, 0.8);
        border: 1.5px solid var(--neon);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition-fast);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
    }
    .cam-btn:active { transform: scale(0.88); }
    .cam-btn.disabled { opacity: 0.3; pointer-events: none; }
    .cam-btn i {
        color: var(--neon);
        font-size: 20px;
    }

    /* Shutter reformulado com anel pulsante */
    .shutter-wrapper {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .shutter-wrapper::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(57, 255, 20, 0.3);
        animation: shutterPulse 2s ease-in-out infinite;
    }
    @keyframes shutterPulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.2; }
    }
    .shutter-btn {
        position: relative;
        width: 76px;
        height: 76px;
        background: radial-gradient(circle, #000 40%, rgba(57,255,20,0.1) 100%);
        border-radius: 50%;
        border: 4px solid var(--neon);
        cursor: pointer;
        box-shadow:
            0 0 24px var(--neon),
            inset 0 0 20px rgba(57, 255, 20, 0.2);
        transition: var(--transition-fast);
        z-index: 2;
    }
    .shutter-btn:active { transform: scale(0.9); }

    /* ═══════════════════════════════════════════════════════════
       OVERLAYS (flash, loader, offline, rotate)
       ═══════════════════════════════════════════════════════════ */
    #flash {
        position: fixed; inset: 0;
        background: #fff;
        display: none;
        z-index: 2000;
        pointer-events: none;
    }

    #loader {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.96);
        backdrop-filter: blur(16px);
        z-index: 3000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
    }
    #loader.active { display: flex; }

    .spin {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(57, 255, 20, 0.15);
        border-top-color: var(--neon);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #offline-overlay {
        position: fixed; inset: 0;
        background: #000;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 30px;
    }
    #offline-overlay.active { display: flex; }
    .offline-icon {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--red-dim);
        border: 2px solid var(--red);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--red);
        font-size: 38px;
        margin-bottom: 28px;
        animation: pulseOff 1.5s ease-in-out infinite;
    }
    @keyframes pulseOff {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 49, 49, 0.5); }
        50% { box-shadow: 0 0 0 24px rgba(255, 49, 49, 0); }
    }
    .offline-text {
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 900;
        color: var(--red);
        text-shadow: 0 0 30px var(--red);
        text-transform: uppercase;
        letter-spacing: 3px;
        text-align: center;
        line-height: 1.3;
        margin-bottom: 14px;
    }
    .offline-sub {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 700;
    }

    #rotate-warning {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.98);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        color: var(--neon);
        padding: 30px;
        text-align: center;
    }
    #rotate-warning.active { display: flex; }
    .icon-rotate {
        width: 96px;
        height: 96px;
        margin-bottom: 28px;
        animation: rotateAnim 2s ease-in-out infinite;
    }
    @keyframes rotateAnim {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
    }
    #rotate-warning h2 {
        font-family: var(--font-display);
        font-size: 22px;
        margin-bottom: 10px;
        letter-spacing: 2px;
        font-weight: 900;
    }
    #rotate-warning p {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--text-2);
        letter-spacing: 1px;
        font-weight: 600;
    }

    /* ═══════════════════════════════════════════════════════════
       MENU SECRETO
       ═══════════════════════════════════════════════════════════ */
    #bg-menu {
        position: fixed;
        top: 100px;
        left: 16px;
        z-index: 100;
        display: none;
        flex-direction: column;
        gap: 10px;
    }
    #bg-menu.active { display: flex; animation: slideIn 0.3s ease; }
    @keyframes slideIn {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
    }
        .bg-btn {
        padding: 12px 20px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-neon);
        background: rgba(0, 0, 0, 0.9);
        color: var(--text-0);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        cursor: pointer;
        backdrop-filter: blur(12px);
        text-align: center;
        transition: var(--transition-fast);
        font-family: var(--font-body);
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
    }
    .bg-btn:hover, .bg-btn:active {
        background: var(--neon-dim);
        color: var(--neon);
        border-color: var(--neon);
    }
    .bg-btn i { font-size: 14px; }
    #bg-input { display: none; }

    /* ═══════════════════════════════════════════════════════════
       TOASTS REFORMULADOS (com barra de progresso)
       ═══════════════════════════════════════════════════════════ */
    .toast-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: calc(100% - 40px);
        max-width: 380px;
        pointer-events: none;
    }
    .toast {
        position: relative;
        background: rgba(10, 10, 10, 0.95);
        border: 1px solid var(--border-2);
        border-left: 3px solid var(--neon);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: var(--shadow-lg);
        pointer-events: auto;
        animation: toastIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(16px);
        overflow: hidden;
    }
    .toast::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 100%;
        background: var(--neon);
        transform-origin: left;
        animation: toastProgress 3.2s linear forwards;
    }
    @keyframes toastProgress {
        from { transform: scaleX(1); }
        to { transform: scaleX(0); }
    }
    .toast.error { border-left-color: var(--red); }
    .toast.error::after { background: var(--red); }
    .toast.info { border-left-color: var(--blue); }
    .toast.info::after { background: var(--blue); }
    .toast.warning { border-left-color: var(--yellow); }
    .toast.warning::after { background: var(--yellow); }

    .toast-icon {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
        background: var(--neon-dim);
        color: var(--neon);
        animation: iconBounce 0.4s ease;
    }
    @keyframes iconBounce {
        0% { transform: scale(0.5); }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    .toast.error .toast-icon { background: var(--red-dim); color: var(--red); }
    .toast.info .toast-icon { background: var(--blue-dim); color: var(--blue); }
    .toast.warning .toast-icon { background: var(--yellow-dim); color: var(--yellow); }

    .toast-title {
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 3px;
        letter-spacing: 0.3px;
    }
    .toast-message {
        font-family: var(--font-body);
        font-size: 11px;
        color: var(--text-2);
        font-weight: 500;
        line-height: 1.3;
    }
    @keyframes toastIn {
        from { opacity: 0; transform: translateY(-20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast.removing {
        animation: toastOut 0.3s ease forwards;
    }
    @keyframes toastOut {
        to { opacity: 0; transform: translateY(-20px) scale(0.95); }
    }

    /* ═══════════════════════════════════════════════════════════
       TELA DE PREVIEW / OPÇÕES DE IMPRESSÃO
       ═══════════════════════════════════════════════════════════ */
    .preview-wrapper {
        position: relative;
        margin-bottom: 20px;
        animation: previewPop 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes previewPop {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }
    .preview-wrapper::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: var(--radius-lg);
        background: linear-gradient(135deg, var(--neon), transparent 50%, var(--neon));
        opacity: 0.4;
        filter: blur(12px);
        z-index: -1;
        animation: previewGlow 3s ease-in-out infinite;
    }
    @keyframes previewGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
    }
    .preview-img {
        max-height: 42vh;
        max-width: 88%;
        border: 2px solid var(--neon);
        border-radius: var(--radius-md);
        box-shadow: 0 0 30px rgba(57, 255, 20, 0.4);
        display: block;
        margin: 0 auto;
    }

    .options-title {
        font-family: var(--font-display);
        font-size: 14px;
        color: var(--neon);
        font-weight: 800;
        letter-spacing: 1px;
        margin-bottom: 18px;
        text-transform: uppercase;
        text-align: center;
    }

    .print-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        width: 90%;
        max-width: 360px;
        margin: 0 auto 20px;
    }
    .print-capsule-btn {
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid var(--neon);
        color: var(--neon);
        padding: 14px 15px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.5px;
        border-radius: 50px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition-fast);
        font-family: var(--font-body);
        text-transform: uppercase;
        position: relative;
        overflow: hidden;
    }
    .print-capsule-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(57, 255, 20, 0.3) 0%, transparent 70%);
        opacity: 0;
        transform: scale(0);
        transition: all 0.4s ease;
    }
    .print-capsule-btn:active::before {
        opacity: 1;
        transform: scale(2);
    }
    .print-capsule-btn:active { transform: scale(0.95); }
    .print-capsule-btn.color-green { border-color: var(--neon); color: var(--neon); }
    .print-capsule-btn.color-green.active {
        background: var(--neon);
        color: var(--bg-0);
        box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
    }
    .print-capsule-btn.color-blue { border-color: var(--blue); color: var(--blue); }
    .print-capsule-btn.color-blue.active {
        background: var(--blue);
        color: var(--bg-0);
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    /* Botão enviar */
    .btn-send {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--neon);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
            0 0 24px var(--neon),
            inset 0 -4px 8px rgba(0, 0, 0, 0.3);
        transition: var(--transition);
        margin-bottom: 10px;
        position: relative;
    }
    .btn-send::after {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px solid rgba(57, 255, 20, 0.3);
        animation: shutterPulse 2s ease-in-out infinite;
    }
    .btn-send:active { transform: scale(0.92); }
    .btn-send i {
        color: var(--bg-0);
        font-size: 26px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .send-label {
        font-family: var(--font-body);
        font-size: 11px;
        color: var(--neon);
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 14px;
    }

    .btn-cancel {
        background: transparent;
        border: 1px solid var(--border-2);
        color: var(--text-3);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 6px;
        cursor: pointer;
        padding: 10px 24px;
        border-radius: 20px;
        font-family: var(--font-body);
        transition: var(--transition-fast);
    }
    .btn-cancel:hover, .btn-cancel:active {
        color: var(--red);
        border-color: var(--red);
        background: var(--red-dim);
    }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVO
       ═══════════════════════════════════════════════════════════ */
    @media (min-width: 900px) {
        .btn-hint { display: none; }
        .btn-eye-wrapper { width: 240px; height: 240px; }
        .btn-eye { width: 180px; height: 180px; }
        .eye-inner { width: 72px; height: 72px; }
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMAÇÕES DE ENTRADA (para dar vida)
       ═══════════════════════════════════════════════════════════ */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .header { animation: fadeInUp 0.5s ease-out; }
    .main-ui { animation: fadeInUp 0.6s ease-out 0.1s backwards; }
</style>
