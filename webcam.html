<head>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- INÍCIO DO BLOCO DE ESTILOS (CSS)                            -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <style>
        :root {
            --neon: #39ff14;
            --neon-dim: rgba(57, 255, 20, 0.12);
            --neon-glow: 0 0 20px rgba(57, 255, 20, 0.4);
            --red: #ff3131;
            --red-dim: rgba(255, 49, 49, 0.15);
            
            --bg-0: #000000;
            --bg-1: #0a0a0a;
            --bg-2: #111111;
            --bg-3: #1a1a1a;
            
            --text-0: #ffffff;
            --text-1: #e0e0e0;
            --text-2: #999999;
            --text-3: #555555;
            
            --border-1: rgba(255, 255, 255, 0.06);
            --border-neon: rgba(57, 255, 20, 0.3);
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            font-family: var(--font-body);
            background: var(--bg-0);
            color: var(--text-0);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background:
                radial-gradient(circle at 50% 0%, rgba(26, 58, 18, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(57, 255, 20, 0.03) 0%, transparent 40%),
                var(--bg-0);
            position: relative;
        }

        /* Grid de fundo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridMove 12s linear infinite;
            pointer-events: none;
        }
        @keyframes gridMove {
            from { transform: translateY(0); }
            to { transform: translateY(40px); }
        }

        /* Fundo Dinâmico */
        #dynamic-bg {
            position: fixed; inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        #dynamic-bg.active { opacity: 0.45; }
        #dynamic-bg::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85));
        }
        body.bg-active::before { display: none; }

        /* Marca d'água central (background) */
        .bg-brand {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.05;
        }
        body.bg-active .bg-brand { display: none; }
        .bg-brand-title {
            font-family: var(--font-display);
            font-size: clamp(80px, 15vw, 180px);
            font-weight: 900;
            color: var(--neon);
            letter-spacing: 16px;
            text-transform: uppercase;
            line-height: 1;
        }
        .bg-brand-sub {
            margin-top: 20px;
            font-size: clamp(18px, 3vw, 36px);
            letter-spacing: 12px;
            text-transform: uppercase;
            color: var(--text-0);
            font-weight: 700;
        }

        /* Luzes decorativas nos cantos */
        .corner-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.06);
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }
        body.bg-active .corner-glow { display: none; }
        .corner-1 { top: -180px; left: -120px; }
        .corner-2 { bottom: -180px; right: -120px; }

        /* ═══════════ LOGO SUPERIOR ═══════════ */
        .top-logo {
            position: fixed;
            top: 40px;
            left: 48px;
            z-index: 25;
            cursor: pointer;
        }
        .logo-title {
            font-family: var(--font-display);
            color: var(--neon);
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: var(--neon-glow), 0 0 35px rgba(57,255,20,0.6);
            user-select: none;
            line-height: 1;
        }
        .logo-sub {
            margin-top: 6px;
            color: var(--text-2);
            letter-spacing: 4px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Evento ativo */
        #active-event-name {
            position: fixed;
            top: 120px;
            left: 48px;
            z-index: 26;
            font-family: var(--font-body);
            color: var(--neon);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(57,255,20,0.5);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-neon);
            display: none;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }
        #active-event-name.visible { display: inline-flex; align-items: center; gap: 8px; }
        #active-event-name::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--neon);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon);
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Debug Info */
        #debug-info {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 999;
            background: rgba(0,0,0,0.8);
            color: var(--neon);
            font-size: 10px;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: var(--font-body);
            max-width: 350px;
            word-break: break-all;
            border: 1px solid var(--border-1);
            display: none; /* Oculto por padrão, pode ser ativado */
        }

        /* ═══════════ MENU SECRETO ═══════════ */
        #bg-menu {
            position: fixed;
            top: 120px;
            right: 40px;
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        #bg-menu.active { display: flex; animation: slideIn 0.3s ease; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bg-btn {
            padding: 12px 22px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-neon);
            background: rgba(0,0,0,0.85);
            color: var(--text-0);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bg-btn:hover {
            transform: translateY(-2px);
            border-color: var(--neon);
            color: var(--neon);
            box-shadow: var(--neon-glow);
        }
        #bg-input { display: none; }

        /* ═══════════ OVERLAY OFFLINE ═══════════ */
        #offline-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #offline-overlay.active { display: flex; }
        .offline-text {
            font-family: var(--font-display);
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
            color: var(--red);
            text-shadow: 0 0 20px var(--red);
            animation: pulseOff 1.5s infinite;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            line-height: 1.3;
        }
        @keyframes pulseOff {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ═══════════ MENSAGEM DE GESTO ═══════════ */
        #gesto-msg {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            pointer-events: none;
            display: none;
        }
        #gesto-msg.active { display: block; }
        .msg-text {
            font-family: var(--font-display);
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px var(--neon);
            animation: pulseGesto 1.2s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 16px 36px;
            border-radius: 30px;
            border: 2px solid var(--neon);
            backdrop-filter: blur(10px);
        }
        @keyframes pulseGesto {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.03); }
        }

        /* ═══════════ TELAS ═══════════ */
        .screen {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            flex-direction: column;
        }
        .screen.active { display: flex; }

        /* TELA DE INÍCIO (Botão Grande) */
        .btn-start {
            position: relative;
            width: clamp(280px, 40vw, 380px);
            height: clamp(280px, 40vw, 380px);
            border-radius: 50%;
            border: 4px solid var(--neon);
            background: radial-gradient(circle at center, rgba(57,255,20,0.15), rgba(0,0,0,0.96));
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-shadow: 0 0 40px rgba(57,255,20,0.5), inset 0 0 60px rgba(57,255,20,0.1);
            backdrop-filter: blur(4px);
            z-index: 30;
            animation: startPulse 2.5s infinite;
        }
        @keyframes startPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(57,255,20,0.5), inset 0 0 60px rgba(57,255,20,0.1); }
            50% { box-shadow: 0 0 60px rgba(57,255,20,0.8), inset 0 0 80px rgba(57,255,20,0.2); }
        }
        
        .btn-start::before {
            content: '';
            position: absolute;
            width: 250%;
            height: 250%;
            background: conic-gradient(transparent, rgba(57,255,20,0.8), rgba(57,255,20,0.2), transparent);
            animation: rotateGlow 3s linear infinite;
            filter: blur(20px);
            opacity: 0.7;
        }
        .btn-start::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: rgba(0,0,0,0.9);
            box-shadow: inset 0 0 60px rgba(57,255,20,0.15);
        }
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }

        .start-content {
            position: relative;
            z-index: 5;
            text-align: center;
            width: 100%;
        }
        .start-icon {
            font-size: clamp(48px, 6vw, 64px);
            margin-bottom: 20px;
            color: var(--neon);
            filter: drop-shadow(0 0 20px var(--neon));
        }
        .start-title {
            font-family: var(--font-display);
            color: var(--neon);
            font-size: clamp(20px, 2.5vw, 26px);
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: var(--neon-glow);
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .start-subtitle {
            font-family: var(--font-body);
            font-size: clamp(14px, 1.8vw, 18px);
            color: var(--text-1);
            line-height: 1.5;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* TELA DA CÂMERA */
        #camera-wrapper {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }
        #camera-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1);
        }

        /* Texto flutuante (SORRIA, PREPARE-SE) */
        .fun-text {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 900;
            text-align: center;
            color: #fff;
            white-space: nowrap;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--neon), 0 0 30px rgba(57,255,20,0.5);
            animation: funPulse 0.6s infinite alternate;
            z-index: 50;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 14px 32px;
            border-radius: 40px;
            border: 2px solid var(--neon);
            display: none;
            letter-spacing: 2px;
        }
        @keyframes funPulse {
            0% { transform: translateX(-50%) scale(0.95); }
            100% { transform: translateX(-50%) scale(1.05); }
        }

        /* Overlay de opções (após captura) */
        #options-overlay {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.95);
            padding: 24px 50px;
            border-radius: 60px;
            box-shadow: var(--shadow-lg), var(--neon-glow);
            z-index: 60;
            text-align: center;
            display: none;
            border: 2px solid var(--neon);
            backdrop-filter: blur(16px);
        }
        #options-overlay.active { display: block; animation: fadeInUp 0.4s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .options-text {
            font-family: var(--font-body);
            font-size: clamp(16px, 2vw, 22px);
            color: var(--neon);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Tela de Agradecimento */
        .status-text {
            font-family: var(--font-display);
            font-size: clamp(28px, 4vw, 44px);
            color: var(--neon);
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 25px var(--neon);
            text-align: center;
            animation: pulseText 1.5s infinite;
            background: rgba(0,0,0,0.85);
            padding: 40px 80px;
            border-radius: var(--radius-xl);
            border: 2px solid var(--neon);
            backdrop-filter: blur(16px);
            line-height: 1.4;
        }
        @keyframes pulseText {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
    </style>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- FIM DO BLOCO DE ESTILOS (CSS)                               -->

</head>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        /* ═══════════ VARIÁVEIS GLOBAIS ═══════════ */
        const API_BASE = 'https://photoprint-api.maxprimefotovideo.workers.dev';
        const videoFeed = document.getElementById('camera-feed');
        const canvasCapture = document.getElementById('camera-canvas');
        const ctx = canvasCapture.getContext('2d');
        const funText = document.getElementById('fun-text');
        const optionsOverlay = document.getElementById('options-overlay');
        
        let stream = null;
        let lastState = 'start';
        let captureInProgress = false;
        let handDetector = null;
        let handCamera = null;
        let handOpen = false;
        let gestureActive = false;
        let initialLoad = true;
        let sistemaOnline = true;
        let eventoAtual = null, eventoId = null, formatoAtual = '10X15V', molduraBase64 = null;
        
        // Controle de Frames (Anti-falso-positivo)
        let handVisibleFrames = 0;
        let openFrames = 0;
        let closedFrames = 0;
        let personDetected = false;
        let inactivityTimeout = null;

        const FORMATOS = {
            "TIRINHA": { w: 591, h: 1819 },
            "POLAROID": { w: 1041, h: 1311 },
            "10X15V": { w: 1181, h: 1819 },
            "10X15H": { w: 1772, h: 1228 }
        };

        function debug(msg) {
            console.log('[WEBCAM]', msg);
            const el = document.getElementById('debug-info');
            if (el) el.innerText = msg;
        }

        /* ═══════════ SINCRONIZAÇÃO E STATUS ═══════════ */
        async function verificarStatus() {
            try {
                const res = await fetch(`${API_BASE}/get-all-states?t=${Date.now()}`);
                if (!res || !res.ok) { sistemaOnline = false; mostrarOffline(); return; }
                const data = await res.json();
                const status = (data.config && data.config.status) ? data.config.status : 'OFFLINE';
                if (status === 'OFFLINE') { sistemaOnline = false; mostrarOffline(); }
                else { sistemaOnline = true; esconderOffline(); }
                return data;
            } catch (e) { sistemaOnline = false; mostrarOffline(); return null; }
        }

        function mostrarOffline() { document.getElementById('offline-overlay').classList.add('active'); }
        function esconderOffline() { document.getElementById('offline-overlay').classList.remove('active'); }

        async function syncEvento() {
            const data = await verificarStatus();
            if (!data || !sistemaOnline) return;
            if (data.config && data.config.evento && data.config.evento !== 'Geral') {
                const novoEventoId = data.config.eventoId;
                const novoFormato = (data.config.formato || '10X15V').toUpperCase().trim();
                if (eventoAtual !== data.config.evento || eventoId !== novoEventoId || formatoAtual !== novoFormato || !molduraBase64) {
                    eventoAtual = data.config.evento; eventoId = novoEventoId; formatoAtual = novoFormato;
                    if (data.moldura) { molduraBase64 = data.moldura; debug('✅ Moldura: ' + formatoAtual); }
                    else { molduraBase64 = null; }
                    updateEventoUI();
                }
            }
        }

        function updateEventoUI() {
            const el = document.getElementById('active-event-name');
            if (eventoAtual) {
                el.classList.add('visible');
                el.innerHTML = `🎉 ${eventoAtual} | ${formatoAtual}`;
            } else el.classList.remove('visible');
        }

        /* ═══════════ INICIALIZAÇÃO DA CÂMERA ═══════════ */
        async function initCamera() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cameras = devices.filter(d => d.kind === 'videoinput');
                let selectedDevice = null;
                for (const cam of cameras) {
                    const name = cam.label.toLowerCase();
                    if (name.includes('logitech') || name.includes('usb') || name.includes('c920') || name.includes('brio')) {
                        selectedDevice = cam; break;
                    }
                }
                if (!selectedDevice && cameras.length > 0) selectedDevice = cameras[0];
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: selectedDevice ? { exact: selectedDevice.deviceId } : undefined,
                        width: { ideal: 1280 }, height: { ideal: 720 }
                    },
                    audio: false
                });
                videoFeed.srcObject = stream;
                debug('✅ Câmera: ' + (selectedDevice ? selectedDevice.label : 'padrão'));
                startMotionDetection();
            } catch (err) {
                debug('❌ Câmera: ' + err.message);
                document.querySelector('.start-subtitle').innerText = 'Câmera não encontrada';
            }
        }

        /* ═══════════ DETECÇÃO DE MOVIMENTO ═══════════ */
        let motionCanvas = null, motionCtx = null, previousFrame = null;
        function startMotionDetection() {
            motionCanvas = document.createElement('canvas');
            motionCanvas.width = 160; motionCanvas.height = 90;
            motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
            checkMotion();
            debug('👁️ Detector de movimento ativo');
        }

        function checkMotion() {
            if (!stream || !motionCtx) { requestAnimationFrame(checkMotion); return; }
            try {
                if (videoFeed.readyState >= 2) {
                    motionCtx.drawImage(videoFeed, 0, 0, 160, 90);
                    const frame = motionCtx.getImageData(0, 0, 160, 90);
                    if (previousFrame) {
                        let changed = 0;
                        for (let i = 0; i < frame.data.length; i += 16) {
                            const diff = Math.abs(frame.data[i] - previousFrame.data[i]) +
                                         Math.abs(frame.data[i+1] - previousFrame.data[i+1]) +
                                         Math.abs(frame.data[i+2] - previousFrame.data[i+2]);
                            if (diff > 30) changed++;
                        }
                        const movement = (changed / (frame.data.length / 16)) * 100;
                        
                        // Se detectou movimento e ninguém está na tela
                        if (movement > 3 && !personDetected) {
                            personDetected = true;
                            debug('👤 Pessoa detectada!');
                            abrirCameraPorPresenca();
                            clearTimeout(inactivityTimeout);
                        }
                        
                        // Se ficou parado, inicia timer para resetar
                        if (movement < 0.5 && personDetected) {
                            if (!inactivityTimeout) {
                                inactivityTimeout = setTimeout(() => {
                                    if (lastState === 'options' || lastState === 'start') {
                                        personDetected = false;
                                        resetToStart();
                                        debug('😴 Pessoa saiu - voltando ao início');
                                    }
                                    inactivityTimeout = null;
                                }, 45000);
                            }
                        } else if (movement > 1) {
                            clearTimeout(inactivityTimeout);
                            inactivityTimeout = null;
                        }
                    }
                    previousFrame = frame;
                }
            } catch(e) {}
            requestAnimationFrame(checkMotion);
        }

        function abrirCameraPorPresenca() {
            if (lastState !== 'start' || captureInProgress) return;
            lastState = 'capturing';
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-camera').classList.add('active');
            videoFeed.style.display = 'block';
            canvasCapture.style.display = 'none';
            document.getElementById('gesto-msg').classList.add('active');
            document.getElementById('msg-texto').innerText = '🖐️ MOSTRE A MÃO ABERTA';
            initHandDetector();
        }

        /* ═══════════ DETECTOR DE MÃOS (MediaPipe) ═══════════ */
        async function initHandDetector() {
            if (gestureActive) return;
            gestureActive = true;
            debug("✋ Iniciando detector de mãos...");
            
            handDetector = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            handDetector.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.70,
                minTrackingConfidence: 0.65
            });
            handDetector.onResults(onHandResults);
            
            handCamera = new Camera(videoFeed, {
                onFrame: async () => {
                    if (gestureActive) {
                        await handDetector.send({ image: videoFeed });
                    }
                },
                width: 1280, height: 720
            });
            handCamera.start();
        }

        function onHandResults(results) {
            if (!gestureActive) return;

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                handVisibleFrames = 0; openFrames = 0; closedFrames = 0;
                return;
            }

            handVisibleFrames++;
            const hand = results.multiHandLandmarks[0];
            
            // Conta dedos abertos
            const dedosAbertos = 
                (hand[8].y < hand[6].y ? 1 : 0) +
                (hand[12].y < hand[10].y ? 1 : 0) +
                (hand[16].y < hand[14].y ? 1 : 0) +
                (hand[20].y < hand[18].y ? 1 : 0);

            if (handVisibleFrames < 8) {
                debug("👋 Localizando mão...");
                return;
            }

            // Palma aberta
            if (dedosAbertos >= 4) {
                openFrames++;
                closedFrames = 0;
                if (openFrames == 10) {
                    handOpen = true;
                    debug("✋ PALMA ABERTA");
                }
            }

            // Mão fechada
            if (handOpen && dedosAbertos <= 1) {
                closedFrames++;
                if (closedFrames == 6) {
                    debug("✊ MÃO FECHADA");
                    gestureActive = false;
                    handOpen = false;
                    capturePhoto();
                }
            }

            // Caso intermediário
            if (dedosAbertos > 1 && dedosAbertos < 4) {
                openFrames = 0;
                closedFrames = 0;
            }
        }

        /* ═══════════ CAPTURA E PROCESSAMENTO ═══════════ */
                function capturePhoto() {
            captureInProgress = true;
            document.getElementById('gesto-msg').classList.remove('active');
            funText.style.display = 'block';
            funText.innerHTML = "✨ PREPARE-SE! ✨";
            
            setTimeout(() => {
                let cd = 3;
                funText.innerHTML = `😁 SORRIA! 😁<br>⏳ ${cd}`;
                const t = setInterval(() => {
                    cd--;
                    if (cd > 0) {
                        funText.innerHTML = `😁 SORRIA! 😁<br>⏳ ${cd}`;
                    } else {
                        funText.style.display = 'none';
                        clearInterval(t);
                        
                        // Desenha o frame atual no canvas
                        canvasCapture.width = videoFeed.videoWidth || 1280;
                        canvasCapture.height = videoFeed.videoHeight || 720;
                        ctx.save();
                        ctx.scale(-1, 1);
                        ctx.drawImage(videoFeed, -canvasCapture.width, 0, canvasCapture.width, canvasCapture.height);
                        ctx.restore();
                        
                        videoFeed.style.display = 'block';
                        canvasCapture.style.display = 'block';
                        debug('✅ Foto capturada (gesto)');
                        
                        // Avisa o servidor que a foto foi tirada
                        fetch(`${API_BASE}/set-state`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ state: 'options' })
                        }).catch(() => {});
                        
                        captureInProgress = false;
                        optionsOverlay.classList.add('active');
                        
                        // Mostra mensagem para ir ao totem
                        document.getElementById('gesto-msg').classList.add('active');
                        document.getElementById('msg-texto').innerText = '👉 RETIRE SUA FOTO NO TOTEM';
                    }
                }, 1000);
            }, 2500);
        }

        /* ═══════════ COMPOSIÇÃO E UPLOAD ═══════════ */
        function getCopiasFisicas(o) {
            if (o === 1) return 1;
            if (o === 2) return 2;
            if (o === 3) return 2;
            if (o === 4) return 3;
            return 1;
        }

        async function composeAndUpload(opcaoCopias) {
            if (!molduraBase64) return;
            const copiasFisicas = getCopiasFisicas(opcaoCopias);
            
            try {
                const fotoImg = await new Promise(r => {
                    const img = new Image();
                    img.onload = () => r(img);
                    img.src = canvasCapture.toDataURL('image/jpeg', 0.92);
                });
                
                const molduraImg = await new Promise((rs, rj) => {
                    const img = new Image();
                    img.onload = () => rs(img);
                    img.onerror = () => rj(new Error('Falha ao carregar moldura'));
                    img.src = molduraBase64;
                });
                
                const fmt = FORMATOS[formatoAtual] || FORMATOS['POLAROID'];
                const canvas = document.createElement('canvas');
                canvas.width = fmt.w;
                canvas.height = fmt.h;
                const cctx = canvas.getContext('2d');
                
                // Fundo branco
                cctx.fillStyle = '#FFFFFF';
                cctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Desenha a foto mantendo aspect ratio
                const scale = Math.max(canvas.width / fotoImg.width, canvas.height / fotoImg.height);
                cctx.drawImage(
                    fotoImg,
                    (canvas.width - fotoImg.width * scale) / 2,
                    (canvas.height - fotoImg.height * scale) / 2,
                    fotoImg.width * scale,
                    fotoImg.height * scale
                );
                
                // Aplica a moldura por cima
                cctx.drawImage(molduraImg, 0, 0, canvas.width, canvas.height);
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
                await uploadBlob(blob, copiasFisicas, opcaoCopias);
            } catch (e) {
                debug('❌ Erro composição: ' + e.message);
            }
        }

        async function uploadBlob(blob, copiasFisicas, opcao) {
            if (!eventoId) return;
            const ts = Date.now();
            const temGuestbook = (opcao === 3 || opcao === 4);
            const sufixo = temGuestbook ? '_guestbook' : '';
            const nome = `foto_${ts}_${copiasFisicas}c${sufixo}.jpg`;
            const fd = new FormData();
            fd.append('foto', blob, nome);
            fd.append('eventoId', eventoId);
            fd.append('timestamp', String(ts) + '_' + copiasFisicas + 'c' + sufixo);
            fd.append('copias', String(copiasFisicas));
            
            try {
                const res = await fetch(`${API_BASE}/salvar-foto`, { method: 'POST', body: fd });
                if (res.ok) debug('✅ Upload OK');
            } catch(e) {
                debug('❌ Upload falhou');
            }
        }

        /* ═══════════ AGUARDO DE IMPRESSÃO ═══════════ */
        async function waitForPrint() {
            for (let i = 0; i < 120; i++) {
                try {
                    const res = await fetch(`${API_BASE}/check-print?t=${Date.now()}`);
                    if (res && res.ok) {
                        const d = await res.json();
                        if (d.printTriggered) return d.copias || 1;
                    }
                } catch(e) {}
                await new Promise(r => setTimeout(r, 500));
            }
            return null;
        }

        async function finishCycle() {
            if (!sistemaOnline) {
                resetToStart();
                return;
            }
            
            const copias = await waitForPrint();
            if (!copias) {
                resetToStart();
                return;
            }
            
            // Atualiza o texto do overlay
            if (optionsOverlay.querySelector('.options-text')) {
                optionsOverlay.querySelector('.options-text').innerText = 'Compondo foto...';
            }
            
            await composeAndUpload(copias);
            await fetch(`${API_BASE}/clear-print`, { method: 'POST' }).catch(() => {});
            showThanks();
        }

        function showThanks() {
            document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
            document.getElementById('screen-thanks').classList.add('active');
            document.getElementById('thanks-text').innerHTML = "🖨️ AGUARDE A IMPRESSÃO...";
            
            setTimeout(() => {
                document.getElementById('thanks-text').innerHTML = "💖 OBRIGADO! 💖<br>APROVEITE SUA FOTO!";
                setTimeout(resetToStart, 2500);
            }, 2500);
        }

        /* ═══════════ RESET E CONTROLE DE ESTADO ═══════════ */
        function resetToStart() {
            document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
            document.getElementById('screen-start').classList.add('active');
            
            ctx.clearRect(0, 0, canvasCapture.width, canvasCapture.height);
            captureInProgress = false;
            lastState = 'start';
            personDetected = false;
            gestureActive = false;
            
            document.getElementById('gesto-msg').classList.remove('active');
            optionsOverlay.classList.remove('active');
            funText.style.display = 'none';
            
            // Força parada de track do MediaPipe se ativo
            if (handCamera) {
                try { handCamera.stop(); } catch(e) {}
                handCamera = null;
            }
            handDetector = null;
            handVisibleFrames = 0;
            openFrames = 0;
            closedFrames = 0;
            
            fetch(`${API_BASE}/set-state`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: 'start' })
            }).catch(() => {});
            
            debug('🔄 Reset para início');
        }

        function updateScreenState(state) {
            if (!sistemaOnline) return;
            if (state === lastState && state !== 'capturing') return;
            
            if (state === 'start' && lastState === 'options') {
                finishCycle();
                lastState = state;
                return;
            }
            if (state === 'capturing' && lastState === 'options') return;
            
            if (state === 'capturing') {
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-camera').classList.add('active');
                videoFeed.style.display = 'block';
                document.getElementById('gesto-msg').classList.add('active');
                document.getElementById('msg-texto').innerText = '🖐️ MOSTRE A MÃO ABERTA';
            }
            lastState = state;
        }

        async function pollServerState() {
            try {
                const res = await fetch(`${API_BASE}/get-state?t=${Date.now()}`);
                if (!res || !res.ok) return;
                const d = await res.json();
                
                if (initialLoad) {
                    initialLoad = false;
                    if (d.state !== 'start') {
                        await fetch(`${API_BASE}/set-state`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ state: 'start' })
                        }).catch(() => {});
                        return;
                    }
                }
                
                if (d.state && d.state !== lastState) {
                    updateScreenState(d.state);
                }
            } catch(e) {}
        }

        /* ═══════════ FUNDO PERSONALIZÁVEL ═══════════ */
        let clickCount = 0, clickTimer = null;
        document.getElementById('secret-logo').addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
            if (clickCount >= 7) {
                document.getElementById('bg-menu').classList.toggle('active');
                clickCount = 0;
            }
        });

        function updateVisualMode() {
            const bg = localStorage.getItem('photoprint_bg');
            if (bg) document.body.classList.add('bg-active');
            else document.body.classList.remove('bg-active');
        }

        document.getElementById('bg-input').addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                document.getElementById('dynamic-bg').style.backgroundImage = `url('${ev.target.result}')`;
                document.getElementById('dynamic-bg').classList.add('active');
                try {
                    localStorage.setItem('photoprint_bg', ev.target.result);
                } catch(err) {
                    debug('⚠️ Imagem muito grande para salvar permanentemente');
                }
                updateVisualMode();
                document.getElementById('bg-menu').classList.remove('active');
            };
            r.readAsDataURL(f);
        });

        function removeBackground() {
            localStorage.removeItem('photoprint_bg');
            document.getElementById('dynamic-bg').style.backgroundImage = "";
            document.getElementById('dynamic-bg').classList.remove('active');
            updateVisualMode();
            document.getElementById('bg-menu').classList.remove('active');
        }

        (function() {
            const bg = localStorage.getItem('photoprint_bg');
            if (bg) {
                document.getElementById('dynamic-bg').style.backgroundImage = `url('${bg}')`;
                document.getElementById('dynamic-bg').classList.add('active');
            }
            updateVisualMode();
        })();

        /* ═══════════ INICIALIZAÇÃO ═══════════ */
        window.addEventListener('load', () => {
            localStorage.setItem('booth_state', 'start');
            updateScreenState('start');
            initCamera();
            syncEvento();
            
            // Loops de verificação
            setInterval(pollServerState, 800);
            setInterval(syncEvento, 5000);
            
            debug('🚀 WEBCAM v13.0 pronta');
        });

        // Cleanup ao sair
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (handCamera) {
                try { handCamera.stop(); } catch(e) {}
            }
            if (inactivityTimeout) clearTimeout(inactivityTimeout);
        });

        // Re-sync quando a aba volta ao foco
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) syncEvento();
        });
    </script>
