<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOTOEIRA - PHOTO PRINT V3.3</title>
    </head>
<body>
    <div id="maintenance" style="display:none; position:fixed; inset:0; background:#000; color:red; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900; z-index:9999;">SISTEMA EM MANUTENÇÃO</div>
    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        let selectedCopiesValue = 1;

        async function sync() {
            try {
                const res = await fetch(`${API}/get-all-states`);
                const data = await res.json();
                document.getElementById('maintenance').style.display = (data.config.status === "OFFLINE") ? "flex" : "none";
            } catch(e) {}
        }
        setInterval(sync, 2000);

        async function triggerPhoto() {
            await fetch(`${API}/trigger`, { method: 'POST' });
            await fetch(`${API}/set-state`, { method: 'POST', body: JSON.stringify({ state: 'capturing' }) });
            // Lógica de transição de telas mantida...
        }
    </script>
</body>
</html>
