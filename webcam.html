<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOTO PRINT — Webcam Totem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; position: relative; background: radial-gradient(circle at 50% 0%, rgba(0,229,255,0.05) 0%, transparent 40%), var(--bg-0); }
        #dynamic-bg { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.6s; pointer-events: none; }
        #dynamic-bg.active { opacity: 0.45; }
        #dynamic-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)); }
        .bg-brand { position: fixed; inset: 0; z-index: 1; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.05; }
        .bg-brand-title { font-family: var(--font-display); font-size: clamp(80px, 15vw, 180px); font-weight: 900; color: var(--accent); letter-spacing: 16px; text-transform: uppercase; line-height: 1; }
        .top-logo { position: fixed; top: 40px; left: 48px; z-index: 25; cursor: pointer; }
        .logo-title { font-family: var(--font-display); color: var(--accent); font-size: clamp(28px, 4vw, 44px); font-weight: 900; letter-spacing: 6px; text-shadow: var(--accent-glow); user-select: none; line-height: 1; }
        .logo-sub { margin-top: 6px; color: var(--text-2); letter-spacing: 4px; font-size: 11px; text-transform: uppercase; font-weight: 700; }
        #active-event-name { position: fixed; top: 120px; left: 48px; z-index: 26; font-family: var(--font-body); color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 1.5px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--accent); display: none; text-transform: uppercase; backdrop-filter: blur(10px); }
        #active-event-name.visible { display: inline-flex; align-items: center; gap: 8px; }
        #active-event-name::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 6px var(--accent); animation: pulseDot 2s infinite; }
        @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.4} }
        #bg-menu { position: fixed; top: 120px; right: 40px; z-index: 100; display: none; flex-direction: column; gap: 12px; }
        #bg-menu.active { display: flex; }
        .bg-btn { padding: 12px 22px; border-radius: var(--radius-md); border: 1px solid var(--accent); background: rgba(0,0,0,0.85); color: var(--text-0); font-family: var(--font-body); font-size: 13px; font-weight: 800; cursor: pointer; backdrop-filter: blur(12px); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .bg-btn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); box-shadow: var(--accent-glow); }
        #bg-input { display: none; }
        #offline-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
        #offline-overlay.active { display: flex; }
        .offline-text { font-family: var(--font-display); font-size: clamp(28px, 5vw, 42px); font-weight: 900; color: var(--danger); text-shadow: 0 0 20px var(--danger); animation: pulseOff 1.5s infinite; text-transform: uppercase; letter-spacing: 4px; text-align: center; }
        #offline-motivo { font-family: var(--font-mono, monospace); font-size: 12px; color: var(--text-3); letter-spacing: 1px; text-align: center; max-width: 90vw; }
        @keyframes pulseOff { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #gesto-msg { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); z-index: 45; pointer-events: none; display: none; }
        #gesto-msg.active { display: block; }
        .msg-text { font-family: var(--font-display); font-size: clamp(20px, 3vw, 28px); font-weight: 900; color: #fff; text-shadow: 0 0 30px var(--accent); animation: pulseGesto 1.2s ease-in-out infinite; text-transform: uppercase; letter-spacing: 3px; text-align: center; background: rgba(0,0,0,0.8); padding: 16px 36px; border-radius: 30px; border: 2px solid var(--accent); backdrop-filter: blur(10px); white-space: nowrap; }
        @keyframes pulseGesto { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.03); } }
        /* ▶▶▶ INÍCIO: cor da mensagem "FECHE A MÃO" (muda de ciano/branco para verde) ◀◀◀ */
        .msg-text.fechar { color: #39ff14; background: rgba(0,35,0,0.9); border-color: #39ff14; text-shadow: 0 0 24px #39ff14; box-shadow: 0 0 36px rgba(57,255,20,0.55); }
        /* ▶▶▶ FIM: cor da mensagem "FECHE A MÃO" ◀◀◀ */
        .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; flex-direction: column; }
        .screen.active { display: flex; }
        .btn-start { position: relative; width: clamp(280px, 40vw, 380px); height: clamp(280px, 40vw, 380px); border-radius: 50%; border: 4px solid var(--accent); background: radial-gradient(circle at center, rgba(0,229,255,0.15), rgba(0,0,0,0.96)); overflow: hidden; transition: all 0.3s; display: flex; align-items: center; justify-content: center; padding: 40px; box-shadow: 0 0 40px rgba(0,229,255,0.5); z-index: 30; animation: startPulse 2.5s infinite; }
        @keyframes startPulse { 0%, 100% { box-shadow: 0 0 40px rgba(0,229,255,0.5); } 50% { box-shadow: 0 0 60px rgba(0,229,255,0.8); } }
        .btn-start::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: rgba(0,0,0,0.9); box-shadow: inset 0 0 60px rgba(0,229,255,0.15); }
        .start-content { position: relative; z-index: 5; text-align: center; width: 100%; }
        .start-icon { font-size: clamp(48px, 6vw, 64px); margin-bottom: 20px; color: var(--accent); }
        .start-title { font-family: var(--font-display); color: var(--accent); font-size: clamp(20px, 2.5vw, 26px); font-weight: 900; letter-spacing: 4px; text-shadow: var(--accent-glow); margin-bottom: 16px; text-transform: uppercase; }
        .start-subtitle { font-family: var(--font-body); font-size: clamp(14px, 1.8vw, 18px); color: var(--text-1); line-height: 1.5; font-weight: 600; }
        #camera-wrapper { position: absolute; inset: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
        #camera-canvas { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
        #foto-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; z-index: 5; }
        #flash { position: absolute; inset: 0; background: #fff; display: none; z-index: 55; pointer-events: none; }
        /* ▶▶▶ INÍCIO: marcação de enquadramento (área que será fotografada) ◀◀◀ */
        #guia { position: absolute; display: none; z-index: 4; pointer-events: none; border: 3px solid var(--accent); border-radius: 10px; box-shadow: 0 0 22px var(--accent), 0 0 0 100vmax rgba(0,0,0,0.6); }
        #guia::after { content: 'ENQUADRE-SE AQUI'; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--accent); background: rgba(0,0,0,0.65); padding: 4px 12px; border-radius: 12px; white-space: nowrap; }
        /* ▶▶▶ FIM: marcação de enquadramento ◀◀◀ */
        .fun-text { position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: clamp(24px, 4vw, 36px); font-weight: 900; text-align: center; color: #fff; text-transform: uppercase; text-shadow: 0 0 15px var(--accent); animation: funPulse 0.6s infinite alternate; z-index: 50; background: rgba(0,0,0,0.7); padding: 14px 32px; border-radius: 40px; border: 2px solid var(--accent); display: none; letter-spacing: 2px; }
        @keyframes funPulse { 0% { transform: translateX(-50%) scale(0.95); } 100% { transform: translateX(-50%) scale(1.05); } }
        #options-overlay { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(10,10,10,0.95); padding: 24px 50px; border-radius: 60px; box-shadow: 0 20px 60px rgba(0,0,0,0.6), var(--accent-glow); z-index: 60; text-align: center; display: none; border: 2px solid var(--accent); backdrop-filter: blur(16px); white-space: nowrap; }
        #options-overlay.active { display: block; }
        .options-text { font-family: var(--font-body); font-size: clamp(16px, 2vw, 22px); color: var(--accent); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .status-text { font-family: var(--font-display); font-size: clamp(28px, 4vw, 44px); color: var(--accent); font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 25px var(--accent); text-align: center; animation: pulseText 1.5s infinite; background: rgba(0,0,0,0.85); padding: 40px 80px; border-radius: var(--radius-xl); border: 2px solid var(--accent); backdrop-filter: blur(16px); }
        @keyframes pulseText { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    </style>
</head>
<body>
    <div id="dynamic-bg"></div>
    <div class="bg-brand"><div class="bg-brand-title">PHOTO PRINT</div><div class="bg-brand-sub">Colecionando Momentos</div></div>
    <div class="top-logo" id="secret-logo"><div class="logo-title">PHOTO PRINT</div><div class="logo-sub">Colecionando Momentos</div></div>
    <div id="active-event-name"></div>
    <div id="bg-menu"><label class="bg-btn" for="bg-input"><i class="fas fa-image"></i> Alterar Fundo</label><div class="bg-btn" onclick="removeBackground()"><i class="fas fa-times"></i> Sem Fundo</div></div>
    <input type="file" id="bg-input" accept="image/*">
    <div id="offline-overlay"><div class="offline-text">SISTEMA EM<br>MANUTENÇÃO</div><div id="offline-motivo"></div></div>
    <div id="gesto-msg"><div class="msg-text" id="msg-texto">🖐️ MOSTRE A MÃO ABERTA</div></div>

    <div id="screen-start" class="screen active">
        <div class="btn-start"><div class="start-content"><div class="start-icon"><i class="fas fa-camera"></i></div><div class="start-title">PHOTO PRINT</div><div class="start-subtitle">Aproxime-se para ativar</div></div></div>
    </div>

    <div id="screen-camera" class="screen" style="z-index:40;">
        <div id="camera-wrapper">
            <video id="camera-feed" autoplay playsinline muted></video>
            <canvas id="camera-canvas"></canvas>
            <div id="guia"></div>
            <img id="foto-preview" alt="">
            <div id="flash"></div>
            <div id="fun-text" class="fun-text"></div>
            <div id="options-overlay"><div class="options-text" id="options-text">ENVIANDO SUA FOTO...</div></div>
        </div>
    </div>

    <div id="screen-thanks" class="screen"><div class="status-text" id="thanks-text">🖨️ AGUARDE A IMPRESSÃO...</div></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const API_BASE = 'https://photoprint-api.maxprimefotovideo.workers.dev';
        const videoFeed = document.getElementById('camera-feed'), canvasCapture = document.getElementById('camera-canvas');
        const ctx = canvasCapture.getContext('2d'), funText = document.getElementById('fun-text'), optionsOverlay = document.getElementById('options-overlay');
        const fotoPreview = document.getElementById('foto-preview'), optionsTextEl = document.getElementById('options-text');
        const MSG_MOSTRAR = '🖐️ MOSTRE A MÃO ABERTA';
        const MSG_FECHAR = '✊ AGORA FECHE A MÃO';
        const COPIAS_PADRAO = 1;          // cópias impressas por foto tirada na webcam
        const SEGUNDOS_RESULTADO = 5;     // tempo da foto na tela antes de voltar ao início
        const INTERVALO_BOTOEIRA_MS = 1500; // de quanto em quanto tempo a webcam pergunta se a botoeira foi apertada
        const CAMERA_LARGURA = 1280, CAMERA_ALTURA = 720;   // resolução pedida à webcam (ex.: 1920 x 1080 para mais nitidez)

        let stream = null, lastState = 'start', captureInProgress = false, handDetector = null;
        let handOpen = false, gestureActive = false, sistemaOnline = true;
        let eventoAtual = null, eventoId = null, formatoAtual = 'POLAROID', molduraBase64 = null;
        let handVisibleFrames = 0, openFrames = 0, closedFrames = 0, noHandFrames = 0;
        let personDetected = false, inactivityTimeout = null, gestoTimeout = null;
        let cooldownAte = 0, rodadaId = 0;
        let fotos = [], capFormato = 'POLAROID', capEventoId = null, capMoldura = null;
        const FORMATOS = { "TIRINHA": { w: 591, h: 1819 }, "POLAROID": { w: 1041, h: 1311 }, "10X15V": { w: 1181, h: 1819 }, "10X15H": { w: 1772, h: 1228 } };

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        function debug(msg) { console.log(msg); }
        function setMsg(t) {
            const el = document.getElementById('msg-texto');
            el.innerText = t;
            el.classList.toggle('fechar', t === MSG_FECHAR);   // só a mensagem "feche a mão" usa a cor verde
        }

        // ===== Câmera robusta, com retry e watchdog =====
        let iniciandoCamera = false;
        async function initCamera() {
            if (iniciandoCamera) return;
            iniciandoCamera = true;
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                const tmp = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: CAMERA_LARGURA }, height: { ideal: CAMERA_ALTURA } }, audio: false });
                stream = tmp;
                const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
                const pref = cams.find(c => /logitech|usb|c920/i.test(c.label));
                if (pref && tmp.getVideoTracks()[0].getSettings().deviceId !== pref.deviceId) {
                    try {
                        const s2 = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: pref.deviceId }, width: { ideal: CAMERA_LARGURA }, height: { ideal: CAMERA_ALTURA } }, audio: false });
                        tmp.getTracks().forEach(t => t.stop());
                        stream = s2;
                    } catch (e) {}
                }
                videoFeed.srcObject = stream;
                try { await videoFeed.play(); } catch (e) {}
                document.querySelector('.start-subtitle').innerText = 'Aproxime-se para ativar';
                if (!motionCtx) startMotionDetection();
            } catch (err) {
                document.querySelector('.start-subtitle').innerText = 'Câmera indisponível — tentando de novo...';
                setTimeout(initCamera, 4000);
            } finally {
                iniciandoCamera = false;
            }
        }

        setInterval(() => {
            const t = stream && stream.getVideoTracks()[0];
            if (!stream || !t || t.readyState !== 'live') initCamera();
            else if (videoFeed.paused) videoFeed.play().catch(() => {});
        }, 5000);

        // ===== Sincronização com o painel =====
        // Offline SOMENTE quando o painel diz OFFLINE (2 leituras seguidas)
        // ou quando o servidor fica realmente sem resposta (4 falhas seguidas).
        let falhasRede = 0, leiturasOffline = 0, consultando = false, primeiraConsulta = true;

        function mostrarOffline(on, motivo) {
            document.getElementById('offline-overlay').classList.toggle('active', on);
            document.getElementById('offline-motivo').innerText = on ? (motivo || '') : '';
        }

        async function verificarStatus() {
            if (consultando) return null;      // evita requisições sobrepostas
            consultando = true;
            let data = null;
            try {
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), 20000);   // a moldura é pesada, precisa de folga
                const res = await fetch(`${API_BASE}/get-all-states?semMoldura=1&t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal });
                clearTimeout(to);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                data = await res.json();
                falhasRede = 0;
                // ▶▶▶ INÍCIO: manutenção quando NÃO há evento ativo no painel ◀◀◀
                const cfg = data && data.config;
                if (cfg) {
                    const comEvento = cfg.status === 'ONLINE' && !!cfg.eventoId && !!cfg.evento && cfg.evento !== 'Geral';
                    if (comEvento) {
                        leiturasOffline = 0; sistemaOnline = true; mostrarOffline(false);
                    } else {
                        leiturasOffline++;
                        // 1ª consulta ao abrir a página mostra na hora; depois confirma com 2 leituras seguidas
                        if (leiturasOffline >= 2 || primeiraConsulta) { sistemaOnline = false; mostrarOffline(true, 'nenhum evento ativo no painel'); }
                    }
                    primeiraConsulta = false;
                } else {
                    debug('resposta sem config: ' + JSON.stringify(data));
                }
                // ▶▶▶ FIM: manutenção quando NÃO há evento ativo no painel ◀◀◀
            } catch (e) {
                falhasRede++;
                debug('falha de rede (' + falhasRede + '): ' + e.message);
                // servidor instável: mantém o último estado do painel (falha de rede NÃO gera manutenção)
                data = null;
            } finally {
                consultando = false;
            }
            if (!sistemaOnline && lastState !== 'start' && !captureInProgress) resetToStart();
            return sistemaOnline ? data : null;
        }

        async function syncEvento() {
            const data = await verificarStatus();
            if (!data) return;
            if (data.config && data.config.evento && data.config.evento !== 'Geral') {
                const novoEventoId = data.config.eventoId, novoFormato = (data.config.formato || 'POLAROID').toUpperCase().trim();
                const novaMoldura = data.molduraUrl || data.moldura || null;
                if (eventoAtual !== data.config.evento || eventoId !== novoEventoId || formatoAtual !== novoFormato || molduraBase64 !== novaMoldura) {
                    eventoAtual = data.config.evento; eventoId = novoEventoId; formatoAtual = novoFormato;
                    molduraBase64 = novaMoldura;
                    updateEventoUI();
                    analisarMoldura();   // descobre a "janela" da moldura para a marcação de enquadramento
                    atualizarGuia();
                }
            } else {
                eventoAtual = null; eventoId = null; molduraBase64 = null;
                updateEventoUI();
            }
        }

        function updateEventoUI() {
            const el = document.getElementById('active-event-name');
            if (eventoAtual) { el.classList.add('visible'); el.innerHTML = `🎉 ${eventoAtual} | ${formatoAtual}`; } else el.classList.remove('visible');
        }

        // ▶▶▶ INÍCIO DO BLOCO NOVO — Marcação de enquadramento ◀◀◀
        // Mostra na tela exatamente a área que vira foto, de acordo com o formato do evento.
        //  - TIRINHA: cada uma das 3 fotos ocupa um encaixe de proporção fixa (a marcação mostra esse encaixe)
        //  - Demais formatos: a foto é cortada na proporção da folha; se a moldura tiver uma "janela"
        //    transparente, a marcação mostra a janela (a parte realmente visível na foto final)
        let janelaMoldura = null, molduraAnalisada = null, guiaVisivel = false;

        async function analisarMoldura() {
            const src = molduraBase64;
            if (!src) { janelaMoldura = null; molduraAnalisada = null; atualizarGuia(); return; }
            if (molduraAnalisada === src) return;
            molduraAnalisada = src;
            janelaMoldura = null;
            try {
                const img = await carregarImg(src);
                const mw = 240, mh = Math.max(1, Math.round(240 * img.height / img.width));
                const cv = document.createElement('canvas'); cv.width = mw; cv.height = mh;
                const c = cv.getContext('2d', { willReadFrequently: true });
                c.drawImage(img, 0, 0, mw, mh);
                const px = c.getImageData(0, 0, mw, mh).data;
                // acha a maior região transparente conectada = janela da foto
                const total = mw * mh, rotulo = new Uint8Array(total), pilha = new Int32Array(total);
                const transp = (p) => px[p * 4 + 3] < 40;
                let melhor = null;
                for (let i = 0; i < total; i++) {
                    if (rotulo[i] || !transp(i)) continue;
                    let topo = 0, area = 0, x0 = mw, y0 = mh, x1 = 0, y1 = 0;
                    pilha[topo++] = i; rotulo[i] = 1;
                    while (topo) {
                        const p = pilha[--topo], x = p % mw, y = (p / mw) | 0;
                        area++;
                        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
                        if (x > 0 && !rotulo[p - 1] && transp(p - 1)) { rotulo[p - 1] = 1; pilha[topo++] = p - 1; }
                        if (x < mw - 1 && !rotulo[p + 1] && transp(p + 1)) { rotulo[p + 1] = 1; pilha[topo++] = p + 1; }
                        if (y > 0 && !rotulo[p - mw] && transp(p - mw)) { rotulo[p - mw] = 1; pilha[topo++] = p - mw; }
                        if (y < mh - 1 && !rotulo[p + mw] && transp(p + mw)) { rotulo[p + mw] = 1; pilha[topo++] = p + mw; }
                    }
                    if (!melhor || area > melhor.area) melhor = { area, x0, y0, x1, y1 };
                }
                if (melhor && melhor.area > total * 0.12) {
                    const j = { x0: melhor.x0 / mw, y0: melhor.y0 / mh, x1: (melhor.x1 + 1) / mw, y1: (melhor.y1 + 1) / mh };
                    // janela quase do tamanho da folha inteira = moldura sem janela definida
                    if (!((j.x1 - j.x0) > 0.97 && (j.y1 - j.y0) > 0.97)) janelaMoldura = j;
                }
            } catch (e) { janelaMoldura = null; debug('análise da moldura falhou: ' + e.message); }
            atualizarGuia();
        }

        function mostrarGuia() { guiaVisivel = true; atualizarGuia(); }
        function esconderGuia() { guiaVisivel = false; document.getElementById('guia').style.display = 'none'; }

        function atualizarGuia() {
            if (!guiaVisivel) return;
            const wrap = document.getElementById('camera-wrapper'), g = document.getElementById('guia');
            const W = wrap.clientWidth, H = wrap.clientHeight;
            if (!W || !H) return;
            const vw = videoFeed.videoWidth || CAMERA_LARGURA, vh = videoFeed.videoHeight || CAMERA_ALTURA;
            const fmt = FORMATOS[formatoAtual] || FORMATOS['POLAROID'];
            let A, jan = null;
            if (formatoAtual === 'TIRINHA') { A = (fmt.w * 0.88) / (fmt.h * 0.254); }   // proporção do encaixe de cada foto
            else { A = fmt.w / fmt.h; jan = janelaMoldura; }
            // área do vídeo que vira foto (corte centralizado, igual ao da montagem final)
            let cropW, cropH;
            if (A <= vw / vh) { cropH = vh; cropW = vh * A; } else { cropW = vw; cropH = vw / A; }
            const s = Math.max(W / vw, H / vh);          // escala do vídeo na tela (object-fit: cover)
            const rw = cropW * s, rh = cropH * s, rx = (W - rw) / 2, ry = (H - rh) / 2;
            const j = jan || { x0: 0, y0: 0, x1: 1, y1: 1 };
            g.style.left = (rx + j.x0 * rw) + 'px';
            g.style.top = (ry + j.y0 * rh) + 'px';
            g.style.width = ((j.x1 - j.x0) * rw) + 'px';
            g.style.height = ((j.y1 - j.y0) * rh) + 'px';
            g.style.display = 'block';
        }

        window.addEventListener('resize', atualizarGuia);
        videoFeed.addEventListener('loadedmetadata', atualizarGuia);
        // ▶▶▶ FIM DO BLOCO NOVO — Marcação de enquadramento ◀◀◀

        // ===== Detecção de presença =====
        let motionCanvas = null, motionCtx = null, previousFrame = null;
        function startMotionDetection() {
            motionCanvas = document.createElement('canvas'); motionCanvas.width = 160; motionCanvas.height = 90;
            motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true }); checkMotion();
        }

        function checkMotion() {
            if (!stream || !motionCtx) { requestAnimationFrame(checkMotion); return; }
            try {
                if (videoFeed.readyState >= 2) {
                    motionCtx.drawImage(videoFeed, 0, 0, 160, 90);
                    const frame = motionCtx.getImageData(0, 0, 160, 90);
                    if (previousFrame) {
                        let changed = 0;
                        for (let i = 0; i < frame.data.length; i += 16) {
                            const diff = Math.abs(frame.data[i] - previousFrame.data[i]) + Math.abs(frame.data[i+1] - previousFrame.data[i+1]) + Math.abs(frame.data[i+2] - previousFrame.data[i+2]);
                            if (diff > 30) changed++;
                        }
                        const movement = (changed / (frame.data.length / 16)) * 100;
                        if (movement > 3 && !personDetected && Date.now() > cooldownAte) { personDetected = true; abrirCameraPorPresenca(); clearTimeout(inactivityTimeout); }
                        if (movement < 0.5 && personDetected) {
                            if (!inactivityTimeout) {
                                inactivityTimeout = setTimeout(() => {
                                    if (lastState === 'start') { personDetected = false; }
                                    inactivityTimeout = null;
                                }, 45000);
                            }
                        } else if (movement > 1) { clearTimeout(inactivityTimeout); inactivityTimeout = null; }
                    }
                    previousFrame = frame;
                }
            } catch(e) {}
            requestAnimationFrame(checkMotion);
        }

        function abrirCameraPorPresenca() {
            if (!sistemaOnline || lastState !== 'start' || captureInProgress) { personDetected = false; return; }
            lastState = 'capturing';
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-camera').classList.add('active');
            videoFeed.style.display = 'block'; canvasCapture.style.display = 'none'; fotoPreview.style.display = 'none';
            optionsOverlay.classList.remove('active');
            document.getElementById('gesto-msg').classList.add('active');
            setMsg(MSG_MOSTRAR);
            mostrarGuia();
            // se ninguém fizer o gesto em 30s, volta para o início
            clearTimeout(gestoTimeout);
            gestoTimeout = setTimeout(() => { if (lastState === 'capturing' && !captureInProgress) resetToStart(); }, 30000);
            initHandDetector();
        }

        // ▶▶▶ INÍCIO DO BLOCO NOVO — Botoeira aciona a webcam ◀◀◀
        // A botoeira grava state='capturing' no Worker (/set-state). A webcam lê esse valor
        // (/get-state), consome (volta para 'start') e dispara a foto na hora, sem esperar o gesto.
        let consultandoBotoeira = false;

        function limparEstadoBotoeira() {
            return fetch(`${API_BASE}/set-state`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: 'start' }) }).catch(() => {});
        }

        async function checarBotoeira(apenasLimpar) {
            if (consultandoBotoeira) return;
            consultandoBotoeira = true;
            try {
                const res = await fetch(`${API_BASE}/get-state?t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                if (!data || data.state !== 'capturing') return;

                // ao abrir a página, apaga um 'capturing' antigo para não disparar sozinho
                if (apenasLimpar) { await limparEstadoBotoeira(); return; }

                // só aceita com a câmera ligada e livre (não durante a contagem nem com a foto na tela)
                const livre = sistemaOnline && stream && !captureInProgress && (lastState === 'start' || lastState === 'capturing');
                if (livre) {
                    await limparEstadoBotoeira();   // consome o comando (evita disparar duas vezes)
                    acionarPorBotoeira();
                }
                // se estiver ocupada, ignora: o resetToStart() já volta o estado para 'start'
            } catch (e) {
            } finally {
                consultandoBotoeira = false;
            }
        }

        function acionarPorBotoeira() {
            gestureActive = false; handOpen = false;       // para a detecção de mão, se estava ativa
            clearTimeout(gestoTimeout);
            lastState = 'capturing'; personDetected = true;
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-camera').classList.add('active');
            videoFeed.style.display = 'block'; canvasCapture.style.display = 'none'; fotoPreview.style.display = 'none';
            optionsOverlay.classList.remove('active');
            document.getElementById('gesto-msg').classList.remove('active');
            mostrarGuia();
            iniciarSequencia();
        }
        // ▶▶▶ FIM DO BLOCO NOVO — Botoeira aciona a webcam ◀◀◀

        // ===== Detector de mão (sem desligar a webcam) =====
        async function initHandDetector() {
            if (gestureActive) return;
            gestureActive = true;
            handVisibleFrames = 0; openFrames = 0; closedFrames = 0; noHandFrames = 0; handOpen = false;
            if (typeof Hands === 'undefined') {
                // biblioteca de mãos não carregou: dispara sozinho para não travar
                setMsg('📸 PREPARE-SE!');
                setTimeout(() => { if (gestureActive) { gestureActive = false; iniciarSequencia(); } }, 2500);
                return;
            }
            if (!handDetector) {
                handDetector = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
                handDetector.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.70, minTrackingConfidence: 0.65 });
                handDetector.onResults(onHandResults);
            }
            const loop = async () => {
                if (!gestureActive) return;
                try { if (videoFeed.readyState >= 2) await handDetector.send({ image: videoFeed }); } catch (e) {}
                requestAnimationFrame(loop);
            };
            loop();
        }

        function onHandResults(results) {
            if (!gestureActive) return;
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                handVisibleFrames = 0; openFrames = 0; closedFrames = 0; noHandFrames++;
                // mão sumiu depois de aberta: volta a pedir para mostrar a mão
                if (handOpen && noHandFrames > 45) { handOpen = false; setMsg(MSG_MOSTRAR); }
                return;
            }
            noHandFrames = 0;
            handVisibleFrames++;
            const hand = results.multiHandLandmarks[0];
            const dedosAbertos = (hand[8].y < hand[6].y ? 1 : 0) + (hand[12].y < hand[10].y ? 1 : 0) + (hand[16].y < hand[14].y ? 1 : 0) + (hand[20].y < hand[18].y ? 1 : 0);
            if (handVisibleFrames < 8) return;

            if (!handOpen) {
                // PASSO 1: mão aberta reconhecida -> muda a mensagem para "feche a mão"
                if (dedosAbertos >= 4) {
                    openFrames++;
                    if (openFrames >= 10) { handOpen = true; closedFrames = 0; setMsg(MSG_FECHAR); }
                } else { openFrames = 0; }
            } else {
                // PASSO 2: mão fechada -> aciona o contador
                if (dedosAbertos <= 1) {
                    closedFrames++;
                    if (closedFrames >= 6) { gestureActive = false; handOpen = false; iniciarSequencia(); }
                } else { closedFrames = 0; }
            }
        }

        // ===== Captura =====
        function capturarFrame() {
            const w = videoFeed.videoWidth || 1280, h = videoFeed.videoHeight || 720;
            canvasCapture.width = w; canvasCapture.height = h;
            ctx.drawImage(videoFeed, 0, 0, w, h);          // quadro cru (o espelho é aplicado na montagem)
            return canvasCapture.toDataURL('image/jpeg', 0.92);
        }

        function piscar() {
            const f = document.getElementById('flash');
            f.style.display = 'block'; setTimeout(() => { f.style.display = 'none'; }, 120);
        }

        async function iniciarSequencia() {
            if (captureInProgress) return;
            captureInProgress = true;
            clearTimeout(gestoTimeout);
            document.getElementById('gesto-msg').classList.remove('active');
            capFormato = formatoAtual; capEventoId = eventoId; capMoldura = molduraBase64;
            const total = capFormato === 'TIRINHA' ? 3 : 1;
            fotos = [];
            funText.style.display = 'block';
            for (let n = 1; n <= total; n++) {
                funText.innerHTML = total > 1 ? `✨ FOTO ${n} DE ${total} ✨` : '✨ PREPARE-SE! ✨';
                await sleep(n === 1 ? 1500 : 1000);
                for (let cd = 3; cd > 0; cd--) {
                    funText.innerHTML = total > 1 ? `📸 FOTO ${n} DE ${total}<br>⏳ ${cd}` : `😁 SORRIA! 😁<br>⏳ ${cd}`;
                    await sleep(1000);
                }
                funText.style.display = 'none';
                fotos.push(capturarFrame());
                piscar();
                videoFeed.style.display = 'block'; canvasCapture.style.display = 'block';   // congela o quadro
                if (n < total) {
                    await sleep(800);
                    canvasCapture.style.display = 'none';
                    funText.style.display = 'block';
                }
            }
            captureInProgress = false;
            finalizarFoto();
        }

        function carregarImg(src) {
            return new Promise((resolve, reject) => { const img = new Image(); img.crossOrigin = 'anonymous'; img.onload = () => resolve(img); img.onerror = reject; img.src = src; });
        }

        function desenharCover(c, img, dx, dy, dw, dh, espelhar) {
            c.save();
            c.beginPath(); c.rect(dx, dy, dw, dh); c.clip();
            if (espelhar) { c.translate(dx + dw / 2, 0); c.scale(-1, 1); c.translate(-(dx + dw / 2), 0); }
            const r = Math.max(dw / img.width, dh / img.height);
            c.drawImage(img, dx + (dw - img.width * r) / 2, dy + (dh - img.height * r) / 2, img.width * r, img.height * r);
            c.restore();
        }

        async function comporFoto() {
            const fmt = FORMATOS[capFormato] || FORMATOS['POLAROID'];
            const cv = document.createElement('canvas'); cv.width = fmt.w; cv.height = fmt.h;
            const c = cv.getContext('2d'); c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, cv.width, cv.height);
            const imgs = await Promise.all(fotos.map(carregarImg));
            if (capFormato === 'TIRINHA') {
                const slots = [{ y: 0.030, h: 0.254 }, { y: 0.296, h: 0.254 }, { y: 0.559, h: 0.254 }];
                imgs.forEach((img, i) => {
                    const s = slots[i];
                    desenharCover(c, img, cv.width * 0.06, cv.height * s.y, cv.width * 0.88, cv.height * s.h, true);
                });
            } else {
                desenharCover(c, imgs[0], 0, 0, cv.width, cv.height, true);
            }
            if (capMoldura) {
                try { const m = await carregarImg(capMoldura); c.drawImage(m, 0, 0, cv.width, cv.height); }
                catch (e) { debug('moldura não carregou: ' + e.message); }
            }
            // mostra a foto final montada na tela
            fotoPreview.src = cv.toDataURL('image/jpeg', 0.85);
            fotoPreview.style.display = 'block';
            canvasCapture.style.display = 'none';
            esconderGuia();
            return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.95));
        }

        async function enviarFoto(blob) {
            if (!capEventoId) { debug('sem eventoId, foto não enviada'); return false; }
            const copias = COPIAS_PADRAO, ts = Date.now();
            for (let tentativa = 1; tentativa <= 3; tentativa++) {
                try {
                    const fd = new FormData();
                    fd.append('foto', blob, `foto_${ts}_${copias}c.jpg`);
                    fd.append('eventoId', capEventoId);
                    fd.append('timestamp', String(ts) + '_' + copias + 'c');
                    fd.append('copias', String(copias));
                    const res = await fetch(`${API_BASE}/salvar-foto`, { method: 'POST', body: fd });
                    if (res.ok) return true;
                    debug('salvar-foto HTTP ' + res.status);
                } catch (e) { debug('salvar-foto erro: ' + e.message); }
                await sleep(1000);
            }
            return false;
        }

        async function finalizarFoto() {
            lastState = 'options';
            const minha = ++rodadaId;
            let restante = SEGUNDOS_RESULTADO, status = 'enviando';
            const atualizar = () => {
                if (minha !== rodadaId) return;
                const base = status === 'ok' ? '✅ FOTO ENVIADA!' : status === 'erro' ? '⚠️ FALHA NO ENVIO' : '⏳ ENVIANDO SUA FOTO...';
                optionsTextEl.innerText = `${base}  •  VOLTANDO EM ${restante}s`;
            };
            optionsOverlay.classList.add('active');
            atualizar();
            const timer = setInterval(() => {
                if (minha !== rodadaId) { clearInterval(timer); return; }
                restante--;
                if (restante <= 0) { clearInterval(timer); resetToStart(); }
                else atualizar();
            }, 1000);
            fetch(`${API_BASE}/set-state`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: 'options' }) }).catch(() => {});
            try {
                const blob = await comporFoto();
                const ok = await enviarFoto(blob);
                status = ok ? 'ok' : 'erro';
            } catch (e) {
                debug('❌ ' + e.message);
                status = 'erro';
            }
            atualizar();
        }

        // ===== Volta para a tela inicial =====
        function resetToStart() {
            esconderGuia();
            rodadaId++;
            clearTimeout(gestoTimeout);
            document.querySelectorAll('.screen').forEach(e => e.classList.remove('active'));
            document.getElementById('screen-start').classList.add('active');
            ctx.clearRect(0, 0, canvasCapture.width, canvasCapture.height);
            canvasCapture.style.display = 'none'; fotoPreview.style.display = 'none'; fotoPreview.removeAttribute('src');
            videoFeed.style.display = 'block';
            captureInProgress = false; lastState = 'start'; personDetected = false; gestureActive = false;
            document.getElementById('gesto-msg').classList.remove('active');
            optionsOverlay.classList.remove('active'); funText.style.display = 'none';
            handVisibleFrames = 0; openFrames = 0; closedFrames = 0; noHandFrames = 0; handOpen = false;
            previousFrame = null;
            cooldownAte = Date.now() + 4000;     // evita reabrir na hora com a pessoa ainda na frente
            fotos = [];
            fetch(`${API_BASE}/set-state`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: 'start' }) }).catch(() => {});
        }

        // ===== Menu secreto de fundo (7 cliques no logo) =====
        let clickCount = 0, clickTimer = null;
        document.getElementById('secret-logo').addEventListener('click', () => {
            clickCount++; clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
            if (clickCount >= 7) { document.getElementById('bg-menu').classList.toggle('active'); clickCount = 0; }
        });
        document.getElementById('bg-input').addEventListener('change', (e) => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                document.getElementById('dynamic-bg').style.backgroundImage = `url('${ev.target.result}')`; document.getElementById('dynamic-bg').classList.add('active');
                try { localStorage.setItem('photoprint_bg', ev.target.result); } catch(err) {}
                document.getElementById('bg-menu').classList.remove('active');
            };
            r.readAsDataURL(f);
        });

        function removeBackground() {
            localStorage.removeItem('photoprint_bg');
            document.getElementById('dynamic-bg').style.backgroundImage = "";
            document.getElementById('dynamic-bg').classList.remove('active');
            document.getElementById('bg-menu').classList.remove('active');
        }

        (function () {
            const bg = localStorage.getItem('photoprint_bg');
            if (bg) {
                document.getElementById('dynamic-bg').style.backgroundImage = `url('${bg}')`;
                document.getElementById('dynamic-bg').classList.add('active');
            }
        })();

        window.addEventListener('load', () => {
            initCamera();
            syncEvento();
            setInterval(syncEvento, 5000);
            checarBotoeira(true);                                        // limpa 'capturing' antigo, sem disparar
            setInterval(() => checarBotoeira(false), INTERVALO_BOTOEIRA_MS);
        });
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (inactivityTimeout) clearTimeout(inactivityTimeout);
            if (gestoTimeout) clearTimeout(gestoTimeout);
        });
    </script>
</body>
