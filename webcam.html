<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>WEBCAM - PHOTO PRINT v3.7</title>
    <style>
        :root { --neon: #39ff14; --dark: #0a0a0a; --danger: #ff3131; }
        body { margin: 0; background: var(--dark); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #cam-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none; }
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: none; align-items: center; justify-content: center; }
        #final-preview-container { z-index: 150; background: #000; display: none; }
        #img-review { max-width: 80%; border: 5px solid var(--neon); }
    </style>
</head>
<body>
    <div id="loader"><h2>PROCESSANDO...</h2></div>
    <video id="cam-preview" autoplay playsinline></video>
    
    <div id="screen-start" class="screen">
        <div onclick="initSession()" style="padding:50px; border: 5px solid var(--neon); cursor:pointer">VAMOS COMEÇAR?</div>
    </div>

    <div id="final-preview-container" class="screen">
        <img id="img-review" src="">
        <div id="botoeira-controls" style="margin-top: 20px; color: var(--neon); font-size: 24px;">
            AGUARDANDO ESCOLHA NA BOTOEIRA...
        </div>
    </div>

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const video = document.getElementById('cam-preview');
        let finalBlob = null;

        async function initSession() {
            document.getElementById('screen-start').style.display = "none";
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.style.display = "block";
            // Inicia sequência após carregar
            setTimeout(processFinalImage, 2000); 
        }

        async function processFinalImage() {
            // Lógica de captura simplificada
            const canvas = document.createElement('canvas');
            canvas.width = 1920; canvas.height = 1080;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(b => { finalBlob = b; }, 'image/jpeg');
            
            document.getElementById('final-preview-container').style.display = "flex";
            document.getElementById('img-review').src = canvas.toDataURL();
            
            // Inicia o escutador de impressão
            startPrintPolling();
        }

        async function startPrintPolling() {
            const interval = setInterval(async () => {
                const res = await fetch(`${API}/check-print`);
                const data = await res.json();
                if (data.printTriggered) {
                    clearInterval(interval);
                    await fetch(`${API}/clear-print`, { method: 'POST' });
                    finalizar(data.copias);
                }
            }, 1000);
        }

        async function finalizar(qtd) {
            const fd = new FormData();
            fd.append('file', finalBlob);
            fd.append('copias', qtd);
            await fetch(`${API}/upload`, { method: 'POST', body: fd });
            location.reload();
        }

        async function checkRemoteTrigger() {
            if (document.getElementById('screen-start').style.display !== "none") {
                const res = await fetch(`${API}/check-trigger`);
                const data = await res.json();
                if (data.triggered) {
                    await fetch(`${API}/clear-trigger`, { method: 'POST' });
                    initSession();
                }
            }
        }
        setInterval(checkRemoteTrigger, 1000);
    </script>
</body>
</html>
