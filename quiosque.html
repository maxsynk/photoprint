<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>PHOTO CLOUD — Quiosque Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest-quiosque.json">
<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiosque">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-quiosque-192.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        html, body { user-select: none; -webkit-user-select: none; display: flex; flex-direction: column; background: radial-gradient(circle at 50% -20%, rgba(0,229,255,0.05) 0%, transparent 50%), var(--bg-0); }
        header { background: rgba(10,10,10,0.8); padding: 30px 40px 20px; border-bottom: 1px solid var(--border-1); position: relative; backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .event-label { position: absolute; left: 40px; top: 35px; border-left: 3px solid var(--accent); padding-left: 16px; display: flex; flex-direction: column; align-items: flex-start; }
        .event-prefix { font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
        .event-name { margin: 2px 0 0; font-family: var(--font-display); font-size: 18px; text-transform: uppercase; color: var(--accent); letter-spacing: 2px; text-shadow: var(--accent-glow); }
        .brand-center { text-align: center; margin-bottom: 20px; }
        .brand-center h1 { font-family: var(--font-display); margin: 0; font-size: 52px; color: var(--accent); font-weight: 900; letter-spacing: 8px; text-transform: uppercase; text-shadow: var(--accent-glow); animation: titleGlow 3s infinite; }
        @keyframes titleGlow { 0%,100%{text-shadow:0 0 15px rgba(0,229,255,0.5);} 50%{text-shadow:0 0 30px rgba(0,229,255,0.8);} }
        .brand-center p { margin: 6px 0 0; font-size: 11px; color: var(--text-3); letter-spacing: 6px; font-weight: 700; text-transform: uppercase; }
        .search-trigger { background: rgba(0,0,0,0.6); border: 1px solid var(--accent); color: var(--accent); width: 85%; max-width: 400px; padding: 16px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--font-body); font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; border-bottom: 3px solid var(--accent); }
        .search-trigger:hover { background: var(--accent-dim); }
        #galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; padding: 30px; height: calc(100vh - 230px); overflow-y: auto; align-items: start; }
        .foto-item { background: var(--bg-1); border-radius: var(--radius-md); overflow: hidden; position: relative; border: 1px solid var(--border-1); transition: all 0.3s; cursor: pointer; }
        .foto-item:hover { transform: scale(1.03); border-color: var(--accent); box-shadow: 0 0 25px rgba(0,229,255,0.3); }
        .foto-item img { width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; }
        .foto-id { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.9); color: var(--accent); padding: 5px 12px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; font-weight: 800; z-index: 10; border-left: 3px solid var(--accent); }
        #numpad-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        #numpad-overlay.active { display: flex; }
        .numpad-content { width: 340px; max-width: 92vw; text-align: center; }
        .numpad-title { font-family: var(--font-display); font-size: 16px; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; font-weight: 800; margin-bottom: 20px; }
        #input-busca { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid var(--bg-4); color: var(--accent); font-size: 56px; font-weight: 700; font-family: var(--font-mono); text-align: center; margin-bottom: 24px; outline: none; text-shadow: 0 0 25px var(--accent); border-radius: var(--radius-md); letter-spacing: 8px; padding: 12px; }
        #input-busca:focus { border-color: var(--accent); }
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .num-btn { background: rgba(255,255,255,0.04); border: 1px solid var(--bg-4); color: var(--text-0); width: 100%; height: 68px; border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; outline: none; }
        .num-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
        .num-btn:active { background: var(--accent); color: var(--bg-0); transform: scale(0.95); }
        .btn-ok { background: var(--accent); color: var(--bg-0); border-color: var(--accent); font-family: var(--font-display); font-size: 16px; font-weight: 900; }
        .btn-c { color: var(--danger); border-color: rgba(255,49,49,0.3); font-size: 14px; font-weight: 800; }
        .btn-fechar { margin-top: 24px; background: transparent; border: 1px solid var(--bg-4); color: var(--text-3); font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 14px; border-radius: var(--radius-md); cursor: pointer; width: 100%; }
        .btn-fechar:hover { color: var(--danger); border-color: var(--danger); }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(20px); }
        #modal.active { display: flex; }
        .modal-container { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; max-width: 950px; }
        #full-photo { max-height: 50vh; max-width: 90%; border-radius: var(--radius-md); border: 2px solid var(--accent); box-shadow: 0 0 60px rgba(0,229,255,0.2); object-fit: contain; }
        .qr-panel { background: #fff; padding: 32px; border-radius: var(--radius-lg); text-align: center; color: #000; width: 280px; box-shadow: 0 0 60px rgba(0,229,255,0.3); }
        .instr-header { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: 6px; }
        .instr-text { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: #000; margin-bottom: 16px; text-transform: uppercase; }
        #qrcode { display: flex; justify-content: center; margin: 16px 0; }
        #qrcode img { border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #photo-id-label { font-family: var(--font-mono); font-weight: 700; font-size: 34px; color: #000; margin-top: 8px; letter-spacing: 2px; }
        .close-btn { background: var(--accent); color: var(--bg-0); border: none; padding: 16px; border-radius: var(--radius-md); font-family: var(--font-body); font-weight: 900; font-size: 14px; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px; margin-top: 20px; }
        .close-btn:hover { box-shadow: var(--accent-glow); }
        #screensaver { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; cursor: pointer; }
        #screensaver.active { display: block; }
        #ss-img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0.5) contrast(1.1); transition: opacity 0.6s ease; }
        .ss-msg { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 2px solid var(--accent); color: var(--accent); padding: 20px 50px; border-radius: var(--radius-md); font-family: var(--font-display); font-weight: 900; font-size: 22px; text-transform: uppercase; box-shadow: 0 0 25px var(--accent); letter-spacing: 4px; border-left: 8px solid var(--accent); animation: pulseBlink 2s infinite; }
        @keyframes pulseBlink { 0%,100%{opacity:1} 50%{opacity:0.6} }
        #mobile-download-screen { display: none; position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,229,255,0.1) 0%, #000 100%); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        #mobile-download-screen.active { display: flex; }
        .mobile-title { font-family: var(--font-display); color: var(--accent); letter-spacing: 4px; margin: 0 0 24px; font-size: 28px; text-transform: uppercase; font-weight: 900; }
        #mobile-img { max-width: 100%; max-height: 50vh; border-radius: var(--radius-md); border: 2px solid var(--accent); }
        .btn-baixar { background: var(--accent); color: var(--bg-0); padding: 20px 56px; border-radius: var(--radius-md); text-decoration: none; font-family: var(--font-body); font-weight: 900; font-size: 15px; margin-top: 28px; text-transform: uppercase; letter-spacing: 2px; border: none; cursor: pointer; display: inline-flex; gap: 10px; }
        .empty-galeria { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text-3); }
        .empty-galeria i { font-size: 60px; margin-bottom: 16px; opacity: 0.3; display: block; }
        @media (min-width: 768px) { .modal-container { flex-direction: row; justify-content: center; } #full-photo { max-height: 80vh; max-width: 60%; } }
    </style>
</head>
<body>
    <div id="mobile-download-screen">
        <div style="font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 8px;">SISTEMA PRONTO</div>
        <h2 class="mobile-title">Baixar Foto</h2>
        <img id="mobile-img" src="" alt="Foto">
        <button id="btn-forcar-download" class="btn-baixar"><i class="fas fa-download"></i> Confirmar Download</button>
        <p id="msg-status" style="font-size: 11px; color: var(--text-3); margin-top: 16px;"></p>
    </div>

    <div id="conteudo-quiosque">
        <header>
            <div class="event-label"><div class="event-prefix">Evento Ativo</div><h2 class="event-name" id="ev-titulo">SINCRONIZANDO...</h2></div>
            <div class="brand-center"><h1>PHOTO CLOUD</h1><p>Colecionando Momentos</p></div>
            <div class="search-trigger" onclick="toggleNumpad(true)"><i class="fas fa-search"></i> Digite o ID da sua foto</div>
        </header>
        <div id="galeria"></div>
        <div id="screensaver" onclick="stopScreensaver()"><img id="ss-img" src="" alt=""><div class="ss-msg">Toque para buscar</div></div>
        <div id="numpad-overlay">
            <div class="numpad-content">
                <div class="numpad-title">Digite o ID da foto</div>
                <input type="text" id="input-busca" placeholder="----" readonly>
                <div class="numpad-grid">
                    <button class="num-btn" onclick="addNum(1)">1</button><button class="num-btn" onclick="addNum(2)">2</button><button class="num-btn" onclick="addNum(3)">3</button>
                    <button class="num-btn" onclick="addNum(4)">4</button><button class="num-btn" onclick="addNum(5)">5</button><button class="num-btn" onclick="addNum(6)">6</button>
                    <button class="num-btn" onclick="addNum(7)">7</button><button class="num-btn" onclick="addNum(8)">8</button><button class="num-btn" onclick="addNum(9)">9</button>
                    <button class="num-btn btn-c" onclick="limparBusca()">ESC</button><button class="num-btn" onclick="addNum(0)">0</button><button class="num-btn btn-ok" onclick="buscarEAbrirFoto()">OK</button>
                </div>
                <button class="btn-fechar" onclick="toggleNumpad(false)">Fechar</button>
            </div>
        </div>
        <div id="modal">
            <div class="modal-container">
                <img id="full-photo" src="" alt="Preview">
                <div class="qr-panel">
                    <div class="instr-header">Ponte Digital</div>
                    <div class="instr-text">Escaneie para salvar<br>no seu celular</div>
                    <div id="qrcode"></div>
                    <div id="photo-id-label"></div>
                    <button class="close-btn" onclick="fecharModal()">Voltar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        let eventoAtivo = "", todasFotos = [], inactivityTimer, ssInterval;
        const qr = new QRCode(document.getElementById("qrcode"), { width: 190, height: 190, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
        
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const fotoUrl = params.get('dl'), fotoKey = params.get('key');
            if (fotoUrl) exibirTelaDownload(decodeURIComponent(fotoUrl));
            else if (fotoKey) syncDados().then(() => exibirTelaDownload(`${API}/photo?key=${encodeURIComponent(fotoKey)}&t=${Date.now()}`));
            else { syncDados(); resetInactivityTimer(); }
        });

        function exibirTelaDownload(url) {
            document.getElementById('conteudo-quiosque').style.display = 'none';
            document.getElementById('mobile-download-screen').classList.add('active');
            document.getElementById('mobile-img').src = url;
            document.getElementById('btn-forcar-download').onclick = () => forcarDownload(url);
        }

        async function forcarDownload(url) {
            const btn = document.getElementById('btn-forcar-download'), status = document.getElementById('msg-status');
            try {
                btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...'; status.innerText = "Preparando download...";
                const r = await fetch(url), blob = await r.blob(), blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = blobUrl; a.download = "fotocloud_" + Date.now() + ".jpg";
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(blobUrl);
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-download"></i> Confirmar Download'; status.innerText = "Download concluído!";
            } catch (e) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Tentar novamente'; status.innerText = "Se falhar, segure na imagem e 'Salvar Foto'"; }
        }

        async function syncDados() {
            try {
                const r1 = await fetch(`${API}/get-all-states?t=${Date.now()}`), data = await r1.json(), config = data.config || data;
                const novoEvento = (config.evento && config.evento !== 'Geral') ? config.evento : "";
                if (novoEvento !== eventoAtivo) { eventoAtivo = novoEvento; document.getElementById('ev-titulo').innerText = eventoAtivo ? eventoAtivo.toUpperCase() : "AGUARDANDO EVENTO"; todasFotos = []; }
                let url = `${API}/list-photos?t=${Date.now()}`;
                if (eventoAtivo) url += `&evento=${encodeURIComponent(eventoAtivo)}`;
                const r2 = await fetch(url), fotos = await r2.json();
                if (!Array.isArray(fotos)) return;
                const invertidas = fotos.reverse();
                if (JSON.stringify(invertidas.map(f => f.key || f.id)) !== JSON.stringify(todasFotos.map(f => f.key || f.id))) { todasFotos = invertidas; renderizarGaleria(); }
            } catch (e) { console.error(e); }
        }

        function renderizarGaleria() {
            const container = document.getElementById('galeria'), termo = document.getElementById('input-busca').value;
            const comId = todasFotos.map((f, i) => ({ ...f, displayId: todasFotos.length - i }));
            const filtradas = termo === "" ? comId : comId.filter(f => f.displayId.toString().includes(termo));
            if (filtradas.length === 0) { container.innerHTML = `<div class="empty-galeria"><i class="fas fa-image"></i><h3>Nenhuma foto encontrada</h3><p>As fotos aparecerão aqui conforme forem capturadas</p></div>`; return; }
            container.innerHTML = filtradas.map(f => {
                const key = f.key || f.id || f.nome;
                return `<div class="foto-item" onclick="abrirModal('${key}', '${f.displayId}')"><div class="foto-id">#${f.displayId}</div><img src="${API}/photo?key=${encodeURIComponent(key)}&t=${Date.now()}" loading="lazy" alt="Foto ${f.displayId}"></div>`;
            }).join('');
        }

        function resetInactivityTimer() { clearTimeout(inactivityTimer); inactivityTimer = setTimeout(() => { if (todasFotos.length > 0 && !document.getElementById('modal').classList.contains('active')) { document.getElementById('screensaver').classList.add('active'); runSlideshow(); clearInterval(ssInterval); ssInterval = setInterval(runSlideshow, 5000); } }, 60000); }
        function runSlideshow() { if (todasFotos.length === 0) return; const f = todasFotos[Math.floor(Math.random() * todasFotos.length)], key = f.key || f.id || f.nome, img = document.getElementById('ss-img'); img.style.opacity = '0'; setTimeout(() => { img.src = `${API}/photo?key=${encodeURIComponent(key)}&t=${Date.now()}`; img.style.opacity = '1'; }, 300); }
        function stopScreensaver() { document.getElementById('screensaver').classList.remove('active'); clearInterval(ssInterval); resetInactivityTimer(); }
        function addNum(n) { const inp = document.getElementById('input-busca'); if (inp.value.length < 4) inp.value += n; renderizarGaleria(); }
        function limparBusca() { document.getElementById('input-busca').value = ""; renderizarGaleria(); }
        function toggleNumpad(show) { document.getElementById('numpad-overlay').classList.toggle('active', show); if (show) { document.getElementById('input-busca').value = ""; renderizarGaleria(); } }
        
        function buscarEAbrirFoto() {
            const termo = document.getElementById('input-busca').value;
            if (!termo) return;
            const comId = todasFotos.map((f, i) => ({ ...f, displayId: todasFotos.length - i }));
            const achada = comId.find(f => f.displayId.toString() === termo);
            if (achada) { toggleNumpad(false); abrirModal(achada.key || achada.id || achada.nome, achada.displayId); }
            else { const input = document.getElementById('input-busca'); input.style.borderColor = 'var(--danger)'; input.style.color = 'var(--danger)'; input.value = "ERRO"; setTimeout(() => { input.style.borderColor = ''; input.style.color = ''; limparBusca(); }, 1000); }
        }

        function abrirModal(key, id) {
            stopScreensaver();
            const url = `${API}/photo?key=${encodeURIComponent(key)}&t=${Date.now()}`;
            const img = document.getElementById('full-photo'); img.onerror = function() { this.src = url + '&retry=1'; }; img.src = url;
            document.getElementById('photo-id-label').innerText = "#" + id;
            const linkCurto = new URL(window.location.href.split('?')[0]);
            linkCurto.pathname = linkCurto.pathname.replace('quiosque.html', 'galeria.html');
            linkCurto.searchParams.set('key', key); linkCurto.searchParams.set('id', id);
            qr.clear(); qr.makeCode(linkCurto.toString());
            document.getElementById('modal').classList.add('active');
        }
        function fecharModal() { document.getElementById('modal').classList.remove('active'); limparBusca(); resetInactivityTimer(); }
        setInterval(syncDados, 5000);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (document.getElementById('modal').classList.contains('active')) fecharModal(); else if (document.getElementById('numpad-overlay').classList.contains('active')) toggleNumpad(false); } });
        window.addEventListener('beforeunload', () => { if (inactivityTimer) clearTimeout(inactivityTimer); if (ssInterval) clearInterval(ssInterval); });
    </script>
</body>
</html>
