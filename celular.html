<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PHOTO PRINT — Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest-celular.json">
<meta name="theme-color" content="#16a34a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Celular">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-celular-192.png">

    <style>
        html, body { overflow: hidden; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at 50% 30%, rgba(0,229,255,0.05) 0%, transparent 50%), var(--bg-0); }
        #dynamic-bg { position: fixed; inset: 0; z-index: 0; background-size: cover; opacity: 0; transition: opacity 0.6s; }
        #dynamic-bg.active { opacity: 0.35; }
        .status-badge { position: fixed; top: 16px; right: 16px; z-index: 20; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(10,10,10,0.85); border: 1px solid var(--border-2); border-radius: 20px; backdrop-filter: blur(12px); font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--text-2); }
        .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulseDot 2s infinite; }
        .status-badge.online .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .status-badge.online { color: var(--accent); border-color: var(--accent); }
        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .header { position: relative; z-index: 10; padding: 22px 20px 18px 26px; margin: 16px 16px 0; background: linear-gradient(135deg, rgba(10,10,10,0.9), rgba(17,17,17,0.7)); border: 1px solid var(--border-1); border-radius: var(--radius-lg); backdrop-filter: blur(16px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden; }
        .header::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
        .brand-title { font-family: var(--font-display); font-size: clamp(22px, 6vw, 30px); font-weight: 900; color: var(--accent); text-shadow: 0 0 20px rgba(0,229,255,0.5); letter-spacing: 2px; text-transform: uppercase; line-height: 1; }
        .subtitle { font-size: 10px; letter-spacing: 3px; color: var(--text-3); text-transform: uppercase; font-weight: 700; margin-top: 4px; }
        #nome-evento-capa { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-top: 14px; min-height: 20px; display: flex; align-items: center; gap: 8px; }
        #nome-evento-capa::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
        .main-ui { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 24px; padding-bottom: 40px; }
        .btn-eye-wrapper { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; }
        .btn-eye-wrapper::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(0,229,255,0.3); animation: rotateRing 20s linear infinite; }
        @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .btn-eye { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(0,0,0,0.9) 0%, rgba(0,20,25,0.9) 100%); animation: pulseNeon 2.4s infinite; transition: all 0.3s; z-index: 2; }
        .btn-eye:active { transform: scale(0.94); }
        .eye-inner { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--accent); background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, transparent 70%); box-shadow: inset 0 0 20px rgba(0,229,255,0.3), 0 0 20px rgba(0,229,255,0.4); }
        @keyframes pulseNeon { 0% { box-shadow: 0 0 0 0 rgba(0,229,255,0.7); } 70% { box-shadow: 0 0 0 24px rgba(0,229,255,0); } }
        .btn-hint { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; text-align: center; }
        .btn-hint .highlight { display: block; color: var(--accent); margin-top: 4px; font-size: 12px; }
        #cam-container { position: fixed; inset: 0; background: #000; display: none; z-index: 1000; }
        #cam-container.active { display: block; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .mirror { transform: scaleX(-1); }
        #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; pointer-events: none; }
        .topo-grupo { background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(10,20,25,0.85)); border: 1px solid var(--accent); padding: 18px 32px 20px; border-radius: var(--radius-xl); width: 88%; max-width: 420px; backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0,229,255,0.15); text-align: center; position: relative; overflow: hidden; }
        .topo-grupo::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
        #info-topo { font-family: var(--font-body); font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        #num-count { font-family: var(--font-mono); font-size: 84px; font-weight: 700; color: #fff; line-height: 1; display: block; text-shadow: 0 0 30px var(--accent); letter-spacing: -2px; }
        #sub-count { font-family: var(--font-body); font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-top: 6px; display: block; }
        #cam-controls { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-evenly; width: 100%; padding: 0 24px; pointer-events: auto; }
        .cam-btn { width: 58px; height: 58px; background: rgba(0,0,0,0.8); border: 1.5px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(12px); }
        .cam-btn.disabled { opacity: 0.35; pointer-events: none; }
        .cam-btn i { color: var(--accent); font-size: 20px; }
        .shutter-wrapper { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; }
        .shutter-btn { position: relative; width: 76px; height: 76px; background: radial-gradient(circle, #000 40%, rgba(0,229,255,0.1) 100%); border-radius: 50%; border: 4px solid var(--accent); cursor: pointer; box-shadow: 0 0 24px var(--accent); z-index: 2; }
        .shutter-btn:active { transform: scale(0.9); }
        #flash { position: fixed; inset: 0; background: #fff; display: none; z-index: 2000; pointer-events: none; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); backdrop-filter: blur(16px); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        #loader.active { display: flex; }
        .spin { width: 60px; height: 60px; border: 4px solid rgba(0,229,255,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #offline-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 30px; gap: 16px; }
        #offline-overlay.active { display: flex; }
        .offline-text { font-family: var(--font-display); font-size: 26px; font-weight: 900; color: var(--danger); text-transform: uppercase; letter-spacing: 3px; text-align: center; }
        #offline-motivo { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--text-3); letter-spacing: 1px; text-align: center; }
        .print-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 90%; max-width: 360px; margin: 20px auto; }
        .print-capsule-btn { background: rgba(0,0,0,0.6); border: 2px solid var(--accent); color: var(--accent); padding: 14px 15px; font-size: 11px; font-weight: 800; border-radius: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
        .print-capsule-btn.active { background: var(--accent); color: var(--bg-0); }
        .btn-send { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px var(--accent); margin: 10px 0; }
        .btn-send i { color: var(--bg-0); font-size: 26px; }
        .preview-img { max-height: 42vh; max-width: 88%; border: 2px solid var(--accent); border-radius: var(--radius-md); display: block; margin: 0 auto 20px; }
    </style>
</head>
<body>
    <div id="dynamic-bg"></div>
    <div class="status-badge" id="status-badge"><span class="dot"></span><span id="status-text">Offline</span></div>
    <div id="offline-overlay"><div class="offline-text">Sistema em<br>Manutenção</div><div id="offline-motivo"></div></div>
    <div id="flash"></div>
    <div id="loader"></div>

    <div id="cam-container">
        <video id="v" autoplay playsinline muted></video>
        <div id="overlay">
            <div class="topo-grupo">
                <div id="info-topo">CARREGANDO...</div>
                <span id="num-count"></span>
                <span id="sub-count">Aguardando Start</span>
            </div>
            <div id="cam-controls">
                <div class="cam-btn" id="btn-back" onclick="voltarHome()"><i class="fas fa-arrow-left"></i></div>
                <div class="shutter-wrapper" id="shutter-placeholder"><div class="shutter-btn" id="btn-shutter" onclick="iniciarSequencia()"></div></div>
                <div class="cam-btn" id="btn-switch" onclick="switchCam()"><i class="fas fa-sync-alt"></i></div>
            </div>
        </div>
    </div>

    <div class="header" id="secret-logo">
        <h1 class="brand-title">PHOTO PRINT</h1>
        <div class="subtitle">colecionando momentos</div>
        <div id="nome-evento-capa">...</div>
    </div>

    <div class="main-ui">
        <div class="btn-eye-wrapper">
            <div id="main-action-btn" class="btn-eye" onclick="ligar()">
                <div class="eye-inner"></div>
            </div>
        </div>
        <div class="btn-hint"><span>Toque no olho para começar</span><span class="highlight">Captura Mobile</span></div>
    </div>

    <canvas id="c-snap" style="display:none"></canvas>
    <canvas id="c-strip" style="display:none"></canvas>

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const FORMATOS = {
            "TIRINHA": { w: 591, h: 1819, fotos: 3, exigeH: false },
            "POLAROID": { w: 1041, h: 1311, fotos: 1, exigeH: false },
            "10X15H": { w: 1772, h: 1228, fotos: 1, exigeH: true },
            "10X15V": { w: 1181, h: 1819, fotos: 1, exigeH: false }
        };

        let ev = "", formatStr = "", molduraBase64 = "", eventoId = "", guestbookAtivo = false, sistemaOnline = true;
        let pics = [], stream = null, facingMode = "environment", configAtual = null, quantidadeCopias = 1;
        let lastState = 'start', captureInProgress = false, intervaloStatus = null;

        function mostrarToast(titulo, mensagem, tipo = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                container.id = 'toast-container';
                container.style = "position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:7000;display:flex;flex-direction:column;gap:10px;width:calc(100% - 40px);max-width:380px;";
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.style = "background:var(--bg-2);border:1px solid var(--border-2);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,0.8);animation:slideDown 0.3s;";
            toast.innerHTML = `<i class="fas fa-${tipo==='success'?'check-circle':tipo==='error'?'exclamation-triangle':'info-circle'}" style="color:var(--${tipo==='success'?'success':tipo==='error'?'danger':'accent'})"></i>
                <div><div style="font-size:12px;font-weight:800;">${titulo}</div><div style="font-size:11px;color:var(--text-2);">${mensagem}</div></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function atualizarBadgeStatus(online) {
            const badge = document.getElementById('status-badge'), text = document.getElementById('status-text');
            badge.classList.toggle('online', online);
            text.innerText = online ? 'Online' : 'Offline';
        }

        function mostrarOffline(on, motivo) {
            document.getElementById('offline-overlay').classList.toggle('active', on);
            document.getElementById('offline-motivo').innerText = on ? (motivo || '') : '';
            atualizarBadgeStatus(!on);
        }

        // Offline SOMENTE quando o painel diz OFFLINE (2 leituras seguidas)
        // ou quando o servidor fica realmente sem resposta (4 falhas seguidas).
        let falhasRede = 0, leiturasOffline = 0, consultando = false, primeiraConsulta = true;

        async function verificarStatus() {
            if (consultando) return null;      // evita requisições sobrepostas
            consultando = true;
            let data = null;
            try {
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), 20000);   // a moldura é pesada, precisa de folga
                const res = await fetch(`${API}/get-all-states?semMoldura=1&t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal });
                clearTimeout(to);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                data = await res.json();
                falhasRede = 0;
                // ▶▶▶ INÍCIO: manutenção quando NÃO há evento ativo no painel ◀◀◀
                const cfg = data && data.config;
                if (cfg) {
                    const comEvento = cfg.status === 'ONLINE' && !!cfg.eventoId && !!cfg.evento && cfg.evento !== 'Geral';
                    if (comEvento) {
                        leiturasOffline = 0; sistemaOnline = true; mostrarOffline(false);
                    } else {
                        leiturasOffline++;
                        // 1ª consulta ao abrir a página mostra na hora; depois confirma com 2 leituras seguidas
                        if (leiturasOffline >= 2 || primeiraConsulta) { sistemaOnline = false; mostrarOffline(true, 'nenhum evento ativo no painel'); }
                    }
                    primeiraConsulta = false;
                } else {
                    console.log('resposta sem config:', data);
                }
                // ▶▶▶ FIM: manutenção quando NÃO há evento ativo no painel ◀◀◀
            } catch (e) {
                falhasRede++;
                console.log('falha de rede (' + falhasRede + '):', e.message);
                // servidor instável: mantém o último estado do painel (falha de rede NÃO gera manutenção)
                data = null;
            } finally {
                consultando = false;
            }
            return sistemaOnline ? data : null;
        }

        async function sync() {
            const data = await verificarStatus();
            if (!sistemaOnline) {
                if (stream && !captureInProgress) voltarHome();   // painel ficou offline com a câmera aberta
                return;
            }
            if (!data) return;
            if (data.config && data.config.evento && data.config.evento !== 'Geral') {
                ev = data.config.evento;
                formatStr = (data.config.formato || 'POLAROID').toUpperCase().trim();
                eventoId = data.config.eventoId;
                guestbookAtivo = (data.config.livro === true || data.config.livro === 1);
                molduraBase64 = data.molduraUrl || data.moldura || '';
            } else {
                ev = "Geral"; formatStr = "POLAROID"; eventoId = ""; molduraBase64 = ""; guestbookAtivo = false;
            }
            document.getElementById('nome-evento-capa').innerText = ev || "—";
            configAtual = FORMATOS[formatStr] || FORMATOS["POLAROID"];
        }

        async function startStream() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
                const video = document.getElementById('v');
                video.srcObject = stream;
                video.className = (facingMode === "user") ? "mirror" : "";
            } catch (e) { mostrarToast("Erro", "Câmera indisponível.", "error"); throw e; }
        }

        async function switchCam() {
            if (captureInProgress) return;
            facingMode = (facingMode === "user") ? "environment" : "user";
            try { await startStream(); } catch (e) {}
        }

        async function ligar() {
            if (!sistemaOnline) return mostrarToast("Offline", "Sistema desligado no painel.", "error");
            if (!configAtual) configAtual = FORMATOS["POLAROID"];
            if (!molduraBase64) return mostrarToast("Moldura ausente", "Configure no painel.", "warning");
            document.getElementById('cam-container').classList.add('active');
            document.getElementById('info-topo').innerText = `${ev} | ${formatStr}`;
            document.getElementById('num-count').innerText = "";
            document.getElementById('sub-count').innerText = "TOQUE NO DISPARADOR";
            try { await startStream(); } catch (e) { voltarHome(); }
        }

        function voltarHome() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            document.getElementById('cam-container').classList.remove('active');
            document.getElementById('shutter-placeholder').style.visibility = "visible";
            document.getElementById('btn-switch').classList.remove('disabled');
        }

        async function iniciarSequencia() {
            if (captureInProgress) return;
            if (configAtual.exigeH && window.innerWidth <= window.innerHeight) return mostrarToast("Gire o aparelho", "Horizontal necessária.", "warning");
            captureInProgress = true;
            document.getElementById('shutter-placeholder').style.visibility = "hidden";
            document.getElementById('btn-switch').classList.add('disabled');
            pics = [];
            try {
                for (let n = 1; n <= configAtual.fotos; n++) {
                    document.getElementById('sub-count').innerText = `FOTO ${n} DE ${configAtual.fotos}`;
                    for (let i = 5; i > 0; i--) { document.getElementById('num-count').innerText = i; await new Promise(r => setTimeout(r, 1000)); }
                    document.getElementById('num-count').innerText = "SORRIA!";
                    snap();
                    await new Promise(r => setTimeout(r, 1500));
                }
                captureInProgress = false;
                processar();
            } catch (e) { captureInProgress = false; voltarHome(); }
        }

        function snap() {
            const v = document.getElementById('v');
            if (!v.videoWidth) return;
            document.getElementById('flash').style.display = "block";
            setTimeout(() => document.getElementById('flash').style.display = "none", 120);
            const cv = document.getElementById('c-snap'), ctx = cv.getContext('2d');
            cv.width = v.videoWidth; cv.height = v.videoHeight;
            if (facingMode === "user") { ctx.translate(cv.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(v, 0, 0);
            pics.push(cv.toDataURL('image/jpeg', 0.92));
        }

        function processar() {
            voltarHome();
            document.getElementById('loader').innerHTML = `<div class="spin"></div><p style="color:var(--accent);margin-top:20px;font-weight:700;">Processando...</p>`;
            document.getElementById('loader').classList.add('active');
            const cv = document.getElementById('c-strip'), ctx = cv.getContext('2d'), molduraImg = new Image();

            molduraImg.onload = () => {
                cv.width = configAtual.w; cv.height = configAtual.h;
                ctx.fillStyle = "white"; ctx.fillRect(0, 0, cv.width, cv.height);
                if (formatStr === "TIRINHA") {
                    const slots = [{ y: 0.030, h: 0.254 }, { y: 0.296, h: 0.254 }, { y: 0.559, h: 0.254 }];
                    let count = 0;
                    pics.forEach((src, i) => {
                        const img = new Image();
                        img.onload = () => {
                            const s = slots[i];
                            const dx = cv.width * 0.06, dw = cv.width * 0.88, dy = cv.height * s.y, dh = cv.height * s.h;
                            ctx.save(); ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
                            const r = Math.max(dw / img.width, dh / img.height);
                            ctx.drawImage(img, dx + (dw - img.width * r) / 2, dy + (dh - img.height * r) / 2, img.width * r, img.height * r);
                            ctx.restore(); count++;
                            if (count === 3) { ctx.drawImage(molduraImg, 0, 0, cv.width, cv.height); exibir(cv.toDataURL('image/jpeg', 0.95)); }
                        };
                        img.src = src;
                    });
                } else {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.max(cv.width / img.width, cv.height / img.height);
                        const w = img.width * scale, h = img.height * scale;
                        ctx.drawImage(img, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
                        ctx.drawImage(molduraImg, 0, 0, cv.width, cv.height);
                        exibir(cv.toDataURL('image/jpeg', 0.95));
                    };
                    img.src = pics[0];
                }
            };
            molduraImg.onerror = () => { document.getElementById('loader').classList.remove('active'); mostrarToast("Erro", "Falha na moldura.", "error"); };
            molduraImg.crossOrigin = 'anonymous';
            molduraImg.src = molduraBase64;
        }

        function alterarCopias(qtd) {
            quantidadeCopias = qtd;
            document.querySelectorAll('.print-capsule-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-opt-' + qtd);
            if (btn) btn.classList.add('active');
        }

        function exibir(url) {
            quantidadeCopias = 1;
            const botoesGuestbook = guestbookAtivo ? `
                <button id="btn-opt-3" class="print-capsule-btn" onclick="alterarCopias(3)"><i class="fas fa-book"></i> 1 + GB</button>
                <button id="btn-opt-4" class="print-capsule-btn" onclick="alterarCopias(4)"><i class="fas fa-book"></i> 2 + GB</button>` : '';
            const loader = document.getElementById('loader');
            loader.innerHTML = `
                <img src="${url}" class="preview-img">
                <div style="font-family:var(--font-display);font-size:14px;color:var(--accent);margin-bottom:18px;text-transform:uppercase;">Quantas cópias?</div>
                <div class="print-grid">
                    <button id="btn-opt-1" class="print-capsule-btn active" onclick="alterarCopias(1)"><i class="fas fa-print"></i> 1</button>
                    <button id="btn-opt-2" class="print-capsule-btn" onclick="alterarCopias(2)"><i class="fas fa-print"></i> 2</button>
                    ${botoesGuestbook}
                </div>
                <button class="btn-send" onclick="enviar()"><i class="fas fa-paper-plane"></i></button>
                <div style="font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:14px;">Enviar</div>
                <button onclick="document.getElementById('loader').classList.remove('active')" style="background:transparent;border:1px solid var(--border-2);color:var(--text-3);font-size:11px;font-weight:700;padding:10px 24px;border-radius:20px;cursor:pointer;text-transform:uppercase;">Cancelar</button>
            `;
            loader.classList.add('active');
        }

        async function enviar() {
            document.getElementById('loader').innerHTML = `<div class="spin"></div><p style="color:var(--accent);margin-top:20px;font-weight:700;">Enviando...</p>`;
            const cv = document.getElementById('c-strip');
            cv.toBlob(async (b) => {
                const copiasFisicas = quantidadeCopias === 1 ? 1 : quantidadeCopias === 2 ? 2 : quantidadeCopias === 3 ? 2 : 3;
                const temGuestbook = (quantidadeCopias === 3 || quantidadeCopias === 4);
                const sufixo = temGuestbook ? '_guestbook' : '';
                const ts = Date.now();
                const fd = new FormData();
                fd.append('foto', b, `foto_${ts}_${copiasFisicas}c${sufixo}.jpg`);
                fd.append('eventoId', eventoId);
                fd.append('timestamp', String(ts) + '_' + copiasFisicas + 'c' + sufixo);
                fd.append('copias', String(copiasFisicas));
                try {
                    const res = await fetch(`${API}/salvar-foto`, { method: 'POST', body: fd });
                    if (res.ok) { mostrarToast("Enviado", "Foto enviada!", "success"); document.getElementById('loader').classList.remove('active'); }
                    else throw new Error();
                } catch (e) { mostrarToast("Erro", "Falha no envio.", "error"); document.getElementById('loader').classList.remove('active'); }
            }, 'image/jpeg', 0.95);
        }

        window.addEventListener('load', () => {
            sync();
            intervaloStatus = setInterval(sync, 5000);
            const bg = localStorage.getItem('photoprint_bg_mobile');
            if (bg) { document.getElementById('dynamic-bg').style.backgroundImage = `url('${bg}')`; document.getElementById('dynamic-bg').classList.add('active'); }
        });

        window.addEventListener('beforeunload', () => {
            if (intervaloStatus) clearInterval(intervaloStatus);
            if (stream) stream.getTracks().forEach(t => t.stop());
        });
    </script>
