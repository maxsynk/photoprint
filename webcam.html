<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT - Webcam v9.1</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        .camera-container { position: relative; width: 100vh; height: 100vh; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* A moldura fica exatamente em cima do vídeo da webcam */
        #moldura-overlay { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            pointer-events: none; /* Não bloqueia o clique na tela */
            display: none; 
        }
        .info-box { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; font-size: 12px; border-radius: 5px; border: 1px solid #39ff14; z-index: 10; }
    </style>
</head>
<body>

    <div class="info-box">
        <div>SISTEMA: <strong style="color: #39ff14;">PHOTO PRINT</strong></div>
        <div>EVENTO: <span id="txt-evento">Carregando...</span></div>
        <div>FORMATO: <span id="txt-formato">-</span></div>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <img id="moldura-overlay" src="" alt="Moldura do Evento">
    </div>

<script>
    const API_URL = "https://photoprint-api.maxprimefotovideo.workers.dev";
    
    // Variáveis dinâmicas (NADA FIXO)
    let eventoAtivo = "";
    let formatoAtivo = "";
    let molduraAtiva = "";

    // 1. Inicia a Câmera local do dispositivo
    async function iniciarCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1920, height: 1080 }, audio: false });
            document.getElementById('video').srcObject = stream;
        } catch (e) {
            console.error("Erro ao acessar a webcam: ", e);
        }
    }

    // 2. Sincroniza em tempo real com o Worker buscando o que foi decidido no painel
    async function sincronizarComPainel() {
        try {
            const resp = await fetch(`${API_URL}/get-all-states?t=${Date.now()}`);
            const data = await resp.json();
            
            if (data && data.config) {
                const conf = data.config;

                // Só reconfigura a tela se o painel tiver mudado o evento ou a moldura
                if (eventoAtivo !== conf.evento || molduraAtiva !== conf.moldura || formatoAtivo !== conf.formato) {
                    
                    eventoAtivo = conf.evento;
                    formatoAtivo = conf.formato;
                    molduraAtiva = conf.moldura;

                    // Atualiza os textos informativos na tela
                    document.getElementById('txt-evento').innerText = eventoAtivo.toUpperCase();
                    document.getElementById('txt-formato').innerText = formatoAtivo;

                    // Atualiza a moldura PNG sobreposta na tela
                    const imgOverlay = document.getElementById('moldura-overlay');
                    if (molduraAtiva) {
                        imgOverlay.src = molduraAtiva; // Carrega o Base64 direto na imagem
                        imgOverlay.style.display = "block";
                    } else {
                        imgOverlay.src = "";
                        imgOverlay.style.display = "none";
                    }

                    console.log(`Webcam sincronizada com o evento: ${eventoAtivo} (${formatoAtivo})`);
                    
                    // Se você tiver uma função que prepara o motor de captura/recorte baseado no formato, dispare aqui:
                    // ajustarFormatacaoDaCaptura(formatoAtivo);
                }
            }
        } catch (e) {
            console.error("Falha ao atualizar dados do painel:", e);
        }
    }

    window.onload = () => {
        iniciarCamera();
        sincronizarComPainel();
        
        // Verifica se houve mudanças no painel a cada 3 segundos
        setInterval(sincronizarComPainel, 3000);
    };
</script>
</body>
</html>
