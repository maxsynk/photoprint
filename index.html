<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>MASTER HUB | PHOTO PRINT</title>
    <style>
        :root {
            --neon: #39ff14;
            --bg: #0a0a0a;
            --card: rgba(255, 255, 255, 0.03);
        }

        body, html { 
            margin: 0; padding: 0; min-height: 100vh;
            background-color: var(--bg);
            color: white; font-family: 'Orbitron', sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #1a3a12 0%, #000 60%);
            z-index: -1;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 5.5rem); margin: 0;
            color: var(--neon); text-transform: uppercase;
            text-shadow: 0 0 20px var(--neon);
            animation: glitch 3s infinite;
            text-align: center;
            cursor: pointer; /* Adicionado cursor para indicar interatividade nos 7 cliques */
        }

        .subtitle {
            font-size: 0.7rem; letter-spacing: 5px; opacity: 0.6;
            margin-bottom: 30px; text-transform: uppercase;
            text-align: center;
        }

        #login-screen, #hub-content { width: 95%; flex-direction: column; align-items: center; z-index: 10; }
        #hub-content { display: none; padding: 20px 0; }

        .login-box {
            background: var(--card); backdrop-filter: blur(20px);
            padding: 30px 15px; border-radius: 20px;
            border: 1px solid rgba(57, 255, 20, 0.2);
            text-align: center; width: 100%; max-width: 320px;
        }

        input {
            background: #000; border: 1px solid #333; color: var(--neon);
            padding: 15px; width: 100%; max-width: 180px;
            text-align: center; font-size: 1.2rem; outline: none;
            border-radius: 5px; margin-bottom: 20px;
        }

        .btn-login {
            background: var(--neon); color: #000; border: none; padding: 15px 30px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 5px;
        }

        .container {
            display: grid; grid-template-columns: 1fr; gap: 15px; width: 90%; max-width: 1100px;
        }

        @media (min-width: 600px) { .container { grid-template-columns: repeat(2, 1fr); } }

        .btn {
            position: relative; background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border-left: 4px solid var(--neon); padding: 20px 15px;
            text-decoration: none; color: white; font-weight: bold;
            display: flex; align-items: center; gap: 15px; transition: 0.4s;
            border-radius: 0 15px 15px 0;
        }

        .btn:hover { background: rgba(57, 255, 20, 0.1); transform: translateX(5px); }
        .btn span { font-size: 1.4rem; filter: drop-shadow(0 0 5px var(--neon)); }
        .btn div { font-size: 0.9rem; }

        @keyframes glitch { 0% { transform: skew(0deg); } 2% { transform: skew(10deg); } 4% { transform: skew(-10deg); } 6% { transform: skew(0deg); } }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div id="login-screen">
        <h1>Photo Print</h1>
        <div class="subtitle">colecionando momentos</div>
        <div class="login-box">
            <h2 style="color:var(--neon); font-size: 1rem;">SISTEMA RESTRITO</h2>
            <input type="tel" id="pass" placeholder="••••" inputmode="numeric"> <br>
            <button class="btn-login" onclick="checkPass()">Acessar Terminal</button>
        </div>
    </div>

    <div id="hub-content">
        <h1 id="exit-title" onclick="handleTitleClick()">Photo Print</h1>
        <div class="subtitle">colecionando momentos</div>

        <div class="container">
            <a href="celular.html" class="btn" target="_blank"><span>📸</span> <div>CÂMERA CELULAR</div></a>
            <a href="painel.html" class="btn" target="_blank"><span>⚙️</span> <div>PAINEL CONTROLE</div></a>
            <a href="quiosque.html" class="btn" target="_blank"><span>🔍</span> <div>QUIOSQUE BUSCA</div></a>
            <a href="galeria.html" class="btn" target="_blank"><span>🖼️</span> <div>GALERIA CLIENTE</div></a>
            <a href="telao.html" class="btn" target="_blank"><span>🖥️</span> <div>TELÃO SLIDESHOW</div></a>
            
            <a href="webcam.html" class="btn" target="_blank" style="border-color: #00e5ff;"><span>⚡</span> <div>ACIONAR WEBCAM</div></a>
            
            <a href="webcam.html" class="btn" target="_blank"><span>📹</span> <div>WEBCAM <small style="display:block; opacity:0.5; font-size:10px">Captura Totem Touch</small></div></a>
        </div>
    </div>

    <script>
        // Lógica de Login
        function checkPass() {
            if(document.getElementById('pass').value === "1234") { 
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('hub-content').style.display = 'flex';
            } else { alert("Senha incorreta"); }
        }

        // Lógica dos 7 cliques para "Sair" (Voltar para o login)
        let clicks = 0;
        function handleTitleClick() {
            clicks++;
            if (clicks >= 7) {
                clicks = 0;
                document.getElementById('hub-content').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('pass').value = "";
            }
            setTimeout(() => { clicks = 0; }, 2000); // Reseta se demorar muito
        }
    </script>
</body>
</html>
