<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GALERIA - PHOTO PRINT v5.1</title>
    <style>
        #manutencao { display:none; position:fixed; inset:0; background:#000; color:red; font-size:40px; font-weight:900; align-items:center; justify-content:center; z-index:99999; animation:pulse 1s infinite; text-align:center; }
        @keyframes pulse { 0%,100%{ opacity: 1;} 50%{ opacity: 0.5;} }
    </style>
</head>
<body>
    <div id="manutencao">SISTEMA EM MANUTENÇÃO</div>

    <!-- Mantenha todo o seu layout original da galeria aqui -->
    <!-- ... -->

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";

        async function loopSync() {
            try {
                const res = await fetch(`${API}/get-all-states?t=${Date.now()}`);
                const data = await res.json();

                // Alterna a tela de manutenção sem apagar seu HTML
                const man = document.getElementById('manutencao');
                if (data.config.status === "OFFLINE") {
                    man.style.display = "flex";
                } else {
                    man.style.display = "none";
                    
                    // Lógica de impressão se houver sinal
                    if (data.print && data.print.printTriggered) {
                        imprimir(data.print.copias); // Sua função de impressão existente
                        await fetch(`${API}/clear-print`, { method: 'POST' });
                    }
                }
            } catch(e) { console.log("Aguardando rede..."); }
        }
        
        // Verifica a cada 2 segundos
        setInterval(loopSync, 2000);
    </script>
</body>
</html>
