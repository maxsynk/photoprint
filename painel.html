<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Master Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: block; height: 100vh; overflow: hidden; }
        #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
        
        .sidebar { background: var(--bg-1); border-right: 1px solid var(--border-1); display: flex; flex-direction: column; padding: 24px 16px; z-index: 10; }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; border-bottom: 1px solid var(--border-1); margin-bottom: 16px; }
        .brand-logo { width: 36px; height: 36px; background: var(--accent); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--bg-0); font-size: 16px; box-shadow: var(--accent-glow); flex-shrink: 0; }
        .brand-text h2 { font-family: var(--font-display); font-size: 13px; font-weight: 900; color: var(--accent); letter-spacing: 1px; line-height: 1.1; }
        .brand-text span { font-size: 8px; color: var(--text-3); letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); color: var(--text-2); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; }
        .nav-item i { font-size: 14px; width: 18px; text-align: center; }
        .nav-item:hover { background: var(--bg-2); color: var(--text-0); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
        .nav-badge { margin-left: auto; background: var(--accent); color: var(--bg-0); font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 10px; }
        .sidebar-status-box { margin-top: auto; background: var(--bg-2); border: 1px solid var(--border-1); border-radius: var(--radius-sm); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .status-indicator-info { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px currentColor; flex-shrink: 0; }
        .status-dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .sync-info { font-size: 9px; color: var(--text-3); font-weight: 600; letter-spacing: 0.5px; padding-top: 6px; border-top: 1px solid var(--border-1); }
        
        .content-area { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-0); }
        .topbar { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--border-1); background: rgba(10,10,10,0.7); backdrop-filter: blur(20px); flex-shrink: 0; }
        .topbar-title h1 { font-size: 16px; font-weight: 700; }
        .topbar-title span { font-size: 11px; color: var(--text-3); font-weight: 500; }
        .topbar-active-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 20px; font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; text-transform: uppercase; max-width: 240px; }
        .topbar-active-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .topbar-active-badge.hidden { display: none; }
        .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulseDot 1.5s ease-in-out infinite; flex-shrink: 0; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch-slider { position: absolute; cursor: pointer; inset: 0; background: var(--bg-4); transition: all 0.3s; border-radius: 30px; border: 1px solid var(--border-2); }
        .switch-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: var(--text-3); transition: all 0.3s; border-radius: 50%; }
        .switch input:checked + .switch-slider { background: var(--accent-dim); border-color: var(--accent); }
        .switch input:checked + .switch-slider:before { transform: translateX(20px); background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        
        .view-container { flex: 1; overflow-y: auto; padding: 28px 32px; display: none; }
        .view-container.active { display: block; animation: fadeInView 0.3s ease; }
        @keyframes fadeInView { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .metric-card { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 20px; position: relative; overflow: hidden; transition: all 0.3s; }
        .metric-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .metric-card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); }
        .metric-card.blue::before { background: #0096ff; }
        .metric-card.yellow::before { background: var(--warn); }
        .metric-card.red::before { background: var(--danger); }
        .metric-icon { width: 34px; height: 34px; background: var(--accent-dim); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 14px; margin-bottom: 12px; }
        .metric-card.blue .metric-icon { background: rgba(0,150,255,0.15); color: #0096ff; }
        .metric-card.yellow .metric-icon { background: var(--warn-dim); color: var(--warn); }
        .metric-card.red .metric-icon { background: var(--danger-dim); color: var(--danger); }
        .metric-value { font-family: var(--font-display); font-size: 26px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .metric-value.small { font-size: 18px; }
        .metric-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
        
        .card { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border-1); display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); background: var(--bg-2); }
        .card-body { padding: 20px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 14px; background: var(--bg-0); border: 1px solid var(--bg-4); color: var(--text-0); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 13px; outline: none; transition: all 0.3s; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border: 1px solid transparent; transition: all 0.3s; font-family: inherit; }
        .btn-primary { background: var(--accent); color: var(--bg-0); border-color: var(--accent); }
        .btn-primary:hover { box-shadow: var(--accent-glow); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--text-0); border-color: var(--border-2); }
        .btn-outline:hover { background: var(--bg-2); border-color: var(--accent); color: var(--accent); }
        
        .eventos-list { display: flex; flex-direction: column; gap: 10px; }
        .evento-item { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-md); padding: 14px 18px; display: flex; align-items: center; gap: 16px; transition: all 0.3s; position: relative; }
        .evento-item:hover { border-color: var(--border-2); background: var(--bg-2); }
        .evento-item.ativo { border-color: var(--accent); background: linear-gradient(90deg, var(--accent-dim) 0%, var(--bg-1) 40%); }
        .evento-item.ativo::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); box-shadow: var(--accent-glow); border-radius: 3px 0 0 3px; }
        .evento-info { flex: 1; }
        .evento-nome { font-size: 13px; font-weight: 700; color: var(--text-0); margin-bottom: 3px; }
        .evento-meta { font-size: 10px; color: var(--text-3); font-weight: 500; }
        
        .upload-zone { border: 2px dashed var(--bg-4); border-radius: var(--radius-md); padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--bg-0); }
        .upload-zone:hover { border-color: var(--accent); background: var(--accent-dim); }
        
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 5000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: var(--bg-1); border: 1px solid var(--border-2); border-left: 3px solid var(--accent); border-radius: var(--radius-md); padding: 12px 16px; min-width: 260px; max-width: 360px; display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); pointer-events: auto; animation: toastIn 0.3s; }
        .toast.error { border-left-color: var(--danger); }
        .toast-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; background: var(--accent-dim); color: var(--accent); }
        .toast.error .toast-icon { background: var(--danger-dim); color: var(--danger); }
        .toast.info .toast-icon { background: rgba(0,150,255,0.15); color: #0096ff; }
        .toast-title { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
        .toast-message { font-size: 10px; color: var(--text-2); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 4000; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
        .loading-overlay.active { display: flex; }
        .spinner { width: 42px; height: 42px; border: 3px solid var(--bg-4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo"><i class="fas fa-camera-retro"></i></div>
                <div class="brand-text"><h2>PHOTO PRINT</h2><span>Master Panel</span></div>
            </div>
            <div class="sidebar-nav">
                <button class="nav-item active" data-aba="dashboard" onclick="trocarAba('dashboard', this)"><i class="fas fa-chart-pie"></i> Dashboard</button>
                <button class="nav-item" data-aba="eventos" onclick="trocarAba('eventos', this)"><i class="fas fa-list-alt"></i> Eventos <span class="nav-badge" id="badge-total">0</span></button>
                <button class="nav-item" data-aba="novo" onclick="trocarAba('novo', this)"><i class="fas fa-plus-circle"></i> Novo Evento</button>
            </div>
            <div class="sidebar-status-box">
                <div class="status-indicator-info"><div class="status-dot" id="sidebar-dot"></div><span id="sidebar-status-text">Offline</span></div>
                <div class="sync-info" id="sync-info"><i class="fas fa-clock"></i> Aguardando...</div>
            </div>
        </aside>

        <main class="content-area">
            <header class="topbar">
                <div class="topbar-title"><h1 id="topbar-title-text">Dashboard</h1><span id="topbar-subtitle-text">Visão geral</span></div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="topbar-active-badge hidden" id="topbar-active-badge"><span class="pulse-dot"></span><span id="topbar-active-name">—</span></div>
                    <div style="display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700;">
                        <span id="label-status" style="color: var(--danger);">OFFLINE</span>
                        <label class="switch"><input type="checkbox" id="server-status" onchange="salvarStatusRede()"><span class="switch-slider"></span></label>
                    </div>
                </div>
            </header>

            <div id="view-dashboard" class="view-container active">
                <div class="metrics-grid">
                    <div class="metric-card"><div class="metric-icon"><i class="fas fa-calendar-check"></i></div><div class="metric-value" id="stat-total">0</div><div class="metric-label">Total de Eventos</div></div>
                    <div class="metric-card blue"><div class="metric-icon"><i class="fas fa-signal"></i></div><div class="metric-value small" id="stat-ativo-nome">—</div><div class="metric-label">Evento em Transmissão</div></div>
                    <div class="metric-card yellow"><div class="metric-icon"><i class="fas fa-image"></i></div><div class="metric-value" id="stat-molduras">0</div><div class="metric-label">Molduras Carregadas</div></div>
                    <div class="metric-card red"><div class="metric-icon"><i class="fas fa-book-open"></i></div><div class="metric-value" id="stat-guestbooks">0</div><div class="metric-label">Eventos Guestbook</div></div>
                </div>
                <div class="card">
                    <div class="card-header"><span><i class="fas fa-bolt"></i> Ações Rápidas</span></div>
                    <div class="card-body" style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <button class="btn btn-primary" onclick="trocarAba('novo', document.querySelector('[data-aba=novo]'))"><i class="fas fa-plus"></i> Criar Novo Evento</button>
                        <button class="btn btn-outline" onclick="trocarAba('eventos', document.querySelector('[data-aba=eventos]'))"><i class="fas fa-list"></i> Ver Todos</button>
                        <button class="btn btn-outline" onclick="carregarEventosDoServidor()"><i class="fas fa-sync-alt"></i> Sincronizar</button>
                    </div>
                </div>
            </div>

            <div id="view-eventos" class="view-container">
                <div class="card">
                    <div class="card-header"><span><i class="fas fa-database"></i> Base de Eventos</span><button class="btn btn-outline" onclick="carregarEventosDoServidor()"><i class="fas fa-sync-alt"></i> Sincronizar</button></div>
                    <div class="card-body"><div class="eventos-list" id="corpo-lista"></div></div>
                </div>
            </div>

            <div id="view-novo" class="view-container">
                <div class="card" style="max-width: 800px; margin: 0 auto;">
                    <div class="card-header"><span id="card-form-title"><i class="fas fa-plus-circle"></i> Cadastrar Novo Evento</span></div>
                    <div class="card-body">
                        <input type="hidden" id="edit-id" value="">
                        <div class="form-grid">
                            <div class="form-group full"><label class="form-label"><i class="fas fa-tag"></i> Nome do Evento</label><input type="text" id="input-evento" class="form-control" placeholder="Ex: Casamento"></div>
                            <div class="form-group"><label class="form-label"><i class="fas fa-calendar-alt"></i> Data</label><input type="date" id="input-data" class="form-control"></div>
                            <div class="form-group"><label class="form-label"><i class="fas fa-crop-alt"></i> Formato</label>
                                <select id="select-formato" class="form-control" onchange="atualizarLabelMoldura()">
                                    <option value="POLAROID">Polaroid</option>
                                    <option value="TIRINHA">Tirinha</option>
                                    <option value="10X15H">10x15 Horizontal</option>
                                    <option value="10X15V">10x15 Vertical</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-0); border: 1px solid var(--bg-4); border-radius: var(--radius-sm);">
                                <span style="font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px;"><i class="fas fa-book-open" style="color: var(--accent);"></i> Modo Guestbook</span>
                                <label class="switch"><input type="checkbox" id="input-livro"><span class="switch-slider"></span></label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-image"></i> <span id="label-moldura">Moldura</span></label>
                            <input type="file" id="input-moldura" accept="image/png" style="display:none" onchange="uploadMoldura(this)">
                            <div class="upload-zone" id="upload-zone" onclick="document.getElementById('input-moldura').click()" ondragover="event.preventDefault(); this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event)">
                                <div style="font-size: 28px; color: var(--text-3); margin-bottom: 8px;"><i class="fas fa-cloud-upload-alt"></i></div>
                                <div style="font-size: 11px; font-weight: 600; color: var(--text-2);">Clique ou arraste o PNG</div>
                            </div>
                            <div id="preview-wrapper" style="margin-top: 12px; text-align: center; display: none;"><img id="moldura-preview" style="max-width: 160px; border: 1px solid var(--accent); border-radius: 8px;"><div id="moldura-nome" style="font-size: 10px; color: var(--accent); margin-top: 6px;"></div></div>
                        </div>
                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button class="btn btn-primary" style="flex: 1;" onclick="salvarEvento()" id="btn-submit"><i class="fas fa-save"></i> <span id="btn-text">Criar Evento</span></button>
                            <button class="btn btn-outline" style="display: none;" onclick="cancelarEdicao()" id="btn-cancelar"><i class="fas fa-times"></i> Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div><div style="font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase;" id="loading-text">...</div></div>
    <div class="toast-container" id="toast-container"></div>

    <script>
        const API_URL = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const RESOLUCOES = { 'POLAROID': { w: 1041, h: 1311, label: 'Polaroid' }, 'TIRINHA': { w: 591, h: 1819, label: 'Tirinha' }, '10X15V': { w: 1181, h: 1819, label: '10x15 V' }, '10X15H': { w: 1772, h: 1228, label: '10x15 H' } };
        let eventos = [], molduras = { polaroid: null, tirinha: null, '10x15v': null, '10x15h': null }, autoRefreshInterval = null;

        function mostrarToast(titulo, mensagem, tipo = 'success') {
            const toast = document.createElement('div'); toast.className = `toast ${tipo}`;
            toast.innerHTML = `<div class="toast-icon"><i class="fas fa-${tipo==='success'?'check':tipo==='error'?'exclamation-triangle':'info'}"></i></div><div><div class="toast-title">${titulo}</div><div class="toast-message">${mensagem}</div></div>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }
        function mostrarLoading(show, texto = "...") { document.getElementById('loading-text').innerText = texto; document.getElementById('loading-overlay').classList.toggle('active', show); }
        
        function trocarAba(aba, btn) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + aba).classList.add('active'); 
            if (btn) btn.classList.add('active');
            document.getElementById('topbar-title-text').innerText = aba === 'dashboard' ? 'Dashboard' : aba === 'eventos' ? 'Eventos' : 'Novo Evento';
        }

        async function carregarEventosDoServidor() {
            mostrarLoading(true, "Sincronizando...");
            try {
                const resp = await fetch(`${API_URL}/eventos`); 
                const data = await resp.json();
                if (data.success && data.eventos) {
                    eventos = data.eventos.map(ev => ({ id: ev.id, nome: ev.nome, data: ev.data, dataRaw: ev.data, formato: ev.formato || 'POLAROID', livro: ev.livro === 1, ativo: ev.ativo === 1, temMoldura: ev.tem_moldura === 1 }));
                }
                // Após carregar, verifica o status real no Worker
                await verificarEstadoAtual();
                renderizarLista(); 
                atualizarMetricas();
                atualizarSyncInfo();
            } catch (e) { 
                mostrarToast("Erro", "Falha na conexão.", "error"); 
            } finally { 
                mostrarLoading(false); 
            }
        }

        async function verificarEstadoAtual() {
            try {
                const resp = await fetch(`${API_URL}/get-all-states`);
                const data = await resp.json();
                if (data.config) {
                    const online = data.config.status === "ONLINE";
                    atualizarUIStatus(online);
                    document.getElementById('server-status').checked = online;
                    
                    // Atualiza a lista de eventos com base no que o worker diz que está ativo
                    const activeId = data.config.eventoId ? String(data.config.eventoId) : null;
                    eventos.forEach(ev => ev.ativo = (String(ev.id) === activeId));
                }
            } catch (e) {}
        }

        function atualizarUIStatus(on) {
            const lb = document.getElementById('label-status');
            const dot = document.getElementById('sidebar-dot');
            const statusText = document.getElementById('sidebar-status-text');
            
            lb.innerText = on ? "ONLINE" : "OFFLINE";
            lb.style.color = on ? "var(--accent)" : "var(--danger)";
            
            dot.classList.toggle('online', on);
            statusText.innerText = on ? "Online" : "Offline";
            
            // Atualiza badge do topo
            const ativo = eventos.find(e => e.ativo);
            document.getElementById('topbar-active-badge').classList.toggle('hidden', !ativo);
            if (ativo) document.getElementById('topbar-active-name').innerText = ativo.nome;
        }

        function atualizarSyncInfo() {
            const agora = new Date();
            const time = agora.toLocaleTimeString('pt-BR');
            document.getElementById('sync-info').innerHTML = `<i class="fas fa-clock"></i> Última sync: ${time}`;
        }

        function atualizarMetricas() {
            document.getElementById('stat-total').innerText = eventos.length; 
            document.getElementById('stat-molduras').innerText = eventos.filter(e => e.temMoldura).length; 
            document.getElementById('stat-guestbooks').innerText = eventos.filter(e => e.livro).length;
            const ativo = eventos.find(e => e.ativo); 
            document.getElementById('stat-ativo-nome').innerText = ativo ? ativo.nome : '—'; 
            document.getElementById('badge-total').innerText = eventos.length;
        }

        function renderizarLista() {
            const container = document.getElementById('corpo-lista');
            if (eventos.length === 0) return container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-3);">Nenhum evento.</div>';
            container.innerHTML = eventos.map((ev, i) => `<div class="evento-item ${ev.ativo ? 'ativo' : ''}"><div class="evento-info"><div class="evento-nome">${ev.nome}</div><div class="evento-meta">${ev.data} · ${ev.formato}</div></div><button class="btn btn-outline" onclick="editarEvento(${i})"><i class="fas fa-edit"></i></button><button class="btn btn-outline" onclick="excluirEvento(${i})" style="color:var(--danger);border-color:var(--danger);"><i class="fas fa-trash"></i></button><button class="btn ${ev.ativo ? 'btn-primary' : 'btn-outline'}" onclick="ativarEvento(${i})">${ev.ativo ? 'Ativado' : 'Ativar'}</button></div>`).join('');
        }

        async function ativarEvento(index) {
            const ev = eventos[index]; 
            const novo = !ev.ativo; 
            mostrarLoading(true, "Alterando...");
            try { 
                // Se estiver ativando um novo, desativa todos os outros no banco primeiro
                if (novo) {
                    for(let e of eventos) {
                        if (e.ativo && e.id !== ev.id) {
                            await fetch(`${API_URL}/atualizar-evento/${e.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: e.nome, data: e.dataRaw, formato: e.formato, livro: e.livro, ativo: false }) });
                        }
                    }
                }
                
                await fetch(`${API_URL}/atualizar-evento/${ev.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: ev.nome, data: ev.dataRaw, formato: ev.formato, livro: ev.livro, ativo: novo }) }); 
                
                // Envia pro Worker
                if(novo) {
                    await fetch(`${API_URL}/set-config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ evento: ev.nome, status: "ONLINE", formato: ev.formato, livro: ev.livro, eventoId: ev.id, temMoldura: ev.temMoldura }) });
                } else {
                    await fetch(`${API_URL}/set-config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ evento: "Geral", status: "OFFLINE", formato: "POLAROID", livro: false, eventoId: "", temMoldura: false }) });
                }

                await carregarEventosDoServidor(); // Recarrega tudo pra garantir
            } catch (e) { 
                mostrarToast("Erro", e.message, "error"); 
            } finally { 
                mostrarLoading(false); 
            }
        }

        async function salvarStatusRede() {
            const on = document.getElementById('server-status').checked;
            const ativo = eventos.find(e => e.ativo);
            
            // Se tentar ligar o status sem evento ativo, impede
            if (on && !ativo) {
                document.getElementById('server-status').checked = false;
                return mostrarToast("Erro", "Ative um evento primeiro.", "error");
            }

            try {
                if (ativo) {
                                   await fetch(`${API_URL}/set-config`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ evento: ativo.nome, status: on ? "ONLINE" : "OFFLINE", formato: ativo.formato, livro: ativo.livro, eventoId: ativo.id, temMoldura: ativo.temMoldura }) });
                }
                atualizarUIStatus(on);
                mostrarToast("Status Alterado", on ? "Sistema Online" : "Sistema Offline", on ? "success" : "warning");
            } catch (e) {
                document.getElementById('server-status').checked = !on;
                mostrarToast("Erro", "Falha ao mudar o status.", "error");
            }
        }

        function editarEvento(index) { 
            const ev = eventos[index]; 
            document.getElementById('input-evento').value = ev.nome; 
            document.getElementById('input-data').value = ev.dataRaw; 
            document.getElementById('select-formato').value = ev.formato; 
            document.getElementById('input-livro').checked = ev.livro; 
            document.getElementById('edit-id').value = ev.id; 
            document.getElementById('btn-text').innerText = "Salvar"; 
            document.getElementById('btn-cancelar').style.display = 'inline-flex'; 
            trocarAba('novo', document.querySelector('[data-aba="novo"]')); 
        }

        function cancelarEdicao() { 
            document.getElementById('input-evento').value = ""; 
            document.getElementById('input-data').value = ""; 
            document.getElementById('edit-id').value = ""; 
            document.getElementById('btn-text').innerText = "Criar Evento"; 
            document.getElementById('btn-cancelar').style.display = 'none'; 
            trocarAba('eventos', document.querySelector('[data-aba="eventos"]')); 
        }

        async function excluirEvento(index) { 
            if (!confirm("Excluir?")) return; 
            const ev = eventos[index]; 
            try { 
                await fetch(`${API_URL}/deletar-evento/${ev.id}`, { method: 'DELETE' }); 
                eventos.splice(index, 1); 
                renderizarLista(); 
                atualizarMetricas(); 
            } catch (e) { 
                mostrarToast("Erro", e.message, "error"); 
            } 
        }

        async function salvarEvento() {
            const nome = document.getElementById('input-evento').value.trim(); 
            const data = document.getElementById('input-data').value; 
            const formato = document.getElementById('select-formato').value; 
            const livro = document.getElementById('input-livro').checked; 
            const editId = document.getElementById('edit-id').value;
            if (!nome || !data) return mostrarToast("Erro", "Preencha tudo.", "error"); 
            
            mostrarLoading(true, "Salvando...");
            try {
                if (editId) {
                    const atual = eventos.find(e => String(e.id) === String(editId));
                    await fetch(`${API_URL}/atualizar-evento/${editId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome, data, formato, livro, ativo: atual ? atual.ativo : false }) });
                } else { 
                    const resp = await fetch(`${API_URL}/criar-evento`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome, data, formato, livro }) }); 
                }
                
                // Upload de moldura (se houver)
                const temMoldura = Object.values(molduras).some(f => f !== null);
                if (temMoldura) {
                    const evId = editId || (await fetch(`${API_URL}/eventos`).then(r => r.json())).eventos[0].id;
                    for (const [formato, arquivo] of Object.entries(molduras)) {
                        if (!arquivo) continue;
                        const formData = new FormData();
                        formData.append('moldura', arquivo);
                        formData.append('eventoId', evId);
                        formData.append('formato', formato);
                        await fetch(`${API_URL}/upload-moldura`, { method: 'POST', body: formData });
                    }
                }

                mostrarToast("Sucesso", "Salvo!"); 
                cancelarEdicao(); 
                carregarEventosDoServidor();
            } catch (e) { 
                mostrarToast("Erro", e.message, "error"); 
            } finally { 
                mostrarLoading(false); 
            }
        }

        async function uploadMoldura(input) {
            if (input.files && input.files[0]) { 
                const file = input.files[0];
                if (file.type !== 'image/png') return mostrarToast("Formato Inválido", "Apenas PNG.", "error");
                const formato = document.getElementById('select-formato').value;
                const resolucao = RESOLUCOES[formato];
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        document.getElementById('moldura-preview').src = e.target.result;
                        document.getElementById('preview-wrapper').style.display = 'block';
                        document.getElementById('moldura-nome').innerText = `✅ ${file.name} (${img.width}x${img.height}px)`;
                        molduras[formato.toLowerCase()] = file;
                        if (img.width !== resolucao.w || img.height !== resolucao.h) {
                            mostrarToast("Aviso de Resolução", `Recomendado: ${resolucao.w}x${resolucao.h}px`, "warning");
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function atualizarLabelMoldura() {
            const formato = document.getElementById('select-formato').value;
            document.getElementById('label-moldura').innerText = 'Moldura — ' + (RESOLUCOES[formato]?.label || formato);
        }

        window.addEventListener('load', () => { 
            carregarEventosDoServidor(); 
            autoRefreshInterval = setInterval(carregarEventosDoServidor, 30000); 
        });
    </script>
</body>
</html>
