<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>WEBCAM - PHOTO PRINT v4.0</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {

            --neon: #39ff14;
            --dark: #050505;
            --danger: #ff3131;

        }

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            background: var(--dark);

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

        }

        #cam-preview {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            display: none;

            z-index: 1;

        }

        .screen {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            z-index: 20;

        }

        #loader {

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.92);

            z-index: 999;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            color: var(--neon);

            font-size: 28px;

            font-weight: bold;

            text-shadow: 0 0 20px var(--neon);

        }

        #final-preview-container {

            z-index: 150;

            background: #000;

            display: none;

        }

        #img-review {

            max-width: 80%;

            border: 5px solid var(--neon);

            box-shadow: 0 0 35px rgba(57,255,20,0.8);

            border-radius: 25px;

        }

        /* =========================================
           BOTÃO INICIAL
        ========================================= */

        .btn-start {

            position: relative;

            width: 560px;
            height: 560px;

            border-radius: 50%;

            border: 5px solid var(--neon);

            background:
                radial-gradient(circle at center,
                rgba(57,255,20,0.20),
                rgba(0,0,0,0.92));

            cursor: pointer;

            overflow: hidden;

            transition: 0.3s;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 35px rgba(57,255,20,0.4),
                inset 0 0 30px rgba(57,255,20,0.15);

            animation: pulseStart 2s infinite;

        }

        @keyframes pulseStart {

            0% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.02);

            }

            100% {

                transform: scale(1);

            }

        }

        .btn-start:hover {

            transform: scale(1.04);

            box-shadow:
                0 0 60px rgba(57,255,20,0.9),
                inset 0 0 40px rgba(57,255,20,0.3);

        }

        .btn-start::before {

            content: '';

            position: absolute;

            top: -50%;
            left: -50%;

            width: 200%;
            height: 200%;

            background: linear-gradient(
                45deg,
                transparent,
                rgba(57,255,20,0.18),
                transparent
            );

            animation: rotateGlow 5s linear infinite;

        }

        @keyframes rotateGlow {

            100% {

                transform: rotate(360deg);

            }

        }

        .start-content {

            position: relative;

            z-index: 2;

            text-align: center;

            padding: 40px;

        }

        .start-title {

            color: var(--neon);

            font-size: 48px;

            font-weight: 900;

            text-align: center;

            margin-bottom: 20px;

            text-shadow: 0 0 25px var(--neon);

            font-family: 'Orbitron', sans-serif;

            text-transform: uppercase;

        }

        .start-subtitle {

            text-align: center;

            font-size: 24px;

            color: white;

            line-height: 1.6;

        }

        .start-subtitle span {

            color: var(--neon);

            font-weight: bold;

        }

        /* =========================================
           OVERLAY CAMERA
        ========================================= */

        #camera-overlay {

            position: fixed;

            inset: 0;

            z-index: 50;

            pointer-events: none;

            display: none;

        }

        .camera-info {

            position: absolute;

            top: 40px;
            left: 40px;

            display: flex;

            align-items: flex-start;

            gap: 18px;

        }

        .camera-line {

            width: 6px;

            height: 170px;

            background: var(--neon);

            box-shadow: 0 0 20px var(--neon);

            border-radius: 50px;

        }

        .camera-text {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .camera-system {

            color: var(--neon);

            font-size: 36px;

            font-weight: bold;

            text-shadow: 0 0 15px var(--neon);

            font-family: 'Orbitron', sans-serif;

        }

        .camera-event {

            font-size: 28px;

            font-weight: bold;

        }

        .camera-type {

            font-size: 18px;

            opacity: 0.9;

            letter-spacing: 2px;

        }

        /* =========================================
           PREPARE-SE
        ========================================= */

        #prepare-screen {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 90;

            background: rgba(0,0,0,0.25);

        }

        #prepare-text {

            font-family: 'Orbitron', sans-serif;

            font-size: 90px;

            font-weight: 900;

            color: var(--neon);

            text-shadow:
                0 0 15px var(--neon),
                0 0 40px var(--neon);

            animation: prepareAnim 1s infinite alternate;

            letter-spacing: 8px;

        }

        @keyframes prepareAnim {

            from {

                transform: scale(1);

                opacity: 0.7;

            }

            to {

                transform: scale(1.08);

                opacity: 1;

            }

        }

        /* =========================================
           CONTADOR
        ========================================= */

        #countdown-container {

            position: absolute;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 80;

            background: rgba(0,0,0,0.15);

        }

        #countdown {

            color: var(--neon);

            font-size: 220px;

            font-weight: bold;

            text-shadow: 0 0 35px var(--neon);

            animation: pulse 1s infinite;

            font-family: 'Orbitron', sans-serif;

        }

        @keyframes pulse {

            0% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.15);

            }

            100% {

                transform: scale(1);

            }

        }

        /* =========================================
           PREVIEW FINAL
        ========================================= */

        #botoeira-controls {

            margin-top: 25px;

            color: var(--neon);

            font-size: 28px;

            font-weight: bold;

            text-align: center;

            animation: pulseText 1.5s infinite alternate;

        }

        @keyframes pulseText {

            from {

                opacity: 0.6;

                text-shadow: 0 0 5px var(--neon);

            }

            to {

                opacity: 1;

                text-shadow: 0 0 20px var(--neon);

            }

        }

    </style>

</head>

<body>

    <!-- LOADER -->

    <div id="loader">

        <div>PROCESSANDO...</div>

    </div>

    <!-- CAMERA -->

    <video id="cam-preview" autoplay playsinline></video>

    <!-- OVERLAY -->

    <div id="camera-overlay">

        <!-- INFO -->

        <div class="camera-info">

            <div class="camera-line"></div>

            <div class="camera-text">

                <div class="camera-system">

                    PHOTO PRINT

                </div>

                <div class="camera-event" id="event-name">

                    CARREGANDO EVENTO...

                </div>

                <div class="camera-type" id="photo-type">

                    FOTO DIGITAL • MOLDURA DINÂMICA

                </div>

            </div>

        </div>

        <!-- PREPARE -->

        <div id="prepare-screen">

            <div id="prepare-text">

                📸 PREPARE-SE

            </div>

        </div>

        <!-- COUNTDOWN -->

        <div id="countdown-container">

            <div id="countdown">

                5

            </div>

        </div>

    </div>

    <!-- START -->

    <div id="screen-start" class="screen">

        <div class="btn-start" onclick="initSession()">

            <div class="start-content">

                <div class="start-title" id="start-event-name">

                    EVENTO

                </div>

                <div class="start-subtitle">

                    Clique na <span>BOTOEIRA DO TOTEM</span><br>
                    para iniciar sua experiência 📸

                </div>

            </div>

        </div>

    </div>

    <!-- PREVIEW -->

    <div id="final-preview-container" class="screen">

        <img id="img-review" src="">

        <div id="botoeira-controls">

            AGUARDANDO ESCOLHA NA BOTOEIRA... 📱

        </div>

    </div>

    <script>

        const API =
            "https://photoprint-api.maxprimefotovideo.workers.dev";

        const video =
            document.getElementById('cam-preview');

        let finalBlob = null;

        let currentEvent = "EVENTO";
        let currentPhotoType = "FOTO DIGITAL";

        // =========================================
        // BUSCA EVENTO ATIVO
        // =========================================

        async function loadSystemConfig() {

            try {

                const res =
                    await fetch(`${API}/status?t=${Date.now()}`);

                const config =
                    await res.json();

                currentEvent =
                    config.evento || "EVENTO";

                currentPhotoType =
                    config.tipo || "MOLDURA PADRÃO";

                document.getElementById('event-name')
                    .innerText = currentEvent;

                document.getElementById('start-event-name')
                    .innerText = currentEvent;

                document.getElementById('photo-type')
                    .innerText =
                        `FOTO DIGITAL • ${currentPhotoType}`;

            } catch(e) {

                console.log("Erro ao carregar evento");

            }

        }

        // =========================================
        // INICIA SESSÃO
        // =========================================

        async function initSession() {

            document.getElementById('screen-start')
                .style.display = "none";

            document.getElementById('loader')
                .style.display = "flex";

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            width: 1920,
                            height: 1080

                        }

                    });

                video.srcObject = stream;

                video.style.display = "block";

                document.getElementById('loader')
                    .style.display = "none";

                document.getElementById('camera-overlay')
                    .style.display = "block";

                // TELA PREPARE-SE

                setTimeout(() => {

                    document.getElementById('prepare-screen')
                        .style.display = "none";

                    document.getElementById('countdown-container')
                        .style.display = "flex";

                    startCountdown();

                }, 3000);

            } catch(e) {

                alert("Erro ao acessar câmera");

                location.reload();

            }

        }

        // =========================================
        // CONTADOR
        // =========================================

        function startCountdown() {

            let time = 5;

            const countdown =
                document.getElementById('countdown');

            countdown.innerText = time;

            const interval = setInterval(() => {

                time--;

                countdown.innerText = time;

                if (time <= 0) {

                    clearInterval(interval);

                    processFinalImage();

                }

            }, 1000);

        }

        // =========================================
        // PROCESSA FOTO
        // =========================================

        async function processFinalImage() {

            document.getElementById('countdown')
                .innerText = "📸";

            const canvas =
                document.createElement('canvas');

            canvas.width = 1920;
            canvas.height = 1080;

            const ctx =
                canvas.getContext('2d');

            // FOTO ESPELHADA

            ctx.translate(canvas.width, 0);

            ctx.scale(-1, 1);

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            // BLOB

            canvas.toBlob(b => {

                finalBlob = b;

            }, 'image/jpeg', 0.92);

            // PREVIEW

            document.getElementById('img-review').src =
                canvas.toDataURL('image/jpeg', 0.92);

            // ESCONDE OVERLAY

            document.getElementById('camera-overlay')
                .style.display = "none";

            // AVISA BOTOEIRA

            fetch(`${API}/photo-ready`, {

                method: 'POST'

            });

            // MOSTRA PREVIEW

            document.getElementById('final-preview-container')
                .style.display = "flex";

            // ESCUTA IMPRESSÃO

            startPrintPolling();

        }

        // =========================================
        // ESCUTA IMPRESSÃO
        // =========================================

        async function startPrintPolling() {

            const interval = setInterval(async () => {

                try {

                    const res =
                        await fetch(`${API}/check-print?t=${Date.now()}`);

                    const data =
                        await res.json();

                    if (data.printTriggered) {

                        clearInterval(interval);

                        await fetch(`${API}/clear-print`, {

                            method: 'POST'

                        });

                        finalizar(data.copias);

                    }

                } catch(e) {}

            }, 1000);

        }

        // =========================================
        // FINALIZA
        // =========================================

        async function finalizar(qtd) {

            document.getElementById('loader')
                .style.display = "flex";

            const fd = new FormData();

            fd.append('file', finalBlob, 'webcam.jpg');

            fd.append('copias', qtd);

            fd.append('evento', currentEvent);

            try {

                await fetch(`${API}/upload`, {

                    method: 'POST',

                    body: fd

                });

                location.reload();

            } catch(e) {

                alert("Erro ao enviar impressão");

                location.reload();

            }

        }

        // =========================================
        // ESCUTA GATILHO
        // =========================================

        async function checkRemoteTrigger() {

            const screenStart =
                document.getElementById('screen-start');

            if (!screenStart ||
                screenStart.style.display === "none")
                return;

            try {

                const res =
                    await fetch(`${API}/check-trigger?t=${Date.now()}`);

                const data =
                    await res.json();

                if (data.triggered) {

                    await fetch(`${API}/clear-trigger`, {

                        method: 'POST'

                    });

                    initSession();

                }

            } catch(e) {}

        }

        // =========================================
        // INIT
        // =========================================

        loadSystemConfig();

        setInterval(checkRemoteTrigger, 1000);

    </script>

</body>
</html>
