<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Master Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: grid; grid-template-columns: 260px 1fr; height: 100vh; overflow: hidden; }
        #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
        .sidebar { background: var(--bg-1); border-right: 1px solid var(--border-1); display: flex; flex-direction: column; padding: 24px 16px; z-index: 10; }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; border-bottom: 1px solid var(--border-1); margin-bottom: 16px; }
        .brand-logo { width: 36px; height: 36px; background: var(--accent); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--bg-0); font-size: 16px; box-shadow: var(--accent-glow); flex-shrink: 0; }
        .brand-text h2 { font-family: var(--font-display); font-size: 13px; font-weight: 900; color: var(--accent); letter-spacing: 1px; line-height: 1.1; }
        .brand-text span { font-size: 8px; color: var(--text-3); letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); color: var(--text-2); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; }
        .nav-item i { font-size: 14px; width: 18px; text-align: center; }
        .nav-item:hover { background: var(--bg-2); color: var(--text-0); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
        .nav-badge { margin-left: auto; background: var(--accent); color: var(--bg-0); font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 10px; }
        .sidebar-status-box { margin-top: auto; background: var(--bg-2); border: 1px solid var(--border-1); border-radius: var(--radius-sm); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .status-indicator-info { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px currentColor; flex-shrink: 0; }
        .status-dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .sync-info { font-size: 9px; color: var(--text-3); font-weight: 600; letter-spacing: 0.5px; padding-top: 6px; border-top: 1px solid var(--border-1); }
        .content-area { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-0); }
        .topbar { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--border-1); background: rgba(10,10,10,0.7); backdrop-filter: blur(20px); flex-shrink: 0; }
        .topbar-title h1 { font-size: 16px; font-weight: 700; }
        .topbar-title span { font-size: 11px; color: var(--text-3); font-weight: 500; }
        .topbar-active-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 20px; font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; text-transform: uppercase; max-width: 240px; }
        .topbar-active-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .topbar-active-badge.hidden { display: none; }
        .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulseDot 1.5s ease-in-out infinite; flex-shrink: 0; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch-slider { position: absolute; cursor: pointer; inset: 0; background: var(--bg-4); transition: all 0.3s; border-radius: 30px; border: 1px solid var(--border-2); }
        .switch-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: var(--text-3); transition: all 0.3s; border-radius: 50%; }
        .switch input:checked + .switch-slider { background: var(--accent-dim); border-color: var(--accent); }
        .switch input:checked + .switch-slider:before { transform: translateX(20px); background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .view-container { flex: 1; overflow-y: auto; padding: 28px 32px; display: none; }

        @keyframes fadeInView { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .metric-card { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 20px; position: relative; overflow: hidden; transition: all 0.3s; }
        .metric-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .metric-card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); }
        .metric-card.blue::before { background: #0096ff; }
        .metric-card.yellow::before { background: var(--warn); }
        .metric-card.red::before { background: var(--danger); }
        .metric-icon { width: 34px; height: 34px; background: var(--accent-dim); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 14px; margin-bottom: 12px; }

        .metric-card.yellow .metric-icon { background: var(--warn-dim); color: var(--warn); }
        .metric-card.red .metric-icon { background: var(--danger-dim); color: var(--danger); }
        .metric-value { font-family: var(--font-display); font-size: 26px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .metric-value.small { font-size: 18px; }
        .metric-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
        .card { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border-1); display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); background: var(--bg-2); }
        .card-body { padding: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 14px; background: var(--bg-0); border: 1px solid var(--bg-4); color: var(--text-0); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 13px; outline: none; transition: all 0.3s; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border: 1px solid transparent; transition: all 0.3s; font-family: inherit; }
        .btn-primary { background: var(--accent); color: var(--bg-0); border-color: var(--accent); }
        .btn-primary:hover { box-shadow: var(--accent-glow); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--text-0); border-color: var(--border-2); }
        .btn-outline:hover { background: var(--bg-2); border-color: var(--accent); color: var(--accent); }
        .eventos-list { display: flex; flex-direction: column; gap: 10px; }
        .evento-item { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-md); padding: 14px 18px; display: flex; align-items: center; gap: 16px; transition: all 0.3s; position: relative; }
        .evento-item:hover { border-color: var(--border-2); background: var(--bg-2); }
        .evento-item.ativo { border-color: var(--accent); background: linear-gradient(90deg, var(--accent-dim) 0%, var(--bg-1) 40%); }
        .evento-item.ativo::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); box-shadow: var(--accent-glow); border-radius: 3px 0 0 3px; }
        .evento-info { flex: 1; }
        .evento-nome { font-size: 13px; font-weight: 700; color: var(--text-0); margin-bottom: 3px; }
        .evento-meta { font-size: 10px; color: var(--text-3); font-weight: 500; }
        .upload-zone { border: 2px dashed var(--bg-4); border-radius: var(--radius-md); padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--bg-0); }
        .upload-zone:hover { border-color: var(--accent); background: var(--accent-dim); }
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 5000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
