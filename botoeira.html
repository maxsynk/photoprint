<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Botoeira</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 50% 20%, rgba(0,229,255,0.05) 0%, transparent 50%), var(--bg-0); }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .brand-title { font-family: var(--font-display); font-size: clamp(28px, 8vw, 38px); font-weight: 900; color: var(--accent); text-shadow: var(--accent-glow); letter-spacing: 3px; text-transform: uppercase; }
        .subtitle { font-size: 11px; letter-spacing: 4px; color: var(--text-3); text-transform: uppercase; font-weight: 700; margin-top: 4px; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; margin: 0 auto 20px; padding: 8px 16px; background: var(--bg-1); border: 1px solid var(--border-2); border-radius: 20px; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--danger); }
        .status-badge.online { color: var(--accent); border-color: var(--accent); }
        .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; animation: pulseDot 2s infinite; }
        @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .card { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-xl); padding: 32px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); text-align: center; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 3s ease-in-out infinite; }
        @keyframes scan { 0%,100%{opacity:0.3} 50%{opacity:1} }
        .event-info { margin-bottom: 24px; }
        .event-label { font-size: 10px; color: var(--text-3); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
        .event-name { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .btn-main { width: 100%; padding: 24px; border-radius: var(--radius-lg); border: 2px solid var(--accent); background: rgba(0,229,255,0.08); color: var(--accent); font-family: var(--font-display); font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: all 0.3s; }
        .btn-main i { font-size: 32px; }
        .btn-main:hover { background: var(--accent); color: var(--bg-0); box-shadow: var(--accent-glow); }
        .btn-main:active { transform: scale(0.97); }
        .btn-main.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .btn-main.processing { background: rgba(255,204,0,0.15); border-color: var(--warn); color: var(--warn); pointer-events: none; }
        .btn-main.success { background: var(--accent); color: var(--bg-0); box-shadow: var(--accent-glow); }
        .btn-main.error { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
        .footer-info { text-align: center; font-size: 10px; color: var(--text-3); font-weight: 600; letter-spacing: 1px; margin-top: 20px; }
        .log-box { background: var(--bg-0); border: 1px solid var(--border-1); border-radius: var(--radius-md); padding: 12px; max-height: 100px; overflow-y: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-2); text-align: left; margin-top: 16px; }
        .log-line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-line.error { color: var(--danger); }
        .log-line.success { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="brand-title">PHOTO PRINT</h1>
            <p class="subtitle">Controle Botoeira</p>
        </div>
        <div style="text-align: center;">
            <div class="status-badge" id="status-badge"><span class="dot"></span><span id="status-text">Conectando...</span></div>
        </div>
        <div class="card">
            <div class="event-info"><div class="event-label">Evento Ativo</div><div class="event-name" id="event-name">—</div></div>
            <button class="btn-main disabled" id="btn-trigger" onclick="dispararCaptura()">
                <i class="fas fa-camera"></i><span id="btn-text">Aguardando Sincronização</span>
            </button>
            <div class="log-box" id="log-box"><div class="log-line">Sistema iniciado.</div></div>
        </div>
        <div class="footer-info">Pressione o botão para capturar</div>
    </div>

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        let sistemaOnline = false, eventoAtivo = false, processando = false, intervaloSync = null;
        let falhasRede = 0, leiturasOffline = 0, consultando = false, ultimoLog = '';

        function log(msg, tipo = '') {
            const box = document.getElementById('log-box'), line = document.createElement('div');
            line.className = `log-line ${tipo}`;
            line.innerText = `[${new Date().toLocaleTimeString('pt-BR')}] ${msg}`;
            box.appendChild(line); box.scrollTop = box.scrollHeight;
            if (box.children.length > 15) box.removeChild(box.firstChild);
        }

        // registra no log só quando o estado muda (evita encher o log a cada consulta)
        function logMudanca(msg, tipo = '') { if (msg !== ultimoLog) { ultimoLog = msg; log(msg, tipo); } }

        function atualizarStatusUI() {
            const badge = document.getElementById('status-badge'), text = document.getElementById('status-text');
            const btn = document.getElementById('btn-trigger'), btnText = document.getElementById('btn-text'), eventName = document.getElementById('event-name');

            badge.classList.toggle('online', sistemaOnline);
            text.innerText = sistemaOnline ? "Online" : "Offline";

            if (!sistemaOnline || !eventoAtivo) {
                btn.classList.add('disabled');
                if (!processando) btnText.innerText = "Aguardando Sincronização";
                if (!sistemaOnline) eventName.innerText = "—";
                else if (!eventoAtivo) eventName.innerText = "Nenhum evento ativo";
            } else {
                btn.classList.remove('disabled');
                if (!processando) btnText.innerText = "DISPARAR CAPTURA";
            }
        }

        // Offline SOMENTE quando o painel diz OFFLINE (2 leituras seguidas)
        // ou quando o servidor fica realmente sem resposta (4 falhas seguidas).
        async function verificarSistema() {
            if (consultando) return;           // evita requisições sobrepostas
            consultando = true;
            try {
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), 20000);   // a resposta é pesada, precisa de folga
                const res = await fetch(`${API}/get-all-states?semMoldura=1&t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal });
                clearTimeout(to);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                falhasRede = 0;
                const cfg = data.config || {};
                if (cfg.status === 'ONLINE') {
                    leiturasOffline = 0; sistemaOnline = true;
                    logMudanca('Painel ONLINE.', 'success');
                } else if (cfg.status === 'OFFLINE') {
                    leiturasOffline++;
                    if (leiturasOffline >= 2) { sistemaOnline = false; logMudanca('Painel OFFLINE.', 'error'); }
                }
                eventoAtivo = !!(cfg.evento && cfg.evento !== 'Geral');
                if (eventoAtivo) document.getElementById('event-name').innerText = cfg.evento;
            } catch (e) {
                falhasRede++;
                // servidor instável: mantém o último estado do painel (falha de rede NÃO derruba a botoeira)
                if (falhasRede >= 4) logMudanca('Servidor instável (' + e.message + '). Mantendo o último estado.', 'error');
            } finally {
                consultando = false;
            }
            atualizarStatusUI();
        }

        async function dispararCaptura() {
            if (processando || !sistemaOnline || !eventoAtivo) return;
            processando = true;
            const btn = document.getElementById('btn-trigger'), btnText = document.getElementById('btn-text');
            btn.classList.add('processing'); btnText.innerText = "Processando..."; log("Comando enviado...", "success");
            try {
                const res = await fetch(`${API}/set-state`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: 'capturing' }) });
                if (res.ok) {
                    log("Sucesso! Câmera acionada.", "success");
                    btn.classList.remove('processing'); btn.classList.add('success'); btnText.innerText = "CAPTURADO!";
                    setTimeout(() => { btn.classList.remove('success'); processando = false; btnText.innerText = "DISPARAR CAPTURA"; atualizarStatusUI(); }, 2000);
                } else throw new Error('Falha');
            } catch (e) {
                log("Erro ao enviar comando.", "error");
                btn.classList.remove('processing'); btn.classList.add('error'); btnText.innerText = "ERRO";
                setTimeout(() => { btn.classList.remove('error'); processando = false; atualizarStatusUI(); }, 2000);
            }
        }

        window.addEventListener('load', () => {
            verificarSistema();
            intervaloSync = setInterval(verificarSistema, 4000); // sincroniza a cada 4 segundos
        });

        window.addEventListener('beforeunload', () => { if (intervaloSync) clearInterval(intervaloSync); });
    </script>
</body>
</html>
