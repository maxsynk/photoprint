<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- INÍCIO DO ARQUIVO celular.html — MOBILE v4.0                       -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>PHOTO PRINT — Mobile v4.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- INÍCIO DO BLOCO DE ESTILOS (CSS)                            -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <style>
        :root {
            --neon: #39ff14;
            --neon-dim: rgba(57, 255, 20, 0.12);
            --neon-glow: 0 0 20px rgba(57, 255, 20, 0.4);
            --red: #ff3131;
            --red-dim: rgba(255, 49, 49, 0.15);
            --blue: #00e5ff;
            --blue-dim: rgba(0, 229, 255, 0.12);
            --yellow: #ffb800;
            --yellow-dim: rgba(255, 184, 0, 0.15);

            --bg-0: #000000;
            --bg-1: #0a0a0a;
            --bg-2: #111111;
            --bg-3: #1a1a1a;
            --bg-4: #222222;

            --text-0: #ffffff;
            --text-1: #e0e0e0;
            --text-2: #999999;
            --text-3: #555555;

            --border-1: rgba(255, 255, 255, 0.06);
            --border-2: rgba(255, 255, 255, 0.1);
            --border-neon: rgba(57, 255, 20, 0.3);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.15s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-0);
            color: var(--text-0);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 50% 0%, rgba(26, 58, 18, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(57, 255, 20, 0.04) 0%, transparent 40%),
                var(--bg-0);
        }

        /* Fundo dinâmico (personalizável) */
        #dynamic-bg {
            position: fixed; inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #dynamic-bg.active { opacity: 0.35; }
        #dynamic-bg::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85));
        }

        /* Grid pattern */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridMove 12s linear infinite;
            pointer-events: none;
            mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
        }
        body.bg-active::before { display: none; }
        @keyframes gridMove { from { transform: translateY(0); } to { transform: translateY(40px); } }

        /* ═══════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════ */
        .header {
            position: relative;
            z-index: 10;
            padding: 20px 24px 12px;
            border-left: 3px solid var(--neon);
            margin: 16px 20px 0;
            cursor: pointer;
        }
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(22px, 6vw, 32px);
            font-weight: 900;
            color: var(--neon);
            text-shadow: var(--neon-glow);
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1;
        }
        .subtitle {
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--text-3);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 4px;
        }

        #nome-evento-capa {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 14px;
            min-height: 20px;
        }

        #modo-guestbook {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 4px 10px;
            background: var(--blue-dim);
            border: 1px solid var(--blue);
            border-radius: 20px;
            color: var(--blue);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .modo-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        .modo-selector span {
            font-size: 10px;
            color: var(--text-3);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .modo-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--border-2);
            color: var(--text-3);
            transition: var(--transition-fast);
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }
        .modo-btn.activo {
            background: var(--neon);
            color: var(--bg-0);
            border-color: var(--neon);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.3);
        }

        /* ═══════════════════════════════════════════════════════════
           BOTÃO PRINCIPAL (OLHO)
           ═══════════════════════════════════════════════════════════ */
        .main-ui {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            padding-bottom: 60px;
        }
        .btn-eye {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid var(--neon);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: pulseNeon 2s infinite;
            position: relative;
            transition: var(--transition);
        }
        .btn-eye:active { transform: scale(0.95); }
        .btn-eye.desativado {
            opacity: 0.3;
            animation: none;
            pointer-events: none;
        }
        .eye-inner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--neon);
            box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.3);
        }
        @keyframes pulseNeon {
            0% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 24px rgba(57, 255, 20, 0); transform: scale(1.03); }
            100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0); transform: scale(1); }
        }

        /* Hint abaixo do botão */
        .btn-hint {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* ═══════════════════════════════════════════════════════════
           CÂMERA
           ═══════════════════════════════════════════════════════════ */
        #cam-container {
            position: fixed; inset: 0;
            background: #000;
            display: none;
            z-index: 1000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mirror { transform: scaleX(-1); }

        #overlay {
            position: absolute; inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        .topo-grupo {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon);
            padding: 16px 28px;
            border-radius: var(--radius-lg);
            width: 88%;
            max-width: 420px;
            pointer-events: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.15);
            text-align: center;
        }
        #info-topo {
            font-size: 11px;
            font-weight: 800;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        #num-count {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            display: block;
            text-shadow: 0 0 30px var(--neon);
        }
        #sub-count {
            font-size: 12px;
            font-weight: 700;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
            display: block;
        }

        #cam-controls {
            position: absolute;
            bottom: 32px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            width: 100%;
            padding: 0 24px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 56px;
            height: 56px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
            backdrop-filter: blur(10px);
        }
        .cam-btn:active { transform: scale(0.9); }
        .cam-btn.disabled { opacity: 0.3; pointer-events: none; }
        .cam-btn i {
            color: var(--neon);
            font-size: 20px;
        }

        .shutter-btn {
            width: 84px;
            height: 84px;
            background: #000;
            border-radius: 50%;
            border: 4px solid var(--neon);
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon);
            transition: var(--transition-fast);
        }
        .shutter-btn:active { transform: scale(0.92); }

        /* ═══════════════════════════════════════════════════════════
           FLASH / LOADER / OVERLAYS
           ═══════════════════════════════════════════════════════════ */
        #flash {
            position: fixed; inset: 0;
            background: #fff;
            display: none;
            z-index: 2000;
            pointer-events: none;
        }

        #loader {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 3000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        #loader.active { display: flex; }

        .spin {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(57, 255, 20, 0.15);
            border-top-color: var(--neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #offline-overlay {
            position: fixed; inset: 0;
            background: #000;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 30px;
        }
        #offline-overlay.active { display: flex; }
        .offline-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--red-dim);
            border: 2px solid var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 36px;
            margin-bottom: 24px;
            animation: pulseOff 1.5s ease-in-out infinite;
        }
        @keyframes pulseOff {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 49, 49, 0.5); }
            50% { box-shadow: 0 0 0 20px rgba(255, 49, 49, 0); }
        }
        .offline-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--red);
            text-shadow: 0 0 20px var(--red);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 12px;
        }
        .offline-sub {
            font-size: 12px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        #rotate-warning {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            color: var(--neon);
            padding: 30px;
            text-align: center;
        }
        #rotate-warning.active { display: flex; }
        .icon-rotate {
            width: 90px;
            height: 90px;
            margin-bottom: 24px;
            animation: rotateAnim 2s ease-in-out infinite;
        }
        @keyframes rotateAnim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }
        #rotate-warning h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        #rotate-warning p {
            font-size: 12px;
            color: var(--text-2);
            letter-spacing: 1px;
        }

        /* ═══════════════════════════════════════════════════════════
           MENU SECRETO DE FUNDO
           ═══════════════════════════════════════════════════════════ */
        #bg-menu {
            position: fixed;
            top: 90px;
            left: 20px;
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        #bg-menu.active { display: flex; }
        .bg-btn {
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-neon);
            background: rgba(0, 0, 0, 0.85);
            color: var(--text-0);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            text-align: center;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
        }
        .bg-btn:hover { background: var(--neon-dim); color: var(--neon); }
        #bg-input { display: none; }

        /* ═══════════════════════════════════════════════════════════
           TOASTS
           ═══════════════════════════════════════════════════════════ */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: calc(100% - 40px);
            max-width: 380px;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-1);
            border: 1px solid var(--border-2);
            border-left: 3px solid var(--neon);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-lg);
            pointer-events: auto;
            animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.error { border-left-color: var(--red); }
        .toast.info { border-left-color: var(--blue); }
        .toast.warning { border-left-color: var(--yellow); }
        .toast-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            background: var(--neon-dim);
            color: var(--neon);
        }
        .toast.error .toast-icon { background: var(--red-dim); color: var(--red); }
        .toast.info .toast-icon { background: var(--blue-dim); color: var(--blue); }
        .toast.warning .toast-icon { background: var(--yellow-dim); color: var(--yellow); }
        .toast-title { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
        .toast-message { font-size: 10px; color: var(--text-2); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════════════════════════
           TELA DE OPÇÕES (após captura)
           ═══════════════════════════════════════════════════════════ */
        .preview-img {
            max-height: 42vh;
            max-width: 90%;
            border: 2px solid var(--neon);
            border-radius: var(--radius-md);
            box-shadow: 0 0 30px var(--neon);
            margin-bottom: 18px;
        }
        .options-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: var(--neon);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }
        .print-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 360px;
            margin: 0 auto 16px;
        }
        .print-capsule-btn {
            background: transparent;
            border: 2px solid var(--neon);
            color: var(--text-0);
            padding: 12px 15px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
        }
        .print-capsule-btn:active { transform: scale(0.96); }
        .print-capsule-btn.color-green { border-color: var(--neon); color: var(--neon); }
        .print-capsule-btn.color-green.active { background: var(--neon); color: var(--bg-0); }
        .print-capsule-btn.color-blue { border-color: var(--blue); color: var(--blue); }
        .print-capsule-btn.color-blue.active { background: var(--blue); color: var(--bg-0); }

        .btn-send {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--neon);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--neon-glow);
            transition: var(--transition);
            margin-bottom: 8px;
        }
        .btn-send:active { transform: scale(0.94); }
        .btn-send i { color: var(--bg-0); font-size: 24px; }

        .btn-cancel {
            background: transparent;
            border: none;
            color: var(--text-3);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: underline;
            margin-top: 6px;
            cursor: pointer;
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
        }
        .btn-cancel:hover { color: var(--red); }

        /* Esconde em desktop (só mobile) */
        @media (min-width: 900px) {
            .main-ui .btn-hint { display: none; }
        }
    </style>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- FIM DO BLOCO DE ESTILOS (CSS)                               -->
    <!-- ═══════════════════════════════════════════════════════════ -->
</head>
<body>

    <div id="dynamic-bg"></div>

    <!-- Overlay offline -->
    <div id="offline-overlay">
        <div class="offline-icon"><i class="fas fa-tools"></i></div>
        <div class="offline-text">Sistema em<br>Manutenção</div>
        <div class="offline-sub">Aguarde a reativação no painel</div>
    </div>

    <!-- Aviso de rotação -->
    <div id="rotate-warning">
        <svg class="icon-rotate" viewBox="0 0 24 24" fill="var(--neon)">
            <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h2l-3.5 3.5-3.5-3.5h2c-.34-3.19-2.32-5.85-5.08-7.1l1.11-1.88M12.06 19c-1.38 0-2.61-.56-3.5-1.47l-1.41 1.41C8.36 20.15 10.09 21 12.06 21c3.97 0 7.32-2.8 8.16-6.5h-2.07c-.77 2.58-3.17 4.5-5.99 4.5M2.06 11h2c.34 3.19 2.32 5.85 5.08 7.1l-1.11 1.88C4.76 18.43 2.42 15.26 2.06 11.5M12.06 5c1.38 0 2.61.56 3.5 1.47l1.41-1.41C15.76 3.85 14.03 3 12.06 3 8.09 3 4.74 5.8 3.9 9.5h2.07C6.74 6.92 9.14 5 12.06 5Z"/>
        </svg>
        <h2>GIRE O APARELHO</h2>
        <p>Posição Horizontal necessária (Deitado)</p>
    </div>

    <!-- Flash da câmera -->
    <div id="flash"></div>

    <!-- Loader / Tela de opções -->
    <div id="loader"></div>

    <!-- Menu secreto de fundo -->
    <div id="bg-menu">
        <label class="bg-btn" for="bg-input"><i class="fas fa-image"></i> Alterar Fundo</label>
        <div class="bg-btn" onclick="removeBackground()"><i class="fas fa-times"></i> Sem Fundo</div>
    </div>
    <input type="file" id="bg-input" accept="image/*">

    <!-- Container da câmera -->
    <div id="cam-container">
        <video id="v" autoplay playsinline muted></video>
        <div id="overlay">
            <div class="topo-grupo">
                <div id="info-topo">CARREGANDO...</div>
                <span id="num-count"></span>
                <span id="sub-count">Aguardando Start</span>
            </div>
            <div id="cam-controls">
                <div class="cam-btn" id="btn-back" onclick="voltarHome()">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <div id="shutter-placeholder">
                    <div class="shutter-btn" id="btn-shutter" onclick="iniciarSequencia()"></div>
                </div>
                <div class="cam-btn" id="btn-switch" onclick="switchCam()">
                    <i class="fas fa-sync-alt"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- HEADER PRINCIPAL                                            -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="header" id="secret-logo">
        <h1 class="brand-title">PHOTO PRINT</h1>
        <div class="subtitle">colecionando momentos</div>
        <div id="nome-evento-capa">...</div>
        <div id="modo-guestbook"><i class="fas fa-book"></i> Modo Guestbook Ativo</div>
        <div class="modo-selector">
            <span><i class="fas fa-mobile-alt"></i> Modo:</span>
            <button class="modo-btn activo" id="btn-modo-manual" onclick="setModo('manual')">Manual</button>
            <button class="modo-btn" id="btn-modo-botoeira" onclick="setModo('botoeira')">Botoeira</button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- ÁREA PRINCIPAL — BOTÃO DE CAPTURA                          -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <div class="main-ui">
        <div id="main-action-btn" class="btn-eye" onclick="ligar()">
            <div class="eye-inner"></div>
            <div class="btn-hint">Toque para abrir a câmera</div>
        </div>
    </div>

    <!-- Canvas ocultos -->
    <canvas id="c-snap" style="display:none"></canvas>
    <canvas id="c-strip" style="display:none"></canvas>
    <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- INÍCIO DO BLOCO DE SCRIPTS (JavaScript)                     -->
    <!-- ═══════════════════════════════════════════════════════════ -->
    <script>
        /* ═══════════════════════════════════════════════════════
           CONFIGURAÇÕES GLOBAIS
           ═══════════════════════════════════════════════════════ */
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const LS_MODO = 'celular_modo';
        const LS_BG   = 'photoprint_bg_mobile';

        const FORMATOS = {
            "TIRINHA":  { w: 591,  h: 1819, fotos: 3, key: "TIRINHA",  exigeH: false },
            "POLAROID": { w: 1041, h: 1311, fotos: 1, key: "POLAROID", exigeH: false },
            "10X15H":   { w: 1772, h: 1228, fotos: 1, key: "10X15H",   exigeH: true  },
            "10X15V":   { w: 1181, h: 1819, fotos: 1, key: "10X15V",   exigeH: false }
        };

        /* Estado da aplicação */
        let ev = "", formatStr = "", molduraBase64 = "", eventoId = "", guestbookAtivo = false, sistemaOnline = true;
        let pics = [], stream = null, facingMode = "environment", configAtual = null, quantidadeCopias = 1;
        let modoOperacao = "manual", lastState = 'start', captureInProgress = false;
        let intervaloStatus = null, intervaloPolling = null;

        /* ═══════════════════════════════════════════════════════
           SISTEMA DE TOASTS
           ═══════════════════════════════════════════════════════ */
        function criarToastContainer() {
            if (!document.getElementById('toast-container')) {
                const c = document.createElement('div');
                c.className = 'toast-container';
                c.id = 'toast-container';
                document.body.appendChild(c);
            }
            return document.getElementById('toast-container');
        }

        function mostrarToast(titulo, mensagem, tipo = 'success') {
            const container = criarToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            const iconMap = {
                success: 'fa-check',
                error: 'fa-exclamation-triangle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation'
            };
            toast.innerHTML = `
                <div class="toast-icon"><i class="fas ${iconMap[tipo] || 'fa-check'}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${titulo}</div>
                    <div class="toast-message">${mensagem}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        /* ═══════════════════════════════════════════════════════
           MODO DE OPERAÇÃO
           ═══════════════════════════════════════════════════════ */
        function setModo(modo) {
            modoOperacao = modo;
            document.getElementById('btn-modo-manual').classList.toggle('activo', modo === 'manual');
            document.getElementById('btn-modo-botoeira').classList.toggle('activo', modo === 'botoeira');

            const btnEye = document.getElementById('main-action-btn');
            if (modo === 'botoeira') {
                btnEye.classList.add('desativado');
                iniciarPollingBotoeira();
            } else {
                btnEye.classList.remove('desativado');
                pararPollingBotoeira();
            }
            try { localStorage.setItem(LS_MODO, modo); } catch(e) {}
        }

        /* ═══════════════════════════════════════════════════════
           FUNDO PERSONALIZÁVEL + MENU SECRETO
           ═══════════════════════════════════════════════════════ */
        const dynamicBg = document.getElementById('dynamic-bg');
        const bgMenu = document.getElementById('bg-menu');
        const secretLogo = document.getElementById('secret-logo');
        let clickCount = 0, clickTimer = null;

        secretLogo.addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
            if (clickCount >= 7) {
                bgMenu.classList.toggle('active');
                clickCount = 0;
                if (bgMenu.classList.contains('active')) {
                    mostrarToast("Menu Secreto", "Alterar fundo desbloqueado.", "info");
                }
            }
        });

        /* Comprime imagem antes de salvar no localStorage (evita estouro 5MB) */
        function comprimirImagem(file, maxW = 1280, qualidade = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxW) {
                            height = Math.round(height * (maxW / width));
                            width = maxW;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', qualidade));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('bg-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const dataUrl = await comprimirImagem(file);
                dynamicBg.style.backgroundImage = `url('${dataUrl}')`;
                dynamicBg.classList.add('active');
                document.body.classList.add('bg-active');
                try { localStorage.setItem(LS_BG, dataUrl); } catch(err) {
                    mostrarToast("Aviso", "Imagem grande demais para salvar permanentemente.", "warning");
                }
                bgMenu.classList.remove('active');
                mostrarToast("Fundo Atualizado", "Nova imagem aplicada.", "success");
            } catch (err) {
                mostrarToast("Erro", "Não foi possível processar a imagem.", "error");
            }
        });

        function removeBackground() {
            try { localStorage.removeItem(LS_BG); } catch(e) {}
            dynamicBg.style.backgroundImage = "";
            dynamicBg.classList.remove('active');
            document.body.classList.remove('bg-active');
            bgMenu.classList.remove('active');
            mostrarToast("Fundo Removido", "Voltamos ao padrão.", "info");
        }

        function loadSavedBackground() {
            try {
                const saved = localStorage.getItem(LS_BG);
                if (saved) {
                    dynamicBg.style.backgroundImage = `url('${saved}')`;
                    dynamicBg.classList.add('active');
                    document.body.classList.add('bg-active');
                }
            } catch(e) {}
        }

        /* ═══════════════════════════════════════════════════════
           STATUS ONLINE / OFFLINE
           ═══════════════════════════════════════════════════════ */
        function mostrarOffline() {
            document.getElementById('offline-overlay').classList.add('active');
        }
        function esconderOffline() {
            document.getElementById('offline-overlay').classList.remove('active');
        }

        async function verificarStatus() {
            try {
                const res = await fetch(`${API}/get-all-states?t=${Date.now()}`);
                if (!res || !res.ok) {
                    sistemaOnline = false;
                    mostrarOffline();
                    return null;
                }
                const texto = await res.text();
                let data;
                try { data = JSON.parse(texto); }
                catch(e) {
                    sistemaOnline = false;
                    mostrarOffline();
                    return null;
                }

                const status = (data.config && data.config.status) ? data.config.status : 'OFFLINE';
                if (status === 'OFFLINE') {
                    sistemaOnline = false;
                    mostrarOffline();
                } else {
                    sistemaOnline = true;
                    esconderOffline();
                }
                return data;
            } catch (e) {
                sistemaOnline = false;
                mostrarOffline();
                return null;
            }
        }

        /* ═══════════════════════════════════════════════════════
           SINCRONIZAÇÃO DE CONFIG
           ═══════════════════════════════════════════════════════ */
        async function sync() {
            const data = await verificarStatus();
            if (!data || !sistemaOnline) return;

            if (data.config && data.config.evento && data.config.evento !== 'Geral') {
                ev = data.config.evento;
                formatStr = data.config.formato || 'POLAROID';
                eventoId = data.config.eventoId;
                guestbookAtivo = (data.config.livro === true || data.config.livro === 1);
                molduraBase64 = data.moldura || '';
            } else {
                ev = "Geral";
                formatStr = "POLAROID";
                eventoId = "";
                molduraBase64 = "";
                guestbookAtivo = false;
            }

            document.getElementById('nome-evento-capa').innerText = ev || "—";
            document.getElementById('modo-guestbook').style.display = guestbookAtivo ? 'inline-flex' : 'none';

            configAtual = FORMATOS[formatStr.toUpperCase()] || FORMATOS["POLAROID"];
        }

        /* ═══════════════════════════════════════════════════════
           POLLING DO ESTADO (APENAS MODO BOTOEIRA)
           ═══════════════════════════════════════════════════════ */
        function iniciarPollingBotoeira() {
            if (intervaloPolling) return;
            intervaloPolling = setInterval(pollServerState, 800);
        }
        function pararPollingBotoeira() {
            if (intervaloPolling) {
                clearInterval(intervaloPolling);
                intervaloPolling = null;
            }
        }

        async function pollServerState() {
            if (modoOperacao !== 'botoeira') return;
            if (captureInProgress) return;
            try {
                const res = await fetch(`${API}/get-state?t=${Date.now()}`);
                if (!res || !res.ok) return;
                const d = await res.json();
                if (d.state && d.state !== lastState) {
                    lastState = d.state;
                    if (d.state === 'capturing' && !captureInProgress) {
                        if (!molduraBase64) {
                            mostrarToast("Moldura ausente", "Configure a moldura no painel.", "warning");
                            return;
                        }
                        document.getElementById('cam-container').style.display = "block";
                        document.getElementById('info-topo').innerText = `${ev} | ${configAtual.key}`;
                        checkOrientation();
                        await startStream();
                        iniciarSequenciaAuto();
                    }
                }
            } catch(e) {}
        }

        async function iniciarSequenciaAuto() {
            captureInProgress = true;
            document.getElementById('shutter-placeholder').style.visibility = "hidden";
            document.getElementById('btn-switch').classList.add('disabled');
            pics = [];
            try {
                for (let n = 1; n <= configAtual.fotos; n++) {
                    document.getElementById('sub-count').innerText = `FOTO ${n} DE ${configAtual.fotos}`;
                    for (let i = 5; i > 0; i--) {
                        document.getElementById('num-count').innerText = i;
                        await new Promise(r => setTimeout(r, 1000));
                    }
                    document.getElementById('num-count').innerText = "SORRIA!";
                    snap();
                    await new Promise(r => setTimeout(r, 1500));
                }
                processarAuto();
            } catch(e) {
                captureInProgress = false;
                resetarBotoesCamera();
                voltarHome();
            }
        }

        function processarAuto() {
            voltarHome();
            mostrarLoader('Processando imagem...');
            const cv = document.getElementById('c-strip'), ctx = cv.getContext('2d');
            const molduraImg = new Image();
            molduraImg.onload = () => {
                cv.width = configAtual.w;
                cv.height = configAtual.h;
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, cv.width, cv.height);

                if (configAtual.key === "TIRINHA") {
                    const slots = [{y:0.030, h:0.254}, {y:0.296, h:0.254}, {y:0.559, h:0.254}];
                    let count = 0;
                    pics.forEach((src, i) => {
                        const img = new Image();
                        img.onload = () => {
                            const s = slots[i];
                            const dx = cv.width * 0.06, dw = cv.width * 0.88;
                            const dy = cv.height * s.y, dh = cv.height * s.h;
                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(dx, dy, dw, dh);
                            ctx.clip();
                            const r = Math.max(dw/img.width, dh/img.height);
                            ctx.drawImage(img, dx+(dw-img.width*r)/2, dy+(dh-img.height*r)/2, img.width*r, img.height*r);
                            ctx.restore();
                            count++;
                            if (count === 3) {
                                ctx.drawImage(molduraImg, 0, 0, cv.width, cv.height);
                                enviarAuto(cv.toDataURL('image/jpeg', 0.95));
                            }
                        };
                        img.src = src;
                    });
                } else {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.max(cv.width/img.width, cv.height/img.height);
                        const w = img.width * scale, h = img.height * scale;
                        ctx.drawImage(img, (cv.width-w)/2, (cv.height-h)/2, w, h);
                        ctx.drawImage(molduraImg, 0, 0, cv.width, cv.height);
                        enviarAuto(cv.toDataURL('image/jpeg', 0.95));
                    };
                    img.src = pics[0];
                }
            };
            molduraImg.onerror = () => {
                mostrarToast("Erro", "Falha ao carregar moldura.", "error");
                captureInProgress = false;
                resetarBotoesCamera();
                voltarHome();
                fecharLoader();
            };
            molduraImg.src = molduraBase64;
        }

        async function enviarAuto(dataUrl) {
            mostrarLoader('Enviando...');
            const blob = await fetch(dataUrl).then(r => r.blob());
            const ts = Date.now();
            const nome = `foto_${ts}_1c.jpg`;
            const fd = new FormData();
            fd.append('foto', blob, nome);
            fd.append('eventoId', eventoId);
            fd.append('timestamp', String(ts) + '_1c');
            fd.append('copias', '1');
            try {
                await fetch(`${API}/salvar-foto`, { method: 'POST', body: fd });
                await fetch(`${API}/set-state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state: 'options' })
                });
                mostrarToast("Enviado", "Foto enviada com sucesso!", "success");
                captureInProgress = false;
                resetarBotoesCamera();
                fecharLoader();
                setTimeout(() => voltarHome(), 300);
            } catch(e) {
                mostrarToast("Erro no envio", "Verifique a conexão.", "error");
                captureInProgress = false;
                resetarBotoesCamera();
                fecharLoader();
                voltarHome();
            }
        }

        /* ═══════════════════════════════════════════════════════
           ORIENTAÇÃO
           ═══════════════════════════════════════════════════════ */
        function checkOrientation() {
            if (!configAtual || !configAtual.exigeH) {
                document.getElementById('rotate-warning').classList.remove('active');
                return;
            }
            const vertical = window.innerWidth <= window.innerHeight;
            document.getElementById('rotate-warning').classList.toggle('active', vertical);
        }
        window.addEventListener("resize", checkOrientation);

        /* ═══════════════════════════════════════════════════════
           CÂMERA — START / SWITCH / STOP
           ═══════════════════════════════════════════════════════ */
        async function startStream() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                const video = document.getElementById('v');
                video.srcObject = stream;
                video.className = (facingMode === "user") ? "mirror" : "";
            } catch (e) {
                if (e.name === 'NotAllowedError') {
                    mostrarToast("Permissão negada", "Autorize o acesso à câmera nas configurações.", "error");
                } else if (e.name === 'NotFoundError') {
                    mostrarToast("Sem câmera", "Nenhuma câmera encontrada no dispositivo.", "error");
                } else {
                    mostrarToast("Erro de câmera", "Não foi possível iniciar a captura.", "error");
                }
                throw e;
            }
        }

        async function switchCam() {
            if (captureInProgress) return;
            facingMode = (facingMode === "user") ? "environment" : "user";
            try { await startStream(); }
            catch(e) { /* toast já mostrado */ }
        }

        /* ═══════════════════════════════════════════════════════
           LIGAR CÂMERA (MODO MANUAL)
           ═══════════════════════════════════════════════════════ */
        async function ligar() {
            if (!sistemaOnline) {
                mostrarToast("Sistema offline", "Aguarde a reativação no painel.", "warning");
                return;
            }
            if (modoOperacao === 'botoeira') return;
            if (!molduraBase64) {
                mostrarToast("Moldura ausente", "Configure a moldura no painel de controle.", "warning");
                return;
            }
            document.getElementById('cam-container').style.display = "block";
            document.getElementById('info-topo').innerText = `${ev} | ${configAtual.key}`;
            document.getElementById('num-count').innerText = "";
            document.getElementById('sub-count').innerText = "TOQUE NO DISPARADOR";
            checkOrientation();
            try { await startStream(); }
            catch(e) { voltarHome(); }
        }

        function voltarHome() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            document.getElementById('cam-container').style.display = "none";
            document.getElementById('rotate-warning').classList.remove('active');
            document.getElementById('shutter-placeholder').style.visibility = "visible";
            resetarBotoesCamera();
        }

        function resetarBotoesCamera() {
            document.getElementById('btn-switch').classList.remove('disabled');
        }

        /* ═══════════════════════════════════════════════════════
           SEQUÊNCIA MANUAL + SNAP
           ═══════════════════════════════════════════════════════ */
        async function iniciarSequencia() {
            if (captureInProgress) return;
            if (configAtual.exigeH && window.innerWidth <= window.innerHeight) {
                mostrarToast("Gire o aparelho", "Posição horizontal necessária.", "warning");
                return;
            }
            captureInProgress = true;
            document.getElementById('shutter-placeholder').style.visibility = "hidden";
            document.getElementById('btn-switch').classList.add('disabled');
            pics = [];

            try {
                for (let n = 1; n <= configAtual.fotos; n++) {
                    document.getElementById('sub-count').innerText = `FOTO ${n} DE ${configAtual.fotos}`;
                    for (let i = 5; i > 0; i--) {
                        document.getElementById('num-count').innerText = i;
                        await new Promise(r => setTimeout(r, 1000));
                    }
                    document.getElementById('num-count').innerText = "SORRIA!";
                    snap();
                    await new Promise(r => setTimeout(r, 1500));
                }
                captureInProgress = false;
                processar();
            } catch(e) {
                captureInProgress = false;
                resetarBotoesCamera();
                voltarHome();
            }
        }

        function snap() {
            const v = document.getElementById('v');
            if (!v.videoWidth || !v.videoHeight) {
                mostrarToast("Câmera iniciando", "Aguarde a câmera estabilizar.", "warning");
                return;
            }
            document.getElementById('flash').style.display = "block";
            setTimeout(() => document.getElementById('flash').style.display = "none", 120);

            const cv = document.getElementById('c-snap');
            const ctx = cv.getContext('2d');
            cv.width = v.videoWidth;
            cv.height = v.videoHeight;
            if (facingMode === "user") {
                ctx.translate(cv.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(v, 0, 0);
            pics.push(cv.toDataURL('image/jpeg', 0.92));
        }

        /* ═══════════════════════════════════════════════════════
           PROCESSAMENTO MANUAL
           ═══════════════════════════════════════════════════════ */
        function processar() {
            voltarHome();
            mostrarLoader('Processando imagem...');
            const cv = document.getElementById('c-strip'), ctx = cv.getContext('2d');
            const molduraImg = new Image();
            molduraImg.onload = () => {
                cv.width = configAtual.w;
                cv.height = configAtual.h;
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, cv.width, cv.height);

                if (configAtual.key === "TIRINHA") {
                    const slots = [{y:0.030, h:0.254}, {y:0.296, h:0.254}, {y:0.559, h:0.254}];
                    let count = 0;
                    pics.forEach((src, i) => {
                        const img = new Image();
                        img.onload = () => {
                            const s = slots[i];
                            const dx = cv.width * 0.06, dw = cv.width * 0.88;
                            const dy = cv.height * s.y, dh = cv.height * s.h;
                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(dx, dy, dw, dh);
                            ctx.clip();
                            const r = Math.max(dw/img.width, dh/img.height);
                            ctx.drawImage(img, dx+(dw-img.width*r)/2, dy+(dh-img.height*r)/2, img.width*r, img.height*r);
                            ctx.restore();
                            count++;
                            if (count === 3) {
                                ctx.drawImage(molduraImg, 0, 0, cv.width, cv.height);
                                exibir(cv.toDataURL('image/jpeg', 0.95));
                            }
                        };
                        img.src = src;
                    });
                } else {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.max(cv.width/img.width, cv.height/img.height);
                        const w = img.width * scale, h = img.height * scale;
                        ctx.drawImage(img, (cv.width-w)/2, (cv.height-h)/2, w, h);
                        ctx.drawImage(molduraImg, 0, 0, cv.width, cv.height);
                        exibir(cv.toDataURL('image/jpeg', 0.95));
                    };
                    img.src = pics[0];
                }
            };
            molduraImg.onerror = () => {
                mostrarToast("Erro", "Falha ao carregar moldura.", "error");
                fecharLoader();
            };
            molduraImg.src = molduraBase64;
        }

        /* ═══════════════════════════════════════════════════════
           LOADER / OPÇÕES DE IMPRESSÃO
           ═══════════════════════════════════════════════════════ */
        function mostrarLoader(texto = 'Processando...') {
            const loader = document.getElementById('loader');
            loader.innerHTML = `<div class="spin"></div><p style="color:var(--neon); margin-top:20px; font-weight:700; letter-spacing:2px; text-transform:uppercase; font-size:12px;">${texto}</p>`;
            loader.classList.add('active');
        }
        function fecharLoader() {
            document.getElementById('loader').classList.remove('active');
            document.getElementById('loader').innerHTML = '';
        }

        function getCopiasFisicas(o) {
            if (o === 1) return 1;
            if (o === 2) return 2;
            if (o === 3) return 2;
            if (o === 4) return 3;
            return 1;
        }

        function alterarCopias(qtd) {
            quantidadeCopias = qtd;
            document.querySelectorAll('.print-capsule-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-opt-' + qtd);
            if (btn) btn.classList.add('active');
        }

        function exibir(url) {
            quantidadeCopias = 1;
            const botoesGuestbook = guestbookAtivo ? `
                <button id="btn-opt-3" class="print-capsule-btn color-blue" onclick="alterarCopias(3)">
                    <i class="fas fa-book"></i> 1 + Guestbook
                </button>
                <button id="btn-opt-4" class="print-capsule-btn color-blue" onclick="alterarCopias(4)">
                    <i class="fas fa-book"></i> 2 + Guestbook
                </button>` : '';

            const loader = document.getElementById('loader');
            loader.innerHTML = `
                <img src="${url}" class="preview-img" alt="Preview">
                <div class="options-title">Quantas cópias deseja imprimir?</div>
                <div class="print-grid">
                    <button id="btn-opt-1" class="print-capsule-btn color-green active" onclick="alterarCopias(1)">
                        <i class="fas fa-print"></i> 1 Cópia
                    </button>
                    <button id="btn-opt-2" class="print-capsule-btn color-green" onclick="alterarCopias(2)">
                        <i class="fas fa-print"></i> 2 Cópias
                    </button>
                    ${botoesGuestbook}
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <button class="btn-send" onclick="enviar()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                    <span style="font-size:11px; color:var(--neon); font-weight:800; letter-spacing:1px; text-transform:uppercase; margin-bottom:10px;">
                        Enviar e Imprimir
                    </span>
                    <button class="btn-cancel" onclick="cancelarCaptura()">Cancelar</button>
                </div>
            `;
            loader.classList.add('active');
        }

        function cancelarCaptura() {
            fecharLoader();
            pic = [];
            voltarHome();
        }

        /* ═══════════════════════════════════════════════════════
           ENVIO FINAL
           ═══════════════════════════════════════════════════════ */
        async function enviar() {
            mostrarLoader('Enviando...');
            const cv = document.getElementById('c-strip');
            cv.toBlob(async (b) => {
                const copiasFisicas = getCopiasFisicas(quantidadeCopias);
                const ts = Date.now();
                const temGuestbook = (quantidadeCopias === 3 || quantidadeCopias === 4);
                const sufixo = temGuestbook ? '_guestbook' : '';
                const nome = `foto_${ts}_${copiasFisicas}c${sufixo}.jpg`;
                const fd = new FormData();
                fd.append('foto', b, nome);
                fd.append('eventoId', eventoId);
                fd.append('timestamp', String(ts) + '_' + copiasFisicas + 'c' + sufixo);
                fd.append('copias', String(copiasFisicas));

                try {
                    const res = await fetch(`${API}/salvar-foto`, { method: 'POST', body: fd });
                    if (res.ok) {
                        mostrarToast("Enviado", "Foto enviada com sucesso!", "success");
                        fecharLoader();
                        setTimeout(() => {
                            document.getElementById('sub-count').innerText = "AGUARDANDO START";
                            document.getElementById('num-count').innerText = "";
                        }, 400);
                    } else {
                        mostrarToast("Erro no envio", "Servidor rejeitou o arquivo.", "error");
                        fecharLoader();
                    }
                } catch (e) {
                    mostrarToast("Erro no envio", "Verifique a conexão.", "error");
                    fecharLoader();
                }
            }, 'image/jpeg', 0.95);
        }

        /* ═══════════════════════════════════════════════════════
           INICIALIZAÇÃO + CLEANUP
           ═══════════════════════════════════════════════════════ */
        function initApp() {
            loadSavedBackground();

            const savedModo = localStorage.getItem(LS_MODO) || 'manual';
            setModo(savedModo);

            sync();
            intervaloStatus = setInterval(sync, 10000);
        }

        window.addEventListener('load', initApp);
        window.addEventListener('beforeunload', () => {
            if (intervaloStatus) clearInterval(intervaloStatus);
            if (intervaloPolling) clearInterval(intervaloPolling);
            if (stream) stream.getTracks().forEach(t => t.stop());
        });

        /* Re-sync quando a aba volta ao foco */
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) sync();
        });
    </script>
