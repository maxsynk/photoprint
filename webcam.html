<!DOCTYPE html>
<html>
<body>
    <video id="video" autoplay playsinline style="display:none"></video>
    <canvas id="canvas" style="display:none"></canvas>
    <div id="display-area"></div>
    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        
        async function processFrame() {
            const res = await fetch(`${API}/get-all-states`);
            const data = await res.json();
            
            // Se estado for 'capturing' e trigger=true, tira a foto
            if (data.app.state === 'capturing' && data.trigger.triggered) {
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                // Desenha a moldura (deve estar carregada em um objeto Image)
                // ctx.drawImage(molduraImg, 0, 0); 
                
                const imageData = canvas.toDataURL('image/jpeg');
                // Envia para o servidor e seta photo-ready
                await fetch(`${API}/photo-ready`, { method: 'POST' });
                await fetch(`${API}/clear-trigger`, { method: 'POST' });
            }
        }
        setInterval(processFrame, 1000);
    </script>
</body>
</html>
