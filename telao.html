<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Telão Slideshow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest-telao.json">
<meta name="theme-color" content="#dc2626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Telão">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-telao-192.png">
    <style>
        html, body { overflow: hidden; }
        body { background: radial-gradient(circle at 50% -20%, rgba(0,229,255,0.06) 0%, transparent 60%), var(--bg-0); }
        
        header { position: absolute; top: 40px; left: 48px; z-index: 100; display: flex; flex-direction: column; align-items: flex-start; border-left: 4px solid var(--accent); padding-left: 18px; animation: fadeInLeft 0.8s ease-out; }
        @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .brand-box h1 { font-family: var(--font-display); margin: 0; font-size: 32px; color: var(--accent); font-weight: 900; letter-spacing: 5px; text-transform: uppercase; text-shadow: var(--accent-glow); line-height: 1; }
        .brand-box p { margin: 8px 0 0; font-size: 10px; color: var(--text-3); letter-spacing: 4px; font-weight: 700; text-transform: uppercase; }

        #display { width: 100vw; height: calc(100vh - 140px); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .slide-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.5s ease-in-out; z-index: 1; }
        .slide-container.active { opacity: 1; z-index: 2; }
        .slide-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: blur(50px) brightness(0.3) saturate(1.3); transform: scale(1.15); z-index: 1; }
        .slide-main { position: relative; max-width: 92%; max-height: 92%; object-fit: contain; z-index: 2; box-shadow: 0 0 100px rgba(0,0,0,0.9), 0 0 40px rgba(0,229,255,0.15); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; animation: zoomIn 1.5s ease-out; }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0.8; } to { transform: scale(1); opacity: 1; } }

        #waiting-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; }
        .spinner { width: 60px; height: 60px; border: 3px solid rgba(0,229,255,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 28px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .waiting-title { font-family: var(--font-display); font-size: clamp(20px, 3vw, 32px); font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 8px; text-shadow: var(--accent-glow); margin-bottom: 12px; }
        .waiting-sub { font-size: 12px; color: var(--text-3); letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }

        #sponsor-bar { width: 100vw; height: 140px; background: rgba(0,0,0,0.85); border-top: 1px solid var(--accent); position: absolute; bottom: 0; display: flex; align-items: center; justify-content: space-around; padding: 20px 80px; z-index: 200; backdrop-filter: blur(15px); }
        .sponsor-label { position: absolute; top: 12px; left: 40px; font-size: 9px; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; opacity: 0.6; }
        #logos-container { display: flex; align-items: center; justify-content: space-around; width: 100%; gap: 40px; }
        .sponsor-logo { max-height: 80px; max-width: calc(100% / 5 - 40px); object-fit: contain; filter: brightness(0.9); transition: all 0.3s; }
        .sponsor-logo:hover { filter: brightness(1.2); transform: scale(1.05); }
        .config-trigger { position: absolute; top: 16px; right: 20px; width: 28px; height: 28px; border: 1px solid rgba(0,229,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 12px; cursor: pointer; opacity: 0.25; }
        .config-trigger:hover { opacity: 1; background: var(--accent-dim); }

        .status-dot-top { position: absolute; top: 48px; right: 48px; display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: rgba(0,0,0,0.7); border: 1px solid var(--border-1); border-radius: 24px; backdrop-filter: blur(10px); z-index: 100; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-3); }
        .status-dot-top .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulseDot 2s infinite; }
        .status-dot-top.online { color: var(--accent); border-color: var(--accent); }
        .status-dot-top.online .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
    </style>
</head>
<body>
    <input type="file" id="logo-upload" multiple accept="image/*" style="display:none">
    <header>
        <div class="brand-box"><h1>PHOTO PRINT</h1><p>Colecionando Momentos</p></div>
    </header>
    <div class="status-dot-top" id="status-indicator"><span class="dot"></span><span id="status-text">Conectando...</span></div>
    
    <div id="display">
        <div id="waiting-msg">
            <div class="spinner"></div>
            <div class="waiting-title">Sincronizando</div>
            <div class="waiting-sub" id="waiting-sub">Conectando ao servidor...</div>
        </div>
    </div>

    <div id="sponsor-bar">
        <span class="sponsor-label">Parceiros Oficiais</span>
        <div class="config-trigger" onclick="document.getElementById('logo-upload').click()" title="Configurar logos"><i class="fas fa-cog"></i></div>
        <div id="logos-container"></div>
    </div>

    <script>
        const API_URL = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const INTERVALO_SLIDE = 8000, INTERVALO_SYNC = 10000;
        let eventoAtivo = "", fotos = [], currentIndex = 0, slideInterval = null, syncInterval = null, estadoAtual = 'aguardando', fotosComErro = new Set();
        const containerLogos = document.getElementById('logos-container'), fileInput = document.getElementById('logo-upload');

        fileInput.addEventListener('change', async function() {
            const files = Array.from(this.files).slice(0, 5); containerLogos.innerHTML = ""; const logosData = [];
            for (const file of files) {
                try { const base64 = await comprimirImagem(file, 400, 0.85); renderLogo(base64); logosData.push(base64); } catch (err) {}
            }
            try { localStorage.setItem('pp_logos', JSON.stringify(logosData)); } catch (err) {}
            this.value = '';
        });

        function comprimirImagem(file, maxW = 400) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxW) { height = Math.round(height * (maxW / width)); width = maxW; }
                        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = reject; img.src = e.target.result;
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        function renderLogo(src) { const img = document.createElement('img'); img.src = src; img.className = 'sponsor-logo'; containerLogos.appendChild(img); }

        async function sync() {
            try {
                const resStatus = await fetch(`${API_URL}/status?t=${Date.now()}`), dataStatus = await resStatus.json();
                if (!dataStatus.evento || dataStatus.evento === 'Geral') {
                    eventoAtivo = ""; atualizarStatusIndicator(false); mostrarAviso('aguardando', 'Aguardando Evento Ativo', 'Inicie um evento no painel'); pararSlides(); return;
                }
                if (dataStatus.evento !== eventoAtivo) { eventoAtivo = dataStatus.evento; fotos = []; currentIndex = 0; fotosComErro.clear(); pararSlides(); }
                atualizarStatusIndicator(true);
                const resFotos = await fetch(`${API_URL}/list-photos?evento=${encodeURIComponent(eventoAtivo)}&t=${Date.now()}`), novasFotos = await resFotos.json();
                if (Array.isArray(novasFotos) && novasFotos.length > 0) {
                    const invertidas = novasFotos.reverse();
                    if (JSON.stringify(invertidas.map(f => f.key)) !== JSON.stringify(fotos.map(f => f.key))) { fotos = invertidas; if (!slideInterval) iniciarSlides(); }
                } else { mostrarAviso('aguardando', 'Evento sem Fotos', 'As fotos aparecerão aqui'); pararSlides(); }
            } catch (e) { atualizarStatusIndicator(false); }
        }

        function atualizarStatusIndicator(online) {
            document.getElementById('status-indicator').classList.toggle('online', online);
            document.getElementById('status-text').innerText = online ? 'Ao Vivo' : 'Offline';
        }

        function mostrarAviso(estado, titulo, subtitulo) {
            if (estadoAtual === estado && document.getElementById('waiting-msg')?.style.display !== 'none') { document.getElementById('waiting-sub').innerText = subtitulo; return; }
            estadoAtual = estado;
            const display = document.getElementById('display'), antigo = document.getElementById('waiting-msg'); if (antigo) antigo.remove();
            display.querySelectorAll('.slide-container').forEach(s => s.remove());
            const msg = document.createElement('div'); msg.id = 'waiting-msg';
            msg.innerHTML = `${estado === 'aguardando' ? '<div class="spinner"></div>' : ''}<div class="waiting-title">${titulo}</div><div class="waiting-sub">${subtitulo}</div>`;
            display.appendChild(msg);
        }

        function iniciarSlides() { document.querySelectorAll('#waiting-msg').forEach(el => el.remove()); estadoAtual = 'exibindo'; currentIndex = 0; renderNextSlide(); if (slideInterval) clearInterval(slideInterval); slideInterval = setInterval(renderNextSlide, INTERVALO_SLIDE); }
        function pararSlides() { if (slideInterval) { clearInterval(slideInterval); slideInterval = null; } document.getElementById('display').querySelectorAll('.slide-container').forEach(s => s.remove()); }

        function renderNextSlide() {
            if (fotos.length === 0) return;
            let tentativas = 0;
            while (fotosComErro.has(fotos[currentIndex].key) && tentativas < fotos.length) { currentIndex = (currentIndex + 1) % fotos.length; tentativas++; }
            const urlFinal = `${API_URL}/photo?key=${encodeURIComponent(fotos[currentIndex].key)}&t=${Date.now()}`;
            const display = document.getElementById('display'), slideContainer = document.createElement('div');
            slideContainer.className = 'slide-container';
            const imgMain = new Image(); imgMain.className = 'slide-main'; const imgBg = new Image(); imgBg.className = 'slide-bg';
            imgMain.onload = () => {
                const oldSlides = display.querySelectorAll('.slide-container'); imgBg.src = imgMain.src;
                slideContainer.appendChild(imgBg); slideContainer.appendChild(imgMain); display.appendChild(slideContainer);
                requestAnimationFrame(() => slideContainer.classList.add('active'));
                if (oldSlides.length > 0) setTimeout(() => oldSlides.forEach(s => s.remove()), 1600);
                currentIndex = (currentIndex + 1) % fotos.length;
            };
            imgMain.onerror = () => { fotosComErro.add(fotos[currentIndex].key); currentIndex = (currentIndex + 1) % fotos.length; setTimeout(() => renderNextSlide(), 1000); };
            imgMain.src = urlFinal;
        }

        window.addEventListener('load', () => {
            try { const saved = JSON.parse(localStorage.getItem('pp_logos') || "[]"); saved.forEach(src => renderLogo(src)); } catch (e) {}
            sync(); syncInterval = setInterval(sync, INTERVALO_SYNC);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
        });
        window.addEventListener('beforeunload', () => { if (slideInterval) clearInterval(slideInterval); if (syncInterval) clearInterval(syncInterval); });
    </script>
    <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
