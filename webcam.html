<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>WEBCAM - PHOTO PRINT v4.1</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {

            --neon: #39ff14;
            --dark: #050505;
            --danger: #ff3131;

        }

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;
            background: var(--dark);
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

        }

        #cam-preview {

            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            display: none;

            z-index: 1;

        }

        .screen {

            position: fixed;
            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            z-index: 20;

        }

        #loader {

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.92);

            z-index: 999;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            color: var(--neon);

            font-size: 28px;
            font-weight: bold;

            text-shadow: 0 0 20px var(--neon);

        }

        #final-preview-container {

            z-index: 150;

            background: #000;

            display: none;

        }

        #img-review {

            max-width: 80%;

            border: 5px solid var(--neon);

            box-shadow: 0 0 35px rgba(57,255,20,0.8);

            border-radius: 25px;

        }

        /* =========================================
           BOTÃO INICIAL
        ========================================= */

        .btn-start {

            position: relative;

            width: 560px;
            height: 560px;

            border-radius: 50%;

            border: 5px solid var(--neon);

            background:
                radial-gradient(circle at center,
                rgba(57,255,20,0.20),
                rgba(0,0,0,0.96));

            cursor: pointer;

            overflow: hidden;

            transition: 0.3s;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 40px;

            box-shadow:
                0 0 40px rgba(57,255,20,0.8),
                inset 0 0 60px rgba(57,255,20,0.25);

        }

        .btn-start:hover {

            transform: scale(1.04);

            box-shadow:
                0 0 80px rgba(57,255,20,1),
                inset 0 0 90px rgba(57,255,20,0.45);

        }

        /* GLOW MAIS FORTE */

        .btn-start::before {

            content: '';

            position: absolute;

            width: 260%;
            height: 260%;

            background: conic-gradient(
                transparent,
                rgba(57,255,20,1),
                rgba(57,255,20,0.4),
                transparent
            );

            animation: rotateGlow 2.5s linear infinite;

            filter: blur(25px);

            opacity: 1;

        }

        .btn-start::after {

            content: '';

            position: absolute;

            inset: 10px;

            border-radius: 50%;

            background: rgba(0,0,0,0.93);

            box-shadow:
                inset 0 0 60px rgba(57,255,20,0.18);

        }

        @keyframes rotateGlow {

            100% {

                transform: rotate(360deg);

            }

        }

        .start-content {

            position: relative;

            z-index: 5;

            text-align: center;

            width: 100%;

        }

        .start-title {

            color: var(--neon);

            font-size: 42px;

            font-weight: 900;

            text-shadow:
                0 0 15px var(--neon),
                0 0 35px var(--neon);

            margin-bottom: 18px;

            text-transform: uppercase;

        }

        .start-subtitle {

            font-size: 23px;

            line-height: 1.6;

        }

        .start-subtitle span {

            color: var(--neon);

            font-weight: bold;

            text-shadow: 0 0 15px var(--neon);

        }

        /* =========================================
           OVERLAY CAMERA
        ========================================= */

        #camera-overlay {

            position: fixed;
            inset: 0;

            z-index: 50;

            pointer-events: none;

            display: none;

        }

        .camera-info {

            position: absolute;

            top: 40px;
            left: 40px;

            display: flex;

            align-items: flex-start;

            gap: 18px;

        }

        .camera-line {

            width: 6px;

            height: 160px;

            background: var(--neon);

            box-shadow: 0 0 20px var(--neon);

            border-radius: 50px;

        }

        .camera-text {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .camera-system {

            color: var(--neon);

            font-size: 36px;

            font-weight: bold;

            text-shadow: 0 0 15px var(--neon);

        }

        .camera-event {

            font-size: 24px;

            font-weight: bold;

            text-transform: uppercase;

        }

        .camera-type {

            font-size: 18px;

            opacity: 0.8;

            letter-spacing: 2px;

        }

        /* =========================================
           CONTADOR
        ========================================= */

        #countdown-container {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            z-index: 80;

            background: rgba(0,0,0,0.18);

        }

        #prepare-text {

            font-family: 'Orbitron', sans-serif;

            color: var(--neon);

            font-size: 76px;

            font-weight: 900;

            letter-spacing: 8px;

            text-shadow:
                0 0 15px var(--neon),
                0 0 35px var(--neon),
                0 0 60px var(--neon);

            animation: preparePulse 0.8s infinite alternate;

        }

        @keyframes preparePulse {

            from {

                transform: scale(1);
                opacity: 0.7;

            }

            to {

                transform: scale(1.08);
                opacity: 1;

            }

        }

        #countdown {

            display: none;

            color: white;

            font-size: 220px;

            font-weight: bold;

            text-shadow:
                0 0 20px var(--neon),
                0 0 40px var(--neon);

            animation: countdownPulse 1s infinite;

        }

        @keyframes countdownPulse {

            0% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.15);

            }

            100% {

                transform: scale(1);

            }

        }

        /* =========================================
           PREVIEW FINAL
        ========================================= */

        #botoeira-controls {

            margin-top: 25px;

            color: var(--neon);

            font-size: 28px;

            font-weight: bold;

            text-align: center;

            animation: pulseText 1.5s infinite alternate;

        }

        @keyframes pulseText {

            from {

                opacity: 0.6;
                text-shadow: 0 0 5px var(--neon);

            }

            to {

                opacity: 1;
                text-shadow: 0 0 20px var(--neon);

            }

        }

    </style>

</head>

<body>

    <!-- LOADER -->

    <div id="loader">

        <div>PROCESSANDO...</div>

    </div>

    <!-- CAMERA -->

    <video id="cam-preview" autoplay playsinline></video>

    <!-- OVERLAY CAMERA -->

    <div id="camera-overlay">

        <div class="camera-info">

            <div class="camera-line"></div>

            <div class="camera-text">

                <div class="camera-system">

                    PHOTO PRINT

                </div>

                <div class="camera-event" id="event-name">

                    CARREGANDO EVENTO...

                </div>

                <div class="camera-type" id="event-type">

                    FOTO DIGITAL • TOTEM INTERATIVO

                </div>

            </div>

        </div>

        <!-- CONTADOR -->

        <div id="countdown-container">

            <div id="prepare-text">

                😎 PREPARE-SE

            </div>

            <div id="countdown">

                5

            </div>

        </div>

    </div>

    <!-- TELA INICIAL -->

    <div id="screen-start" class="screen">

        <div class="btn-start" onclick="manualStart()">

            <div class="start-content">

                <div class="start-title" id="start-event-name">

                    CARREGANDO EVENTO...

                </div>

                <div class="start-subtitle">

                    Aperte a <span>BOTOEIRA DO TOTEM</span><br>
                    para iniciar sua foto 📸

                </div>

            </div>

        </div>

    </div>

    <!-- PREVIEW FINAL -->

    <div id="final-preview-container" class="screen">

        <img id="img-review" src="">

        <div id="botoeira-controls">

            AGUARDANDO ESCOLHA NA BOTOEIRA... 📱

        </div>

    </div>

    <script>

        const API =
            "https://photoprint-api.maxprimefotovideo.workers.dev";

        const video =
            document.getElementById('cam-preview');

        let finalBlob = null;

        let eventoAtivo = "EVENTO";
        let tipoFoto = "FOTO DIGITAL";

        let pollingTrigger = false;
        let sessaoIniciada = false;

        // =========================================
        // CARREGA STATUS
        // =========================================

        async function loadSystemStatus() {

            try {

                const res =
                    await fetch(`${API}/status?t=${Date.now()}`);

                const data =
                    await res.json();

                eventoAtivo =
                    data.evento || "EVENTO";

                tipoFoto =
                    data.tipo || "FOTO DIGITAL";

                // EVENTO NO OVERLAY

                document.getElementById('event-name')
                    .innerText = eventoAtivo;

                // TIPO FOTO

                document.getElementById('event-type')
                    .innerText =
                        `${tipoFoto} • TOTEM INTERATIVO`;

                // BOTÃO PRINCIPAL AGORA MOSTRA EVENTO

                document.getElementById('start-event-name')
                    .innerText = eventoAtivo;

            } catch(e) {

                console.log(e);

            }

        }

        // =========================================
        // START MANUAL
        // =========================================

        function manualStart() {

            if (sessaoIniciada) return;

            initSession();

        }

        // =========================================
        // INICIA SESSÃO
        // =========================================

        async function initSession() {

            if (sessaoIniciada) return;

            sessaoIniciada = true;

            document.getElementById('screen-start')
                .style.display = "none";

            document.getElementById('loader')
                .style.display = "flex";

            try {

                // RECARREGA EVENTO ATIVO
                // ANTES DE CAPTURAR

                await loadSystemStatus();

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            width: 1920,
                            height: 1080

                        },

                        audio: false

                    });

                video.srcObject = stream;

                // AGUARDA VIDEO REALMENTE INICIAR
                // EVITA FALHA NA PRIMEIRA TENTATIVA

                await new Promise(resolve => {

                    video.onloadedmetadata = () => {

                        video.play();

                        resolve();

                    };

                });

                video.style.display = "block";

                document.getElementById('loader')
                    .style.display = "none";

                document.getElementById('camera-overlay')
                    .style.display = "block";

                // PREPARE-SE 3 SEGUNDOS

                setTimeout(() => {

                    startCountdown();

                }, 3000);

            } catch(e) {

                console.log(e);

                alert("Erro ao acessar câmera");

                location.reload();

            }

        }

        // =========================================
        // CONTADOR
        // =========================================

        function startCountdown() {

            document.getElementById('prepare-text')
                .style.display = "none";

            const countdown =
                document.getElementById('countdown');

            countdown.style.display = "block";

            let time = 5;

            countdown.innerText = time;

            const interval = setInterval(() => {

                time--;

                countdown.innerText = time;

                if (time <= 0) {

                    clearInterval(interval);

                    processFinalImage();

                }

            }, 1000);

        }

        // =========================================
        // PROCESSA FOTO
        // =========================================

        async function processFinalImage() {

            document.getElementById('countdown')
                .innerText = "📸";

            await new Promise(r => setTimeout(r, 300));

            const canvas =
                document.createElement('canvas');

            canvas.width = 1920;
            canvas.height = 1080;

            const ctx =
                canvas.getContext('2d');

            // FOTO ESPELHADA

            ctx.translate(canvas.width, 0);

            ctx.scale(-1, 1);

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            // GERA BLOB

            finalBlob = await new Promise(resolve => {

                canvas.toBlob(blob => {

                    resolve(blob);

                }, 'image/jpeg', 0.92);

            });

            // PREVIEW

            document.getElementById('img-review').src =
                canvas.toDataURL('image/jpeg', 0.92);

            // ESCONDE OVERLAY

            document.getElementById('camera-overlay')
                .style.display = "none";

            // AVISA BOTOEIRA
            // COM RETRY AUTOMÁTICO

            await notifyPhotoReady();

            // MOSTRA PREVIEW

            document.getElementById('final-preview-container')
                .style.display = "flex";

            // ESCUTA IMPRESSÃO

            startPrintPolling();

        }

        // =========================================
        // GARANTE SINCRONIA BOTOEIRA
        // =========================================

        async function notifyPhotoReady() {

            let enviado = false;

            while (!enviado) {

                try {

                    const res = await fetch(`${API}/photo-ready`, {

                        method: 'POST'

                    });

                    if (res.ok) {

                        enviado = true;

                    }

                } catch(e) {}

                if (!enviado) {

                    await new Promise(r => setTimeout(r, 700));

                }

            }

        }

        // =========================================
        // ESCUTA IMPRESSÃO
        // =========================================

        async function startPrintPolling() {

            const interval = setInterval(async () => {

                try {

                    const res =
                        await fetch(`${API}/check-print?t=${Date.now()}`);

                    const data =
                        await res.json();

                    if (data.printTriggered) {

                        clearInterval(interval);

                        await fetch(`${API}/clear-print`, {

                            method: 'POST'

                        });

                        finalizar(data.copias);

                    }

                } catch(e) {}

            }, 700);

        }

        // =========================================
        // FINALIZA
        // =========================================

        async function finalizar(qtd) {

            document.getElementById('loader')
                .style.display = "flex";

            const fd = new FormData();

            fd.append('file', finalBlob, 'webcam.jpg');

            fd.append('copias', qtd);

            fd.append('evento', eventoAtivo);

            fd.append('tipo', tipoFoto);

            try {

                await fetch(`${API}/upload`, {

                    method: 'POST',

                    body: fd

                });

                location.reload();

            } catch(e) {

                alert("Erro ao enviar impressão");

                location.reload();

            }

        }

        // =========================================
        // ESCUTA GATILHO REMOTO
        // =========================================

        async function checkRemoteTrigger() {

            if (pollingTrigger) return;

            pollingTrigger = true;

            const screenStart =
                document.getElementById('screen-start');

            if (!screenStart ||
                screenStart.style.display === "none") {

                pollingTrigger = false;

                return;

            }

            try {

                const res =
                    await fetch(`${API}/check-trigger?t=${Date.now()}`, {

                        cache: "no-store"

                    });

                const data =
                    await res.json();

                if (data.triggered) {

                    // LIMPA IMEDIATAMENTE
                    // PARA NÃO DUPLICAR

                    await fetch(`${API}/clear-trigger`, {

                        method: 'POST'

                    });

                    initSession();

                }

            } catch(e) {

                console.log(e);

            }

            pollingTrigger = false;

        }

        // =========================================
        // INIT
        // =========================================

        loadSystemStatus();

        // ATUALIZA EVENTO A CADA 5 SEGUNDOS

        setInterval(loadSystemStatus, 5000);

        // LOOP BOTOEIRA MAIS RÁPIDO

        setInterval(checkRemoteTrigger, 400);

    </script>

</body>
</html>
