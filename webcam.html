<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>WEBCAM - PHOTO PRINT v8.3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
:root{ --neon:#39ff14; --dark:#050505; --danger:#ff3131; }
*{ box-sizing:border-box; }
body{ margin:0; background: radial-gradient(circle at top, rgba(57,255,20,0.10), transparent 35%), linear-gradient(135deg, #020202 0%, #050505 40%, #071107 100%); color:white; font-family:Arial,Helvetica,sans-serif; width:100vw; height:100vh; overflow:hidden; position:relative; }

/* ... (Estilos mantidos para não quebrar seu layout) ... */
#dynamic-bg{ position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; background-repeat:no-repeat; opacity:0; transition:opacity 0.6s ease; }
#dynamic-bg.active{ opacity:0.45; }
.screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; flex-direction:column; }
#camera-wrapper { position: absolute; inset: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; z-index: 40; }
#camera-feed, #camera-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

/* TEXTOS E FLASH */
.fun-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Orbitron', sans-serif; font-size: 80px; font-weight: 900; color: var(--neon); text-shadow: 0 0 20px black; z-index: 100; text-align: center; }
#flash-effect { position: fixed; inset: 0; background: white; z-index: 999; opacity: 0; pointer-events: none; }
.flash-animate { animation: flashPhoto 0.5s ease-out; }
@keyframes flashPhoto { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
#options-overlay { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); padding: 20px 45px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 60; text-align: center; }
.options-text { font-family: 'Arial', sans-serif; font-size: 28px; color: #222; font-weight: bold; }
</style>
</head>
<body>

<div id="dynamic-bg"></div>
<div id="flash-effect"></div>

<div id="screen-start" class="screen">
    <div style="text-align:center;"><h1>PHOTO PRINT</h1><p>Aguardando comando...</p></div>
</div>

<div id="screen-camera" class="screen" style="display:none;">
    <div id="camera-wrapper">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="camera-canvas" style="display:none;"></canvas>
        <div id="fun-text" class="fun-text" style="display:none;"></div>
        <div id="options-overlay" style="display:none;">
            <div class="options-text">👇 ESCOLHA A IMPRESSÃO NO CELULAR 👇</div>
        </div>
    </div>
</div>

<script>
const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
const videoFeed = document.getElementById('camera-feed');
const canvasCapture = document.getElementById('camera-canvas');
const ctx = canvasCapture.getContext('2d');
const funText = document.getElementById('fun-text');
const optionsOverlay = document.getElementById('options-overlay');
const flashEffect = document.getElementById('flash-effect');

let lastState = 'start';

async function initWebcam() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1920, height: 1080 } });
        videoFeed.srcObject = stream;
    } catch (err) { console.warn("Permissão negada"); }
}

function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function startCaptureSequence() {
    videoFeed.style.display = 'block';
    canvasCapture.style.display = 'none';
    optionsOverlay.style.display = 'none';
    funText.style.display = 'block';

    // 1. Prepare-se
    funText.innerHTML = "PREPARE-SE";
    await wait(2500);

    // 2. Sorria
    funText.innerHTML = "SORRIA!";
    await wait(3000);

    // 3. Contagem
    for(let i=3; i>0; i--) {
        funText.innerHTML = i;
        await wait(1000);
    }

    // 4. Flash e Foto
    funText.style.display = 'none';
    flashEffect.classList.add('flash-animate');
    await wait(200); // tempo do flash
    
    canvasCapture.width = videoFeed.videoWidth;
    canvasCapture.height = videoFeed.videoHeight;
    ctx.drawImage(videoFeed, 0, 0, canvasCapture.width, canvasCapture.height);
    
    videoFeed.style.display = 'none';
    canvasCapture.style.display = 'block';
    optionsOverlay.style.display = 'block';
    
    setTimeout(() => flashEffect.classList.remove('flash-animate'), 500);
}

function updateScreenState(state) {
    if (state === lastState && state !== 'capturing') return;

    document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
    
    if (state === 'capturing') {
        document.getElementById('screen-camera').style.display = 'flex';
        startCaptureSequence();
    } else if (state === 'options') {
        document.getElementById('screen-camera').style.display = 'flex';
        canvasCapture.style.display = 'block';
        optionsOverlay.style.display = 'block';
    } else {
        document.getElementById('screen-start').style.display = 'flex';
    }
    lastState = state;
}

// Polling da API
setInterval(async () => {
    try {
        const res = await fetch(`${API}/get-state`);
        const data = await res.json();
        if(data.state) updateScreenState(data.state);
    } catch(e) {}
}, 1000);

initWebcam();
</script>
</body>
</html>
