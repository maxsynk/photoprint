<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT - Galeria Digital v4.8</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; margin: 0; padding: 20px; }
        header { text-align: center; padding: 20px; border-bottom: 1px solid #222; margin-bottom: 30px; }
        h1 { color: #39ff14; font-weight: 900; letter-spacing: 2px; margin: 0; text-transform: uppercase; font-size: 28px; }
        h2 { font-size: 14px; color: #aaa; margin-top: 5px; text-transform: uppercase; letter-spacing: 4px; }
        .grid-fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .foto-card { background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden; transition: 0.3s; }
        .foto-card:hover { border-color: #39ff14; transform: scale(1.02); }
        .foto-card img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <header>
        <h1 id="nome-sistema">PHOTO PRINT</h1>
        <h2 id="nome-evento">Buscando evento ativo...</h2>
    </header>

    <div class="grid-fotos" id="galeria-container">
        </div>

<script>
    const API_URL = "https://photoprint-api.maxprimefotovideo.workers.dev";
    let eventoAtual = "";

    // 1. Monitora qual evento o Painel mandou executar
    async function monitorarPainel() {
        try {
            const resp = await fetch(`${API_URL}/get-all-states?t=${Date.now()}`);
            const data = await resp.json();
            
            if (data && data.config) {
                const eventoDoWorker = data.config.evento;

                // Se o usuário trocou de evento no painel, atualiza a galeria
                if (eventoAtual !== eventoDoWorker) {
                    console.log(`Galeria mudando para o evento: ${eventoDoWorker}`);
                    eventoAtual = eventoDoWorker;
                    
                    // Atualiza o título na tela
                    document.getElementById('nome-evento').innerText = eventoAtual;

                    // Dispara a busca de imagens no seu bucket/servidor passando o nome do evento limpo
                    atualizarFotosDaGrade(eventoAtual);
                }
            }
        } catch (e) {
            console.error("Erro na sincronização da galeria:", e);
        }
    }

    // 2. Busca e renderiza os arquivos baseados no evento ativo
    async function atualizarFotosDaGrade(nomeDoEvento) {
        const container = document.getElementById('galeria-container');
        container.innerHTML = "<p style='color: #666; text-align:center; width:100%'>Atualizando galeria...</p>";

        try {
            // Exemplo de integração: Substitua pela sua rota que lê os arquivos do Cloudflare R2
            // Geralmente você passa o nome do evento como parâmetro para filtrar a pasta
            // const respostaArquivos = await fetch(`https://seu-bucket-r2.com/list?pasta=${encodeURIComponent(nomeDoEvento)}`);
            // const arquivos = await respostaArquivos.json();

            // Exemplo de renderização falsa simulada:
            let htmlGerado = "";
            
            /* arquivos.forEach(urlDaFoto => {
                htmlGerado += `
                    <div class="foto-card">
                        <img src="${urlDaFoto}" alt="Foto do evento">
                    </div>
                `;
            });
            */

            // Se não houver fotos integradas ainda, exibe aviso
            container.innerHTML = htmlGerado || `<p style='color: #444; grid-column: 1/-1; text-align:center;'>Nenhuma foto encontrada para o evento "${nomeDoEvento}".</p>`;

        } catch (err) {
            console.error("Erro ao carregar fotos do R2:", err);
            container.innerHTML = "<p style='color: red; text-align:center; width:100%'>Erro ao carregar fotos.</p>";
        }
    }

    window.onload = () => {
        monitorarPainel();
        
        // Fica checando se o painel trocou de evento a cada 3 segundos
        setInterval(monitorarPainel, 3000);
    };
</script>
</body>
</html>
