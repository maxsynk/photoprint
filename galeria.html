<!-- ▶▶▶ INÍCIO DO ARQUIVO galeria.html — CENTRAL v8.0 (A4 AGGREGATOR) ◀◀◀ -->
<!-- (SUBSTITUA O ARQUIVO INTEIRO POR ESTE)                              -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Central de Impressão v8.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════════
           TOKENS — PALETA v8.0 (Lime Sofisticado)
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --accent: #A8FF00;
            --accent-dim: rgba(168, 255, 0, 0.12);
            --accent-glow: 0 0 24px rgba(168, 255, 0, 0.35);
            --danger: #EF4444;
            --danger-dim: rgba(239, 68, 68, 0.15);
            --info: #00E5FF;
            --info-dim: rgba(0, 229, 255, 0.12);
            --warn: #F59E0B;
            --warn-dim: rgba(245, 158, 11, 0.15);

            --bg-0: #050505;
            --bg-1: #0F0F0F;
            --bg-2: #181818;
            --bg-3: #222222;
            --bg-4: #2A2A2A;

            --text-0: #F5F5F5;
            --text-1: #D4D4D4;
            --text-2: #8A8A8A;
            --text-3: #525252;

            --border-1: rgba(255, 255, 255, 0.07);
            --border-2: rgba(255, 255, 255, 0.12);
            --border-accent: rgba(168, 255, 0, 0.35);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.5);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.6);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.75);

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.15s ease;

            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'Space Grotesk', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: var(--font-body);
            background: var(--bg-0);
            color: var(--text-0);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background:
                radial-gradient(circle at 50% 0%, rgba(168, 255, 0, 0.04) 0%, transparent 50%),
                var(--bg-0);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(circle at 50% 30%, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 30%, transparent 75%);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

        /* ═══════════════════════════════════════════════════════════════
           ÁREA DE IMPRESSÃO — A4 portrait, grid 3×2 (6 polaroids)
           ═══════════════════════════════════════════════════════════════ */
        #print-area { display: none; }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body * {
                visibility: hidden !important;
                display: none !important;
            }
            #print-area, #print-area * {
                visibility: visible !important;
                display: block !important;
            }
            #print-area {
                position: absolute !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            .print-sheet {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important;
                grid-template-rows: repeat(2, 1fr) !important;
                gap: 2mm !important;
                padding: 3mm !important;
                width: 100% !important;
                height: 100% !important;
                background: #fff !important;
                box-sizing: border-box !important;
            }
            .print-sheet .slot {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                overflow: hidden !important;
                background: #fff !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .print-sheet .slot img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
                display: block !important;
            }
            /* Layouts alternativos (mantidos para futuro) */
            .print-sheet.layout-1 { grid-template-columns: 1fr !important; grid-template-rows: 1fr !important; }
            .print-sheet.layout-2 { grid-template-columns: repeat(2, 1fr) !important; grid-template-rows: 1fr !important; }
            .print-sheet.layout-4 { grid-template-columns: repeat(2, 1fr) !important; grid-template-rows: repeat(2, 1fr) !important; }
            .print-sheet.layout-6 { grid-template-columns: repeat(3, 1fr) !important; grid-template-rows: repeat(2, 1fr) !important; }
        }

        /* ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ */
        header {
            position: relative;
            z-index: 10;
            padding: 32px 48px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-container {
            position: absolute;
            left: 48px;
            top: 32px;
            text-align: left;
            border-left: 3px solid var(--accent);
            padding-left: 16px;
        }
        .status-label {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-3);
            font-weight: 800;
            margin-bottom: 3px;
        }
        #nome-evento {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #tipo-formato {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-1);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .brand-center { text-align: center; margin-top: 16px; }
        .brand-center h1 {
            font-family: var(--font-display);
            font-size: clamp(32px, 5vw, 48px);
            color: var(--accent);
            text-shadow: var(--accent-glow);
            letter-spacing: 8px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
        }
        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-3);
            margin-top: 8px;
            font-weight: 800;
        }

        /* Barra de status */
        .print-status-bar {
            margin-top: 22px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--border-1);
            border-radius: 30px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-2);
            backdrop-filter: blur(12px);
        }
        .print-status-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-3);
            transition: var(--transition);
        }
        .print-status-bar.active { color: var(--accent); border-color: var(--border-accent); }
        .print-status-bar.active .dot {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulseDot 1s ease-in-out infinite;
        }
        .print-status-bar.paused { color: var(--warn); border-color: rgba(245, 158, 11, 0.4); }
        .print-status-bar.paused .dot {
            background: var(--warn);
            box-shadow: 0 0 10px var(--warn);
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        .print-controls {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--border-2);
            color: var(--text-1);
            padding: 9px 16px;
            border-radius: 24px;
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-fast);
        }
        .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .ctrl-btn.active { border-color: var(--accent); color: var(--bg-0); background: var(--accent); }
        .ctrl-btn.pause.active { border-color: var(--warn); color: var(--bg-0); background: var(--warn); }
        .ctrl-btn .badge-qty {
            background: var(--accent);
            color: var(--bg-0);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .ctrl-btn.active .badge-qty { background: var(--bg-0); color: var(--accent); }

        /* ═══════════════════════════════════════════════════════════════
           PREVIEW DA FOLHA (slot indicator + miniaturas em tempo real)
           ═══════════════════════════════════════════════════════════════ */
        .sheet-preview-wrap {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .slot-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--border-1);
            border-radius: 30px;
            backdrop-filter: blur(12px);
        }
        .slot-indicator-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-3);
            font-weight: 800;
        }
        .slot-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .slot-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 2px solid var(--border-2);
            background: transparent;
            transition: var(--transition-fast);
        }
        .slot-dot.filled {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(168, 255, 0, 0.5);
        }
        .slot-indicator-count {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 900;
            color: var(--accent);
        }

        .sheet-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            padding: 14px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-md);
            width: 280px;
            height: 200px;
            box-shadow: var(--shadow-md);
        }
        .sheet-preview-slot {
            border: 1.5px dashed var(--border-2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: var(--text-3);
            font-family: var(--font-mono);
            overflow: hidden;
            position: relative;
            transition: var(--transition-fast);
        }
        .sheet-preview-slot.filled {
            border-style: solid;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(168, 255, 0, 0.25);
        }
        .sheet-preview-slot.filled img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .sheet-preview-slot .slot-label {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 8px;
            font-weight: 900;
            color: var(--accent);
            background: rgba(0,0,0,0.75);
            padding: 1px 3px;
            border-radius: 3px;
            z-index: 2;
        }

        /* Barra de seleção */
        .selection-bar {
            display: none;
            margin-top: 12px;
            padding: 12px 20px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 30px;
            align-items: center;
            gap: 12px;
            justify-content: center;
            animation: slideDown 0.3s ease;
        }
        .selection-bar.active { display: flex; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .selection-bar-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Busca */
        .search-box {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .search-box input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-2);
            color: var(--text-0);
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            width: 200px;
            outline: none;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: var(--transition-fast);
        }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .search-box input::placeholder { color: var(--text-3); font-family: var(--font-body); letter-spacing: 2px; font-size: 11px; }
        .search-btn {
            background: var(--accent);
            color: var(--bg-0);
            border: none;
            padding: 0 20px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition-fast);
        }
        .search-btn:hover { box-shadow: var(--accent-glow); transform: translateY(-1px); }

        /* ═══════════════════════════════════════════════════════════════
           MENU + SIDEBAR
           ═══════════════════════════════════════════════════════════════ */
        .menu-trigger {
            position: fixed;
            right: 32px;
            top: 32px;
            z-index: 5100;
            width: 48px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--border-2);
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: var(--transition-fast);
        }
        .menu-trigger:hover { border-color: var(--accent); }
        .menu-trigger span {
            display: block;
            width: 22px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: var(--transition);
        }
        .menu-trigger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-trigger.active span:nth-child(2) { opacity: 0; }
        .menu-trigger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .sidebar {
            position: fixed;
            right: -380px;
            top: 0;
            width: 340px;
            height: 100%;
            background: rgba(15, 15, 15, 0.98);
            z-index: 5000;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 100px 24px 24px;
            border-left: 1px solid var(--border-accent);
            backdrop-filter: blur(24px);
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar-title {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 18px;
            padding-left: 4px;
        }
        .sidebar-btn {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-2);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-0);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
            transition: var(--transition-fast);
        }
        .sidebar-btn i {
            width: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .sidebar-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
        .sidebar-btn.danger i { color: var(--danger); }
        .sidebar-btn.danger:hover { border-color: var(--danger); background: var(--danger-dim); }

        .sidebar-section {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--border-1);
        }
        .sidebar-section-title {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 12px;
            padding-left: 4px;
        }
        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            gap: 12px;
        }
        .config-row label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-1);
            text-transform: uppercase;
        }
        .config-row select {
            background: var(--bg-1);
            border: 1px solid var(--border-2);
            color: var(--text-0);
            padding: 7px 10px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            outline: none;
            width: 130px;
            text-align: center;
        }
        .config-row select:focus { border-color: var(--accent); }

        /* ═══════════════════════════════════════════════════════════════
           GRID DE FOTOS
           ═══════════════════════════════════════════════════════════════ */
        .grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            padding: 20px 48px 140px;
        }

        .card {
            background: linear-gradient(160deg, rgba(24,24,24,0.9) 0%, rgba(15,15,15,0.9) 100%);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-1);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            box-shadow: var(--shadow-sm);
            animation: cardIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-md);
        }
        .card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim), var(--shadow-md);
        }
        .card img {
            width: 100%;
            display: block;
            aspect-ratio: 3/4;
            object-fit: cover;
            transition: var(--transition);
        }
        .card:hover img { transform: scale(1.03); }

        .card .badge-id {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent);
            color: var(--bg-0);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 900;
            z-index: 2;
        }
        .card .badge-copias {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 900;
            z-index: 2;
            backdrop-filter: blur(6px);
        }
        .card .badge-guestbook {
            position: absolute;
            bottom: 42px;
            right: 10px;
            background: rgba(0, 150, 255, 0.95);
            border: 1px solid var(--info);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .card .print-state {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--border-2);
            color: var(--text-2);
            padding: 5px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 900;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .card .print-state.done {
            border-color: var(--accent);
            color: var(--accent);

        }
        .card .print-state.printing {

        /* ═══════════════════════════════════════════════════════════════

           ═══════════════════════════════════════════════════════════════ */
        .log-drawer {
            position: fixed;
            bottom: 88px;
            right: 24px;

            max-height: 280px;
            background: rgba(15, 15, 15, 0.98);

            backdrop-filter: blur(20px);

            box-shadow: var(--shadow-lg);
                        display: none;

        @keyframes logIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(168, 255, 0, 0.04);
        }
        .log-title {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .log-close {
            background: none;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            transition: var(--transition-fast);
        }
        .log-close:hover { color: var(--danger); }
        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            font-family: var(--font-mono);
            font-size: 10px;
        }
        .log-line {
            padding: 5px 8px;
            border-radius: 4px;
            margin-bottom: 3px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            line-height: 1.4;
        }
        .log-line .ts {
            color: var(--text-3);
            flex-shrink: 0;
            font-size: 9px;
        }
        .log-line .msg { color: var(--text-1); flex: 1; }
        .log-line.success .msg { color: var(--accent); }
        .log-line.error .msg { color: var(--danger); }
        .log-line.warn .msg { color: var(--warn); }
        .log-line.info .msg { color: var(--info); }

        .log-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            background: rgba(15, 15, 15, 0.95);

            align-items: center;
            justify-content: center;

        .log-toggle:hover { box-shadow: var(--accent-glow); transform: scale(1.05); }
        .log-toggle .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);

            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 900;
            min-width: 18px;
            height: 18px;
            border-radius: 10px;

            justify-content: center;

        /* ═══════════════════════════════════════════════════════════════

           ═══════════════════════════════════════════════════════════════ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.97);
            z-index: 6000;
            flex-direction: column;

        .modal.active { display: flex; animation: modalIn 0.3s ease; }

        .modal-info span { color: var(--text-3); }
        .modal-info strong { color: var(--accent); }
        .modal-controls {
            display: flex;
            gap: 12px;

            justify-content: center;

        .btn-act {
            border: none;
            padding: 14px 26px;
            border-radius: 30px;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-act:hover { transform: translateY(-2px); }
        .btn-voltar { background: #333; color: #fff; }
        .btn-voltar:hover { background: #444; }
        .btn-reimprimir { background: var(--accent); color: var(--bg-0); }
        .btn-reimprimir:hover { box-shadow: var(--accent-glow); }
        .btn-excluir { background: var(--danger); color: #fff; }
        .btn-excluir:hover { background: #e02020; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

        /* ═══════════════════════════════════════════════════════════════
           DEBUG BAR + TOAST
           ═══════════════════════════════════════════════════════════════ */
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.92);
