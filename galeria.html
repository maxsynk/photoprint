<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- ▶▶▶ INÍCIO DO ARQUIVO galeria.html — CENTRAL DE IMPRESSÃO v5.0 ◀◀◀ -->
<!-- (SUBSTITUA O ARQUIVO INTEIRO POR ESTE)                              -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Central de Impressão v5.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #020202;
            --surface: rgba(18, 18, 18, 0.9);
            --accent: #39ff14;
            --danger: #ff3131;
            --info-blue: #00e5ff;
            --text: #ffffff;
            --text-dim: #888;
            --neon-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
            --glass-border: 1px solid rgba(57, 255, 20, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at center, #0a1a05 0%, #000 100%);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ═══════════════════════════════════════════════════════════════
           ÁREA DE IMPRESSÃO (só aparece no momento de print)
           ═══════════════════════════════════════════════════════════════ */
        #print-area { display: none; }

        @media print {
            @page { margin: 0; size: auto; }

            body * {
                visibility: hidden !important;
                display: none !important;
            }

            #print-area, #print-area * {
                visibility: visible !important;
                display: block !important;
            }

            #print-area {
                position: absolute !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }

            .print-sheet {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                align-items: center !important;
                width: 100% !important;
                height: 100% !important;
                gap: 4mm !important;
                padding: 4mm !important;
                background: #fff !important;
            }

            .print-sheet img {
                object-fit: contain !important;
                max-height: 100% !important;
                max-width: 100% !important;
                display: block !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ */
        header {
            padding: 30px 40px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .status-container {
            position: absolute;
            left: 40px;
            top: 40px;
            text-align: left;
            border-left: 3px solid var(--accent);
            padding-left: 15px;
        }
        .status-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 2px;
        }
        #nome-evento {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
        }
        #tipo-formato {
            font-size: 12px;
            font-weight: bold;
            opacity: 0.8;
            margin-top: 2px;
            text-transform: uppercase;
            color: #fff;
        }

        .brand-center { text-align: center; margin-top: 20px; }
        .brand-center h1 {
            font-size: 45px;
            color: var(--accent);
            text-shadow: var(--neon-shadow);
            letter-spacing: 8px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .brand-subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Barra de status de impressão */
        .print-status-bar {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        .print-status-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
            transition: 0.3s;
        }
        .print-status-bar.active { color: var(--accent); border-color: var(--accent); }
        .print-status-bar.active .dot {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulseDot 1s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Busca por ID */
        .search-box {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .search-box input {
            background: rgba(255, 255, 255, 0.05);
            border: var(--glass-border);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            width: 180px;
            outline: none;
            font-family: inherit;
            font-weight: 700;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-btn:hover { box-shadow: var(--neon-shadow); }

        /* ═══════════════════════════════════════════════════════════════
           GRID DE FOTOS
           ═══════════════════════════════════════════════════════════════ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px 60px 80px;
        }

        .card {
            background: var(--surface);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: var(--neon-shadow);
        }
        .card img {
            width: 100%;
            display: block;
            height: auto;
            aspect-ratio: 3/4;
            object-fit: cover;
        }
        .card .badge-id {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent);
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            z-index: 2;
        }
        .card .badge-copias {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 900;
            z-index: 2;
        }
        .card .badge-guestbook {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 150, 255, 0.95);
            border: 1px solid var(--info-blue);
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }
        .card .print-state {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-dim);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }
        .card .print-state.done {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ═══════════════════════════════════════════════════════════════
           MODAL DE ZOOM
           ═══════════════════════════════════════════════════════════════ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 6000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal.active { display: flex; }
        .modal img {
            max-width: 90%;
            max-height: 65vh;
            border: 2px solid var(--accent);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.3);
        }
        .modal-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-info span { color: var(--text-dim); }
        .modal-info strong { color: var(--accent); }
        .modal-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn-act {
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-act:hover { transform: translateY(-2px); }
        .btn-voltar { background: #333; color: #fff; }
        .btn-reimprimir { background: var(--accent); color: #000; }
        .btn-excluir { background: var(--danger); color: #fff; }

        /* ═══════════════════════════════════════════════════════════════
           DEBUG INFO
           ═══════════════════════════════════════════════════════════════ */
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.92);
            color: var(--accent);
            font-size: 11px;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            text-align: center;
            border: 1px solid rgba(57, 255, 20, 0.3);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .status-container { position: static; text-align: center; margin-bottom: 16px; }
            .brand-center h1 { font-size: 30px; letter-spacing: 4px; }
            .grid { padding: 20px; gap: 14px; }
            header { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════
         HEADER
         ═══════════════════════════════════════════════════════════════ -->
    <header>
        <div class="status-container">
            <div class="status-label">Status Evento</div>
            <div id="nome-evento">Carregando...</div>
            <div id="tipo-formato">--</div>
        </div>

        <div class="brand-center">
            <h1>PHOTO PRINT</h1>
            <div class="brand-subtitle">central de impressão</div>

            <div class="print-status-bar" id="print-status-bar">
                <span class="dot"></span>
                <span id="print-status-text">Aguardando fotos</span>
            </div>

            <div class="search-box">
                <input type="number" id="input-busca" placeholder="BUSCAR POR ID" onkeydown="if(event.key==='Enter') executarBusca()">
                <button class="search-btn" onclick="executarBusca()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
         GRID DE FOTOS
         ═══════════════════════════════════════════════════════════════ -->
    <main class="grid" id="grid-fotos"></main>

    <!-- ═══════════════════════════════════════════════════════════════
         MODAL DE ZOOM
         ═══════════════════════════════════════════════════════════════ -->
    <div class="modal" id="modal-zoom">
        <img id="img-zoom" src="" alt="Zoom">
        <div class="modal-info">
            <div><span>ID:</span> <strong id="zoom-id">#--</strong></div>
            <div><span>Cópias:</span> <strong id="zoom-copias">--</strong></div>
            <div><span>Guestbook:</span> <strong id="zoom-guestbook">--</strong></div>
        </div>
        <div class="modal-controls">
            <button class="btn-act btn-voltar" onclick="fecharZoom()">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
            <button class="btn-act btn-reimprimir" onclick="reimprimirAtual()">
                <i class="fa-solid fa-print"></i> Reimprimir
            </button>
            <button class="btn-act btn-excluir" id="btn-excluir-zoom">
                <i class="fa-solid fa-trash"></i> Excluir
            </button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         ÁREA DE IMPRESSÃO (invisível, só aparece no @media print)
         ═══════════════════════════════════════════════════════════════ -->
    <div id="print-area"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         DEBUG INFO
         ═══════════════════════════════════════════════════════════════ -->
    <div class="debug-info" id="debug-info">SISTEMA PRONTO</div>

    <!-- ═══════════════════════════════════════════════════════════════
         SCRIPT PRINCIPAL
         ═══════════════════════════════════════════════════════════════ -->
    <script>
        /* ═══════════════════════════════════════════════════════════════
           CONFIGURAÇÕES
           ═══════════════════════════════════════════════════════════════ */
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const POLL_INTERVAL_MS = 4000;      // atualização da galeria
        const PRINT_DELAY_MS = 2500;        // tempo após print() até liberar próximo job
        const MAX_RETRIES_PRINT = 2;        // tentativas em caso de falha

        // Layout de impressão por formato (quantas fotos por folha)
        const LAYOUT_POR_FORMATO = {
            "10X15V":   { cols: 1, rows: 1 },   // 1 foto por folha (vertical)
            "10X15H":   { cols: 1, rows: 1 },   // 1 foto por folha (horizontal)
            "TIRINHA":  { cols: 3, rows: 1 },   // 3 slots na tirinha (mas foto é uma tira inteira, então 1 folha)
            "POLAROID": { cols: 2, rows: 2 }    // 4 polaroids por folha A4
        };

        /* ═══════════════════════════════════════════════════════════════
           ESTADO GLOBAL
           ═══════════════════════════════════════════════════════════════ */
        let todasFotos = [];              // { id, url, key, copias, guestbook, impressa }
        let chavesLocais = new Set();     // evita duplicação
        let eventoAtual = "";
        let eventoIdAtual = "";
        let formatoAtual = "10X15V";
        let primeiraCarga = true;

        let printQueue = [];              // fila de JOBS de impressão
        let isPrinting = false;           // controle de concorrência
        let printJobAtual = null;         // job em execução (para log)

        /* ═══════════════════════════════════════════════════════════════
           HELPERS
           ═══════════════════════════════════════════════════════════════ */
        function debug(msg) {
            console.log('[GALERIA]', msg);
            const el = document.getElementById('debug-info');
            if (el) el.innerText = msg;
        }

        function traduzirFormato(f) {
            if (!f) return "--";
            const up = f.toUpperCase().trim();
            if (up.includes("10X15H")) return "10x15 Horizontal";
            if (up.includes("10X15V")) return "10x15 Vertical";
            if (up.includes("TIRINHA")) return "Tirinha";
            if (up.includes("POLAROID")) return "Polaroid";
            return up;
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INÍCIO: ATUALIZAÇÃO DA GALERIA (polling) ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        async function atualizar() {
            try {
                // 1) Busca config do evento ativo
                const r1 = await fetch(`${API}/get-all-states?t=${Date.now()}`).catch(() => null);
                if (!r1 || !r1.ok) return;

                const config = await r1.json();
                const evt = (config.config && config.config.evento) ? config.config.evento : "Geral";
                const evtId = (config.config && config.config.eventoId) ? config.config.eventoId : "";
                formatoAtual = (config.config && config.config.formato)
                    ? config.config.formato.toUpperCase().trim()
                    : "10X15V";

                // Troca de evento → reseta tudo
                if (eventoIdAtual !== evtId) {
                    eventoAtual = evt;
                    eventoIdAtual = evtId;
                    todasFotos = [];
                    chavesLocais.clear();
                    printQueue = [];
                    primeiraCarga = true;
                    document.getElementById('grid-fotos').innerHTML = "";
                    atualizarBarraStatus();
                    debug('🔄 Evento: ' + evt);
                }

                document.getElementById('nome-evento').innerText = eventoAtual;
                document.getElementById('tipo-formato').innerText = traduzirFormato(formatoAtual);

                if (!eventoIdAtual) {
                    debug('⏳ Aguardando evento ativo...');
                    return;
                }

                // 2) Busca lista de fotos do evento
                const r2 = await fetch(
                    `${API}/list-photos?evento=${encodeURIComponent(eventoAtual)}&t=${Date.now()}`
                ).catch(() => null);
                if (!r2 || !r2.ok) return;

                const dados = await r2.json();
                const fotosValidas = Array.isArray(dados)
                    ? dados.filter(f => !f.key.toLowerCase().includes('moldura'))
                    : [];

                const novas = fotosValidas.filter(f => !chavesLocais.has(f.key));

                if (novas.length > 0) {
                    debug(`📷 ${novas.length} nova(s) foto(s)`);

                    for (const f of novas) {
                        const url = `${API}/photo?key=${encodeURIComponent(f.key)}`;
                        const parsed = analisarNomeFoto(f.key);

                        todasFotos.push({
                            id: todasFotos.length + 1,
                            url,
                            key: f.key,
                            copias: parsed.copias,
                            guestbook: parsed.guestbook,
                            impressa: primeiraCarga  // fotos antigas já consideradas impressas
                        });
                        chavesLocais.add(f.key);

                        // Auto-impressão: só se NÃO é a primeira carga (foto nova de verdade)
                        if (!primeiraCarga) {
                            criarJobsImpressao(url, parsed.copias, parsed.guestbook);
                        }
                    }

                    render();
                    atualizarBarraStatus();
                    debug(`✅ ${todasFotos.length} foto(s) na galeria`);
                }

                primeiraCarga = false;
            } catch (e) {
                debug('⚠️ ' + e.message);
            }
        }

        /**
         * Analisa o nome da foto para extrair cópias e guestbook.
         * Exemplos:
         *   1717000000000_1c.jpg              → { copias: 1, guestbook: false }
         *   1717000000000_2c.jpg              → { copias: 2, guestbook: false }
         *   1717000000000_1c_guestbook.jpg    → { copias: 1, guestbook: true }
         *   1717000000000_2c_guestbook.jpg    → { copias: 2, guestbook: true }
         */
        function analisarNomeFoto(key) {
            const kl = key.toLowerCase();
            let copias = 1;
            const match = kl.match(/_(\d+)c/);
            if (match) copias = parseInt(match[1], 10) || 1;
            const guestbook = kl.includes('_guestbook');
            return { copias, guestbook };
        }
        /* ◀◀◀ FIM: ATUALIZAÇÃO DA GALERIA */

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INÍCIO: RENDERIZAÇÃO DA GRADE ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function render() {
            const grid = document.getElementById('grid-fotos');

            if (todasFotos.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:60px;color:#555;">
                        <i class="fa-solid fa-camera-retro" style="font-size:64px;display:block;margin-bottom:20px;opacity:0.3;"></i>
                        Nenhuma foto ainda
                    </div>`;
                return;
            }

            // Mais recentes primeiro
            grid.innerHTML = todasFotos.slice().reverse().map(f => `
                <div class="card" onclick="abrirZoom(${f.id})">
                    <span class="badge-id">#${f.id}</span>
                    <span class="badge-copias">${f.copias}× cópia${f.copias > 1 ? 's' : ''}</span>
                    ${f.guestbook
                        ? `<span class="badge-guestbook"><i class="fa-solid fa-book-open"></i> GUESTBOOK</span>`
                        : ''}
                    <span class="print-state ${f.impressa ? 'done' : ''}">
                        <i class="fa-solid ${f.impressa ? 'fa-check-circle' : 'fa-clock'}"></i>
                        ${f.impressa ? 'IMPRESSA' : 'NA FILA'}
                    </span>
                    <img src="${f.url}" loading="lazy" alt="Foto #${f.id}">
                </div>
            `).join('');
        }
        /* ◀◀◀ FIM: RENDERIZAÇÃO DA GRADE */

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INÍCIO: FILA E EXECUÇÃO DE IMPRESSÃO ◀◀◀
           ═══════════════════════════════════════════════════════════════
           Cada "job" representa UMA FOLHA (impressão única).
           Se a foto tem 2 cópias, o job tem 2 <img> na folha.
           Se tem guestbook, o guestbook vira um job SEPARADO (outra folha).
        */

        /**
         * Cria os jobs necessários para uma foto.
         * @param {string} url  - URL da foto
         * @param {number} copias - Quantas cópias físicas (1, 2, 3...)
         * @param {boolean} guestbook - Se tem versão guestbook
         */
        function criarJobsImpressao(url, copias, guestbook) {
            // JOB 1: foto comum (N cópias na mesma folha)
            printQueue.push({
                tipo: 'foto',
                url,
                quantidade: copias,
                descricao: `${copias}× cópia${copias > 1 ? 's' : ''}`
            });

            // JOB 2 (opcional): guestbook (folha separada)
            if (guestbook) {
                printQueue.push({
                    tipo: 'guestbook',
                    url,
                    quantidade: 1,
                    descricao: '1× guestbook'
                });
            }

            atualizarBarraStatus();
            processarFilaImpressao();
        }

        function atualizarBarraStatus() {
            const bar = document.getElementById('print-status-bar');
            const txt = document.getElementById('print-status-text');

            if (isPrinting && printJobAtual) {
                bar.classList.add('active');
                txt.innerText = `Imprimindo: ${printJobAtual.descricao} (${printQueue.length} na fila)`;
            } else if (printQueue.length > 0) {
                bar.classList.add('active');
                txt.innerText = `${printQueue.length} job(s) na fila`;
            } else {
                bar.classList.remove('active');
                txt.innerText = 'Aguardando fotos';
            }
        }

        async function processarFilaImpressao() {
            if (isPrinting) return;
            if (printQueue.length === 0) {
                isPrinting = false;
                printJobAtual = null;
                atualizarBarraStatus();
                return;
            }

            isPrinting = true;
            printJobAtual = printQueue.shift();
            atualizarBarraStatus();

            try {
                await executarJobImpressao(printJobAtual);
            } catch (e) {
                console.error('Erro ao imprimir job:', e);
                debug('❌ Erro na impressão: ' + e.message);
            }

            // Aguarda o print() terminar e libera o próximo
            setTimeout(() => {
                isPrinting = false;
                printJobAtual = null;
                atualizarBarraStatus();
                processarFilaImpressao();
            }, PRINT_DELAY_MS);
        }

        /**
         * Executa o job: monta o HTML de impressão, chama window.print().
         */
        async function executarJobImpressao(job) {
            debug(`🖨️ Imprimindo: ${job.descricao}`);

            // Aguarda a imagem carregar antes de imprimir
            await preloadImagem(job.url);

            // Monta folha de impressão
            const printArea = document.getElementById('print-area');
            const sheet = document.createElement('div');
            sheet.className = 'print-sheet';

            // Define layout com base no formato do evento
            const layout = LAYOUT_POR_FORMATO[formatoAtual] || { cols: 1, rows: 1 };
            const totalFotosFolha = Math.min(job.quantidade, layout.cols * layout.rows);

            // Cria N <img> na folha
            for (let i = 0; i < totalFotosFolha; i++) {
                const img = document.createElement('img');
                img.src = job.url;
                img.alt = `Cópia ${i + 1}`;
                // Define tamanho com base na quantidade
                const isMulti = totalFotosFolha > 1;
                img.style.width = isMulti ? `${100 / layout.cols - 2}%` : '100%';
                img.style.height = isMulti ? `${100 / layout.rows - 2}%` : '100%';
                sheet.appendChild(img);
            }

            printArea.innerHTML = '';
            printArea.appendChild(sheet);

            // Pequeno delay para o navegador renderizar
            await new Promise(r => setTimeout(r, 400));

            // Dispara impressão
            window.focus();
            window.print();

            debug(`✅ Job "${job.descricao}" enviado`);
        }

                function preloadImagem(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                setTimeout(() => resolve(false), 8000); // timeout de 8s
            });
        }
        /* ◀◀◀ FIM: FILA E EXECUÇÃO DE IMPRESSÃO */

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INÍCIO: MODAL DE ZOOM ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function abrirZoom(id) {
            const foto = todasFotos.find(f => f.id === id);
            if (!foto) return;

            document.getElementById('img-zoom').src = foto.url;
            document.getElementById('zoom-id').innerText = `#${foto.id}`;
            document.getElementById('zoom-copias').innerText = `${foto.copias}×`;
            document.getElementById('zoom-guestbook').innerText = foto.guestbook ? 'SIM' : 'NÃO';

            document.getElementById('btn-excluir-zoom').onclick = () => excluirFoto(foto.key);
            document.getElementById('modal-zoom').classList.add('active');
        }

        function fecharZoom() {
            document.getElementById('modal-zoom').classList.remove('active');
        }

        function reimprimirAtual() {
            const url = document.getElementById('img-zoom').src;
            if (!url) return;

            // Encontra a foto pelo URL
            const foto = todasFotos.find(f => f.url === url);
            if (!foto) {
                // Fallback: imprime 1 cópia simples
                criarJobsImpressao(url, 1, false);
                return;
            }

            criarJobsImpressao(foto.url, foto.copias, foto.guestbook);
            debug(`🔁 Reimpressão: ${foto.copias}× ${foto.guestbook ? '+ guestbook' : ''}`);
            fecharZoom();
        }

        async function excluirFoto(key) {
            if (!confirm("Deseja realmente excluir esta foto?")) return;

            try {
                await fetch(`${API}/photo?key=${encodeURIComponent(key)}`, { method: 'DELETE' });

                // Remove do estado local
                todasFotos = todasFotos.filter(f => f.key !== key);
                chavesLocais.delete(key);

                // Reindexa IDs
                todasFotos.forEach((f, i) => f.id = i + 1);

                fecharZoom();
                render();
                atualizarBarraStatus();
                debug('🗑️ Foto excluída');
            } catch (e) {
                alert('Erro ao excluir foto: ' + e.message);
            }
        }
        /* ◀◀◀ FIM: MODAL DE ZOOM */

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INÍCIO: BUSCA POR ID ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function executarBusca() {
            const input = document.getElementById('input-busca');
            const idBusca = parseInt(input.value, 10);

            if (!idBusca || isNaN(idBusca)) {
                alert('Digite um ID válido');
                return;
            }

            const foto = todasFotos.find(f => f.id === idBusca);
            if (foto) {
                abrirZoom(foto.id);
                input.value = '';
            } else {
                alert(`ID #${idBusca} não encontrado`);
            }
        }
        /* ◀◀◀ FIM: BUSCA POR ID */

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INÍCIO: ATALHOS E EVENTOS GLOBAIS ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('modal-zoom').classList.contains('active')) {
                    fecharZoom();
                }
            }
        });

        // Fecha modal ao clicar fora
        document.getElementById('modal-zoom').addEventListener('click', (e) => {
            if (e.target.id === 'modal-zoom') fecharZoom();
        });

        // Re-sync quando aba volta ao foco
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) atualizar();
        });
        /* ◀◀◀ FIM: ATALHOS E EVENTOS GLOBAIS */

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INÍCIO: INICIALIZAÇÃO ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        window.addEventListener('load', () => {
            debug('🚀 Central de Impressão v5.0 pronta');
            atualizar();
            setInterval(atualizar, POLL_INTERVAL_MS);
        });
        /* ◀◀◀ FIM: INICIALIZAÇÃO */
    </script>
</body>
