<!-- ▶▶▶ INÍCIO DO ARQUIVO galeria.html — CENTRAL v6.0 PROFISSIONAL ◀◀◀ -->
<!-- (SUBSTITUA O ARQUIVO INTEIRO POR ESTE)                              -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Central de Impressão v6.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════════
           TOKENS
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --accent: #39ff14;
            --accent-dim: rgba(57, 255, 20, 0.12);
            --accent-glow: 0 0 24px rgba(57, 255, 20, 0.45);
            --danger: #ff3131;
            --danger-dim: rgba(255, 49, 49, 0.15);
            --info: #00e5ff;
            --info-dim: rgba(0, 229, 255, 0.12);
            --warn: #ffb800;
            --warn-dim: rgba(255, 184, 0, 0.15);

            --bg-0: #000000;
            --bg-1: #0a0a0a;
            --bg-2: #111111;
            --bg-3: #1a1a1a;
            --bg-4: #222222;

            --text-0: #ffffff;
            --text-1: #e0e0e0;
            --text-2: #999999;
            --text-3: #555555;

            --border-1: rgba(255, 255, 255, 0.06);
            --border-2: rgba(255, 255, 255, 0.1);
            --border-accent: rgba(57, 255, 20, 0.3);

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.65);

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.15s ease;

            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'Space Grotesk', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: var(--font-body);
            background: var(--bg-0);
            color: var(--text-0);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background:
                radial-gradient(circle at 50% 0%, rgba(26, 58, 18, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(57, 255, 20, 0.03) 0%, transparent 40%),
                var(--bg-0);
        }

        /* Grid sutil de fundo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(circle at 50% 30%, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 30%, transparent 75%);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

        /* ═══════════════════════════════════════════════════════════════
           ÁREA DE IMPRESSÃO (@media print)
           ═══════════════════════════════════════════════════════════════ */
        #print-area { display: none; }

        @media print {
            @page { margin: 0; size: auto; }
            body * { visibility: hidden !important; display: none !important; }
            #print-area, #print-area * {
                visibility: visible !important;
                display: block !important;
            }
            #print-area {
                position: absolute !important;
                inset: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            .print-sheet {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                align-items: center !important;
                width: 100% !important;
                height: 100% !important;
                gap: 4mm !important;
                padding: 4mm !important;
                background: #fff !important;
            }
            .print-sheet img {
                object-fit: contain !important;
                max-height: 100% !important;
                max-width: 100% !important;
                display: block !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ */
        header {
            position: relative;
            z-index: 10;
            padding: 32px 48px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-container {
            position: absolute;
            left: 48px;
            top: 32px;
            text-align: left;
            border-left: 3px solid var(--accent);
            padding-left: 16px;
        }
        .status-label {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-3);
            font-weight: 800;
            margin-bottom: 3px;
        }
        #nome-evento {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }
        #tipo-formato {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-1);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .brand-center { text-align: center; margin-top: 16px; }
        .brand-center h1 {
            font-family: var(--font-display);
            font-size: clamp(32px, 5vw, 48px);
            color: var(--accent);
            text-shadow: var(--accent-glow), 0 0 60px rgba(57, 255, 20, 0.25);
            letter-spacing: 8px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            animation: titleGlow 3s ease-in-out infinite;
        }
        @keyframes titleGlow {
            0%, 100% { text-shadow: var(--accent-glow), 0 0 60px rgba(57,255,20,0.25); }
            50% { text-shadow: var(--accent-glow), 0 0 90px rgba(57,255,20,0.45); }
        }
        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-3);
            margin-top: 8px;
            font-weight: 800;
        }

        /* Barra de status da impressão */
        .print-status-bar {
            margin-top: 22px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 22px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-1);
            border-radius: 30px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-2);
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        .print-status-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-3);
            transition: var(--transition);
        }
        .print-status-bar.active { color: var(--accent); border-color: var(--border-accent); }
        .print-status-bar.active .dot {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulseDot 1s ease-in-out infinite;
        }
        .print-status-bar.paused { color: var(--warn); border-color: rgba(255, 184, 0, 0.4); }
        .print-status-bar.paused .dot {
            background: var(--warn);
            box-shadow: 0 0 10px var(--warn);
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        .print-controls {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-2);
            color: var(--text-1);
            padding: 9px 16px;
            border-radius: 24px;
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-fast);
        }
        .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .ctrl-btn.pause:hover { border-color: var(--warn); color: var(--warn); background: var(--warn-dim); }
        .ctrl-btn.pause.active { border-color: var(--warn); color: var(--warn); background: var(--warn-dim); }
        .ctrl-btn .badge-qty {
            background: var(--accent);
            color: var(--bg-0);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0;
        }
        .ctrl-btn.pause.active .badge-qty { background: var(--warn); }

        /* Busca */
        .search-box {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .search-box input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-2);
            color: var(--text-0);
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            width: 200px;
            outline: none;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: var(--transition-fast);
        }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .search-box input::placeholder { color: var(--text-3); font-family: var(--font-body); letter-spacing: 2px; font-size: 11px; }
        .search-btn {
            background: var(--accent);
            color: var(--bg-0);
            border: none;
            padding: 0 20px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition-fast);
        }
        .search-btn:hover { box-shadow: var(--accent-glow); transform: translateY(-1px); }

        /* ═══════════════════════════════════════════════════════════════
           BOTÃO MENU (hamburger)
           ═══════════════════════════════════════════════════════════════ */
        .menu-trigger {
            position: fixed;
            right: 32px;
            top: 32px;
            z-index: 5100;
            width: 48px;
            height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-2);
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: var(--transition-fast);
        }
        .menu-trigger:hover { border-color: var(--accent); box-shadow: var(--accent-glow); }
        .menu-trigger span {
            display: block;
            width: 22px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: var(--transition);
        }
        .menu-trigger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-trigger.active span:nth-child(2) { opacity: 0; }
        .menu-trigger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ═══════════════════════════════════════════════════════════════
           SIDEBAR
           ═══════════════════════════════════════════════════════════════ */
        .sidebar {
            position: fixed;
            right: -360px;
            top: 0;
            width: 320px;
            height: 100%;
            background: rgba(10, 10, 10, 0.98);
            z-index: 5000;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 100px 24px 24px;
            border-left: 1px solid var(--border-accent);
            backdrop-filter: blur(24px);
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
            overflow-y: auto;
        }
        .sidebar.active { right: 0; }
        .sidebar-title {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 18px;
            padding-left: 4px;
        }
        .sidebar-btn {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-2);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-0);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
            transition: var(--transition-fast);
        }
        .sidebar-btn i {
            width: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .sidebar-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
        .sidebar-btn.danger i { color: var(--danger); }
        .sidebar-btn.danger:hover { border-color: var(--danger); background: var(--danger-dim); }

        .sidebar-section {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--border-1);
        }
        .sidebar-section-title {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 12px;
            padding-left: 4px;
        }
        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            gap: 12px;
        }
        .config-row label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-1);
            text-transform: uppercase;
        }
        .config-row select,
        .config-row input {
            background: var(--bg-1);
            border: 1px solid var(--border-2);
            color: var(--text-0);
            padding: 7px 10px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            outline: none;
            width: 110px;
            text-align: center;
        }
        .config-row select:focus,
        .config-row input:focus { border-color: var(--accent); }

        /* ═══════════════════════════════════════════════════════════════
           GRID DE FOTOS
           ═══════════════════════════════════════════════════════════════ */
        .grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            padding: 20px 48px 140px;
        }

        .card {
            background: linear-gradient(160deg, rgba(20,20,20,0.9) 0%, rgba(10,10,10,0.9) 100%);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-1);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            box-shadow: var(--shadow-sm);
            animation: cardIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-md), 0 0 30px rgba(57, 255, 20, 0.15);
        }
        .card img {
            width: 100%;
            display: block;
            aspect-ratio: 3/4;
            object-fit: cover;
            transition: var(--transition);
        }
        .card:hover img { transform: scale(1.03); }

        .card .badge-id {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent);
            color: var(--bg-0);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 900;
            z-index: 2;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(57,255,20,0.4);
        }
        .card .badge-copias {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 900;
            z-index: 2;
            backdrop-filter: blur(6px);
        }
        .card .badge-guestbook {
            position: absolute;
            bottom: 42px;
            right: 10px;
            background: rgba(0, 150, 255, 0.95);
            border: 1px solid var(--info);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(0,229,255,0.35);
        }
        .card .print-state {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--border-2);
            color: var(--text-2);
            padding: 5px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 900;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .card .print-state.done {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(57, 255, 20, 0.08);
        }
        .card .print-state.printing {
            border-color: var(--warn);
            color: var(--warn);
            background: rgba(255, 184, 0, 0.08);
            animation: pulseDot 1.2s infinite;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-3);
        }
        .empty-state i {
            font-size: 72px;
            display: block;
            margin-bottom: 20px;
            opacity: 0.25;
            color: var(--accent);
        }
        .empty-state-title {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--text-2);
            font-weight: 800;
            margin-bottom: 6px;
        }
        .empty-state-sub {
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ═══════════════════════════════════════════════════════════════
           LOG DRAWER (canto inferior direito)
           ═══════════════════════════════════════════════════════════════ */
        .log-drawer {
            position: fixed;
            bottom: 88px;
            right: 24px;
            width: 320px;
            max-height: 280px;
            background: rgba(10, 10, 10, 0.96);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-md);
            backdrop-filter: blur(20px);
            z-index: 400;
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: logIn 0.3s ease;
        }
        .log-drawer.active { display: flex; }
        @keyframes logIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(57, 255, 20, 0.04);
        }
        .log-title {
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .log-close {
            background: none;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            transition: var(--transition-fast);
        }
        .log-close:hover { color: var(--danger); }
        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            font-family: var(--font-mono);
            font-size: 10px;
        }
        .log-line {
            padding: 5px 8px;
            border-radius: 4px;
            margin-bottom: 3px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            line-height: 1.4;
        }
        .log-line .ts {
            color: var(--text-3);
            flex-shrink: 0;
            font-size: 9px;
        }
        .log-line .msg { color: var(--text-1); flex: 1; }
        .log-line.success .msg { color: var(--accent); }
        .log-line.error .msg { color: var(--danger); }
        .log-line.warn .msg { color: var(--warn); }
        .log-line.info .msg { color: var(--info); }

        /* Botão flutuante de log */
        .log-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--border-accent);
            border-radius: 50%;
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 401;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-md);
            transition: var(--transition-fast);
            position: fixed;
        }
        .log-toggle:hover { box-shadow: var(--accent-glow); transform: scale(1.05); }
        .log-toggle .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 900;
            min-width: 18px;
            height: 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        /* ═══════════════════════════════════════════════════════════════
           MODAL DE ZOOM
           ═══════════════════════════════════════════════════════════════ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.97);
            z-index: 6000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(12px);
        }
        .modal.active { display: flex; animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }
        .modal img {
            max-width: 90%;
            max-height: 65vh;
            border: 2px solid var(--accent);
            border-radius: var(--radius-md);
            margin-bottom: 22px;
            box-shadow: 0 0 60px rgba(57, 255, 20, 0.35);
            object-fit: contain;
        }
        .modal-info {
            display: flex;
            gap: 24px;
            margin-bottom: 22px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-wrap: wrap;
            justify-content: center;
        }
        .modal-info > div {
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid var(--border-2);
            padding: 8px 16px;
            border-radius: 24px;
        }
        .modal-info span { color: var(--text-3); }
        .modal-info strong { color: var(--accent); }
        .modal-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-act {
            border: none;
            padding: 14px 26px;
            border-radius: 30px;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-act:hover { transform: translateY(-2px); }
        .btn-voltar { background: #333; color: #fff; }
        .btn-voltar:hover { background: #444; }
        .btn-reimprimir { background: var(--accent); color: var(--bg-0); }
        .btn-reimprimir:hover { box-shadow: var(--accent-glow); }
        .btn-excluir { background: var(--danger); color: #fff; }
        .btn-excluir:hover { background: #e02020; box-shadow: 0 0 20px rgba(255,49,49,0.5); }

        /* ═══════════════════════════════════════════════════════════════
           DEBUG BAR
           ═══════════════════════════════════════════════════════════════ */
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.92);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 9px 14px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-accent);
            font-weight: 700;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════════════════════════
           TOAST
           ═══════════════════════════════════════════════════════════════ */
                .toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 7000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: calc(100% - 40px);
            max-width: 380px;
            pointer-events: none;
        }
        .toast {
            position: relative;
            background: rgba(10, 10, 10, 0.96);
            border: 1px solid var(--border-2);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-lg);
            pointer-events: auto;
            backdrop-filter: blur(16px);
            animation: toastIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.error { border-left-color: var(--danger); }
        .toast.info { border-left-color: var(--info); }
        .toast.warning { border-left-color: var(--warn); }
        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            background: var(--accent-dim);
            color: var(--accent);
        }
        .toast.error .toast-icon { background: var(--danger-dim); color: var(--danger); }
        .toast.info .toast-icon { background: var(--info-dim); color: var(--info); }
        .toast.warning .toast-icon { background: var(--warn-dim); color: var(--warn); }
        .toast-title { font-size: 12px; font-weight: 800; margin-bottom: 3px; }
        .toast-message { font-size: 11px; color: var(--text-2); line-height: 1.3; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toast.removing { animation: toastOut 0.3s ease forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-16px) scale(0.95); } }

        /* ═══════════════════════════════════════════════════════════════
           RESPONSIVO
           ═══════════════════════════════════════════════════════════════ */
        @media (max-width: 900px) {
            .status-container {
                position: static;
                text-align: center;
                margin-bottom: 16px;
                border-left: none;
                border-top: 3px solid var(--accent);
                padding-left: 0;
                padding-top: 12px;
            }
            header { padding: 20px; }
            .menu-trigger { right: 20px; top: 20px; }
            .grid { padding: 16px 20px 140px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .log-drawer { right: 12px; width: calc(100% - 24px); max-width: 340px; }
            .brand-center h1 { letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════
         MENU TRIGGER (HAMBURGER)
         ═══════════════════════════════════════════════════════════════ -->
    <div class="menu-trigger" id="menu-trigger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         HEADER
         ═══════════════════════════════════════════════════════════════ -->
    <header>
        <div class="status-container">
            <div class="status-label">Status Evento</div>
            <div id="nome-evento">Carregando...</div>
            <div id="tipo-formato">--</div>
        </div>

        <div class="brand-center">
            <h1>PHOTO PRINT</h1>
            <div class="brand-subtitle">central de impressão</div>

            <div class="print-status-bar" id="print-status-bar">
                <span class="dot"></span>
                <span id="print-status-text">Aguardando fotos</span>
            </div>

            <div class="print-controls">
                <button class="ctrl-btn pause" id="btn-pause" onclick="togglePausa()">
                    <i class="fa-solid fa-pause"></i>
                    <span id="btn-pause-text">Pausar</span>
                </button>
                <button class="ctrl-btn" onclick="limparFilaManual()">
                    <i class="fa-solid fa-broom"></i>
                    Limpar Fila
                    <span class="badge-qty" id="fila-count">0</span>
                </button>
            </div>

            <div class="search-box">
                <input type="number" id="input-busca" placeholder="BUSCAR POR ID"
                       onkeydown="if(event.key==='Enter') executarBusca()">
                <button class="search-btn" onclick="executarBusca()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
         SIDEBAR
         ═══════════════════════════════════════════════════════════════ -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">Menu de Controle</div>

        <button class="sidebar-btn" onclick="baixarZip()">
            <i class="fa-solid fa-download"></i>
            Baixar Galeria (.zip)
        </button>

        <button class="sidebar-btn danger" onclick="limparTudo()">
            <i class="fa-solid fa-trash"></i>
            Apagar Servidor
        </button>

        <div class="sidebar-section">
            <div class="sidebar-section-title">Configurações</div>

            <div class="config-row">
                <label>Delay entre jobs</label>
                <select id="config-delay" onchange="salvarConfigDelay(this.value)">
                    <option value="1000">1s</option>
                    <option value="1500">1.5s</option>
                    <option value="2000">2s</option>
                    <option value="2500" selected>2.5s</option>
                    <option value="3000">3s</option>
                    <option value="4000">4s</option>
                    <option value="5000">5s</option>
                    <option value="7000">7s</option>
                    <option value="10000">10s</option>
                </select>
            </div>

            <div class="config-row">
                <label>Auto-impressão</label>
                <select id="config-auto" onchange="salvarConfigAuto(this.value)">
                    <option value="1" selected>Ativada</option>
                    <option value="0">Desativada</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         GRID
         ═══════════════════════════════════════════════════════════════ -->
    <main class="grid" id="grid-fotos"></main>

    <!-- ═══════════════════════════════════════════════════════════════
         MODAL DE ZOOM
         ═══════════════════════════════════════════════════════════════ -->
    <div class="modal" id="modal-zoom">
        <img id="img-zoom" src="" alt="Zoom">
        <div class="modal-info">
            <div><span>ID:</span> <strong id="zoom-id">#--</strong></div>
            <div><span>Cópias:</span> <strong id="zoom-copias">--</strong></div>
            <div><span>Guestbook:</span> <strong id="zoom-guestbook">--</strong></div>
        </div>
        <div class="modal-controls">
            <button class="btn-act btn-voltar" onclick="fecharZoom()">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
            <button class="btn-act btn-reimprimir" onclick="reimprimirAtual()">
                <i class="fa-solid fa-print"></i> Reimprimir
            </button>
            <button class="btn-act btn-excluir" id="btn-excluir-zoom">
                <i class="fa-solid fa-trash"></i> Excluir
            </button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         LOG DRAWER
         ═══════════════════════════════════════════════════════════════ -->
    <div class="log-drawer" id="log-drawer">
        <div class="log-header">
            <span class="log-title"><i class="fa-solid fa-terminal"></i> Log de Impressão</span>
            <button class="log-close" onclick="toggleLog()"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="log-body" id="log-body"></div>
    </div>

    <button class="log-toggle" id="log-toggle" onclick="toggleLog()">
        <i class="fa-solid fa-terminal"></i>
        <span class="badge-count" id="log-badge" style="display:none">0</span>
    </button>

    <!-- ═══════════════════════════════════════════════════════════════
         ÁREA DE IMPRESSÃO (invisível)
         ═══════════════════════════════════════════════════════════════ -->
    <div id="print-area"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         DEBUG BAR + TOASTS
         ═══════════════════════════════════════════════════════════════ -->
    <div class="debug-info" id="debug-info">SISTEMA PRONTO</div>
    <div class="toast-container" id="toast-container"></div>

    <!-- ═══════════════════════════════════════════════════════════════
         SCRIPT PRINCIPAL
         ═══════════════════════════════════════════════════════════════ -->
    <script>
        /* ═══════════════════════════════════════════════════════════════
           CONFIGURAÇÕES
           ═══════════════════════════════════════════════════════════════ */
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const POLL_INTERVAL_MS = 4000;
        const MAX_LOG_LINES = 30;

        const LS_QUEUE = 'pp_print_queue_v6';
        const LS_CONFIG = 'pp_print_config_v6';
        const LS_HISTORY = 'pp_print_history_v6';

        const LAYOUT_POR_FORMATO = {
            "10X15V":   { cols: 1, rows: 1 },
            "10X15H":   { cols: 1, rows: 1 },
            "TIRINHA":  { cols: 1, rows: 1 },
            "POLAROID": { cols: 2, rows: 2 }
        };

        /* ═══════════════════════════════════════════════════════════════
           ESTADO GLOBAL
           ═══════════════════════════════════════════════════════════════ */
        let todasFotos = [];
        let chavesLocais = new Set();
        let eventoAtual = "";
        let eventoIdAtual = "";
        let formatoAtual = "10X15V";
        let primeiraCarga = true;

        let printQueue = [];
        let isPrinting = false;
        let printJobAtual = null;
        let pausado = false;
        let printDelayMs = 2500;
        let autoImpressao = true;

        let logHistory = [];
        let logNaoLidas = 0;
        let logAberto = false;

        /* ═══════════════════════════════════════════════════════════════
           PERSISTÊNCIA (sessionStorage + localStorage)
           ═══════════════════════════════════════════════════════════════ */
        function salvarFila() {
            try { sessionStorage.setItem(LS_QUEUE, JSON.stringify(printQueue)); } catch(e) {}
        }
        function carregarFila() {
            try {
                const raw = sessionStorage.getItem(LS_QUEUE);
                if (raw) printQueue = JSON.parse(raw) || [];
            } catch(e) { printQueue = []; }
        }
        function limparFilaStorage() {
            try { sessionStorage.removeItem(LS_QUEUE); } catch(e) {}
        }

        function salvarConfig() {
            try {
                localStorage.setItem(LS_CONFIG, JSON.stringify({
                    printDelayMs, autoImpressao
                }));
            } catch(e) {}
        }
        function carregarConfig() {
            try {
                const raw = localStorage.getItem(LS_CONFIG);
                if (raw) {
                    const c = JSON.parse(raw);
                    if (typeof c.printDelayMs === 'number') printDelayMs = c.printDelayMs;
                    if (typeof c.autoImpressao === 'boolean') autoImpressao = c.autoImpressao;
                }
            } catch(e) {}
        }

        function salvarHistorico() {
            try {
                localStorage.setItem(LS_HISTORY, JSON.stringify(logHistory.slice(-MAX_LOG_LINES)));
            } catch(e) {}
        }
        function carregarHistorico() {
            try {
                const raw = localStorage.getItem(LS_HISTORY);
                if (raw) logHistory = JSON.parse(raw) || [];
            } catch(e) { logHistory = []; }
        }

        /* ═══════════════════════════════════════════════════════════════
           HELPERS
           ═══════════════════════════════════════════════════════════════ */
        function debug(msg) {
            console.log('[GALERIA]', msg);
            const el = document.getElementById('debug-info');
            if (el) el.innerText = msg;
        }

        function traduzirFormato(f) {
            if (!f) return "--";
            const up = f.toUpperCase().trim();
            if (up.includes("10X15H")) return "10x15 Horizontal";
            if (up.includes("10X15V")) return "10x15 Vertical";
            if (up.includes("TIRINHA")) return "Tirinha";
            if (up.includes("POLAROID")) return "Polaroid";
            return up;
        }

        function mostrarToast(titulo, mensagem, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            const iconMap = {
                success: 'fa-check',
                error: 'fa-exclamation-triangle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation'
            };
            toast.innerHTML = `
                <div class="toast-icon"><i class="fas ${iconMap[tipo] || 'fa-check'}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${titulo}</div>
                    <div class="toast-message">${mensagem}</div>
                </div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ LOG DE IMPRESSÃO ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function addLog(msg, tipo = 'info') {
            const agora = new Date();
            const ts = `${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}:${String(agora.getSeconds()).padStart(2,'0')}`;
            const entry = { ts, msg, tipo };
            logHistory.push(entry);
            if (logHistory.length > MAX_LOG_LINES) logHistory.shift();

            renderLogEntry(entry);
            salvarHistorico();

            // Atualiza badge se o drawer estiver fechado
            if (!logAberto) {
                logNaoLidas++;
                const badge = document.getElementById('log-badge');
                if (badge) {
                    badge.innerText = logNaoLidas > 99 ? '99+' : logNaoLidas;
                    badge.style.display = 'flex';
                }
            }
        }

        function renderLogEntry(entry) {
            const body = document.getElementById('log-body');
            if (!body) return;
            const line = document.createElement('div');
            line.className = `log-line ${entry.tipo}`;
            line.innerHTML = `<span class="ts">${entry.ts}</span><span class="msg">${entry.msg}</span>`;
            body.appendChild(line);

            // Mantém apenas MAX_LOG_LINES no DOM
            while (body.children.length > MAX_LOG_LINES) {
                body.removeChild(body.firstChild);
            }
            body.scrollTop = body.scrollHeight;
        }

        function renderLogCompleto() {
            const body = document.getElementById('log-body');
            if (!body) return;
            body.innerHTML = '';
            logHistory.forEach(entry => renderLogEntry(entry));
        }

        function toggleLog() {
            logAberto = !logAberto;
            const drawer = document.getElementById('log-drawer');
            drawer.classList.toggle('active', logAberto);

            if (logAberto) {
                logNaoLidas = 0;
                const badge = document.getElementById('log-badge');
                if (badge) badge.style.display = 'none';
                renderLogCompleto();
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ SIDEBAR + CONFIG ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const trigger = document.getElementById('menu-trigger');
            sb.classList.toggle('active');
            trigger.classList.toggle('active');
        }

        function salvarConfigDelay(valor) {
            printDelayMs = parseInt(valor, 10) || 2500;
            salvarConfig();
            mostrarToast('Configuração salva', `Delay entre jobs: ${printDelayMs}ms`, 'info');
        }

        function salvarConfigAuto(valor) {
            autoImpressao = valor === '1';
            salvarConfig();
            mostrarToast(
                'Configuração salva',
                `Auto-impressão ${autoImpressao ? 'ativada' : 'desativada'}`,
                autoImpressao ? 'success' : 'warning'
            );
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ ATUALIZAÇÃO DA GALERIA (polling) ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        async function atualizar() {
            try {
                const r1 = await fetch(`${API}/get-all-states?t=${Date.now()}`).catch(() => null);
                if (!r1 || !r1.ok) return;

                const config = await r1.json();
                const evt = (config.config && config.config.evento) ? config.config.evento : "Geral";
                const evtId = (config.config && config.config.eventoId) ? config.config.eventoId : "";
                formatoAtual = (config.config && config.config.formato)
                    ? config.config.formato.toUpperCase().trim()
                    : "10X15V";

                if (eventoIdAtual !== evtId) {
                    eventoAtual = evt;
                    eventoIdAtual = evtId;
                    todasFotos = [];
                    chavesLocais.clear();
                    printQueue = [];
                    limparFilaStorage();
                    primeiraCarga = true;
                    document.getElementById('grid-fotos').innerHTML = "";
                    atualizarBarraStatus();
                    addLog(`🔄 Troca de evento: ${evt}`, 'info');
                    debug('🔄 Evento: ' + evt);
                }

                document.getElementById('nome-evento').innerText = eventoAtual;
                document.getElementById('tipo-formato').innerText = traduzirFormato(formatoAtual);

                if (!eventoIdAtual) {
                    debug('⏳ Aguardando evento ativo...');
                    return;
                }

                const r2 = await fetch(
                    `${API}/list-photos?evento=${encodeURIComponent(eventoAtual)}&t=${Date.now()}`
                ).catch(() => null);
                if (!r2 || !r2.ok) return;

                const dados = await r2.json();
                const fotosValidas = Array.isArray(dados)
                    ? dados.filter(f => !f.key.toLowerCase().includes('moldura'))
                    : [];

                const novas = fotosValidas.filter(f => !chavesLocais.has(f.key));

                if (novas.length > 0) {
                    debug(`📷 ${novas.length} nova(s) foto(s)`);

                    for (const f of novas) {
                        const url = `${API}/photo?key=${encodeURIComponent(f.key)}`;
                        const parsed = analisarNomeFoto(f.key);

                        todasFotos.push({
                            id: todasFotos.length + 1,
                            url,
                            key: f.key,
                            copias: parsed.copias,
                            guestbook: parsed.guestbook,
                            impressa: primeiraCarga
                        });
                        chavesLocais.add(f.key);

                        if (!primeiraCarga && autoImpressao) {
                            criarJobsImpressao(url, parsed.copias, parsed.guestbook);
                            addLog(`📥 Nova foto: ${parsed.copias}× ${parsed.guestbook ? '+ guestbook' : ''}`, 'success');
                        } else if (!primeiraCarga && !autoImpressao) {
                            addLog(`⏸️ Foto recebida (auto-impressão off): ${f.key.split('/').pop()}`, 'warn');
                        }
                    }

                    render();
                    atualizarBarraStatus();
                    debug(`✅ ${todasFotos.length} foto(s) na galeria`);
                }

                primeiraCarga = false;
            } catch (e) {
                debug('⚠️ ' + e.message);
            }
        }

        function analisarNomeFoto(key) {
            const kl = key.toLowerCase();
            let copias = 1;
            const match = kl.match(/_(\d+)c/);
            if (match) copias = parseInt(match[1], 10) || 1;
            const guestbook = kl.includes('_guestbook');
            return { copias, guestbook };
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ RENDERIZAÇÃO DA GRADE ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function render() {
            const grid = document.getElementById('grid-fotos');

            if (todasFotos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-camera-retro"></i>
                        <div class="empty-state-title">Nenhuma foto ainda</div>
                        <div class="empty-state-sub">As fotos aparecerão aqui conforme forem capturadas</div>
                    </div>`;
                return;
            }

            grid.innerHTML = todasFotos.slice().reverse().map((f, i) => {
                // Determina estado de impressão
                const estaNaFila = printQueue.some(j => j.url === f.url);
                let printStateClass = '';
                let printStateIcon = 'fa-clock';
                let printStateText = 'NA FILA';

                if (f.impressa) {
                    printStateClass = 'done';
                    printStateIcon = 'fa-check-circle';
                    printStateText = 'IMPRESSA';
                } else if (estaNaFila && printJobAtual && printJobAtual.url === f.url) {
                    printStateClass = 'printing';
                    printStateIcon = 'fa-spinner fa-spin';
                    printStateText = 'IMPRIMINDO';
                }

                return `
                    <div class="card" style="animation-delay:${Math.min(i * 20, 300)}ms" onclick="abrirZoom(${f.id})">
                        <span class="badge-id">#${f.id}</span>
                        <span class="badge-copias">${f.copias}× cópia${f.copias > 1 ? 's' : ''}</span>
                        ${f.guestbook
                            ? `<span class="badge-guestbook"><i class="fa-solid fa-book-open"></i> GUESTBOOK</span>`
                            : ''}
                        <span class="print-state ${printStateClass}">
                            <i class="fa-solid ${printStateIcon}"></i> ${printStateText}
                        </span>
                        <img src="${f.url}" loading="lazy" alt="Foto #${f.id}">
                    </div>`;
            }).join('');
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ FILA E IMPRESSÃO ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function criarJobsImpressao(url, copias, guestbook) {
            printQueue.push({
                tipo: 'foto',
                url,
                quantidade: copias,
                descricao: `${copias}× cópia${copias > 1 ? 's' : ''}`
            });

            if (guestbook) {
                printQueue.push({
                    tipo: 'guestbook',
                    url,
                    quantidade: 1,
                    descricao: '1× guestbook'
                });
            }

            salvarFila();
            atualizarBarraStatus();
            processarFilaImpressao();
        }

        function atualizarBarraStatus() {
            const bar = document.getElementById('print-status-bar');
            const txt = document.getElementById('print-status-text');
            const filaCount = document.getElementById('fila-count');
            const btnPause = document.getElementById('btn-pause');
            const btnPauseText = document.getElementById('btn-pause-text');

            if (filaCount) filaCount.innerText = printQueue.length;

            bar.classList.remove('active', 'paused');

            if (pausado) {
                bar.classList.add('paused');
                txt.innerText = `⏸️ Pausado (${printQueue.length} na fila)`;
                btnPause.classList.add('active');
                btnPauseText.innerText = 'Retomar';
                btnPause.querySelector('i').className = 'fa-solid fa-play';
            } else if (isPrinting && printJobAtual) {
                bar.classList.add('active');
                txt.innerText = `Imprimindo: ${printJobAtual.descricao} (${printQueue.length} na fila)`;
                btnPause.classList.remove('active');
                btnPauseText.innerText = 'Pausar';
                btnPause.querySelector('i').className = 'fa-solid fa-pause';
            } else if (printQueue.length > 0) {
                bar.classList.add('active');
                txt.innerText = `${printQueue.length} job(s) na fila`;
            } else {
                txt.innerText = 'Aguardando fotos';
                btnPause.classList.remove('active');
                btnPauseText.innerText = 'Pausar';
                btnPause.querySelector('i').className = 'fa-solid fa-pause';
            }
        }

        function togglePausa() {
            pausado = !pausado;

            if (pausado) {
                addLog('⏸️ Impressão pausada', 'warn');
                mostrarToast('Pausado', 'A impressão foi pausada.', 'warning');
            } else {
                addLog('▶️ Impressão retomada', 'success');
                mostrarToast('Retomado', 'A impressão foi retomada.', 'success');
                processarFilaImpressao();
            }
            atualizarBarraStatus();
            render();
        }

        function limparFilaManual() {
            if (printQueue.length === 0) {
                mostrarToast('Fila vazia', 'Não há jobs pendentes.', 'info');
                return;
            }
            if (!confirm(`Limpar ${printQueue.length} job(s) da fila?`)) return;

            const qtdRemovida = printQueue.length;
            printQueue = [];
            limparFilaStorage();
            addLog(`🗑️ Fila limpa (${qtdRemovida} job(s) removidos)`, 'warn');
            atualizarBarraStatus();
            render();
            mostrarToast('Fila limpa', `${qtdRemovida} job(s) removidos.`, 'info');
        }

        async function processarFilaImpressao() {
            if (isPrinting) return;
            if (pausado) { atualizarBarraStatus(); return; }
            if (printQueue.length === 0) {
                isPrinting = false;
                printJobAtual = null;
                limparFilaStorage();
                atualizarBarraStatus();
                render();
                return;
            }

            isPrinting = true;
            printJobAtual = printQueue.shift();
            salvarFila();
            atualizarBarraStatus();
            render();

            try {
                await executarJobImpressao(printJobAtual);
                addLog(`✅ Impresso: ${printJobAtual.descricao}`, 'success');
            } catch (e) {
                console.error('Erro ao imprimir:', e);
                addLog(`❌ Erro: ${e.message}`, 'error');
                debug('❌ Erro na impressão: ' + e.message);
            }

            setTimeout(() => {
                isPrinting = false;
                printJobAtual = null;
                atualizarBarraStatus();
                render();
                processarFilaImpressao();
            }, printDelayMs);
        }

        async function executarJobImpressao(job) {
            debug(`🖨️ Imprimindo: ${job.descricao}`);

            await preloadImagem(job.url);

            const printArea = document.getElementById('print-area');
            const sheet = document.createElement('div');
            sheet.className = 'print-sheet';

            const layout = LAYOUT_POR_FORMATO[formatoAtual] || { cols: 1, rows: 1 };
            const totalFotosFolha = Math.min(job.quantidade, layout.cols * layout.rows);

            for (let i = 0; i < totalFotosFolha; i++) {
                const img = document.createElement('img');
                img.src = job.url;
                img.alt = `Cópia ${i + 1}`;
                const isMulti = totalFotosFolha > 1;
                img.style.width = isMulti ? `${100 / layout.cols - 2}%` : '100%';
                img.style.height = isMulti ? `${100 / layout.rows - 2}%` : '100%';
                sheet.appendChild(img);
            }

            printArea.innerHTML = '';
            printArea.appendChild(sheet);

            await new Promise(r => setTimeout(r, 400));

            window.focus();
            window.print();

            debug(`✅ Job "${job.descricao}" enviado`);
        }

        function preloadImagem(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                setTimeout(() => resolve(false), 8000);
            });
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ MODAL DE ZOOM ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function abrirZoom(id) {
            const foto = todasFotos.find(f => f.id === id);
            if (!foto) return;

            document.getElementById('img-zoom').src = foto.url;
            document.getElementById('zoom-id').innerText = `#${foto.id}`;
            document.getElementById('zoom-copias').innerText = `${foto.copias}×`;
            document.getElementById('zoom-guestbook').innerText = foto.guestbook ? 'SIM' : 'NÃO';

            document.getElementById('btn-excluir-zoom').onclick = () => excluirFoto(foto.key);
            document.getElementById('modal-zoom').classList.add('active');
        }

        function fecharZoom() {
            document.getElementById('modal-zoom').classList.remove('active');
        }

        function reimprimirAtual() {
            const url = document.getElementById('img-zoom').src;
            if (!url) return;

            const foto = todasFotos.find(f => f.url === url);
            if (!foto) {
                criarJobsImpressao(url, 1, false);
                return;
            }

            criarJobsImpressao(foto.url, foto.copias, foto.guestbook);
            addLog(`🔁 Reimpressão solicitada: ${foto.copias}× ${foto.guestbook ? '+ guestbook' : ''}`, 'info');
            fecharZoom();
        }

        async function excluirFoto(key) {
            if (!confirm("Deseja realmente excluir esta foto?")) return;

            try {
                await fetch(`${API}/photo?key=${encodeURIComponent(key)}`, { method: 'DELETE' });

                todasFotos = todasFotos.filter(f => f.key !== key);
                chavesLocais.delete(key);
                todasFotos.forEach((f, i) => f.id = i + 1);

                fecharZoom();
                render();
                atualizarBarraStatus();
                addLog(`🗑️ Foto excluída: ${key.split('/').pop()}`, 'warn');
                debug('🗑️ Foto excluída');
            } catch (e) {
                mostrarToast('Erro', 'Não foi possível excluir a foto.', 'error');
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ BUSCA POR ID ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        function executarBusca() {
            const input = document.getElementById('input-busca');
            const idBusca = parseInt(input.value, 10);

            if (!idBusca || isNaN(idBusca)) {
                mostrarToast('ID inválido', 'Digite um número válido.', 'error');
                return;
            }

                       const foto = todasFotos.find(f => f.id === idBusca);
            if (foto) {
                abrirZoom(foto.id);
                input.value = '';
            } else {
                mostrarToast('Não encontrada', `ID #${idBusca} não existe.`, 'warning');
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ SIDEBAR: BAIXAR ZIP ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        async function baixarZip() {
            if (todasFotos.length === 0) {
                mostrarToast('Sem fotos', 'Nenhuma foto para baixar.', 'info');
                return;
            }

            mostrarToast('Preparando ZIP', `${todasFotos.length} foto(s) para baixar...`, 'info');
            addLog(`📦 Iniciando download ZIP (${todasFotos.length} fotos)`, 'info');

            try {
                const zip = new JSZip();
                let baixadas = 0;

                for (const f of todasFotos) {
                    try {
                        const blob = await fetch(f.url).then(r => r.blob());
                        const nome = `foto_${String(f.id).padStart(3, '0')}_${f.copias}c${f.guestbook ? '_guestbook' : ''}.jpg`;
                        zip.file(nome, blob);
                        baixadas++;
                    } catch (e) {
                        console.warn('Falha ao baixar foto', f.id, e);
                    }
                }

                if (baixadas === 0) {
                    mostrarToast('Erro', 'Nenhuma foto pôde ser baixada.', 'error');
                    return;
                }

                const content = await zip.generateAsync({ type: "blob" });
                const nomeZip = `galeria_${eventoAtual.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.zip`;
                saveAs(content, nomeZip);

                addLog(`✅ ZIP gerado (${baixadas} fotos)`, 'success');
                mostrarToast('Download iniciado', `${baixadas} foto(s) no arquivo ZIP.`, 'success');
            } catch (e) {
                addLog(`❌ Erro no ZIP: ${e.message}`, 'error');
                mostrarToast('Erro', 'Falha ao gerar o ZIP.', 'error');
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ SIDEBAR: LIMPAR SERVIDOR ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        async function limparTudo() {
            if (!confirm("⚠️ ATENÇÃO!\n\nIsso vai APAGAR TODAS as fotos do evento ativo no servidor.\n\nEsta ação é IRREVERSÍVEL.\n\nDeseja continuar?")) return;

            const senha = prompt("Digite a senha mestra para confirmar:");
            if (senha !== "1234") {
                mostrarToast('Cancelado', 'Senha incorreta.', 'error');
                return;
            }

            mostrarToast('Apagando', 'Removendo fotos do servidor...', 'warning');

            try {
                await fetch(`${API}/photo?key=all`, { method: 'DELETE' });

                todasFotos = [];
                chavesLocais.clear();
                printQueue = [];
                limparFilaStorage();
                render();
                atualizarBarraStatus();

                addLog(`🗑️ Servidor limpo — todas as fotos removidas`, 'warn');
                mostrarToast('Servidor limpo', 'Todas as fotos foram removidas.', 'success');
                debug('🗑️ Servidor limpo');
            } catch (e) {
                addLog(`❌ Erro ao limpar: ${e.message}`, 'error');
                mostrarToast('Erro', 'Não foi possível limpar o servidor.', 'error');
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ EVENTOS GLOBAIS ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('modal-zoom').classList.contains('active')) {
                    fecharZoom();
                } else if (document.getElementById('sidebar').classList.contains('active')) {
                    toggleSidebar();
                } else if (logAberto) {
                    toggleLog();
                }
            }
        });

        // Fecha modal ao clicar fora
        document.getElementById('modal-zoom').addEventListener('click', (e) => {
            if (e.target.id === 'modal-zoom') fecharZoom();
        });

        // Re-sync quando aba volta ao foco
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) atualizar();
        });

        // Persiste a fila antes de sair (F5 acidental)
        window.addEventListener('beforeunload', () => {
            salvarFila();
        });

        /* ═══════════════════════════════════════════════════════════════
           ▶▶▶ INICIALIZAÇÃO ◀◀◀
           ═══════════════════════════════════════════════════════════════ */
        window.addEventListener('load', () => {
            // Restaura config e histórico
            carregarConfig();
            carregarHistorico();
            renderLogCompleto();

            // Aplica config na UI
            const selDelay = document.getElementById('config-delay');
            if (selDelay) selDelay.value = String(printDelayMs);
            const selAuto = document.getElementById('config-auto');
            if (selAuto) selAuto.value = autoImpressao ? '1' : '0';

            // Restaura fila persistida (se houver)
            carregarFila();

            addLog('🚀 Central de Impressão v6.0 iniciada', 'success');
            debug('🚀 Central de Impressão v6.0 pronta');

            // Se havia fila pendente, retoma processamento
            if (printQueue.length > 0) {
                addLog(`♻️ Fila restaurada (${printQueue.length} job(s))`, 'info');
                processarFilaImpressao();
            }

            atualizar();
            setInterval(atualizar, POLL_INTERVAL_MS);
        });
    </script>
</body>
