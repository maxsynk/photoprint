<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PAINEL MASTER - PHOTO PRINT v1.6</title>
    <style>
        #manutencao { display:none; position:fixed; inset:0; background:#000; color:red; font-size:40px; font-weight:900; align-items:center; justify-content:center; z-index:99999; animation:pulse 1s infinite; text-align:center; }
        @keyframes pulse { 0%,100%{ opacity: 1;} 50%{ opacity: 0.5;} }
    </style>
</head>
<body>
    <div id="manutencao">SISTEMA EM MANUTENÇÃO</div>

    <!-- Mantenha todo o seu layout original aqui -->
    <!-- ... -->

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";

        // Carrega o status do sistema ao abrir a página
        window.onload = async () => {
            try {
                const res = await fetch(`${API}/get-all-states`);
                const data = await res.json();
                document.getElementById('server-status').checked = (data.config.status === "ONLINE");
                document.getElementById('manutencao').style.display = (data.config.status === "OFFLINE") ? "flex" : "none";
            } catch(e) {}
        };

        async function salvarStatusRede() {
            const on = document.getElementById('server-status').checked;
            const status = on ? "ONLINE" : "OFFLINE";
            
            // Atualiza a tela localmente
            document.getElementById('manutencao').style.display = on ? "none" : "flex";

            await fetch(`${API}/set-config`, {
                method: 'POST',
                body: JSON.stringify({ 
                    status: status,
                    evento: "Evento Atual", // Ajuste para pegar o valor do seu campo de texto
                    formato: "10X15V" 
                })
            });
        }
    </script>
</body>
</html>
