<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>WEBCAM - PHOTO PRINT v10.4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
:root{ --neon:#39ff14; --dark:#050505; --danger:#ff3131; }
*{ box-sizing:border-box; }
body{ margin:0; background: radial-gradient(circle at top, rgba(57,255,20,0.10), transparent 35%), radial-gradient(circle at bottom right, rgba(57,255,20,0.08), transparent 30%), linear-gradient(135deg, #020202 0%, #050505 40%, #071107 100%); color:white; font-family:Arial,Helvetica,sans-serif; width:100vw; height:100vh; overflow:hidden; position:relative; }
#dynamic-bg{ position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; background-repeat:no-repeat; opacity:0; transition:opacity 0.6s ease; }
#dynamic-bg.active{ opacity:0.45; }
#dynamic-bg::after{ content:''; position:absolute; inset:0; background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)); }
body::before{ content:''; position:fixed; inset:0; background-image: linear-gradient(rgba(57,255,20,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(57,255,20,0.03) 1px, transparent 1px); background-size:40px 40px; z-index:0; animation:gridMove 12s linear infinite; }
body.bg-active::before{ display:none; }
@keyframes gridMove{ from{ transform:translateY(0px); } to{ transform:translateY(40px); } }
.bg-brand{ position:fixed; inset:0; z-index:1; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.07; }
body.bg-active .bg-brand{ display:none; }
.bg-brand-title{ font-family:'Orbitron',sans-serif; font-size:140px; font-weight:900; color:var(--neon); letter-spacing:14px; text-transform:uppercase; }
.bg-brand-sub{ margin-top:20px; font-size:42px; letter-spacing:12px; text-transform:uppercase; color:white; }
.top-logo{ position:fixed; top:40px; left:50px; z-index:25; }
.logo-title{ font-family:'Orbitron',sans-serif; color:var(--neon); font-size:46px; font-weight:900; letter-spacing:8px; text-shadow: 0 0 15px var(--neon), 0 0 35px rgba(57,255,20,0.8); cursor:pointer; user-select:none; }
.logo-sub{ margin-top:4px; color:white; opacity:0.7; letter-spacing:5px; font-size:13px; text-transform:uppercase; }
#active-event-name{ position:fixed; top:130px; left:50px; z-index:26; font-family:'Orbitron',sans-serif; color:var(--neon); font-size:16px; font-weight:700; letter-spacing:2px; text-shadow:0 0 10px var(--neon); background:rgba(0,0,0,0.7); padding:8px 16px; border-radius:8px; border:1px solid var(--neon); display:none; }
#debug-info{ position:fixed; bottom:10px; right:10px; z-index:999; background:rgba(0,0,0,0.8); color:var(--neon); font-size:10px; padding:5px 10px; border-radius:5px; font-family:monospace; max-width:350px; word-break:break-all; }
.corner-glow{ position:fixed; width:420px; height:420px; border-radius:50%; background:rgba(57,255,20,0.08); filter:blur(90px); z-index:0; }
body.bg-active .corner-glow{ display:none; }
.corner-1{ top:-150px; left:-100px; }
.corner-2{ bottom:-180px; right:-100px; }
#bg-menu{ position:fixed; top:40px; right:40px; z-index:100; display:none; flex-direction:column; gap:12px; }
#bg-menu.active{ display:flex; }
.bg-btn{ padding:12px 20px; border-radius:14px; border:1px solid rgba(57,255,20,0.45); background:rgba(0,0,0,0.55); color:white; font-size:14px; font-weight:bold; letter-spacing:1px; cursor:pointer; backdrop-filter:blur(10px); transition:0.25s; box-shadow:0 0 20px rgba(57,255,20,0.12); text-align:center; }
.bg-btn:hover{ transform:translateY(-2px); border-color:var(--neon); color:var(--neon); box-shadow:0 0 25px rgba(57,255,20,0.35); }
#bg-input{ display:none; }
#offline-overlay{ position:fixed; inset:0; background:#000; z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column; }
#offline-overlay .offline-text{ font-size:40px; font-weight:900; color:var(--danger); text-shadow:0 0 20px var(--danger); animation:pulseOff 1.5s infinite; text-transform:uppercase; letter-spacing:4px; text-align:center; }
@keyframes pulseOff{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
.screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; flex-direction:column; }
.btn-start{ position:relative; width:380px; height:380px; border-radius:50%; border:4px solid var(--neon); background:radial-gradient(circle at center, rgba(57,255,20,0.18), rgba(0,0,0,0.96)); overflow:hidden; transition:0.3s; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px; box-shadow:0 0 30px rgba(57,255,20,0.8), inset 0 0 60px rgba(57,255,20,0.15); backdrop-filter:blur(4px); z-index:30; }
.btn-start::before{ content:''; position:absolute; width:250%; height:250%; background:conic-gradient(transparent, rgba(57,255,20,1), rgba(57,255,20,0.25), transparent); animation:rotateGlow 3s linear infinite; filter:blur(20px); opacity:1; }
.btn-start::after{ content:''; position:absolute; inset:8px; border-radius:50%; background:rgba(0,0,0,0.92); box-shadow:inset 0 0 60px rgba(57,255,20,0.15); }
@keyframes rotateGlow{ 100%{ transform:rotate(360deg); } }
.start-content{ position:relative; z-index:5; text-align:center; width:100%; }
.start-icon{ font-size:58px; margin-bottom:18px; filter:drop-shadow(0 0 15px var(--neon)); }
.start-title{ color:var(--neon); font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; letter-spacing:4px; text-shadow:0 0 15px var(--neon), 0 0 35px var(--neon); margin-bottom:18px; text-transform:uppercase; line-height:1.4; min-height:40px; }
.start-subtitle{ font-size:22px; line-height:1.6; }
#camera-wrapper{ position:absolute; inset:0; width:100vw; height:100vh; background:#000; overflow:hidden; z-index:40; }
#camera-feed{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
#camera-canvas{ width:100%; height:100%; object-fit:cover; }
.fun-text{ position:absolute; bottom:18%; left:50%; transform:translateX(-50%); font-family:'Comic Sans MS','Arial Rounded MT Bold',sans-serif; font-size:38px; font-weight:900; text-align:center; color:#fff; white-space:nowrap; text-transform:uppercase; text-shadow:0px 0px 10px #ff0080,0px 0px 20px #ff8c00,0px 0px 30px #ffff00; animation:funPulse 0.6s infinite alternate, hueShift 3s linear infinite; z-index:50; pointer-events:none; background:rgba(0,0,0,0.5); padding:10px 25px; border-radius:30px; }
@keyframes funPulse{ 0%{ transform:translateX(-50%) scale(0.9); } 100%{ transform:translateX(-50%) scale(1.1); } }
@keyframes hueShift{ 0%{ filter:hue-rotate(0deg); } 100%{ filter:hue-rotate(360deg); } }
#options-overlay{ position:absolute; bottom:50px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.95); padding:20px 45px; border-radius:50px; box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:60; text-align:center; }
.options-text{ font-family:'Arial',sans-serif; font-size:28px; color:#222; font-weight:bold; letter-spacing:1px; }
.status-text{ font-family:'Orbitron',sans-serif; font-size:40px; color:var(--neon); font-weight:900; letter-spacing:4px; text-shadow:0 0 20px var(--neon); text-align:center; animation:pulseText 1.5s infinite; background:rgba(0,0,0,0.8); padding:40px 80px; border-radius:20px; border:2px solid var(--neon); backdrop-filter:blur(10px); }
@keyframes pulseText{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
</style>
</head>
<body>
<div id="dynamic-bg"></div>
<div class="corner-glow corner-1"></div>
<div class="corner-glow corner-2"></div>
<div class="bg-brand"><div class="bg-brand-title">PHOTO PRINT</div><div class="bg-brand-sub">Colecionando momentos</div></div>
<div class="top-logo"><div class="logo-title" id="secret-logo">PHOTO PRINT</div><div class="logo-sub">Colecionando momentos</div></div>
<div id="active-event-name"></div>
<div id="debug-info">SISTEMA PRONTO</div>
<div id="bg-menu"><label class="bg-btn" for="bg-input">🖼 ALTERAR FUNDO</label><div class="bg-btn" onclick="removeBackground()">✖ SEM FUNDO</div></div>
<input type="file" id="bg-input" accept="image/*"/>

<!-- OFFLINE OVERLAY -->
<div id="offline-overlay"><div class="offline-text">SISTEMA EM<br>MANUTENÇÃO</div></div>

<div id="screen-start" class="screen"><div class="btn-start"><div class="start-content"><div class="start-icon">📸</div><div class="start-title">PHOTO PRINT</div><div class="start-subtitle">Aguardando comando...</div></div></div></div>
<div id="screen-camera" class="screen" style="display:none;z-index:40;"><div id="camera-wrapper"><video id="camera-feed" autoplay playsinline muted></video><canvas id="camera-canvas" style="display:none;"></canvas><div id="fun-text" class="fun-text" style="display:none;"></div><div id="options-overlay" style="display:none;"><div class="options-text">ACESSE O TOTEM PARA IMPRIMIR SUA FOTO</div></div></div></div>
<div id="screen-thanks" class="screen" style="display:none;"><div class="status-text" id="thanks-text">🖨️ AGUARDE A IMPRESSÃO...</div></div>
<script>
const API_BASE='https://photoprint-api.maxprimefotovideo.workers.dev';
const videoFeed=document.getElementById('camera-feed');
const canvasCapture=document.getElementById('camera-canvas');
const ctx=canvasCapture.getContext('2d');
const funText=document.getElementById('fun-text');
const optionsOverlay=document.getElementById('options-overlay');
let stream=null,lastState='start',captureInProgress=false,initialLoad=true,sistemaOnline=true;
let eventoAtual=null,eventoId=null,formatoAtual='10X15V',molduraBase64=null;
let fotosTirinha=[];
let motionActive=false;
let lastMovementIdle=0;
let motionCanvas=null;
let motionContext=null;
let previousMotionFrame=null;
let personDetected=false;
let motionSensitivity=2.5;
let motionFrames=0;
let motionConfirmFrames=8;
let lastMotionTime=0;

const FORMATOS={"TIRINHA":{w:591,h:1819},"POLAROID":{w:1041,h:1311},"10X15V":{w:1181,h:1819},"10X15H":{w:1772,h:1228}};

function debug(msg){console.log('[WEBCAM]',msg);const el=document.getElementById('debug-info');if(el)el.innerText=msg;}
function getCopiasFisicas(o){if(o===1)return 1;if(o===2)return 2;if(o===3)return 2;if(o===4)return 3;return 1;}

async function verificarStatus(){
    try{
        const res=await fetch(`${API_BASE}/get-all-states?t=${Date.now()}`);
        if(!res||!res.ok){sistemaOnline=false;mostrarOffline();return;}
        const data=await res.json();
        const status=(data.config&&data.config.status)?data.config.status:'OFFLINE';
        if(status==='OFFLINE'){sistemaOnline=false;mostrarOffline();}
        else{sistemaOnline=true;esconderOffline();}
        return data;
    }catch(e){sistemaOnline=false;mostrarOffline();return null;}
}
function mostrarOffline(){document.getElementById('offline-overlay').style.display='flex';}
function esconderOffline(){document.getElementById('offline-overlay').style.display='none';}

async function initCamera(){
    try{
        debug('🔎 Procurando câmera...');
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameras = devices.filter(d => d.kind === 'videoinput');
        let selectedCamera = null;
        selectedCamera = cameras.find(cam => {
            const name = cam.label.toLowerCase();
            return (name.includes('logitech') || name.includes('usb') || name.includes('camera') || name.includes('hd'));
        });
        if(!selectedCamera){ selectedCamera = cameras[0]; }
        const constraints = {
            video:{
                deviceId:selectedCamera ? {exact:selectedCamera.deviceId} : undefined,
                width:{ideal:1920},
                height:{ideal:1080},
                frameRate:{ideal:30}
            },
            audio:false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoFeed.srcObject = stream;
        await videoFeed.play();
        debug('✅ Câmera OK: '+ (selectedCamera ? selectedCamera.label : 'padrão'));
    }catch(err){
        debug('❌ Câmera: '+ err.message);
    }
}

function initMotionDetector(){
    if(motionCanvas)return;
    motionCanvas=document.createElement('canvas');
    motionCanvas.width=320;
    motionCanvas.height=180;
    motionContext=motionCanvas.getContext('2d');
    motionActive=true;
    requestAnimationFrame(checkMotion);
    debug('👁️ Detector de movimento ativo');
}

function checkMotion(){

    if(!motionActive){

        requestAnimationFrame(checkMotion);
        return;

    }


    if(videoFeed.readyState >= 2){


        motionContext.drawImage(
            videoFeed,
            0,
            0,
            motionCanvas.width,
            motionCanvas.height
        );


        const frame =
        motionContext.getImageData(
            0,
            0,
            motionCanvas.width,
            motionCanvas.height
        );



        let movement = 0;



        if(previousMotionFrame){


            let changed = 0;


            for(
                let i=0;
                i<frame.data.length;
                i+=40
            ){


                const diff =

                Math.abs(
                    frame.data[i] -
                    previousMotionFrame.data[i]
                )

                +

                Math.abs(
                    frame.data[i+1] -
                    previousMotionFrame.data[i+1]
                )

                +

                Math.abs(
                    frame.data[i+2] -
                    previousMotionFrame.data[i+2]
                );



                if(diff > 45){

                    changed++;

                }


            }



            movement =

            (
                changed /
                (frame.data.length/40)
            ) * 100;



            /*
              Mostra somente para ajuste
            */

            debug(
    "PARADO: "+(lastMovementIdle || "0.00")+
    "  |  MOVIMENTO: "+movement.toFixed(2)
);


if(movement < 1){

    lastMovementIdle = movement.toFixed(2);

}
            if(movement > 8){


                motionFrames++;


            }else{


                motionFrames=0;


            }



            if(
                motionFrames >= 15 &&
                !personDetected
            ){


                personDetected=true;


                debug(
                    "👤 PESSOA DETECTADA"
                );


            }



        }



        previousMotionFrame = frame;



    }



    requestAnimationFrame(checkMotion);

}

async function syncEvento(){
    const data=await verificarStatus();
    if(!data||!sistemaOnline)return;
    if(data.config&&data.config.evento&&data.config.evento!=='Geral'){
        const novoEventoId=data.config.eventoId;
        const novoFormato=(data.config.formato||'10X15V').toUpperCase().trim();
        if(eventoAtual!==data.config.evento||eventoId!==novoEventoId||formatoAtual!==novoFormato||!molduraBase64){
            eventoAtual=data.config.evento;eventoId=novoEventoId;formatoAtual=novoFormato;
            if(data.moldura){molduraBase64=data.moldura;debug('✅ Moldura: '+formatoAtual);}
            else{molduraBase64=null;debug('⚠️ Sem moldura');}
            updateEventoUI();
        }
    }
}
function updateEventoUI(){const el=document.getElementById('active-event-name');if(eventoAtual){el.style.display='block';el.innerText=`🎉 ${eventoAtual} | ${formatoAtual}`;}else el.style.display='none';}

function capturePhotoTirinha(numero){return new Promise(resolve=>{videoFeed.style.display='block';canvasCapture.style.display='none';funText.style.display='block';funText.innerHTML=`📸 FOTO ${numero} DE 3`;setTimeout(()=>{let cd=3;funText.innerHTML=`📸 FOTO ${numero} DE 3<br>⏳ ${cd}`;const t=setInterval(()=>{cd--;if(cd>0)funText.innerHTML=`📸 FOTO ${numero} DE 3<br>⏳ ${cd}`;else{funText.style.display='none';clearInterval(t);canvasCapture.width=videoFeed.videoWidth||1920;canvasCapture.height=videoFeed.videoHeight||1080;ctx.save();ctx.scale(-1,1);ctx.drawImage(videoFeed,-canvasCapture.width,0,canvasCapture.width,canvasCapture.height);ctx.restore();fotosTirinha.push(canvasCapture.toDataURL('image/jpeg',0.92));debug(`✅ Foto ${numero}/3`);videoFeed.style.display='none';canvasCapture.style.display='block';funText.style.display='block';funText.innerHTML=`✅ FOTO ${numero} DE 3`;setTimeout(()=>{canvasCapture.style.display='none';funText.style.display='none';videoFeed.style.display='block';resolve();},3000);}},1000);},1500);});}
async function sequenciaTirinha(){fotosTirinha=[];debug('🎞️ TIRINHA 3 fotos');await capturePhotoTirinha(1);await capturePhotoTirinha(2);await capturePhotoTirinha(3);debug('✅ 3 fotos!');}

async function montarTirinha(opcaoCopias){
    if(!molduraBase64||fotosTirinha.length<3)return;
    const copiasFisicas=getCopiasFisicas(opcaoCopias);
    try{
        const molduraImg=await new Promise((rs,rj)=>{const img=new Image();img.onload=()=>rs(img);img.onerror=()=>rj(new Error('Falha'));img.src=molduraBase64;});
        const fmt=FORMATOS['TIRINHA'];const canvas=document.createElement('canvas');canvas.width=fmt.w;canvas.height=fmt.h;const cctx=canvas.getContext('2d');
        cctx.fillStyle='#FFFFFF';cctx.fillRect(0,0,canvas.width,canvas.height);
        const slots=[{y:0.030,h:0.254},{y:0.296,h:0.254},{y:0.559,h:0.254}];
        for(let i=0;i<3;i++){const fotoImg=await new Promise(r=>{const img=new Image();img.onload=()=>r(img);img.src=fotosTirinha[i];});const slot=slots[i];const dx=canvas.width*0.06,dw=canvas.width*0.88,dy=canvas.height*slot.y,dh=canvas.height*slot.h;cctx.save();cctx.beginPath();cctx.rect(dx,dy,dw,dh);cctx.clip();const scale=Math.max(dw/fotoImg.width,dh/fotoImg.height);cctx.drawImage(fotoImg,dx+(dw-fotoImg.width*scale)/2,dy+(dh-fotoImg.height*scale)/2,fotoImg.width*scale,fotoImg.height*scale);cctx.restore();}
        cctx.drawImage(molduraImg,0,0,canvas.width,canvas.height);
        const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.95));await uploadBlob(blob,copiasFisicas,opcaoCopias);
    }catch(e){debug('❌ TIRINHA: '+e.message);}
}

function capturePhoto(){if(captureInProgress)return;captureInProgress=true;videoFeed.style.display='block';canvasCapture.style.display='none';optionsOverlay.style.display='none';funText.style.display='block';funText.innerHTML="✨ PREPARE-SE! ✨";setTimeout(()=>{let cd=3;funText.innerHTML=`😁 SORRIA! 😁<br>⏳ ${cd}`;const t=setInterval(()=>{cd--;if(cd>0)funText.innerHTML=`😁 SORRIA! 😁<br>⏳ ${cd}`;else{funText.style.display='none';clearInterval(t);canvasCapture.width=videoFeed.videoWidth||1920;canvasCapture.height=videoFeed.videoHeight||1080;ctx.save();ctx.scale(-1,1);ctx.drawImage(videoFeed,-canvasCapture.width,0,canvasCapture.width,canvasCapture.height);ctx.restore();videoFeed.style.display='none';canvasCapture.style.display='block';debug('✅ Foto capturada');fetch(`${API_BASE}/set-state`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'options'})}).catch(()=>{});captureInProgress=false;optionsOverlay.style.display='block';optionsOverlay.querySelector('.options-text').innerText='ACESSE O TOTEM PARA IMPRIMIR SUA FOTO';}},1000);},3000);}

async function composeAndUpload(opcaoCopias){if(!molduraBase64)return;const copiasFisicas=getCopiasFisicas(opcaoCopias);try{const fotoImg=await new Promise(r=>{const img=new Image();img.onload=()=>r(img);img.src=canvasCapture.toDataURL('image/jpeg',0.92);});const molduraImg=await new Promise((rs,rj)=>{const img=new Image();img.onload=()=>rs(img);img.onerror=()=>rj(new Error('Falha'));img.src=molduraBase64;});const fmt=FORMATOS[formatoAtual]||FORMATOS['POLAROID'];const canvas=document.createElement('canvas');canvas.width=fmt.w;canvas.height=fmt.h;const cctx=canvas.getContext('2d');cctx.fillStyle='#FFFFFF';cctx.fillRect(0,0,canvas.width,canvas.height);const scale=Math.max(canvas.width/fotoImg.width,canvas.height/fotoImg.height);cctx.drawImage(fotoImg,(canvas.width-fotoImg.width*scale)/2,(canvas.height-fotoImg.height*scale)/2,fotoImg.width*scale,fotoImg.height*scale);cctx.drawImage(molduraImg,0,0,canvas.width,canvas.height);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.95));await uploadBlob(blob,copiasFisicas,opcaoCopias);}catch(e){debug('❌ Erro: '+e.message);}}

async function uploadBlob(blob,copiasFisicas,opcao){if(!eventoId)return;const ts=Date.now();const temGuestbook=(opcao===3||opcao===4);const sufixo=temGuestbook?'_guestbook':'';const nome=`foto_${ts}_${copiasFisicas}c${sufixo}.jpg`;const fd=new FormData();fd.append('foto',blob,nome);fd.append('eventoId',eventoId);fd.append('timestamp',String(ts)+'_'+copiasFisicas+'c'+sufixo);fd.append('copias',String(copiasFisicas));try{const res=await fetch(`${API_BASE}/salvar-foto`,{method:'POST',body:fd});if(res.ok)debug('✅ OK');}catch(e){}}

async function waitForPrint(){for(let i=0;i<120;i++){try{const res=await fetch(`${API_BASE}/check-print?t=${Date.now()}`);if(res&&res.ok){const d=await res.json();if(d.printTriggered)return d.copias||1;}}catch(e){}await new Promise(r=>setTimeout(r,500));}return null;}

async function finishCycle(){if(!sistemaOnline){resetToStart();return;}const copias=await waitForPrint();if(!copias){resetToStart();return;}optionsOverlay.querySelector('.options-text').innerText='Compondo foto...';if(formatoAtual==='TIRINHA'){await montarTirinha(copias);}else{await composeAndUpload(copias);}await fetch(`${API_BASE}/clear-print`,{method:'POST'}).catch(()=>{});showThanks();}

function showThanks(){document.querySelectorAll('.screen').forEach(e=>e.style.display='none');document.getElementById('screen-thanks').style.display='flex';document.getElementById('thanks-text').innerHTML="🖨️ AGUARDE A IMPRESSÃO...";setTimeout(()=>{document.getElementById('thanks-text').innerHTML="💖 OBRIGADO! 💖<br>APROVEITE SUA FOTO!";setTimeout(resetToStart,2500);},2500);}
function resetToStart(){document.querySelectorAll('.screen').forEach(e=>e.style.display='none');document.getElementById('screen-start').style.display='flex';ctx.clearRect(0,0,canvasCapture.width,canvasCapture.height);captureInProgress=false;lastState='start';fotosTirinha=[];fetch(`${API_BASE}/set-state`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'start'})}).catch(()=>{});}

function updateScreenState(state){if(!sistemaOnline)return;if(state===lastState&&state!=='capturing')return;if(state==='start'&&lastState==='options'){finishCycle();lastState=state;return;}if(state==='capturing'&&lastState==='options')return;document.querySelectorAll('.screen').forEach(e=>e.style.display='none');if(state==='capturing'){document.getElementById('screen-camera').style.display='flex';if(formatoAtual==='TIRINHA'){sequenciaTirinha().then(()=>{canvasCapture.style.display='none';fetch(`${API_BASE}/set-state`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'options'})}).catch(()=>{});updateScreenState('options');});}else{capturePhoto();}}else if(state==='options'){document.getElementById('screen-camera').style.display='flex';videoFeed.style.display='none';canvasCapture.style.display='block';funText.style.display='none';optionsOverlay.style.display='block';}else{document.getElementById('screen-start').style.display='flex';}lastState=state;}

async function pollServerState(){try{const res=await fetch(`${API_BASE}/get-state?t=${Date.now()}`);if(!res||!res.ok)return;const d=await res.json();if(initialLoad){initialLoad=false;if(d.state!=='start'){await fetch(`${API_BASE}/set-state`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:'start'})}).catch(()=>{});return;}}if(d.state&&d.state!==lastState)updateScreenState(d.state);}catch(e){}}

window.addEventListener('storage',e=>{if(e.key==='booth_state')updateScreenState(e.newValue);});
let clickCount=0,clickTimer=null;
document.getElementById('secret-logo').addEventListener('click',()=>{clickCount++;clearTimeout(clickTimer);clickTimer=setTimeout(()=>{clickCount=0},2000);if(clickCount>=7){document.getElementById('bg-menu').classList.toggle('active');clickCount=0;}});
function updateVisualMode(){const bg=localStorage.getItem('photoprint_bg');if(bg)document.body.classList.add('bg-active');else document.body.classList.remove('bg-active');}
document.getElementById('bg-input').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{document.getElementById('dynamic-bg').style.backgroundImage=`url('${ev.target.result}')`;document.getElementById('dynamic-bg').classList.add('active');localStorage.setItem('photoprint_bg',ev.target.result);updateVisualMode();document.getElementById('bg-menu').classList.remove('active');};r.readAsDataURL(f);});
function removeBackground(){localStorage.removeItem('photoprint_bg');document.getElementById('dynamic-bg').style.backgroundImage="";document.getElementById('dynamic-bg').classList.remove('active');updateVisualMode();document.getElementById('bg-menu').classList.remove('active');}
(function(){const bg=localStorage.getItem('photoprint_bg');if(bg){document.getElementById('dynamic-bg').style.backgroundImage=`url('${bg}')`;document.getElementById('dynamic-bg').classList.add('active');}updateVisualMode();})();

localStorage.setItem('booth_state','start');
updateScreenState('start');
initCamera()
.then(()=>{

    setTimeout(()=>{

        initMotionDetector();

    },3000);

});
setInterval(pollServerState,800);setInterval(syncEvento,5000);syncEvento();
debug('🚀 WEBCAM v10.3 pronta');
