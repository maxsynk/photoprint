<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>WEBCAM - PHOTO PRINT v5.3</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {

            --neon: #39ff14;
            --dark: #050505;
            --danger: #ff3131;

        }

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;
            background: var(--dark);
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

        }

        #cam-preview {

            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            display: none;

            z-index: 1;

        }

        .screen {

            position: fixed;
            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            z-index: 20;

        }

        #loader {

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.92);

            z-index: 999;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            color: var(--neon);

            font-size: 28px;
            font-weight: bold;

            text-shadow: 0 0 20px var(--neon);

        }

        #final-preview-container {

            z-index: 150;

            background: rgba(0,0,0,0.96);

            display: none;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        #img-review {

            max-width: 78vw;
            max-height: 78vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border: 5px solid var(--neon);

            box-shadow: 0 0 35px rgba(57,255,20,0.8);

            border-radius: 25px;

            background: #000;

        }

        .btn-start {

            position: relative;

            width: 560px;
            height: 560px;

            border-radius: 50%;

            border: 5px solid var(--neon);

            background:
                radial-gradient(circle at center,
                rgba(57,255,20,0.20),
                rgba(0,0,0,0.96));

            cursor: pointer;

            overflow: hidden;

            transition: 0.3s;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 40px;

            box-shadow:
                0 0 40px rgba(57,255,20,0.8),
                inset 0 0 60px rgba(57,255,20,0.25);

        }

        .btn-start:hover {

            transform: scale(1.04);

            box-shadow:
                0 0 80px rgba(57,255,20,1),
                inset 0 0 90px rgba(57,255,20,0.45);

        }

        .btn-start::before {

            content: '';

            position: absolute;

            width: 260%;
            height: 260%;

            background: conic-gradient(
                transparent,
                rgba(57,255,20,1),
                rgba(57,255,20,0.4),
                transparent
            );

            animation: rotateGlow 2.5s linear infinite;

            filter: blur(25px);

            opacity: 1;

        }

        .btn-start::after {

            content: '';

            position: absolute;

            inset: 10px;

            border-radius: 50%;

            background: rgba(0,0,0,0.93);

            box-shadow:
                inset 0 0 60px rgba(57,255,20,0.18);

        }

        @keyframes rotateGlow {

            100% {

                transform: rotate(360deg);

            }

        }

        .start-content {

            position: relative;

            z-index: 5;

            text-align: center;

            width: 100%;

        }

        .start-title {

            color: var(--neon);

            font-size: 42px;

            font-weight: 900;

            text-shadow:
                0 0 15px var(--neon),
                0 0 35px var(--neon);

            margin-bottom: 18px;

            text-transform: uppercase;

        }

        .start-subtitle {

            font-size: 23px;

            line-height: 1.6;

        }

        .start-subtitle span {

            color: var(--neon);

            font-weight: bold;

            text-shadow: 0 0 15px var(--neon);

        }

        #camera-overlay {

            position: fixed;
            inset: 0;

            z-index: 50;

            pointer-events: none;

            display: none;

        }

        .camera-info {

            position: absolute;

            top: 40px;
            left: 40px;

            display: flex;

            align-items: flex-start;

            gap: 18px;

        }

        .camera-line {

            width: 6px;

            height: 160px;

            background: var(--neon);

            box-shadow: 0 0 20px var(--neon);

            border-radius: 50px;

        }

        .camera-text {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .camera-system {

            color: var(--neon);

            font-size: 36px;

            font-weight: bold;

            text-shadow: 0 0 15px var(--neon);

        }

        .camera-event {

            font-size: 24px;

            font-weight: bold;

            text-transform: uppercase;

        }

        .camera-type {

            font-size: 18px;

            opacity: 0.8;

            letter-spacing: 2px;

        }

        #countdown-container {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            z-index: 80;

            background: rgba(0,0,0,0.18);

        }

        #prepare-text {

            font-family: 'Orbitron', sans-serif;

            color: var(--neon);

            font-size: 76px;

            font-weight: 900;

            letter-spacing: 8px;

            text-shadow:
                0 0 15px var(--neon),
                0 0 35px var(--neon),
                0 0 60px var(--neon);

            animation: preparePulse 0.8s infinite alternate;

        }

        @keyframes preparePulse {

            from {

                transform: scale(1);
                opacity: 0.7;

            }

            to {

                transform: scale(1.08);
                opacity: 1;

            }

        }

        #countdown {

            display: none;

            color: white;

            font-size: 220px;

            font-weight: bold;

            text-shadow:
                0 0 20px var(--neon),
                0 0 40px var(--neon);

            animation: countdownPulse 1s infinite;

        }

        @keyframes countdownPulse {

            0% {

                transform: scale(1);

            }

            50% {

                transform: scale(1.15);

            }

            100% {

                transform: scale(1);

            }

        }

        #botoeira-controls {

            margin-top: 25px;

            color: var(--neon);

            font-size: 28px;

            font-weight: bold;

            text-align: center;

            animation: pulseText 1.5s infinite alternate;

        }

        @keyframes pulseText {

            from {

                opacity: 0.6;
                text-shadow: 0 0 5px var(--neon);

            }

            to {

                opacity: 1;
                text-shadow: 0 0 20px var(--neon);

            }

        }

    </style>

</head>

<body>

    <div id="loader">

        <div>PROCESSANDO...</div>

    </div>

    <video id="cam-preview" autoplay playsinline></video>

    <div id="camera-overlay">

        <div class="camera-info">

            <div class="camera-line"></div>

            <div class="camera-text">

                <div class="camera-system">

                    PHOTO PRINT

                </div>

                <div class="camera-event" id="event-name">

                    CARREGANDO EVENTO...

                </div>

                <div class="camera-type" id="event-type">

                    FOTO DIGITAL • TOTEM INTERATIVO

                </div>

            </div>

        </div>

        <div id="countdown-container">

            <div id="prepare-text">

                😎 PREPARE-SE

            </div>

            <div id="countdown">

                5

            </div>

        </div>

    </div>

    <div id="screen-start" class="screen">

        <div class="btn-start" onclick="manualStart()">

            <div class="start-content">

                <div class="start-title" id="start-event-name">

                    CARREGANDO EVENTO...

                </div>

                <div class="start-subtitle">

                    Aperte a <span>BOTOEIRA DO TOTEM</span><br>
                    para iniciar sua foto 📸

                </div>

            </div>

        </div>

    </div>

    <div id="final-preview-container" class="screen">

        <img id="img-review" src="">

        <div id="botoeira-controls">

            AGUARDANDO ESCOLHA NA BOTOEIRA... 📱

        </div>

    </div>

    <script>

        const API =
            "https://photoprint-api.maxprimefotovideo.workers.dev";

        const video =
            document.getElementById('cam-preview');

        let finalBlob = null;

        let eventoAtivo = "EVENTO";
        let tipoFoto = "FOTO DIGITAL";
        let formatoAtivo = "10X15H";

        let molduraAtual = null;

        let pollingTrigger = false;
        let sessaoIniciada = false;

        let ultimoEventoCarregado = "";

        async function loadSystemStatus() {

            try {

                const res =
                    await fetch(`${API}/status?t=${Date.now()}`, {

                        cache: "no-store"

                    });

                if (!res.ok) {

                    throw new Error("Erro status");

                }

                const data =
                    await res.json();

                console.log("STATUS RECEBIDO:", data);

                eventoAtivo =
                    data.evento ||
                    data.nome ||
                    "EVENTO";

                tipoFoto =
                    data.tipo ||
                    "FOTO DIGITAL";

                formatoAtivo =
                    data.formato ||
                    "10X15H";

                document.getElementById('event-name')
                    .innerText = eventoAtivo;

                document.getElementById('event-type')
                    .innerText =
                        `${tipoFoto} • ${formatoAtivo}`;

                document.getElementById('start-event-name')
                    .innerText = eventoAtivo;

                if (
                    ultimoEventoCarregado !== eventoAtivo ||
                    !molduraAtual
                ) {

                    ultimoEventoCarregado = eventoAtivo;

                    await carregarMoldura();

                }

            } catch(e) {

                console.log("Erro status:", e);

            }

        }

        async function carregarMoldura() {

            molduraAtual = null;

            try {

                const nomeArquivo =
                    encodeURIComponent(eventoAtivo.trim());

                const url =
                    `${API}/molduras/${nomeArquivo}.png?t=${Date.now()}`;

                console.log("BUSCANDO MOLDURA:", url);

                const response =
                    await fetch(url, {

                        cache: "no-store"

                    });

                if (!response.ok) {

                    throw new Error(
                        "Moldura não encontrada"
                    );

                }

                const blob =
                    await response.blob();

                const imageUrl =
                    URL.createObjectURL(blob);

                const img =
                    new Image();

                img.crossOrigin = "anonymous";

                await new Promise((resolve, reject) => {

                    img.onload = () => {

                        console.log(
                            "MOLDURA CARREGADA"
                        );

                        resolve();

                    };

                    img.onerror = reject;

                    img.src = imageUrl;

                });

                molduraAtual = img;

            } catch(e) {

                console.log(
                    "ERRO AO CARREGAR MOLDURA:",
                    e
                );

                molduraAtual = null;

            }

        }

        function manualStart() {

            if (sessaoIniciada) return;

            initSession();

        }

        async function initSession() {

            if (sessaoIniciada) return;

            sessaoIniciada = true;

            document.getElementById('screen-start')
                .style.display = "none";

            document.getElementById('loader')
                .style.display = "flex";

            try {

                await loadSystemStatus();

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            width: 1920,
                            height: 1080

                        },

                        audio: false

                    });

                video.srcObject = stream;

                await new Promise(resolve => {

                    video.onloadedmetadata = () => {

                        video.play();

                        resolve();

                    };

                });

                video.style.display = "block";

                document.getElementById('loader')
                    .style.display = "none";

                document.getElementById('camera-overlay')
                    .style.display = "block";

                setTimeout(() => {

                    startCountdown();

                }, 3000);

            } catch(e) {

                console.log(e);

                alert("Erro ao acessar câmera");

                location.reload();

            }

        }

        function startCountdown() {

            document.getElementById('prepare-text')
                .style.display = "none";

            const countdown =
                document.getElementById('countdown');

            countdown.style.display = "block";

            let time = 5;

            countdown.innerText = time;

            const interval = setInterval(() => {

                time--;

                countdown.innerText = time;

                if (time <= 0) {

                    clearInterval(interval);

                    processFinalImage();

                }

            }, 1000);

        }

        async function processFinalImage() {

            document.getElementById('countdown')
                .innerText = "📸";

            await new Promise(r => setTimeout(r, 300));

            await loadSystemStatus();

            if (!molduraAtual) {

                console.log(
                    "Tentando carregar moldura novamente..."
                );

                await carregarMoldura();

            }

            const canvas =
                document.createElement('canvas');

            if (formatoAtivo === "10X15V") {

                canvas.width = 1080;
                canvas.height = 1620;

            } else if (formatoAtivo === "TIRINHA") {

                canvas.width = 1080;
                canvas.height = 3240;

            } else if (formatoAtivo === "POLAROID") {

                canvas.width = 1080;
                canvas.height = 1350;

            } else {

                canvas.width = 1620;
                canvas.height = 1080;

            }

            const ctx =
                canvas.getContext('2d');

            ctx.fillStyle = "#000";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.save();

            ctx.translate(canvas.width, 0);

            ctx.scale(-1, 1);

            const videoRatio =
                video.videoWidth / video.videoHeight;

            const canvasRatio =
                canvas.width / canvas.height;

            let drawWidth;
            let drawHeight;

            if (videoRatio > canvasRatio) {

                drawHeight = canvas.height;

                drawWidth =
                    drawHeight * videoRatio;

            } else {

                drawWidth = canvas.width;

                drawHeight =
                    drawWidth / videoRatio;

            }

            const x =
                (canvas.width - drawWidth) / 2;

            const y =
                (canvas.height - drawHeight) / 2;

            ctx.drawImage(
                video,
                x,
                y,
                drawWidth,
                drawHeight
            );

            ctx.restore();

            if (molduraAtual) {

                console.log(
                    "APLICANDO MOLDURA..."
                );

                ctx.drawImage(
                    molduraAtual,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

            } else {

                console.log(
                    "SEM MOLDURA!"
                );

            }

            finalBlob = await new Promise(resolve => {

                canvas.toBlob(blob => {

                    resolve(blob);

                }, 'image/jpeg', 0.95);

            });

            document.getElementById('img-review').src =
                canvas.toDataURL('image/jpeg', 0.95);

            document.getElementById('camera-overlay')
                .style.display = "none";

            await notifyPhotoReady();

            document.getElementById('final-preview-container')
                .style.display = "flex";

            startPrintPolling();

        }

        async function notifyPhotoReady() {

            let enviado = false;

            while (!enviado) {

                try {

                    const res = await fetch(`${API}/photo-ready`, {

                        method: 'POST'

                    });

                    if (res.ok) {

                        enviado = true;

                    }

                } catch(e) {}

                if (!enviado) {

                    await new Promise(r => setTimeout(r, 700));

                }

            }

        }

        async function startPrintPolling() {

            const interval = setInterval(async () => {

                try {

                    const res =
                        await fetch(`${API}/check-print?t=${Date.now()}`);

                    const data =
                        await res.json();

                    if (data.printTriggered) {

                        clearInterval(interval);

                        await fetch(`${API}/clear-print`, {

                            method: 'POST'

                        });

                        finalizar(data.copias);

                    }

                } catch(e) {}

            }, 700);

        }

        async function finalizar(qtd) {

            document.getElementById('loader')
                .style.display = "flex";

            const fd = new FormData();

            fd.append('file', finalBlob, 'webcam.jpg');

            fd.append('copias', qtd);

            fd.append('evento', eventoAtivo);

            fd.append('tipo', tipoFoto);

            fd.append('formato', formatoAtivo);

            try {

                await fetch(`${API}/upload`, {

                    method: 'POST',

                    body: fd

                });

                location.reload();

            } catch(e) {

                console.log(e);

                alert("Erro ao enviar impressão");

                location.reload();

            }

        }

        async function checkRemoteTrigger() {

            if (pollingTrigger) return;

            pollingTrigger = true;

            const screenStart =
                document.getElementById('screen-start');

            if (
                !screenStart ||
                screenStart.style.display === "none"
            ) {

                pollingTrigger = false;

                return;

            }

            try {

                const res =
                    await fetch(`${API}/check-trigger?t=${Date.now()}`, {

                        cache: "no-store"

                    });

                const data =
                    await res.json();

                if (data.triggered) {

                    await fetch(`${API}/clear-trigger`, {

                        method: 'POST'

                    });

                    initSession();

                }

            } catch(e) {

                console.log(e);

            }

            pollingTrigger = false;

        }

        loadSystemStatus();

        setInterval(loadSystemStatus, 3000);

        setInterval(checkRemoteTrigger, 400);

    </script>

</body>
</html>
