<!-- ▶▶▶ INÍCIO DO ARQUIVO galeria.html — CENTRAL v11.2 FINAL ◀◀◀        -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTO PRINT — Central de Impressão v11.2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════════
           TOKENS — AZUL ELÉTRICO + GRAFITE
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --accent: #00E5FF;
            --accent-dim: rgba(0, 229, 255, 0.12);
            --accent-glow: 0 0 20px rgba(0, 229, 255, 0.4);
            --danger: #FF3B30;
            --danger-dim: rgba(255, 59, 48, 0.15);
            --warn: #FFCC00;
            --success: #34C759;

            --bg-0: #050505;
            --bg-1: #0F0F12;
            --bg-2: #18181D;
            --bg-3: #232329;
            --bg-4: #2E2E36;

            --text-0: #F5F5F7;
            --text-1: #D1D1D6;
            --text-2: #8E8E93;
            --text-3: #54545A;

            --border-1: rgba(255, 255, 255, 0.06);
            --border-2: rgba(255, 255, 255, 0.12);
            --border-3: rgba(255, 255, 255, 0.20);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;

            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'Space Grotesk', monospace;
            --panel-width: 340px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: var(--font-body);
            background: var(--bg-0);
            color: var(--text-0);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: grid;
            grid-template-columns: var(--panel-width) 1fr;
            background: 
                radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.05) 0%, transparent 60%),
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                var(--bg-0);
            background-size: 100% 100%, 40px 40px, 40px 40px, 100% 100%;
        }

        /* ═══════════════════════════════════════════════════════════════
           ÁREA DE IMPRESSÃO (MATEMÁTICA EXATA PARA A4)
           ═══════════════════════════════════════════════════════════════ */
        #print-area { display: none; }

        @media print {
            @page { size: A4 portrait; margin: 0; }
            body * { visibility: hidden !important; display: none !important; }
            #print-area, #print-area * { visibility: visible !important; display: block !important; }
            
            #print-area {
                position: absolute !important; inset: 0 !important;
                width: 210mm !important; height: 297mm !important;
                background: #fff !important; margin: 0 !important; padding: 3mm !important;
                display: grid !important;
                justify-content: center !important;
                align-content: flex-start !important;
                gap: 2mm !important;
            }

            /* LAYOUTS DINÂMICOS */
            .layout-polaroid { grid-template-columns: repeat(3, 68mm) !important; grid-auto-rows: 98mm !important; }
            .layout-tirinha { grid-template-columns: repeat(5, 37mm) !important; grid-auto-rows: 180mm !important; }
            .layout-10x15v { grid-template-columns: repeat(2, 100mm) !important; grid-auto-rows: 150mm !important; }
            .layout-10x15h { grid-template-columns: repeat(2, 150mm) !important; grid-auto-rows: 100mm !important; }

            .slot { width: 100% !important; height: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; overflow: hidden !important; background: #fff !important; }
            .slot img { width: 100% !important; height: 100% !important; object-fit: contain !important; }
        }

        /* ═══════════════════════════════════════════════════════════════
           PAINEL ESQUERDO
           ═══════════════════════════════════════════════════════════════ */
        .panel {
            background: var(--bg-1); border-right: 1px solid var(--border-2);
            display: flex; flex-direction: column; overflow-y: auto; height: 100vh; z-index: 10;
            box-shadow: 4px 0 24px rgba(0,0,0,0.5);
        }
        .panel-header { padding: 24px; border-bottom: 1px solid var(--border-1); position: relative; }
        .brand-title { font-family: var(--font-display); font-size: 22px; font-weight: 900; color: var(--accent); letter-spacing: 2px; text-shadow: var(--accent-glow); }
        .brand-subtitle { font-size: 9px; letter-spacing: 3px; color: var(--text-2); text-transform: uppercase; font-weight: 800; margin-top: 4px; }

        .status-card { margin: 20px 20px 0; padding: 16px; background: var(--bg-2); border: 1px solid var(--border-1); border-left: 3px solid var(--accent); border-radius: var(--radius-md); }
        .status-label { font-size: 9px; letter-spacing: 2px; color: var(--text-3); font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
        #nome-evento { font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text-0); text-transform: uppercase; }
        #tipo-formato { font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-top: 4px; }

        .print-status-bar {
            margin: 14px 20px 0; padding: 10px 14px; background: var(--bg-2); border: 1px solid var(--border-2);
            border-radius: var(--radius-md); display: flex; align-items: center; gap: 10px;
            font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-2);
        }
        .print-status-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
        .print-status-bar.active { color: var(--accent); border-color: var(--accent); background: rgba(0,229,255,0.05); }
        .print-status-bar.active .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .controls { margin: 16px 20px 0; display: flex; flex-direction: column; gap: 8px; }
        .ctrl-btn {
            width: 100%; padding: 12px 16px; background: var(--bg-2); border: 1px solid var(--border-2);
            color: var(--text-1); border-radius: var(--radius-md); font-family: var(--font-body);
            font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: 0.2s;
        }
        .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-3); }
        .ctrl-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .ctrl-btn .badge-qty { margin-left: auto; background: var(--accent); color: var(--bg-0); font-family: var(--font-mono); padding: 2px 8px; border-radius: 20px; }

        .search-box { margin: 16px 20px 0; display: flex; gap: 8px; }
        .search-box input {
            flex: 1; background: var(--bg-0); border: 1px solid var(--border-2); color: var(--text-0);
            padding: 10px 14px; border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 12px; outline: none;
        }
        .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
        .search-btn { background: var(--accent); color: var(--bg-0); border: none; padding: 0 14px; border-radius: var(--radius-md); cursor: pointer; font-size: 14px; }

        .sheet-section {
            margin: 20px; padding: 16px; background: var(--bg-2); border: 1px dashed var(--border-3);
            border-radius: var(--radius-md); transition: 0.2s;
        }
        .sheet-section.drag-over { border-color: var(--accent); background: var(--accent-dim); box-shadow: var(--accent-glow); }
        .sheet-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .sheet-title { font-size: 10px; font-weight: 800; color: var(--text-2); text-transform: uppercase; }
        .sheet-count { font-family: var(--font-mono); font-size: 11px; font-weight: 900; color: var(--accent); }
        
        .sheet-preview { display: grid; gap: 4px; background: var(--bg-0); padding: 6px; border-radius: 6px; aspect-ratio: 210/297; max-width: 180px; margin: 0 auto; transition: 0.2s; }
        .sheet-preview-slot { background: var(--bg-3); border: 1px dashed var(--border-2); border-radius: 3px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .sheet-preview-slot.filled { border: 1px solid var(--accent); }
        .sheet-preview-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
        .sheet-preview-slot .remove-btn {
            position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff;
            width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 10px; cursor: pointer; z-index: 10; opacity: 0; transition: 0.2s;
        }
        .sheet-preview-slot:hover .remove-btn { opacity: 1; }
        .sheet-preview-slot .slot-label { position: absolute; top: 2px; left: 4px; font-size: 8px; color: #fff; background: rgba(0,0,0,0.8); padding: 1px 4px; border-radius: 2px; z-index: 5; }

        .config-toggle {
            margin: auto 20px 20px; padding: 12px; background: transparent; border: 1px solid var(--border-2);
            color: var(--text-2); border-radius: var(--radius-md); cursor: pointer; font-size: 10px;
            display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; font-weight: 800;
        }
        .config-toggle:hover { color: var(--text-0); border-color: var(--border-3); }
        .config-panel { display: none; margin: 0 20px 20px; padding: 16px; background: var(--bg-2); border-radius: var(--radius-md); }
        .config-panel.active { display: block; }
        .config-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; gap: 10px; }
        .config-row label { font-size: 10px; font-weight: 700; color: var(--text-1); }
        .config-row select { background: var(--bg-0); border: 1px solid var(--border-2); color: var(--text-0); padding: 6px 10px; border-radius: 6px; outline: none; }

        /* ═══════════════════════════════════════════════════════════════
           ÁREA PRINCIPAL
           ═══════════════════════════════════════════════════════════════ */
        .main-area { padding: 24px 32px; overflow-y: auto; height: 100vh; position: relative; }
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .main-title { font-family: var(--font-display); font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-0); text-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .main-count { font-family: var(--font-mono); font-size: 12px; background: var(--bg-2); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-2); margin-right: 60px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .card { 
            background: var(--bg-1); border-radius: var(--radius-md); border: 1px solid var(--border-1); 
            position: relative; cursor: pointer; overflow: hidden; transition: 0.2s;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 4px 12px rgba(0,229,255,0.15); }
        .card.dragging { opacity: 0.5; }
        .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; pointer-events: none; }
        .badge-id { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--bg-0); padding: 3px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 10px; font-weight: 900; }
        .badge-copias { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.9); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 10px; border: 1px solid var(--border-3); }
        .print-state { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(0,0,0,0.85); color: var(--text-2); padding: 4px; border-radius: 4px; font-size: 9px; text-align: center; font-weight: 800; }
        .print-state.done { color: var(--accent); border: 1px solid var(--accent); background: rgba(0,229,255,0.1); }
        .check-overlay { position: absolute; inset: 0; background: rgba(0, 229, 255, 0.2); display: none; align-items: center; justify-content: center; font-size: 40px; color: var(--accent); }
        .card.selected { border-color: var(--accent); }
        .card.selected .check-overlay { display: flex; }

        .menu-trigger {
            position: fixed; right: 24px; top: 24px; z-index: 5100; width: 44px; height: 44px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 10px; cursor: pointer; backdrop-filter: blur(12px); transition: 0.2s;
        }
        .menu-trigger:hover { border-color: var(--accent); box-shadow: var(--accent-glow); }
        .menu-trigger span { display: block; width: 20px; height: 2px; background: var(--accent); border-radius: 2px; transition: 0.3s; }
        .menu-trigger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .menu-trigger.active span:nth-child(2) { opacity: 0; }
        .menu-trigger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .sidebar {
            position: fixed; right: -360px; top: 0; width: 320px; height: 100%;
            background: rgba(15, 15, 18, 0.98); z-index: 5000; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 90px 24px 24px; border-left: 1px solid var(--accent); backdrop-filter: blur(24px); box-shadow: -20px 0 60px rgba(0,0,0,0.9);
        }
        .sidebar.active { right: 0; }
        .sidebar-title { font-family: var(--font-display); font-size: 10px; font-weight: 900; letter-spacing: 3px; color: var(--accent); margin-bottom: 18px; text-transform: uppercase; }
        .sidebar-btn {
            width: 100%; padding: 14px 16px; margin-bottom: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-2);
            background: rgba(255, 255, 255, 0.02); color: var(--text-0); cursor: pointer; display: flex; align-items: center; gap: 12px;
            font-family: var(--font-body); font-size: 11px; font-weight: 800; text-transform: uppercase; transition: 0.2s;
        }
        .sidebar-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
        .sidebar-btn.danger i { color: var(--danger); }
        .sidebar-btn.danger:hover { border-color: var(--danger); background: var(--danger-dim); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 6000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal img { max-height: 70vh; border: 2px solid var(--accent); border-radius: var(--radius-md); box-shadow: var(--accent-glow); }
        .modal-controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 24px; border-radius: 30px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .btn-close { background: var(--bg-3); color: #fff; }
        .btn-print { background: var(--accent); color: var(--bg-0); }

        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 7000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-2); border-left: 4px solid var(--accent); padding: 14px 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); display: flex; gap: 12px; align-items: center; animation: slideDown 0.3s; }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } }

        .log-toggle { position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px; background: var(--bg-2); border: 1px solid var(--accent); border-radius: 50%; color: var(--accent); cursor: pointer; z-index: 500; transition: 0.2s; }
        .log-toggle:hover { box-shadow: var(--accent-glow); }
        .log-drawer { position: fixed; bottom: 84px; right: 24px; width: 300px; max-height: 250px; background: var(--bg-1); border: 1px solid var(--accent); border-radius: 12px; z-index: 500; display: none; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
        .log-drawer.active { display: flex; }
        .log-header { padding: 10px; border-bottom: 1px solid var(--border-2); font-size: 10px; font-weight: 900; color: var(--accent); display: flex; justify-content: space-between; }
        .log-body { padding: 10px; overflow-y: auto; font-size: 10px; font-family: var(--font-mono); }
        .log-line { margin-bottom: 4px; display: flex; gap: 6px; }
        .log-line .ts { color: var(--text-3); }
    </style>
</head>
<body>

    <div class="menu-trigger" id="menu-trigger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Menu de Controle</div>
        <button class="sidebar-btn" onclick="baixarZip()">
            <i class="fa-solid fa-download"></i> Baixar Galeria (.zip)
        </button>
        <button class="sidebar-btn danger" onclick="limparTudo()">
            <i class="fa-solid fa-trash"></i> Apagar Servidor
        </button>
    </aside>

    <aside class="panel">
        <div class="panel-header">
            <div class="brand-title">PHOTO PRINT</div>
            <div class="brand-subtitle">Central de Impressão</div>
        </div>

        <div class="status-card">
            <div class="status-label">Evento Ativo</div>
            <div id="nome-evento">Carregando...</div>
            <div id="tipo-formato">--</div>
        </div>

        <div class="print-status-bar" id="print-status-bar">
            <span class="dot"></span>
            <span id="print-status-text">Aguardando fotos</span>
        </div>

        <div class="controls">
            <button class="ctrl-btn pause" id="btn-pause" onclick="togglePausa()">
                <i class="fa-solid fa-pause"></i> <span id="btn-pause-text">Pausar</span>
            </button>
            <button class="ctrl-btn" onclick="limparFilaManual()">
                <i class="fa-solid fa-broom"></i> Limpar Fila <span class="badge-qty" id="fila-count">0</span>
            </button>
            <button class="ctrl-btn" onclick="forcarImpressao()" style="border-color: var(--accent); color: var(--accent);">
                <i class="fa-solid fa-print"></i> Forçar Impressão
            </button>
            <button class="ctrl-btn" id="btn-selecao" onclick="toggleModoSelecao()">
                <i class="fa-solid fa-check-square"></i> <span id="btn-selecao-text">Selecionar</span>
            </button>
        </div>

        <div class="selection-bar" id="selection-bar" style="display:none; padding: 10px 20px; background: var(--accent-dim); margin: 10px 20px; border-radius: 8px;">
            <div style="font-size: 10px; color: var(--accent); font-weight: 800; margin-bottom: 8px;">
                <span id="selection-count">0</span> foto(s) selecionada(s)
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="ctrl-btn" style="background: var(--accent); color: #000;" onclick="imprimirSelecionadas()">
                    <i class="fa-solid fa-print"></i> Imprimir
                </button>
                <button class="ctrl-btn" onclick="cancelarSelecao()"><i class="fa-solid fa-times"></i></button>
            </div>
        </div>

        <div class="search-box">
            <input type="number" id="input-busca" placeholder="BUSCAR ID" onkeydown="if(event.key==='Enter') executarBusca()">
            <button class="search-btn" onclick="executarBusca()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="sheet-section" id="sheet-section">
            <div class="sheet-header">
                <span class="sheet-title">Folha Atual</span>
                <span class="sheet-count" id="sheet-count">0/6</span>
            </div>
            <div class="sheet-preview" id="sheet-preview"></div>
            <div style="font-size:9px; color:var(--text-3); text-align:center; margin-top:8px; text-transform:uppercase;">Arraste fotos para cá</div>
        </div>

        <button class="config-toggle" onclick="document.getElementById('config-panel').classList.toggle('active')">
            <span><i class="fa-solid fa-cog"></i> Configurações</span>
            <i class="fa-solid fa-chevron-up"></i>
        </button>
        <div class="config-panel" id="config-panel">
            <div class="config-row">
                <label>Fotos/folha (Polaroid)</label>
                <select id="config-capacidade" onchange="salvarConfigCapacidade(this.value)">
                    <option value="6" selected>6 (Padrão A4)</option>
                    <option value="9">9</option>
                    <option value="4">4</option>
                    <option value="2">2</option>
                </select>
            </div>
            <div class="config-row">
                <label>Auto-impressão</label>
                <select id="config-auto" onchange="salvarConfigAuto(this.value)">
                    <option value="1">Ativada</option>
                    <option value="0">Desativada</option>
                </select>
            </div>
        </div>
    </aside>

    <main class="main-area">
        <div class="main-header">
            <h2 class="main-title">Galeria do Evento</h2>
            <span class="main-count" id="main-count">0 fotos</span>
        </div>
        <div class="grid" id="grid-fotos"></div>
    </main>

    <div class="modal" id="modal-zoom">
        <div style="text-align: center;">
            <img id="img-zoom" src="">
            <div class="modal-controls">
                <button class="btn btn-close" onclick="fecharZoom()">Voltar</button>
                <button class="btn btn-print" onclick="reimprimirAtual()">Reimprimir</button>
            </div>
        </div>
    </div>

    <button class="log-toggle" onclick="toggleLog()"><i class="fa-solid fa-terminal"></i></button>
    <div class="log-drawer" id="log-drawer">
        <div class="log-header"><span>Log</span><span style="cursor:pointer" onclick="toggleLog()">X</span></div>
        <div class="log-body" id="log-body"></div>
    </div>

    <div id="print-area"></div>
    <div class="toast-container" id="toast-container"></div>

    <script>
        const API = "https://photoprint-api.maxprimefotovideo.workers.dev";
        const POLL_INTERVAL = 4000;
        
        let todasFotos = [], chavesLocais = new Set();
        let eventoAtual = "", eventoIdAtual = "", formatoAtual = "POLAROID", primeiraCarga = true;
        let sheetBuffer = [], sheetQueue = [], isPrinting = false, pausado = false;
        let autoImpressao = true, fotosPorFolha = 6;
        let modoSelecao = false, selecionadas = new Set();
        let logHistory = [], logAberto = false;

        function getCapacidade() {
            const fmt = formatoAtual.toUpperCase();
            if (fmt.includes("POLAROID")) return { slots: fotosPorFolha, layout: "layout-polaroid" };
            if (fmt.includes("TIRINHA")) return { slots: 5, layout: "layout-tirinha" }; // 5 por folha
            if (fmt.includes("10X15H")) return { slots: 2, layout: "layout-10x15h" };
            if (fmt.includes("10X15V")) return { slots: 2, layout: "layout-10x15v" };
            return { slots: fotosPorFolha, layout: "layout-polaroid" };
        }

        function addLog(msg, tipo = 'info') {
            const ts = new Date().toLocaleTimeString('pt-BR');
            logHistory.push({ ts, msg, tipo });
            if (logHistory.length > 30) logHistory.shift();
            renderLog();
        }

        function renderLog() {
            const body = document.getElementById('log-body');
            if (!body) return;
            body.innerHTML = logHistory.map(l => `<div class="log-line"><span class="ts">${l.ts}</span><span style="color:${l.tipo==='error'?'var(--danger)':l.tipo==='success'?'var(--success)':'var(--text-1)'}">${l.msg}</span></div>`).join('');
            body.scrollTop = body.scrollHeight;
        }

        function toggleLog() {
            logAberto = !logAberto;
            document.getElementById('log-drawer').classList.toggle('active', logAberto);
        }

        function mostrarToast(titulo, msg, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = `<i class="fa-solid fa-${tipo==='success'?'check-circle':tipo==='error'?'exclamation-triangle':'info-circle'}" style="color:var(--${tipo==='success'?'success':tipo==='error'?'danger':'accent'})"></i>
                <div><div style="font-size:12px;font-weight:800;">${titulo}</div><div style="font-size:11px;color:var(--text-2);">${msg}</div></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
        }

        /* ════════════════ SINCRONIZAÇÃO COM A API ════════════════ */
        async function atualizar() {
            try {
                                const r1 = await fetch(`${API}/get-all-states?t=${Date.now()}`, { cache: 'no-store' });
                if (!r1.ok) return;
                
                const config = await r1.json();
                const evt = (config.config && config.config.evento) ? config.config.evento : "Geral";
                const evtId = (config.config && config.config.eventoId) ? String(config.config.eventoId) : "";
                const novoFormato = (config.config && config.config.formato) ? String(config.config.formato).toUpperCase().trim() : "POLAROID";

                if (eventoIdAtual !== evtId) {
                    eventoAtual = evt; eventoIdAtual = evtId; formatoAtual = novoFormato;
                    todasFotos = []; chavesLocais.clear(); sheetBuffer = []; sheetQueue = []; primeiraCarga = true;
                    document.getElementById('grid-fotos').innerHTML = "";
                    addLog(`🔄 Evento: ${evt} (${traduzirFormato(formatoAtual)})`, 'success');
                    atualizarUIStatus();
                } else if (formatoAtual !== novoFormato) {
                    formatoAtual = novoFormato;
                    atualizarUIStatus();
                }

                document.getElementById('nome-evento').innerText = eventoAtual;
                document.getElementById('tipo-formato').innerText = traduzirFormato(formatoAtual);

                if (!eventoIdAtual) return;

                const r2 = await fetch(`${API}/list-photos?evento=${encodeURIComponent(eventoAtual)}&t=${Date.now()}`, { cache: 'no-store' });
                if (!r2.ok) return;
                const dados = await r2.json();

                const fotosValidas = Array.isArray(dados) ? dados.filter(f => f.key && !f.key.toLowerCase().includes('moldura')) : [];
                const novas = fotosValidas.filter(f => !chavesLocais.has(f.key));

                if (novas.length > 0) {
                    for (const f of novas) {
                        const url = `${API}/photo?key=${encodeURIComponent(f.key)}`;
                        const parsed = analisarNomeFoto(f.key);
                        const idFoto = todasFotos.length + 1;
                        todasFotos.push({ id: idFoto, url, key: f.key, copias: parsed.copias, guestbook: parsed.guestbook, impressa: primeiraCarga });
                        chavesLocais.add(f.key);
                        if (!primeiraCarga && autoImpressao) alimentarBuffer(url, f.key, parsed, idFoto);
                    }
                    render(); atualizarUIFolha();
                }
                primeiraCarga = false;
            } catch (e) { 
                console.error('[GALERIA]', e); 
            }
        }

        function analisarNomeFoto(key) {
            const kl = key.toLowerCase();
            let copias = 1;
            const match = kl.match(/_(\d+)c/);
            if (match) copias = parseInt(match[1], 10) || 1;
            const guestbook = kl.includes('_guestbook');
            return { copias, guestbook };
        }

        function traduzirFormato(f) {
            if (!f) return "--";
            const up = f.toUpperCase().trim();
            if (up.includes("10X15H")) return "10x15 Horizontal";
            if (up.includes("10X15V")) return "10x15 Vertical";
            if (up.includes("TIRINHA")) return "Tirinha";
            if (up.includes("POLAROID")) return "Polaroid";
            return up;
        }

        /* ════════════════ LÓGICA DA FOLHA E IMPRESSÃO ════════════════ */
        function alimentarBuffer(url, key, parsed, origemId) {
            const cap = getCapacidade();
            
            if (parsed.guestbook) {
                sheetQueue.push({ slots: [{ url, key, tipo: 'guestbook', origemId }], layout: 'layout-guestbook', descricao: 'Guestbook' });
                addLog(`📄 Guestbook preparado`, 'info');
                processarFilaImpressao();
                return;
            }

            for (let i = 0; i < parsed.copias; i++) {
                sheetBuffer.push({ url, key, tipo: 'foto', origemId });
                if (sheetBuffer.length >= cap.slots) {
                    fecharFolha();
                }
            }
            atualizarUIFolha();
            render();
        }

        function fecharFolha() {
            if (sheetBuffer.length === 0) return;
            const cap = getCapacidade();
            const slots = sheetBuffer.splice(0, cap.slots);
            
            sheetQueue.push({ slots, layout: cap.layout, descricao: `Folha ${traduzirFormato(formatoAtual)}` });
            
            mostrarToast('Folha Completa!', 'A foto foi enviada para a impressora.', 'success');
            addLog(`📄 Folha fechada (${slots.length} slots). Enviando para impressão...`, 'success');
            
            atualizarUIFolha();
            processarFilaImpressao();
        }

        function forcarImpressao() {
            if (sheetBuffer.length === 0) {
                return mostrarToast('Fila Vazia', 'Não há fotos na folha atual para imprimir.', 'error');
            }
            const cap = getCapacidade();
            const slots = sheetBuffer.splice(0);
            
            sheetQueue.push({ slots, layout: cap.layout, descricao: `Folha Parcial (${slots.length})` });
            
            mostrarToast('Impressão Forçada', `Enviando ${slots.length} foto(s) para a impressora.`, 'success');
            addLog(`🖨️ Impressão forçada: ${slots.length} slots`, 'warn');
            
            atualizarUIFolha();
            processarFilaImpressao();
        }

        function removerDoBuffer(index) {
            sheetBuffer.splice(index, 1);
            atualizarUIFolha();
            render();
            addLog(`🗑️ Foto removida da folha`, 'warn');
        }

        async function processarFilaImpressao() {
            if (isPrinting || pausado || sheetQueue.length === 0) return;
            
            isPrinting = true;
            const folha = sheetQueue.shift();
            atualizarUIFolha();

            try {
                await imprimirFolhaReal(folha);
            } catch (e) {
                addLog(`❌ Erro na impressão: ${e.message}`, 'error');
            }

            setTimeout(() => {
                isPrinting = false;
                processarFilaImpressao();
            }, 2500);
        }

        async function imprimirFolhaReal(folha) {
            const printArea = document.getElementById('print-area');
            printArea.className = `print-sheet ${folha.layout}`;
            
            printArea.innerHTML = folha.slots.map(s => `
                <div class="slot"><img src="${s.url}"></div>
            `).join('');

            // ⬇️ CORREÇÃO DA ROTAÇÃO (10x15 H e V) ⬇️
            let stylePage = document.getElementById('dynamic-page-style');
            if (stylePage) stylePage.remove(); // Força o Chrome a esquecer a orientação anterior
            
            stylePage = document.createElement('style');
            stylePage.id = 'dynamic-page-style';
            document.head.appendChild(stylePage);
            
            // Define a regra exata da folha
            let pageRule = '@page { size: A4 portrait; margin: 0; }';
            if (folha.layout === 'layout-10x15h') {
                pageRule = '@page { size: A4 landscape; margin: 0; }';
            }
            
            stylePage.innerHTML = `@media print { ${pageRule} }`;

            await new Promise(r => setTimeout(r, 600)); // Aguarda renderizar
            window.print();
        }

        /* ════════════════ INTERFACE (UI) ════════════════ */
        function atualizarUIStatus() {
            const bar = document.getElementById('print-status-bar');
            const txt = document.getElementById('print-status-text');
            
            if (pausado) {
                bar.className = 'print-status-bar paused';
                txt.innerText = 'Pausado';
            } else if (isPrinting) {
                bar.className = 'print-status-bar active';
                txt.innerText = 'Imprimindo...';
            } else {
                bar.className = 'print-status-bar';
                txt.innerText = sheetQueue.length > 0 ? `${sheetQueue.length} na fila` : 'Aguardando fotos';
            }
        }

        function atualizarUIFolha() {
            const cap = getCapacidade();
            document.getElementById('sheet-count').innerText = `${sheetBuffer.length}/${cap.slots}`;
            document.getElementById('fila-count').innerText = sheetQueue.length;
            
            const container = document.getElementById('sheet-preview');
            let cols = 3;
            if (cap.slots === 4) cols = 2;
            else if (cap.slots === 2) cols = 2;
            else if (cap.slots === 5) cols = 5;
            
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.innerHTML = '';

            for (let i = 0; i < cap.slots; i++) {
                const slot = document.createElement('div');
                slot.className = 'sheet-preview-slot';
                const data = sheetBuffer[i];
                
                if (data) {
                    slot.classList.add('filled');
                    slot.innerHTML = `<span class="slot-label">${i+1}</span><img src="${data.url}">
                        <div class="remove-btn" onclick="event.stopPropagation(); removerDoBuffer(${i})"><i class="fa-solid fa-xmark"></i></div>`;
                } else {
                    slot.innerHTML = `<span style="font-size:10px;color:var(--text-3);">${i+1}</span>`;
                }
                container.appendChild(slot);
            }
            atualizarUIStatus();
        }

        function render() {
            const grid = document.getElementById('grid-fotos');
            document.getElementById('main-count').innerText = `${todasFotos.length} fotos`;
            
            if (todasFotos.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-3);"><i class="fa-solid fa-camera-retro" style="font-size:48px;margin-bottom:16px;opacity:0.3;"></i><br>Nenhuma foto ainda</div>`;
                return;
            }

            grid.innerHTML = todasFotos.slice().reverse().map(f => {
                const sel = selecionadas.has(f.id);
                const click = modoSelecao ? `toggleSelecionada(${f.id})` : `abrirZoom(${f.id})`;
                return `
                    <div class="card ${sel ? 'selected' : ''}" draggable="true" onclick="${click}"
                         ondragstart="event.dataTransfer.setData('text', ${f.id}); this.classList.add('dragging')"
                         ondragend="this.classList.remove('dragging')">
                        <div class="check-overlay"><i class="fa-solid fa-check-circle"></i></div>
                        <span class="badge-id">#${f.id}</span>
                        <span class="badge-copias">${f.copias}x</span>
                        <span class="print-state ${f.impressa ? 'done' : ''}">${f.impressa ? 'IMPRESSA' : 'NA FILA'}</span>
                        <img src="${f.url}">
                    </div>`;
            }).join('');
        }

        /* ════════════════ DRAG & DROP ════════════════ */
        const section = document.getElementById('sheet-section');
        section.addEventListener('dragover', e => { e.preventDefault(); section.classList.add('drag-over'); });
        section.addEventListener('dragleave', () => section.classList.remove('drag-over'));
        section.addEventListener('drop', e => {
            e.preventDefault();
            section.classList.remove('drag-over');
            const id = parseInt(e.dataTransfer.getData('text'), 10);
            const foto = todasFotos.find(f => f.id === id);
            if (foto) {
                alimentarBuffer(foto.url, foto.key, { copias: 1, guestbook: foto.guestbook }, foto.id);
                mostrarToast('Adicionada', `Foto #${id} na folha.`, 'info');
            }
        });

        /* ════════════════ SELEÇÃO E CONFIG ════════════════ */
        function toggleModoSelecao() {
            modoSelecao = !modoSelecao;
            selecionadas.clear();
            document.getElementById('btn-selecao').classList.toggle('active', modoSelecao);
            atualizarBarraSelecao(); render();
        }
        function toggleSelecionada(id) {
            if (!modoSelecao) return;
            selecionadas.has(id) ? selecionadas.delete(id) : selecionadas.add(id);
            atualizarBarraSelecao(); render();
        }
        function atualizarBarraSelecao() {
            const bar = document.getElementById('selection-bar');
            if (modoSelecao && selecionadas.size > 0) {
                bar.style.display = 'block';
                document.getElementById('selection-count').innerText = selecionadas.size;
            } else { bar.style.display = 'none'; }
        }
        function cancelarSelecao() { modoSelecao = false; selecionadas.clear(); toggleModoSelecao(); }
        function imprimirSelecionadas() {
            const fotos = todasFotos.filter(f => selecionadas.has(f.id));
            fotos.forEach(f => alimentarBuffer(f.url, f.key, { copias: f.copias, guestbook: f.guestbook }, f.id));
            cancelarSelecao();
        }

        function salvarConfigCapacidade(v) { fotosPorFolha = parseInt(v); atualizarUIFolha(); }
        function salvarConfigAuto(v) { autoImpressao = v === '1'; }

        function togglePausa() {
            pausado = !pausado;
            document.getElementById('btn-pause').classList.toggle('active', pausado);
            document.getElementById('btn-pause-text').innerText = pausado ? 'Retomar' : 'Pausar';
            atualizarUIStatus();
            if (!pausado) processarFilaImpressao();
        }

        function limparFilaManual() {
            if (!confirm('Limpar todas as fotos da folha atual?')) return;
            sheetBuffer = []; sheetQueue = [];
            atualizarUIFolha(); render();
        }

        /* ════════════════ MODAL E BUSCA ════════════════ */
        function abrirZoom(id) {
            const f = todasFotos.find(x => x.id === id);
            if (f) {
                document.getElementById('img-zoom').src = f.url;
                document.getElementById('modal-zoom').classList.add('active');
            }
        }
        function fecharZoom() { document.getElementById('modal-zoom').classList.remove('active'); }
        function reimprimirAtual() {
            const url = document.getElementById('img-zoom').src;
            const foto = todasFotos.find(f => f.url === url);
            if (foto) alimentarBuffer(foto.url, foto.key, { copias: foto.copias, guestbook: foto.guestbook }, foto.id);
            fecharZoom();
        }
        function executarBusca() {
            const id = parseInt(document.getElementById('input-busca').value);
            const foto = todasFotos.find(f => f.id === id);
            if (foto) abrirZoom(foto.id);
            else mostrarToast('Não encontrada', 'ID inválido.', 'error');
        }

        /* ════════════════ SIDEBAR (MENU) ════════════════ */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('menu-trigger').classList.toggle('active');
        }

        async function baixarZip() {
            if (todasFotos.length === 0) return mostrarToast('Sem fotos', 'Nenhuma foto.', 'info');
            const zip = new JSZip();
            for (const f of todasFotos) {
                try {
                    const blob = await fetch(f.url).then(r => r.blob());
                    zip.file(`foto_${f.id}.jpg`, blob);
                } catch(e) {}
            }
            saveAs(await zip.generateAsync({type:"blob"}), "galeria.zip");
            mostrarToast('Sucesso', 'Download iniciado.', 'success');
        }

        async function limparTudo() {
            if (!confirm("⚠️ APAGAR TODAS AS FOTOS?\n\nIrreversível.")) return;
            if (prompt("Senha mestra:") !== "1234") return mostrarToast('Erro', 'Senha incorreta.', 'error');
            try {
                await fetch(`${API}/photo?key=all`, { method: 'DELETE' });
                todasFotos = []; chavesLocais.clear(); sheetBuffer = []; sheetQueue = [];
                render(); atualizarUIFolha();
                mostrarToast('Sucesso', 'Fotos removidas.', 'success');
            } catch (e) { mostrarToast('Erro', 'Falha ao limpar.', 'error'); }
        }

        /* ════════════════ INICIALIZAÇÃO ════════════════ */
        window.addEventListener('load', () => {
            atualizarUIFolha();
            atualizar();
            setInterval(atualizar, POLL_INTERVAL);
            addLog('🚀 Central v11.2 iniciada', 'success');
        });
    </script>
</body>
</html>
